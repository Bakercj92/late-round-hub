   schedule answers it: the current week is the last week whose first kickoff
   has already passed. Falling back to "week 1" would silently show week-1
   opponents in November, which is worse than showing nothing. */
/* The current week is the last week whose games are OVER, plus one — not the
   last week that has started. Those differ for the three days that matter
   most: Tuesday through Thursday, when Chris is setting waiver claims. Taking
   "last week whose first kickoff has passed" would call Tuesday of week 5
   "week 4" and show him last week's opponents while he plans next week's
   claims. Only reachable when Sleeper's state endpoint is unavailable. */
var WEEK_ROLLOVER_MS = 4 * 3600 * 1000;   // grace after the last kickoff of a week
function weekFromSchedule(){
  var now = Date.now(), current = 1;
  for(var w = 1; w <= 18; w++){
    var teams = S.schedule.weeks[String(w)];
    if(!teams) continue;
    var first = null, last = null;
    for(var t in teams){
      var k = kickMs(teams[t].kick);
      if(k === null) continue;
      if(first === null || k < first) first = k;
      if(last === null || k > last) last = k;
    }
    if(first === null) continue;
    if(now >= first) current = w;                        // this week has begun
    if(last !== null && now >= last + WEEK_ROLLOVER_MS && w < 18) current = w + 1;
  }
  return Math.max(1, Math.min(18, current));
}

/* ---------- kickoff / lock ----------
   `kick` is a UTC instant, converted once in gen_season_schedule.py from
   nflverse's US/Eastern gametime using a real tz database. Nothing here
   applies an offset, because every fixed-offset scheme is wrong half the
   season: a hardcoded -04:00 (which this file used to carry) runs an hour
   early for all 164 games after DST ends on 2026-11-01, which is the entire
   stretch run and both leagues' playoffs — and it made the LOCKED pill fire an
   hour before kickoff, telling Chris he could not change a lineup he still
   could.

   Display is pinned to Eastern regardless of where the phone thinks it is,
   because Chris's leagues, his waiver clears and every deadline he cares about
   are Eastern. Formatting with getHours() would render the same game three
   different ways on three devices — and on a UTC device it would print the
   wrong DAY for every Sunday-night game. */
function kickMs(kick){
  if(!kick) return null;
  var t = Date.parse(kick);
  return isNaN(t) ? null : t;
}

var ET_FMT = null;
function etFmt(){
  if(ET_FMT !== null) return ET_FMT;
  try{
    ET_FMT = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York", weekday: "short",
      hour: "numeric", minute: "2-digit", hour12: true
    });
  }catch(e){ ET_FMT = false; }   // no Intl / no tz data: fall back to the baked label
  return ET_FMT;
}

function kickLabel(g){
  if(!g) return null;
  var ms = kickMs(g.kick);
  var f = etFmt();
  if(ms === null || !f){
    // Fallback: the baked Eastern wall clock, formatted from the string.
    if(!g.et) return g.day ? g.day.slice(0,3) : null;
    var hm = g.et.split("T")[1] || "";
    var hh = parseInt(hm.split(":")[0], 10), mm = hm.split(":")[1] || "00";
    if(isNaN(hh)) return g.day ? g.day.slice(0,3) : null;
    var ap0 = hh >= 12 ? "p" : "a"; var h0 = hh % 12 || 12;
    return (g.day ? g.day.slice(0,3) : "") + " " + h0 + (mm !== "00" ? ":" + mm : "") + ap0 + " ET";
  }
  var parts = {};
  f.formatToParts(new Date(ms)).forEach(function(p){ parts[p.type] = p.value; });
  var mins = parts.minute && parts.minute !== "00" ? ":" + parts.minute : "";
  var ap = (parts.dayPeriod || "").toLowerCase().charAt(0);
  return parts.weekday + " " + parts.hour + mins + ap + " ET";
}

function isLocked(g){
  var ms = g ? kickMs(g.kick) : null;
  return ms !== null && Date.now() >= ms;
}

/* ---------- schedule join ---------- */
function gameFor(team, week){
  if(!team) return null;
  var w = S.schedule.weeks[String(week)];
  return (w && w[team]) || null;
}
function onBye(team, week){
  return !!team && S.schedule.byes[team] === week && !gameFor(team, week);
}

/* ---------- player resolution ----------
   Baked index gives an instant first paint; the live pull corrects it. Only
   the live layer is trusted for team and injury status (see the header note).
   DEF entries ("SEA") are their own team and never appear in players/nfl. */
/* A Sleeper DEF id is the team abbreviation itself. Testing "2-3 capitals"
   also matches junk keys that live in the baked index (e.g. "NA"), which would
   silently turn a broken row into a phantom defence. Check membership in the
   actual 32-team set the schedule was built from instead. */
var NFL_TEAMS = (function(){
  var s = {}, w = S.schedule.byes || {};
  for(var t in w) s[t] = 1;
  return s;
})();
function isDef(sid){ return NFL_TEAMS[String(sid)] === 1; }

function facts(sid){
  sid = String(sid);
  var live = LIVE[sid] || null;
  var baked = S.players[sid] || null;
  if(isDef(sid)){
    return {id:sid, name:(baked && baked.n) || (sid + " DEF"), pos:"DEF",
            team:sid, status:null, stale:false};
  }
  return {
    id: sid,
    name: (live && live.name) || (baked && baked.n) || ("Sleeper #" + sid),
    pos:  (live && live.pos)  || (baked && baked.p)  || "?",
    /* TEAM: a live record wins OUTRIGHT, including when it says null.
       `live.team || baked.tm` looks equivalent and is not: Sleeper reports
       team:null for a cut or unsigned player, `||` reads that as "no answer",
       and the page falls back to an August board value — resurrecting the exact
       stale-team bug this rule exists to kill, in the one case where Sleeper is
       authoritatively telling us the player has no game at all. */
    team: live ? (live.team || null) : ((baked && baked.tm) || null),
    status: live ? live.status : null,
    /* UNCONFIRMED means "this row was not verified against Sleeper on the last
       sync" — which covers TWO cases, not one:
         (a) we have never fetched him, so `live` is missing entirely;
         (b) this sync's fetch for him FAILED and loadPlayers fell back to the
             cached record, so `live` is truthy but may be 90 minutes old.
       Checking only (a) was the first version, and it made (b) invisible: the
       footer announced "N players could not be confirmed — those rows are
       marked ?" while no row carried the mark and no alert fired. That is the
       10:00-load / 11:30-Refresh path on a Sunday, showing a stale injury
       designation with nothing to say so. */
    stale: !live || UNRESOLVED.indexOf(sid) >= 0
  };
}

var STATUS_PILL = {
  "Out":{c:"out",t:"OUT"}, "Doubtful":{c:"doub",t:"DOUB"},
  "Questionable":{c:"q",t:"Q"}, "IR":{c:"ir",t:"IR"},
  "PUP":{c:"ir",t:"PUP"}, "Sus":{c:"ir",t:"SUSP"}, "NA":{c:"ir",t:"NA"},
  "COV":{c:"ir",t:"COV"}, "DNR":{c:"ir",t:"DNR"}
};

/* =====================================================================
   FETCHES
   ===================================================================== */
function getJSON(url){
  return fetch(url, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

function loadState(){
  return getJSON(API + "state/nfl").then(function(st){
    var w = parseInt(st && (st.display_week || st.week), 10);
    return (w >= 1 && w <= 18) ? w : weekFromSchedule();
  }).catch(function(){ return weekFromSchedule(); });
}

/* Rosters. THE GUARD IS THE POINT.
   Verified 2026-09-03: api.sleeper.app returned HTTP 200 with a complete,
   well-formed rosters array in which EVERY players[] was empty — a stale edge
   response, not an error. Rendered naively that is an empty roster and a
   waiver wire containing the entire league. A sync that returns a league of
   ghosts is a FAILED sync, and it must not overwrite good data. */
/* League status, so an undrafted league reads as "not drafted yet" rather than
   as the ghost-payload failure. Joop drafts 2026-09-06 and its rosters are
   legitimately empty until then; without this the page would greet Chris with
   a data-corruption warning for a league that is simply early. */
/* This call already pulled the WHOLE league object and threw away everything
   but .status. scoring_settings rides along for free, and it is the difference
   between scoring Chris's roster at his league's real rules and scoring it at
   an August transcription of them. The baked snapshot stays as the fallback
   for a dead network, nothing more. */
var LEAGUE_STATUS = null;
function loadLeagueStatus(){
  return getJSON(API + "league/" + LG.leagueId).then(function(l){
    LEAGUE_STATUS = (l && l.status) || null;
    if(l && l.scoring_settings && typeof l.scoring_settings === "object"){
      SCORING = l.scoring_settings;
    }
    return LEAGUE_STATUS;
  }).catch(function(){ return null; });
}

function loadRoster(){
  return getJSON(API + "league/" + LG.leagueId + "/rosters").then(function(rs){
    if(!Array.isArray(rs) || !rs.length) throw new Error("no rosters returned");

    var withPlayers = rs.filter(function(r){ return (r.players || []).length; });
    if(!withPlayers.length){
      var e;
      if(LEAGUE_STATUS === "pre_draft" || LEAGUE_STATUS === "drafting"){
        e = new Error("This league has not drafted yet — there is no roster to show.");
        e.predraft = true;
      } else {
        e = new Error("Sleeper returned " + rs.length + " rosters with no players on any of them");
        e.ghost = true;
      }
      throw e;
    }

    var mine = rs.filter(function(r){ return r.owner_id === LG.sleeperUserId; })[0];
    if(!mine) throw new Error("no roster in this league is owned by user " + LG.sleeperUserId);
    if(!(mine.players || []).length){
      var e2 = new Error("your roster came back empty"); e2.ghost = true; throw e2;
    }

    var rostered = {};
    rs.forEach(function(r){ (r.players || []).forEach(function(p){ rostered[String(p)] = 1; }); });
    var faabOf = function(r){ return LG.faab - ((r.settings && r.settings.waiver_budget_used) || 0); };
    var rivals = rs.filter(function(r){ return r.roster_id !== mine.roster_id; })
                   .map(faabOf).sort(function(a,b){ return a - b; });

    return {
      players: (mine.players || []).map(String),
      starters: (mine.starters || []).map(String),
      reserve: (mine.reserve || []).map(String),
      faab: faabOf(mine),
      maxRivalFaab: rivals.length ? rivals[rivals.length - 1] : LG.faab,
      rostered: rostered,
      rosterId: mine.roster_id
    };
  });
}

/* Per-player facts. One small request each (~1KB), for roster players only —
   about 18 of them. The 5MB players/nfl dump is deliberately NOT used; it
   would dominate load time on a phone to answer a question about 18 people.
   Cached for CACHE_MIN so a page reopened during the same sitting is instant;
   injury designations move fast enough that a long TTL would be a liar. */
var CACHE_MIN = 90;
var UNRESOLVED = [];   // ids whose live facts could not be fetched this sync

/* force=true bypasses the TTL. The Refresh button MUST force.
   Without it, tapping Refresh at 11:30 on a Sunday re-uses a 10:00 cache and
   then reports "synced just now" — which is precisely when inactives drop and
   precisely the moment the page would be lying. The cache exists to make a
   page REOPENED in the same sitting instant, not to ignore a deliberate ask. */
function loadPlayers(ids, force){
  var cache = lsGet() || {};
  var pc = cache.players || {};
  var fresh = Date.now() - CACHE_MIN * 60000;
  var need = [], out = {};

  ids.forEach(function(sid){
    sid = String(sid);
    if(isDef(sid)) return;
    var hit = pc[sid];
    if(!force && hit && hit.at > fresh){ out[sid] = hit; } else { need.push(sid); }
  });

  if(!need.length){ LIVE = out; UNRESOLVED = []; return Promise.resolve(out); }

  return Promise.all(need.map(function(sid){
    return getJSON(API + "players/nfl/" + sid).then(function(p){
      return {sid:sid, v:{
        name: ((p.first_name || "") + " " + (p.last_name || "")).trim() || null,
        pos: p.position || null,
        team: p.team || null,
        status: p.injury_status || null,
        depth: (p.depth_chart_order == null ? null : p.depth_chart_order),
        at: Date.now()
      }};
    }).catch(function(){ return {sid:sid, v:null}; });
  })).then(function(res){
    var failed = [];
    res.forEach(function(r){
      if(r && r.v){ out[r.sid] = r.v; }
      else if(r){
        // Keep a previous good record rather than dropping the player entirely,
        // but remember that we did not confirm it this time round.
        if(pc[r.sid]) out[r.sid] = pc[r.sid];
        failed.push(r.sid);
      }
    });
    LIVE = out;
    UNRESOLVED = failed;
    cache.players = out;
    cache.at = Date.now();
    lsSet(cache);
    return out;
  });
}

/* ---------- projections ----------
   One call per rostered player, all 18 weeks each — about 18 requests, the
   same shape and the same cache window as the per-player facts above. There is
   no bulk endpoint that returns components for an arbitrary id list, and the
   season-wide dump is megabytes to answer a question about eighteen people.

   NEVER add order_by=ppr. Measured 2026-09-07: it strips the stats block on
   BOTH hosts, leaving rows that look healthy and carry no components — which
   is exactly the failure that cost two sessions to diagnose. Nothing here can
   be re-scored without the components, so the parameter would silently turn
   every league-rules number back into the vendor's six-point-TD number.

   DEF works: a Sleeper defense id IS the team abbreviation, and
   /projections/nfl/player/SEA returns a full defensive stat line (verified
   2026-09-07 — SEA week 11 comes back null, which is the bye behind Ball
   Knowers' week-11 hole). */
function projUrl(sid){
  return API_ROOT + "projections/nfl/player/" + encodeURIComponent(sid)
       + "?season=" + SEASON_YEAR + "&season_type=regular&grouping=week";
}

function loadProjections(ids, force){
  var cache = lsGet() || {};
  var pj = cache.proj || {};
  var fresh = Date.now() - CACHE_MIN * 60000;
  var need = [], out = {};

  ids.forEach(function(sid){
    sid = String(sid);
    var hit = pj[sid];
    if(!force && hit && hit.at > fresh && hit.w){ out[sid] = hit; }
    else { need.push(sid); }
  });

  var finish = function(){
    PROJ = {};
    for(var sid in out){ PROJ[sid] = out[sid].w; }
    /* PARTIAL is not OK. A page that ranked nine of eleven slots and said
       nothing would be claiming a completeness it does not have. */
    PROJ_STATE = PROJ_MISSING.length
      ? (Object.keys(out).length ? "partial" : "fallback")
      : "live";
    cache.proj = out;
    cache.at = Date.now();
    lsSet(cache);
    return PROJ;
  };

  if(!need.length){ PROJ_MISSING = []; return Promise.resolve(finish()); }

  return Promise.all(need.map(function(sid){
    return getJSON(projUrl(sid)).then(function(byWeek){
      if(!byWeek || typeof byWeek !== "object") throw new Error("shape");
      var w = {};
      for(var k = 1; k <= 18; k++){
        var row = byWeek[String(k)];
        /* A literal null is a BYE OR MISSING DATA and this layer does not
           decide which — it preserves the null and lets weekState() settle it
           against the schedule. Spencer Shrader is null for weeks 2-18 while
           Indianapolis plays every one of them; collapsing that here would
           bench Joop's only kicker for the season. */
        w[String(k)] = (row && row.stats) ? {
          stats: row.stats,
          /* The live feed says `opponent` / `is_away_team`; the baked snapshot
             says `opp` / `away`. Normalise here so one shape reaches the
             renderer and a fallback row is indistinguishable from a live one
             except where the page deliberately says which it used. */
          opp: row.opponent || null,
          away: row.is_away_team ? 1 : 0,
          lm: row.last_modified || null
        } : null;
      }
      return {sid:sid, v:{w:w, at:Date.now()}};
    }).catch(function(){ return {sid:sid, v:null}; });
  })).then(function(res){
    var failed = [];
    res.forEach(function(r){
      if(r && r.v){ out[r.sid] = r.v; }
      else if(r){
        // Same rule as the facts cache: keep the last good record rather than
        // dropping the player, but remember it was not confirmed this time.
        if(pj[r.sid]) out[r.sid] = pj[r.sid];
        failed.push(r.sid);
      }
    });
    PROJ_MISSING = failed;
    return finish();
  });
}

/* scoreFor(sid, week) -> {pts, vendor, opp, away, floor, unmatched, src} | null

   LIVE WINS OUTRIGHT, INCLUDING WHEN IT SAYS NULL. Same rule as team
   authority, for the same reason: if the live feed has a record for this
   player and reports no row for this week, that is an answer, and falling
   back to an August bake would resurrect exactly the staleness the live path
   exists to kill. The bake is for players the live fetch never reached. */
function scoreFor(sid, week){
  sid = String(sid); var wk = String(week);
  var rec = PROJ[sid];
  if(rec){
    var row = rec[wk];
    if(!row || !row.stats) return null;
    var sc = SCORING || S.scoring;
    if(sc){
      var r = RankEngine.rescore(row.stats, sc, {pos: facts(sid).pos});
      return {
        pts: r.pts, vendor: RankEngine.vendorPPR(row.stats),
        opp: row.opp, away: !!row.away,
        /* Non-empty unmatched means the league pays for something the feed
           cannot source, so this number is a FLOOR and the row must say so.
           Exactly one such key exists across both rosters: fgm_yds_over_30 on
           Joop's kickers. */
        floor: r.unmatched.length > 0, unmatched: r.unmatched,
        src: "live", lm: row.lm
      };
    }
  }
  var b = S.proj && S.proj[sid] && S.proj[sid].w ? S.proj[sid].w[wk] : null;
  if(b){
    var um = (S.proj[sid].unmatched || []);
    return {pts: b[0], vendor: b[3], opp: b[1], away: !!b[2],
            floor: um.length > 0, unmatched: um, src: "baked", lm: null};
  }
  return null;
}

/* buildPlayers(week) -> the {sid,pos,pts,playable} array the engine wants,
   plus the extra facts the band needs to explain itself.

   PLAYABLE is a certainty test, not a probability one. Out, IR, a roster
   reserve slot, a bye and "no game this week" are facts, so they set
   playable:false and the optimiser routes around them. DOUBTFUL DOES NOT:
   it is a hard flag the band always speaks about, but a doubtful starter can
   still be the right start, and marking him unplayable would have the page
   silently manufacture a certainty Sleeper has not given it. The band handles
   him by costing the alternative instead — "if he sits, X takes the slot". */
var HARD_OUT = {Out:1, IR:1, PUP:1, NA:1, Sus:1, COV:1, DNR:1};

/* A FUTURE WEEK IS NOT THIS WEEK, AND TODAY'S INJURY ROOM IS A FACT ABOUT
   TODAY. Both `status` and the roster's reserve list describe week 1. Applied
   unchanged to week 12 they say "this player is out in December", which Sleeper
   has not claimed and nobody knows — and because the look-ahead's whole job is
   to find slots with nobody in them, a single Out designation on a single-body
   position would manufacture a hole in every remaining week of the season.

   So beyond the live week, availability is the part that is actually knowable
   in September: the bye calendar and the schedule. The strip and the roll-up
   both say in copy that they assume today's roster at full health, because that
   assumption is doing real work and hiding it would be the same class of lie as
   showing a season average as a weekly projection.

   A player Sleeper reports with no team stays unplayable — he genuinely has no
   game — but the roll-up reports that as one standing roster gap rather than as
   seventeen dated emergencies. See rollupItems(). */
function buildPlayers(week){
  var res = {}; (ROSTER.reserve || []).forEach(function(s){ res[String(s)] = 1; });
  var future = NOW_WEEK != null && week > NOW_WEEK;
  return (ROSTER.players || []).map(function(sid){
    sid = String(sid);
    var f = facts(sid);
    var bye = onBye(f.team, week);
    var g = bye ? null : gameFor(f.team, week);
    var sc = scoreFor(sid, week);
    return {
      sid: sid, pos: f.pos, name: f.name, team: f.team,
      pts: sc ? sc.pts : null,
      score: sc,
      bye: bye, game: g, locked: !!(g && isLocked(g)),
      status: f.status, reserve: !!res[sid], stale: f.stale,
      noTeam: !f.team,
      state: RankEngine.weekState(sc ? {stats:1} : null, bye),
      playable: future
        ? (!bye && !!g)
        : (!bye && !!g && !res[sid] && !HARD_OUT[f.status])
    };
  });
}

/* =====================================================================
   RENDER
   ===================================================================== */
function setStatus(state, msg){
  STATUS.state = state; STATUS.msg = msg;
  var d = el("statusDot"), t = el("statusTxt");
  d.className = "dot" + (state === "ok" ? " ok" : state === "bad" ? " bad" : state === "stale" ? " stale" : "");
  t.textContent = msg;
}

function rowHTML(slotLabel, sid, opts){
  opts = opts || {};
  if(!sid || sid === "0"){
    return '<div class="row empty"><div class="slot">' + esc(slotLabel) + '</div>'
         + '<div class="body"><div class="nm dim">empty</div>'
         + '<div class="meta">nothing set in Sleeper</div></div></div>';
  }
  var f = facts(sid);
  var bye = onBye(f.team, WEEK);
  var g = bye ? null : gameFor(f.team, WEEK);
  var locked = g && isLocked(g);

  var pills = "";
  var sp = f.status && STATUS_PILL[f.status];
  if(sp) pills += '<span class="pill ' + sp.c + '">' + sp.t + '</span>';
  if(bye) pills += '<span class="pill bye">BYE</span>';
  if(locked) pills += '<span class="pill locked">LOCKED</span>';
  // An unconfirmed row is marked ON THE ROW. Computing a staleness flag and
  // then rendering the row identically is the same as not computing it.
  if(f.stale) pills += '<span class="pill unconf" title="not confirmed with Sleeper">?</span>';

  var line;
  if(bye){
    line = esc(f.team || "?") + " · on bye";
  } else if(g){
    line = esc(f.team) + " " + (g.home ? "vs " : "@ ") + esc(g.opp);
  } else if(f.team){
    line = esc(f.team) + " · no game this week";
  } else if(f.stale){
    line = "team not confirmed";
  } else {
    line = "no NFL team";
  }
  if(f.stale && f.team) line += " · unconfirmed";
  if(f.pos && f.pos !== "DEF") line = esc(f.pos) + " · " + line;

  /* The projected number, secondary to the kickoff by design (Session A:
     "tier first, number secondary and de-emphasised"). Three states, and they
     must read differently:
       12.4   a league-rules number, re-scored from live components
       ≥ 8.1  a FLOOR — the league pays for something the feed cannot source.
              Exactly one such key exists across both rosters, Joop's
              fgm_yds_over_30, so this marks Joop's two kickers and nobody
              else. It is never the vendor's number wearing a league label.
       —      no projection: excluded from ranking, and the row says so
                                                                            */
  var sc = (!bye && g) ? scoreFor(sid, WEEK) : null;
  var ptsHTML = "";
  if(!bye && g){
    if(sc && sc.pts != null){
      ptsHTML = '<span class="pts' + (sc.floor ? ' floor' : '') + '" title="'
              + (sc.floor ? 'a floor — this league pays for a stat the projection feed does not carry'
                          : 'projected at your league&#39;s scoring, not the vendor&#39;s')
              + '">' + (sc.floor ? '&ge;&nbsp;' : '') + (Math.round(sc.pts * 10) / 10).toFixed(1)
              + '</span>';
    } else if(PROJ_STATE !== "pending"){
      ptsHTML = '<span class="pts none" title="no projection — excluded from ranking">&mdash;</span>';
    }
  }

  var right = "";
  if(!bye && g){
    right = '<div class="right"><b>' + esc(kickLabel(g) || "") + '</b>' + ptsHTML + '</div>';
  }

  /* An unconfirmed player says so ON HIS OWN ROW, every time. Whether that
     doubt reaches the band is a separate and much narrower test — see
     RankEngine.unrankableSlots() — because one dropped fetch marking five of
     eleven slots would train Chris to ignore the band entirely. */
  var norank = "";
  if(opts.starter && PROJ_STATE !== "pending"
     && (PROJ_MISSING.indexOf(sid) >= 0 || (f.stale && (!sc || sc.pts == null)))){
    norank = '<div class="norank">couldn&rsquo;t rank &mdash; not confirmed with Sleeper</div>';
  }

  var cls = "row";
  if(opts.starter && (bye || f.status === "Out" || f.status === "IR")) cls += " alert";
  else if(opts.starter && (f.status === "Doubtful")) cls += " soft";

  return '<div class="' + cls + '">'
       + '<div class="slot' + (opts.flex ? " flex" : "") + '">' + esc(slotLabel) + '</div>'
       + '<div class="body"><div class="nm">' + esc(f.name) + pills + '</div>'
       + '<div class="meta">' + line + '</div>' + norank + '</div>'
       + right + '</div>';
}

/* Alerts: only things that need a decision. An empty list renders nothing at
   all rather than a reassuring green box — silence is the signal that the
   lineup is fine, which is the whole "stay quiet unless it matters" stance. */
function alertList(){
  var out = [];
  var st = ROSTER.starters || [];
  LG.lineup.forEach(function(slot, i){
    var sid = String(st[i] || "0");
    if(sid === "0"){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(slot) + " is empty</b> — no player set in Sleeper"});
      return;
    }
    var f = facts(sid);
    if(onBye(f.team, WEEK)){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> is on bye (" + esc(f.team) + ") but is in your " + esc(slot)});
    } else if(f.status === "Out" || f.status === "IR"){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> is " + esc(f.status) + " and is in your " + esc(slot)});
    } else if(f.status === "Doubtful"){
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> is Doubtful in your " + esc(slot)});
    } else if(f.status === "Questionable"){
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> is Questionable in your " + esc(slot)});
    } else if(f.stale || !f.team){
      // A starter the page could not verify is worth saying out loud. Silence
      // here reads as "all clear", and the one row we know nothing about is the
      // last row that should be silently reassuring.
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> in your " + esc(slot)
        + " could not be confirmed with Sleeper — check him yourself"});
    } else if(!gameFor(f.team, WEEK)){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> (" + esc(f.team)
        + ") has no game in week " + WEEK + " but is in your " + esc(slot)});
    }
  });
  return out;
}

/* =====================================================================
   THE DECISION BAND
   ---------------------------------------------------------------------
   QUIET STATE IS THE FEATURE. A band that speaks every week is a band Chris
   scrolls past, and then the week it matters he scrolls past that too. When
   nothing fires this renders ONE line plus the threshold it used and any
   count it could not confirm — never a reassuring green summary of nine
   healthy slots.

   IT SUPERSEDES THE SESSION-A ALERTS PANEL ON THE LIVE WEEK, deliberately.
   The band says everything alertList() said and shows the arithmetic behind
   it; rendering both would tell Chris about the same bye twice, in two
   different voices, eleven inches apart. Off the live week the band is gated
   and alertList() is still the only thing watching, so it stays.
   ===================================================================== */

var BAND = null;        // computed once per render, consumed by bandHTML()
var BAND_MORE = false;  // "+N more" disclosure

function one(n){ return (Math.round(n * 10) / 10).toFixed(1); }
function signed(n){ var v = Math.round(n * 10) / 10; return (v > 0 ? "+" : "") + v.toFixed(1); }

/* The rule that fired, in words, on the page. Not a tooltip and not a
   console log — if Chris cannot see why a slot was flagged he has to trust
   it, and trust is the one thing a lineup tool has to earn every week. */
function ruleFor(gap, thr){
  return "gap " + one(gap) + " vs threshold " + one(thr)
       + " — " + (gap < thr ? "under it, so this is close" : "over it, so this is clear");
}
function thresholdNote(thr){
  return "Threshold " + one(thr) + " pts (the floor). σ is not wired yet — it "
       + "lands with the usage layer, and until then this errs toward speaking up.";
}

function computeBand(){
  if(!ROSTER) return null;
  /* WEEK GATING. Ranking this week's lineup against the starters[] Chris set
     for week 1 while he is looking at week 9 produces confident nonsense —
     the array is positional and has no idea which week it belongs to. */
  if(NOW_WEEK && WEEK !== NOW_WEEK) return {gated:true, week:WEEK, now:NOW_WEEK};
  if(PROJ_STATE === "pending") return {pending:true};

  var st = [];
  (ROSTER.starters || []).forEach(function(s, i){ st[i] = (s == null ? null : String(s)); });

  var players = buildPlayers(WEEK);
  var byId = {}; players.forEach(function(p){ byId[p.sid] = p; });
  var thr = RankEngine.closeThreshold(null, CLOSE_FLOOR);

  /* LOCK AWARENESS. A starter whose game has kicked off is a fact, not a
     candidate, so he is pinned; a bench player whose game has kicked off can
     no longer be moved in, so he is excluded. Seattle kicks off Wednesday
     09-09 while the rest of both lineups stay open until Sunday — the DEF
     slot locks four days before anything else, and a band that offered a
     defense swap on Saturday would be offering something Sleeper will refuse. */
  var pinned = {}, exclude = {}, inLineup = {};
  st.forEach(function(sid){ if(sid && sid !== "0") inLineup[sid] = 1; });
  LG.lineup.forEach(function(slot, i){
    var sid = st[i];
    if(!sid || sid === "0") return;
    var p = byId[sid];
    if(p && p.locked) pinned[i] = sid;
  });
  players.forEach(function(p){ if(p.locked && !inLineup[p.sid]) exclude[p.sid] = 1; });

  var opt = RankEngine.assignLineup(ECFG, players, {pinned: pinned, exclude: exclude});
  var delta = RankEngine.lineupDelta(ECFG, players, st, opt);

  /* A MOVE IS SOMEONE ENTERING OR LEAVING THE LINEUP — never a permutation
     inside it.

     lineupDelta() reports every slot whose occupant changed, which is the
     right primitive and the wrong unit for a human. Measured against one
     bench receiver worth 20: the optimiser produced FOUR slot changes —
     Wilson into WR1, Jefferson down to WR2, London to the first FLEX,
     Montgomery to the second — for a single decision worth +7.0. Three of
     those four are Sleeper shuffling equivalent players between
     interchangeable slots; none is a choice Chris makes, and a band that
     lists them has buried its one real sentence under three fake ones.

     So diff the SETS. Whoever is in the optimal lineup and not the actual one
     is coming in; whoever is in the actual and not the optimal is going out;
     everything else is noise the page never mentions. This is the same
     reasoning that made close a total-lineup delta rather than nine pairwise
     claims — applied one level further out. */
  var wasSet = {}, nowSet = {};
  st.forEach(function(sid){ if(sid && sid !== "0") wasSet[sid] = 1; });
  for(var ai in opt.assign){ nowSet[String(opt.assign[ai])] = 1; }

  var movesOf = function(assign){
    var inSet = {};
    for(var k in assign){ inSet[String(assign[k])] = 1; }
    var coming = [], going = [];
    for(var a in inSet){ if(!wasSet[a]) coming.push(a); }
    for(var b in wasSet){ if(!inSet[b]) going.push(b); }
    var pts = function(s){ var p = byId[s]; return (p && p.pts != null) ? p.pts : 0; };
    coming.sort(function(x, y){ return pts(y) - pts(x); });
    going.sort(function(x, y){ return pts(x) - pts(y); });
    return coming.map(function(sid, k){
      var outSid = going[k] || null;
      /* Attribute the move to the slot the OUTGOING player was in, because
         that is the slot Chris is looking at. */
      var at = outSid ? st.indexOf(outSid) : -1;
      if(at < 0){ for(var s2 in assign){ if(String(assign[s2]) === sid){ at = Number(s2); break; } } }
      return {"in": sid, out: outSid, i: at,
              slot: at >= 0 ? LG.lineup[at] : null,
              gain: Math.round((pts(sid) - (outSid ? pts(outSid) : 0)) * 100) / 100};
    });
  };

  var moves = movesOf(opt.assign);
  var moveByOutSlot = {};
  moves.forEach(function(m){ if(m.i >= 0) moveByOutSlot[m.i] = m; });

  /* What the lock actually cost: the same solve with nothing pinned or
     excluded, diffed against the real one. The suppressed moves are never
     offered as actions — they are unreachable — but the COUNT belongs in the
     quiet line, because "nothing to change" and "one thing to change that you
     no longer can" are different sentences. */
  var freeOpt = RankEngine.assignLineup(ECFG, players, {});
  var taken = {}; moves.forEach(function(m){ taken[m["in"]] = 1; });
  var suppressed = [];
  movesOf(freeOpt.assign).forEach(function(m){
    if(taken[m["in"]]) return;              // this move is available, not lost
    var outgoing = m.out ? byId[m.out] : null;
    var incoming = byId[m["in"]];
    /* Only a LOCK can suppress a move. Anything else that differs between the
       two solves is the permutation noise filtered out above, and reporting it
       as "too late" would invent a loss that never existed. */
    var blocker = (outgoing && outgoing.locked) ? outgoing
                : ((incoming && incoming.locked) ? incoming : null);
    if(!blocker) return;
    suppressed.push({slot: m.slot, i: m.i, name: blocker.name,
                     inName: incoming ? incoming.name : m["in"],
                     when: kickLabel(blocker.game) || "already started"});
  });

  var hs = RankEngine.holes(ECFG, players);
  var holeBy = {}; hs.forEach(function(h){ holeBy[h.i] = h; });

  /* Unconfirmed players: every one of them marks its own ROW. Only the ones
     that could actually change a slot reach the band. */
  var unconfirmed = [];
  UNRESOLVED.forEach(function(s){ if(unconfirmed.indexOf(s) < 0) unconfirmed.push(s); });
  PROJ_MISSING.forEach(function(s){ if(unconfirmed.indexOf(s) < 0) unconfirmed.push(s); });
  var unrank = RankEngine.unrankableSlots(ECFG, players, unconfirmed, thr, st);

  /* ITEM ORDER, worst-first and deliberately not by severity alone:
       0  a hole — no legal lineup exists and only a waiver add fixes it
       1  a hard flag — empty slot, Out, bye, Doubtful
       2  a clear upgrade
       3  a close call
       4  a slot a failed fetch genuinely put in doubt
       5  a body with no projection — start him anyway
     A hole outranks a bye because it is strictly worse: the bye tells Chris to
     move someone, the hole tells him there is nobody to move. Only the first
     three items show without tapping, so this order decides what he sees. */
  var items = [];
  var add = function(rank, crit, line, rule){
    items.push({rank: rank, crit: !!crit, line: line, rule: rule || null});
  };

  LG.lineup.forEach(function(slot, i){
    var label = slot === "SUPER_FLEX" ? "SFLX" : slot;
    var sid = st[i];
    var swap = moveByOutSlot[i];

    /* A slot with a no-body hole is handled ONCE, by the hole item below.
       Without this, week 11 said "SEA DEF is on bye" and "No DEF available"
       as two separate lines — the same problem, twice, in two voices, and
       neither of them mentioning the other. The hole item is the one that
       tells Chris what to actually do. */
    if(holeBy[i] && holeBy[i].reason === "no-body") return;

    if(!sid || sid === "0"){
      var fill = swap && swap["in"] ? byId[String(swap["in"])] : null;
      add(1, true, "<b>" + esc(label) + " is empty</b> — nothing set in Sleeper"
        + (fill ? ". Best available: " + esc(fill.name) + " (" + one(fill.pts) + ")" : ""),
        "an unset slot scores zero, whatever else the lineup does");
      return;
    }

    var p = byId[sid];
    if(!p) return;
    var repl = swap && swap["in"] ? byId[String(swap["in"])] : null;

    if(p.bye){
      add(1, true, "<b>" + esc(p.name) + "</b> is on bye (" + esc(p.team || "?")
        + ") in your " + esc(label)
        + (repl ? " — start <b>" + esc(repl.name) + "</b> instead (" + one(repl.pts) + ")" : ""),
        "a bye is a certainty, not a projection");
      return;
    }
    if(HARD_OUT[p.status]){
      add(1, true, "<b>" + esc(p.name) + "</b> is " + esc(p.status) + " in your " + esc(label)
        + (repl ? " — start <b>" + esc(repl.name) + "</b> instead (" + one(repl.pts) + ")" : ""),
        "Out and IR are hard flags: they fire whatever the gap is");
      return;
    }
    if(p.status === "Doubtful"){
      /* Doubtful is a hard flag but NOT an automatic bench — costing the
         alternative is more use than pretending to know he will sit. */
      var ex2 = {}; for(var k in exclude) ex2[k] = 1; ex2[p.sid] = 1;
      var pin2 = {};
      for(var k2 in pinned){ if(String(pinned[k2]) !== p.sid) pin2[k2] = pinned[k2]; }
      var alt = RankEngine.assignLineup(ECFG, players, {pinned: pin2, exclude: ex2});
      var cost = Math.round((opt.total - alt.total) * 100) / 100;
      var taker = alt.assign[i] != null ? byId[String(alt.assign[i])] : null;
      add(1, true, "<b>" + esc(p.name) + "</b> is Doubtful in your " + esc(label)
        + (taker ? " — if he sits, <b>" + esc(taker.name) + "</b> takes it" : " — and nobody else is eligible"),
        taker ? "costs " + one(cost) + " pts to bench him now; Doubtful is a hard flag, so decide it deliberately"
              : "no eligible replacement exists, so this slot is his either way");
      return;
    }

    if(swap && swap.gain > 0 && repl){
      if(swap.gain >= thr){
        add(2, false, "<b>" + esc(label) + ":</b> start <b>" + esc(repl.name) + "</b> ("
          + one(repl.pts) + ") over " + esc(p.name) + " (" + one(p.pts) + ")",
          ruleFor(swap.gain, thr)
          + (p.status === "Questionable" ? " · and " + esc(p.name) + " is Questionable" : ""));
      } else {
        /* Questionable is never a flag on its own — here it is the tiebreak
           that tips an already-close slot toward the HEALTHY player, and it
           has to work in BOTH directions. The first version only looked at the
           incumbent, so a Questionable challenger read as a reason to bench a
           healthy starter, which is precisely backwards. It breaks the tie
           only when exactly one of the two is Questionable; if both are, it
           says nothing, because it distinguishes nothing. */
        var qOut = (p.status === "Questionable");
        var qIn = (repl.status === "Questionable");
        var tie = "";
        if(qOut && !qIn){
          tie = " — and " + esc(p.name) + " is Questionable, which breaks the tie toward "
              + esc(repl.name);
        } else if(qIn && !qOut){
          tie = " — and " + esc(repl.name) + " is Questionable, which breaks the tie toward "
              + esc(p.name) + ", who you already have in";
        }
        add(3, false, "<b>" + esc(label) + ":</b> " + esc(repl.name) + " (" + one(repl.pts)
          + ") and " + esc(p.name) + " (" + one(p.pts) + ") are too close to call" + tie,
          ruleFor(swap.gain, thr));
      }
    }
    /* Not close and not behind: Questionable alone stays quiet by design. It
       is a pill on the row and nothing more. */
  });

  hs.forEach(function(h){
    var label = h.slot === "SUPER_FLEX" ? "SFLX" : h.slot;
    if(h.reason === "no-body"){
      /* Name the man who WAS in the slot, so the item reads as one story
         rather than an abstract complaint about a position. */
      var was = st[h.i] && st[h.i] !== "0" ? byId[st[h.i]] : null;
      var why = was ? (was.bye ? esc(was.name) + " is on bye and "
                               : esc(was.name) + " is " + esc(was.status || "unavailable") + " and ") : "";
      add(0, true, "<b>No " + esc(label) + " available</b> — " + why
        + "nobody else on the roster can fill it",
        "only a waiver add fixes this; no move between your own players will");
    } else {
      add(5, false, "<b>" + esc(label) + " cannot be projected</b> — you have a body, "
        + "the feed has no numbers for him",
        "start him anyway; this is missing data, not a missing player");
    }
  });

  unrank.forEach(function(u){
    var label = u.slot === "SUPER_FLEX" ? "SFLX" : u.slot;
    var p = byId[u.sid];
    add(4, false, "<b>" + esc(label) + " could not be ranked</b> — "
      + esc(p ? p.name : u.sid) + " did not come back from Sleeper",
      "his last known " + one(u.pts) + " is within " + one(u.threshold) + " of the slot, "
      + "so it could change the answer");
  });

  items.sort(function(a, b){ return a.rank - b.rank; });

  return {
    items: items, delta: delta, thr: thr, suppressed: suppressed,
    unconfirmed: unconfirmed, projState: PROJ_STATE,
    crit: items.some(function(i){ return i.crit; })
  };
}

function bandHTML(){
  var b = BAND;
  if(!b) return "";

  if(b.gated){
    return '<div class="band"><div class="bhead"><h3>Decisions</h3></div>'
      + '<div class="bquiet">Decisions are live-week only. You are on week ' + b.week
      + '; the NFL is on week ' + b.now + ', and the lineup below is the one you set '
      + 'for week ' + b.now + ' — ranking it against week ' + b.week
      + ' would be comparing two different questions.</div></div>';
  }
  if(b.pending){
    return '<div class="band"><div class="bhead"><h3>Decisions</h3></div>'
      + '<div class="bpend">Ranking your lineup&hellip;</div></div>';
  }

  var foot = [];
  if(b.suppressed.length){
    foot.push(b.suppressed.length + ' change' + (b.suppressed.length === 1 ? '' : 's')
      + ' too late to make — ' + b.suppressed.map(function(s){
          return esc(s.inName) + ' for ' + esc(s.name) + ', but '
               + esc(s.name) + ' kicked off ' + esc(s.when);
        }).join('; '));
  }
  if(b.unconfirmed.length){
    foot.push(b.unconfirmed.length + ' player' + (b.unconfirmed.length === 1 ? '' : 's')
      + ' could not be confirmed with Sleeper');
  }
  if(b.projState === "fallback"){
    foot.push('Projections came from the baked snapshot, not live — the numbers may be stale.');
  } else if(b.projState === "partial"){
    foot.push('Some projections came from the baked snapshot.');
  }

  if(!b.items.length){
    /* THE QUIET LINE. One sentence, the threshold it used, and anything it
       could not confirm. Silence must only ever mean "checked and fine". */
    return '<div class="band quiet"><div class="bhead"><h3>Decisions</h3></div>'
      + '<div class="bquiet"><b>Lineup checked, nothing to change.</b></div>'
      + '<div class="bfoot">' + esc(thresholdNote(b.thr))
      + (foot.length ? '<br>' + foot.join('<br>') : '') + '</div></div>';
  }

  var shown = BAND_MORE ? b.items : b.items.slice(0, 3);
  var hidden = b.items.length - shown.length;

  var h = '<div class="band ' + (b.crit ? 'crit' : 'act') + '">'
    + '<div class="bhead"><h3>Decisions · ' + b.items.length + '</h3>'
    + (b.delta.delta > 0
        ? '<span class="bdelta">' + signed(b.delta.delta) + ' pts</span>' : '')
    + '</div><ul class="bitems">';

  shown.forEach(function(it){
    h += '<li class="bitem' + (it.crit ? ' hard' : '') + '">'
       + '<div class="bl">' + it.line + '</div>'
       + (it.rule ? '<div class="brule">' + esc(it.rule) + '</div>' : '')
       + '</li>';
  });
  h += '</ul>';

  if(hidden > 0){
    h += '<button class="bmore" onclick="toggleMore()" style="margin:0 12px">+'
       + hidden + ' more</button>';
  } else if(BAND_MORE && b.items.length > 3){
    h += '<button class="bmore" onclick="toggleMore()" style="margin:0 12px">show fewer</button>';
  }

  h += '<div class="bfoot">' + esc(thresholdNote(b.thr))
     + (foot.length ? '<br>' + foot.join('<br>') : '') + '</div></div>';
  return h;
}

function toggleMore(){ BAND_MORE = !BAND_MORE; render(); }

/* =====================================================================
   THE LATER-THIS-SEASON ROLL-UP

   A four-week strip viewed in week 1 covers weeks 2-5 and shows none of the
   five weeks where no legal lineup exists — the earliest is Ball Knowers week
   7. So the strip is not enough on its own, and this scans every week left in
   the season instead.

   It answers ONE question: which weeks from here to the end have a slot with
   nobody in it. That is knowable in September, it is the most expensive thing
   on this page to discover late, and every row of it hands straight to the
   waiver tool.

   AVAILABILITY ONLY. Nothing here reads a projection, by construction:
   holes() reports a slot with no BODY separately from a slot it cannot score,
   and this consumes lookahead()'s `unfilled`, which is the no-body half. So
   the roll-up is correct before a single projection has arrived, and a dead
   projection fetch cannot invent a hole or hide one.
   ===================================================================== */
var ROLL = null;
var ROLL_OPEN = false;

/* The regular season is 18 weeks. Scanning to a CONSTANT rather than to the
   last week the bake happens to contain is what makes the "can't tell" state
   reachable: a truncated schedule pull then shows as weeks we cannot answer
   for, instead of silently shortening the season and reporting all-clear on
   the part it still has. */
var SEASON_WEEKS = 18;

/* A slot that is empty in this many or more of the scanned weeks is a STANDING
   ROSTER GAP, not a run of dated emergencies. The five real bye-week holes are
   one week each, so this never touches them — it exists for the shape that
   would otherwise fill the list with noise: a player Sleeper reports with no
   NFL team has no game in EVERY remaining week, so a cut kicker would print
   seventeen identical rows and bury the five that matter. One line, named
   cause, once. */
var STANDING_MIN = 4;

/* Who is eligible for this slot and why none of them can play. The reason is
   the actionable half — "LAC bye" is a date you can plan around, "no NFL team"
   is a roster problem that will not fix itself. */
function holeCause(slotName, players){
  var out = [];
  (players || []).forEach(function(p){
    if(!RankEngine.slotEligible(p.pos, slotName, ECFG)) return;
    out.push({
      name: p.name, team: p.team,
      cut: !!p.noTeam,
      why: p.noTeam ? "no NFL team"
         : p.bye ? ((p.team || "?") + " bye")
         : "no game"
    });
  });
  return out;
}

/* The slot CHIP keeps the league's own code (K, DEF, SFLX) because that is what
   Sleeper shows Chris. The PROSE spells it out, because "your only K" reads
   like a typo and "your only kicker" reads like a sentence. */
var SLOT_WORD = {
  QB:"quarterback", RB:"running back", WR:"receiver", TE:"tight end",
  K:"kicker", DEF:"defense", FLEX:"flex", SUPER_FLEX:"superflex"
};
function slotWord(slot){ return SLOT_WORD[slot] || slot; }
function slotChip(slot){ return slot === "SUPER_FLEX" ? "SFLX" : slot; }

function computeRollup(){
  if(NOW_WEEK == null) return {pending:true};
  if(!ROSTER.players || !ROSTER.players.length) return null;

  /* ONE source for the span. `from` is both the loop bound and the number the
     page prints — a mutation test caught them as two, where moving the scan
     silently left the label saying something else. */
  var from = NOW_WEEK + 1;
  var weeks = [], byWeek = {};
  for(var w = from; w <= SEASON_WEEKS; w++){
    var ps = buildPlayers(w);
    byWeek[w] = ps;
    weeks.push({week:w, players:ps, covered: !!S.schedule.weeks[String(w)]});
  }
  if(!weeks.length) return {done:true, items:[], thin:[], standing:[], unknown:[],
                            weekCount:0, from:from, last:SEASON_WEEKS};

  var scan = RankEngine.lookahead(ECFG, weeks);

  /* ONE source for what counts as a hole, too, for the same reason. Both the
     counting pass and the row pass below read THIS list — deriving the filter
     twice is how the no-projection bug got into `legal` in the first place, and
     a mutation that flipped only one of the two copies came back green. */
  var holeAt = {};
  scan.forEach(function(e){
    if(RankEngine.lookaheadState(e) !== "hole") return;
    holeAt[e.week] = e.unfilled;
  });

  /* Count first, then decide how to say it. A slot short in most of the
     remaining season is one fact; the same slot short in one week is another.
     Deciding per row would report the standing gap once per week. */
  var slotWeeks = {};
  scan.forEach(function(e){
    (holeAt[e.week] || []).forEach(function(hl){
      (slotWeeks[hl.slot] = slotWeeks[hl.slot] || []).push(e.week);
    });
  });

  var items = [], standing = [], thin = [], unknown = [], holeWeeks = {};
  var pw = (LG.playoffs && LG.playoffs.start_week) || null;

  for(var slot in slotWeeks){
    if(!Object.prototype.hasOwnProperty.call(slotWeeks, slot)) continue;
    if(slotWeeks[slot].length >= STANDING_MIN){
      var first = slotWeeks[slot][0];
      standing.push({
        slot: slot, weeks: slotWeeks[slot].slice(),
        from: first, count: slotWeeks[slot].length,
        cause: holeCause(slot, byWeek[first])
      });
    }
  }

  scan.forEach(function(e){
    var state = RankEngine.lookaheadState(e);
    if(state === "unknown"){ unknown.push(e.week); return; }
    if(state === "hole"){
      (holeAt[e.week] || []).forEach(function(hl){
        if(slotWeeks[hl.slot].length >= STANDING_MIN) return;   // said once, above
        holeWeeks[e.week] = 1;
        items.push({
          week: e.week, slot: hl.slot, i: hl.i,
          cause: holeCause(hl.slot, byWeek[e.week]),
          prePlayoff: pw ? (e.week === pw - 1) : false,
          inPlayoff:  pw ? (e.week >= pw) : false
        });
      });
    }
    e.thin.forEach(function(t){
      thin.push({week:e.week, slot:t.slot, pos:t.pos, supply:t.supply, demand:t.demand});
    });
  });

  items.sort(function(a,b){ return a.week - b.week || a.i - b.i; });
  thin.sort(function(a,b){
    if(a.week !== b.week) return a.week - b.week;
    return a.slot < b.slot ? -1 : a.slot > b.slot ? 1 : 0;
  });

  return {
    done: true, items: items, standing: standing, thin: thin, unknown: unknown,
    weekCount: Object.keys(holeWeeks).length,
    from: from, last: SEASON_WEEKS, playoffStart: pw
  };
}

function causeText(cause){
  if(!cause || !cause.length) return "nobody on your roster plays this slot";
  return cause.map(function(c){
    return '<span' + (c.cut ? ' class="cut"' : '') + '>' + esc(c.name)
         + " — " + esc(c.why) + "</span>";
  }).join(" · ");
}

function unfixableText(slot, cause){
  var n = cause ? cause.length : 0;
  if(n === 0) return "No " + slotWord(slot) + " on your roster at all";
  if(n === 1) return "Your only " + slotWord(slot);
  return "All " + n + " of your " + slotWord(slot) + " options are out";
}

function rollupHTML(){
  var r = ROLL;
  if(!r) return "";
  if(r.pending){
    return '<div class="roll"><div class="rollline">'
         + 'Checking the rest of the season…</div></div>';
  }

  /* THE HEADLINE COUNTS HOLES ONLY. Thin weeks are real and they are in the
     expansion, but a legal-but-awkward lineup is not "no legal lineup" and
     folding them into one number would inflate the only figure on this page
     Chris is meant to act on. */
  var n = r.weekCount, st = r.standing.length;
  var clean = !n && !st;
  var head;
  if(clean){
    head = '<b>Nothing unfillable</b> between week ' + r.from + ' and week ' + r.last + '.';
  } else {
    var bits = [];
    if(n) bits.push('<b>' + n + (n === 1 ? ' week' : ' weeks') + '</b> with no legal lineup');
    if(st) bits.push('<b>' + st + ' standing ' + (st === 1 ? 'gap' : 'gaps') + '</b>');
    head = bits.join(" and ") + ' between week ' + r.from + ' and week ' + r.last + '.';
  }
  if(r.unknown.length){
    head += ' ' + r.unknown.length + ' week' + (r.unknown.length === 1 ? '' : 's')
          + ' can’t be checked.';
  }

  var open = ROLL_OPEN && !clean;
  var h = '<div class="roll ' + (clean ? "clean" : "has") + '">';
  h += clean
    ? '<div class="rollline">' + head + '</div>'
    : '<button class="rollline" onclick="toggleRollup()">' + head
      + '<span class="rollcar">' + (open ? "hide" : "show") + '</span></button>';

  if(open){
    h += '<div class="rollbody">';

    var span = r.last - r.from + 1;
    r.standing.forEach(function(s){
      h += '<div class="rollrow"><div class="rollwk">Weeks ' + s.from + '–' + r.last
         + ' · <span class="slot">' + esc(slotChip(s.slot)) + '</span>'
         + '<span class="rolltag">standing gap</span></div>'
         + '<div class="rollwhy">' + causeText(s.cause) + '. '
         + esc(s.count >= span
             ? 'Every one of the ' + span + ' weeks left.'
             : s.count + ' of the ' + span + ' weeks left.')
         + ' This is a roster problem, not a bye — one add fixes all of them at once.'
         + '</div></div>';
    });

    r.items.forEach(function(it){
      var tag = it.prePlayoff
        ? '<span class="rolltag pre">last week before playoffs</span>'
        : it.inPlayoff ? '<span class="rolltag">playoff week</span>' : '';
      h += '<div class="rollrow"><div class="rollwk">Week ' + it.week
         + ' · <span class="slot">' + esc(slotChip(it.slot)) + '</span>' + tag + '</div>'
         + '<div class="rollwhy">' + causeText(it.cause) + '. '
         + esc(unfixableText(it.slot, it.cause)) + ' — only a waiver add fixes it.'
         + '</div></div>';
    });

    if(r.thin.length){
      h += '<div class="rollsub"><b>Thin, but legal:</b> '
         + r.thin.map(function(t){
             return 'week ' + t.week + ' ' + esc(slotChip(t.slot))
                  + ' (' + esc(t.pos) + ' ' + t.supply + ' left, ' + t.demand + ' needed first)';
           }).join(" · ")
         + '. A lineup exists, but the position that normally fills that slot has '
         + 'run out, so something lesser goes in.</div>';
    }

    if(r.unknown.length){
      h += '<div class="rollsub">Week' + (r.unknown.length === 1 ? ' ' : 's ')
         + r.unknown.join(", ") + ' can’t be checked — the schedule bake does not '
         + 'reach that far. Not a clean bill of health for those weeks.</div>';
    }

    h += '</div>';
    h += '<div class="rollfoot">Availability only — no projection is used or implied. '
       + 'Assumes today’s roster at full health: an injury designation is a fact about '
       + 'this week, not about November.</div>';
  }

  return h + '</div>';
}

function toggleRollup(){ ROLL_OPEN = !ROLL_OPEN; render(); }

function render(){
  var app = el("app");

  if(!ROSTER && STATUS.state === "stale" && /not drafted/.test(STATUS.msg)){
    app.innerHTML = '<div class="msg"><b>' + esc(LG.name) + ' has not drafted yet.</b><br><br>'
      + 'This page comes alive the moment the draft finishes — it reads your roster '
      + 'straight from Sleeper, so there is nothing to set up. Until then the draft '
      + 'tools are the ones you want.</div>' + footHTML();
    return;
  }

  if(!ROSTER){
    app.innerHTML = '<div class="msg bad"><b>No roster loaded.</b><br><br>'
      + esc(STATUS.msg) + '<br><br>'
      + 'Tap <b>Refresh</b> to try again. If this page was opened from a saved file '
      + 'rather than the published hub, the browser may be blocking the call to Sleeper '
      + '— open it from the hub link instead.</div>' + footHTML();
    return;
  }

  var h = "";

  /* Viewing a week that is not the current one. Without this the page shows
     week-3 opponents next to THIS week's injury pills and an alerts panel
     announcing byes that have not happened, distinguished only by "WK 3" in
     the corner. Two taps of the arrow is all it takes to get there. */
  if(NOW_WEEK && WEEK !== NOW_WEEK){
    h += '<div class="msg"><b>You are looking at week ' + WEEK + '.</b> '
       + 'The NFL is on week ' + NOW_WEEK + ', and the injury designations below are '
       + 'today’s — not week ' + WEEK + '’s. '
       + '<button class="chip" onclick="setWeek(' + NOW_WEEK + ')">Back to week '
       + NOW_WEEK + '</button></div>';
  }

  /* A schedule that has quietly aged. Flex scheduling moves Sunday 1:00pm games
     to 8:20pm all through weeks 5–17; a stale bake would show "Sun 1p" and a
     LOCKED pill for a game that has not kicked off. */
  var age = scheduleAgeDays();
  if(age !== null && age > 7){
    h += '<div class="msg bad"><b>This schedule is ' + age + ' days old.</b> '
       + 'Kickoff times move when the NFL flexes a game, so the times and LOCKED '
       + 'marks below may be wrong. Ask Claude to re-run the weekly refresh.</div>';
  }

  /* THE BAND IS COMPUTED AND RENDERED IN THE SAME BREATH. Both Session A audit
     cycles caught a version of "computed and never rendered" — a stale flag
     and a stale team, each worked out correctly and then dropped on the floor,
     which is indistinguishable from never having checked. */
  BAND = computeBand();
  h += bandHTML();

  /* The roll-up is computed and rendered in the same breath, for the same
     reason the band is. It anchors on NOW_WEEK rather than the week being
     viewed, so paging back to week 1 does not quietly re-scope "the rest of
     the season" — the answer is the same wherever Chris is standing. */
  ROLL = computeRollup();
  h += rollupHTML();

  /* On the live week the band has already said everything the Session-A
     alerts panel would say, with the arithmetic attached. Off the live week
     the band is gated, so the panel is the only thing watching and stays. */
  if(!BAND || BAND.gated){
    var al = alertList();
    if(al.length){
      var crit = al.some(function(a){ return a.crit; });
      h += '<div class="alerts' + (crit ? " crit" : "") + '"><h3>Needs you · ' + al.length + '</h3><ul>'
         + al.map(function(a){ return '<li><span>' + a.icon + '</span><span>' + a.txt + '</span></li>'; }).join("")
         + '</ul></div>';
    }
  }

  var st = ROSTER.starters || [];
  h += '<div class="sec">Starters <i>as set in Sleeper</i></div>';
  LG.lineup.forEach(function(slot, i){
    var flex = (slot === "FLEX" || slot === "SUPER_FLEX");
    h += rowHTML(slot === "SUPER_FLEX" ? "SFLX" : slot, st[i], {starter:true, flex:flex});
  });

  /* ONLY the starters this lineup actually RENDERS count as in the lineup.
     starters[] is positional and its length is Sleeper's business, not ours:
     if it ever comes back longer than roster_positions — a league reshaped
     mid-season, a stale array, the wrong league's roster — the extra ids were
     silently dropped from BOTH halves of the page. They are past the end of
     LG.lineup so no slot renders them, and they were counted as "in the
     lineup" so the bench filtered them out too. A rostered player must never
     be invisible; when in doubt he goes on the bench, where he can be seen. */
  var inLineup = {};
  st.slice(0, LG.lineup.length).forEach(function(s){
    if(s && s !== "0") inLineup[String(s)] = 1;
  });
  var res = {}; (ROSTER.reserve || []).forEach(function(s){ res[String(s)] = 1; });
  var bench = ROSTER.players.filter(function(p){ return !inLineup[p] && !res[p]; });
  var ir = ROSTER.players.filter(function(p){ return res[p]; });

  h += '<div class="sec">Bench <i>' + bench.length + " of " + LG.bench + '</i></div>';
  bench.forEach(function(p){ h += rowHTML("BN", p, {}); });
  if(!bench.length) h += '<div class="row empty"><div class="slot">BN</div><div class="body">'
    + '<div class="nm dim">nobody on the bench</div></div></div>';

  if(LG.ir){
    h += '<div class="sec">IR <i>' + ir.length + " of " + LG.ir + '</i></div>';
    if(ir.length) ir.forEach(function(p){ h += rowHTML("IR", p, {}); });
    else h += '<div class="row empty"><div class="slot">IR</div><div class="body">'
      + '<div class="nm dim">empty</div></div></div>';
  }

  h += footHTML();
  app.innerHTML = h;
}

function scheduleAgeDays(){
  var p = (S.schedule._meta || {}).pulled;
  if(!p) return null;
  var t = Date.parse(p + "T12:00:00Z");
  if(isNaN(t)) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

function footHTML(){
  var sch = S.schedule._meta || {};
  var age = scheduleAgeDays();
  return '<div class="foot">'
    + '<b>Where these numbers come from.</b><br>'
    + 'Roster, starters, FAAB and every player’s team and injury designation are pulled '
    + 'live from Sleeper each time this page loads — nothing about them is baked in. '
    + 'Opponents, kickoff times and byes come from the ' + esc(sch.season || "2026")
    + ' schedule (' + esc(sch.source_url || "nflverse") + ', pulled ' + esc(sch.pulled || "?")
    + (age === null ? '' : ', ' + age + ' day' + (age === 1 ? '' : 's') + ' ago') + ').<br><br>'
    + 'Projected points are <b>re-scored at your league&rsquo;s own rules</b> from '
    + 'Rotowire&rsquo;s component projections — they are not the vendor&rsquo;s PPR '
    + 'number, which pays six points for a passing touchdown where this league pays four. '
    + (PROJ_STATE === "live" ? 'Pulled live this session.'
      : PROJ_STATE === "partial" ? 'Mostly live; some players fell back to the snapshot baked into this page.'
      : PROJ_STATE === "fallback" ? '<b>Live projections could not be reached — these came from the snapshot baked into this page.</b>'
      : 'Loading&hellip;')
    + '<br>Only the imminent week is genuinely refreshed by the vendor; weeks after it '
    + 'are a season-per-game average, which is why the look-ahead talks about '
    + 'availability rather than points.<br><br>'
    + 'All kickoff times are Eastern. Page built ' + esc(S.built) + '.'
    + (STATUS.at ? '<br>Last successful sync ' + esc(ago(STATUS.at)) + '.' : '')
    + (UNRESOLVED.length ? '<br><b>' + UNRESOLVED.length + ' player(s) could not be '
        + 'confirmed with Sleeper on the last sync</b> — those rows are marked “?”.' : '')
    + (PROJ_MISSING.length ? '<br><b>' + PROJ_MISSING.length + ' player(s) had no '
        + 'projection this sync</b> — they are excluded from ranking, and any slot '
        + 'they could actually have changed is named in the band above.' : '')
    + '</div>';
}

/* =====================================================================
   WEEK NAV + BOOT
   ===================================================================== */
function paintWeek(){
  el("wkNum").textContent = "WK " + WEEK;
  el("wkPrev").disabled = (WEEK <= 1);
  el("wkNext").disabled = (WEEK >= 18);
}
function setWeek(w){
  w = Math.max(1, Math.min(18, w));
  if(w === WEEK) return;
  WEEK = w; paintWeek(); render();
}

/* TWO-STAGE PAINT. The facts view goes up the moment the roster and the
   per-player facts land; the band follows when the projections do. On a phone
   ninety minutes before kickoff, eighteen more round-trips of blank screen is
   worse than a band that arrives a beat late — and the facts half is what
   Session A built to be useful on its own. */
function sync(force){
  setStatus("boot", "syncing…");
  /* Reset BOTH unconfirmed counts at the top. A sync that dies early confirmed
     nothing, and a previous run's count reported as this run's is the exact
     shape of the bug Session A's second cycle caught on UNRESOLVED. */
  PROJ_STATE = "pending";
  PROJ_MISSING = [];
  return loadLeagueStatus().then(loadRoster).then(function(r){
    ROSTER = r;
    return loadPlayers(r.players, force);
  }).then(function(){
    STATUS.at = Date.now();
    setStatus(UNRESOLVED.length ? "stale" : "ok", "loading projections…");
    render();                                  // facts now, band pending
    return loadProjections(ROSTER.players, force).catch(function(){
      /* A total projections failure is NOT a page failure. The facts view
         is already on screen and correct; the band degrades to the baked
         snapshot, or says plainly that it has nothing. */
      PROJ = {}; PROJ_MISSING = (ROSTER.players || []).map(String);
      PROJ_STATE = "fallback";
    });
  }).then(function(){
    // A sync that could not confirm every player is NOT a clean sync, and must
    // not present itself as one.
    if(UNRESOLVED.length){
      setStatus("stale", UNRESOLVED.length + " player(s) unconfirmed · $" + ROSTER.faab + " FAAB");
    } else {
      setStatus("ok", "$" + ROSTER.faab + " FAAB · synced " + ago(STATUS.at));
    }
    render();
  }).catch(function(e){
    // A sync that died before reaching loadPlayers confirmed nothing, so a
    // previous run's count must not keep being reported as this run's.
    UNRESOLVED = [];
    PROJ_MISSING = [];
    /* And the band must not keep showing last sync's ranking under a red
       status dot. "pending" makes it say it is still working rather than
       present a stale answer as a current one. */
    PROJ_STATE = "pending";
    // A ghost payload must not clobber a roster we already have on screen.
    if(e && e.ghost && ROSTER){
      setStatus("stale", "Sleeper returned an empty roster — keeping the last good one");
    } else if(e && e.predraft){
      setStatus("stale", "not drafted yet");
      if(!ROSTER) render();
    } else {
      setStatus("bad", e && e.message ? e.message : "sync failed");
      if(!ROSTER) render();
    }
  });
}

(function boot(){
  el("lname").textContent = LG.name;
  el("wkPrev").onclick = function(){ setWeek(WEEK - 1); };
  el("wkNext").onclick = function(){ setWeek(WEEK + 1); };
  // Refresh FORCES a re-fetch past the cache — BOTH caches, facts and
  // projections. See loadPlayers() for why: a Refresh that re-uses a 10:00
  // cache at 11:30 on a Sunday and then reports "synced just now" is lying at
  // precisely the moment inactives drop.
  el("syncBtn").onclick = function(){ sync(true); };

  loadState().then(function(w){
    NOW_WEEK = w; WEEK = w; paintWeek();
    return sync();
  });
})();
</script>
</body>
</html>
