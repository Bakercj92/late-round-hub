<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Team — Ball Knowers United</title>
<style>
/* Navy & Gold, matching hub.py SKINS['navy']. Phone-first: the base rules ARE
   the phone rules; the only desktop concession is a max-width so the column
   does not stretch to 1500px on a laptop. Decided 2026-09-03 — Sunday lineup
   calls and Tuesday waiver bids both happen on a phone. */
:root{
  --surface:#0A0F1A; --raised:#131B2E; --line-soft:#22304A;
  --text:#EDF1F7; --text-mute:#93A0B8; --brand:#F5C451; --brand-fill:#43370F;
  --positive:#5CE39B; --urgent:#FF6B6B; --warn:#F5A551;
  --fs-body:13px; --fs-support:15px; --fs-head:17px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--text);
  font:var(--fs-support)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line-soft);
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
}
.hrow{display:flex;align-items:baseline;gap:8px;max-width:560px;margin:0 auto}
.lname{font-size:var(--fs-head);font-weight:700;letter-spacing:-.2px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px}
.wk button{
  background:var(--raised);color:var(--text);border:1px solid var(--line-soft);
  border-radius:7px;font:600 var(--fs-body)/1 inherit;padding:7px 9px;cursor:pointer;
  min-width:32px;min-height:32px;
}
.wk button:disabled{opacity:.35;cursor:default}
.wk b{font-size:var(--fs-body);color:var(--brand);min-width:52px;text-align:center;
  font-variant-numeric:tabular-nums}
.sub{max-width:560px;margin:3px auto 0;font-size:var(--fs-body);color:var(--text-mute);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-mute);flex:none}
.dot.ok{background:var(--positive)} .dot.bad{background:var(--urgent)}
.dot.stale{background:var(--warn)}
.sync{margin-left:auto;background:none;border:1px solid var(--line-soft);color:var(--text-mute);
  border-radius:6px;font:600 11px/1 inherit;padding:6px 8px;cursor:pointer}

/* ---------- alerts ---------- */
.alerts{margin:12px 0 0;border:1px solid var(--line-soft);border-left:3px solid var(--warn);
  border-radius:9px;background:var(--raised);padding:10px 12px}
.alerts.crit{border-left-color:var(--urgent)}
.alerts h3{margin:0 0 6px;font-size:var(--fs-body);letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-mute);font-weight:700}
.alerts ul{margin:0;padding:0;list-style:none}
.alerts li{padding:4px 0;font-size:var(--fs-body);display:flex;gap:7px;align-items:flex-start}
.alerts li span:first-child{flex:none}

/* ---------- section heads ---------- */
.sec{margin:20px 0 7px;font-size:var(--fs-body);letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-mute);font-weight:700;display:flex;align-items:baseline;gap:8px}
.sec i{font-style:normal;font-weight:500;color:var(--line-soft);margin-left:auto;
  text-transform:none;letter-spacing:0}

/* ---------- player rows ---------- */
.row{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;
  background:var(--raised);border:1px solid transparent;margin-bottom:5px;min-height:52px}
.row.empty{background:none;border:1px dashed var(--line-soft)}
.row.alert{border-color:var(--urgent)}
.row.soft{border-color:var(--warn)}
.slot{flex:none;width:38px;font-size:10px;font-weight:800;letter-spacing:.04em;
  color:var(--brand);text-align:center;line-height:1.15}
.slot.flex{color:var(--text-mute)}
.body{min-width:0;flex:1}
.nm{font-size:var(--fs-support);font-weight:650;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.dim{color:var(--text-mute);font-weight:500}
.meta{font-size:var(--fs-body);color:var(--text-mute);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{flex:none;text-align:right;font-size:11px;line-height:1.3;color:var(--text-mute);
  font-variant-numeric:tabular-nums}
.right b{display:block;font-size:var(--fs-body);color:var(--text);font-weight:600}
.pill{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:800;
  letter-spacing:.04em;vertical-align:1px;margin-left:5px}
.pill.out{background:#4A1416;color:#FFAFAF}
.pill.doub{background:#4A2E14;color:#FFCB8F}
.pill.q{background:#3A3416;color:#F0E08F}
.pill.ir{background:#3A1440;color:#E0AFFF}
.pill.bye{background:var(--brand-fill);color:var(--brand)}
.pill.locked{background:#1B2436;color:var(--text-mute)}
.pill.unconf{background:#3A2A16;color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-fill);
  color:var(--brand);border:none;border-radius:6px;font:700 11px/1 inherit;
  padding:6px 8px;cursor:pointer;margin-left:auto}

/* ---------- decision band ----------
   Sits ABOVE the facts table and owns the top of the screen. The facts view
   underneath is unchanged: this adds a layer, it does not replace one. */
.band{margin:12px 0 0;border:1px solid var(--line-soft);border-radius:10px;
  background:var(--raised);overflow:hidden}
.band.act{border-left:3px solid var(--brand)}
.band.crit{border-left:3px solid var(--urgent)}
.band.quiet{border-left:3px solid var(--positive)}
.bhead{display:flex;align-items:baseline;gap:8px;padding:11px 12px 0}
.bhead h3{margin:0;font-size:var(--fs-body);letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-mute);font-weight:700}
.bdelta{margin-left:auto;font-size:var(--fs-support);font-weight:800;color:var(--brand);
  font-variant-numeric:tabular-nums;flex:none}
.bquiet{padding:11px 12px 12px;font-size:var(--fs-support);line-height:1.5}
.bquiet b{color:var(--positive)}
.bitems{margin:0;padding:8px 12px 4px;list-style:none}
.bitem{padding:8px 0;border-top:1px solid var(--line-soft)}
.bitems .bitem:first-child{border-top:none}
.bitem .bl{font-size:var(--fs-support);line-height:1.35}
.bitem .bl b{font-weight:700}
.bitem.hard .bl b{color:var(--urgent)}
/* THE RULE IS PRINTED, always, on every item that fired. A flag whose reason
   is invisible is a flag Chris has to take on faith, and the one thing this
   band cannot afford is to be taken on faith. */
.brule{margin-top:3px;font-size:11px;color:var(--text-mute);line-height:1.45;
  font-variant-numeric:tabular-nums}
.bfoot{padding:8px 12px 11px;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--text-mute);line-height:1.5}
.bmore{background:none;border:none;color:var(--brand);font:700 11px/1 inherit;
  padding:8px 0 2px;cursor:pointer;text-align:left}
.bpend{padding:11px 12px 12px;font-size:var(--fs-body);color:var(--text-mute)}

/* ---------- later-this-season roll-up ----------
   Same shell as the band, one step quieter. The band is this Sunday; this is
   every Sunday left, and it must never out-shout the thing Chris can act on
   today. Collapsed to a single line by default: the expansion is a waiver
   to-do list and it keeps until he asks for it. */
.roll{margin:10px 0 0;border:1px solid var(--line-soft);border-radius:10px;
  background:var(--raised);overflow:hidden}
.roll.has{border-left:3px solid var(--warn)}
.roll.clean{border-left:3px solid var(--positive)}
.rollline{display:flex;align-items:baseline;gap:8px;width:100%;background:none;
  border:none;padding:11px 12px;text-align:left;cursor:pointer;color:var(--text);
  font:inherit;font-size:var(--fs-support);line-height:1.4}
.roll.clean .rollline{cursor:default}
.rollline b{font-weight:700}
.roll.has .rollline b{color:var(--warn)}
.roll.clean .rollline b{color:var(--positive)}
.rollcar{margin-left:auto;color:var(--brand);font-size:11px;font-weight:700;flex:none}
.rollbody{border-top:1px solid var(--line-soft);padding:4px 12px 10px}
.rollrow{padding:9px 0;border-top:1px solid var(--line-soft)}
.rollbody .rollrow:first-child{border-top:none}
.rollwk{font-size:var(--fs-support);font-weight:700}
.rollwk .slot{color:var(--urgent)}
.rollwhy{margin-top:3px;font-size:11px;color:var(--text-mute);line-height:1.45}
.rollwhy .cut{color:var(--warn)}
.rolltag{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:4px;
  background:var(--surface);color:var(--text-mute);font-size:10px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.rolltag.pre{background:var(--urgent);color:#fff}
.rollsub{margin:2px 0 0;padding:9px 0 0;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--text-mute);line-height:1.5}
.rollsub b{color:var(--warn);font-weight:700}
.rollfoot{padding:8px 12px 11px;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--text-mute);line-height:1.5}

/* projection number on a facts row — secondary to the kickoff by design
   (Session A: "tier first, number secondary and de-emphasised") */
.pts{display:block;font-size:11px;color:var(--text-mute);margin-top:1px;
  font-variant-numeric:tabular-nums}
.pts.floor{color:var(--warn)}
.pts.none{color:var(--line-soft)}
.norank{font-size:11px;color:var(--warn);margin-top:2px}

/* ---------- states ---------- */
.msg{margin:16px 0;padding:14px;border:1px solid var(--line-soft);border-radius:9px;
  background:var(--raised);font-size:var(--fs-body);line-height:1.55}
.msg b{color:var(--text)}
.msg.bad{border-left:3px solid var(--urgent)}
.foot{margin:26px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--text-mute);line-height:1.6}
.foot a{color:var(--text-mute)}
.spin{padding:40px 12px;text-align:center;color:var(--text-mute);font-size:var(--fs-body)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="lname" id="lname">&nbsp;</div>
    <div class="wk">
      <button id="wkPrev" aria-label="Previous week">&#8249;</button>
      <b id="wkNum">WK &ndash;</b>
      <button id="wkNext" aria-label="Next week">&#8250;</button>
    </div>
  </div>
  <div class="sub">
    <span class="dot" id="statusDot"></span><span id="statusTxt">starting&hellip;</span>
    <button class="sync" id="syncBtn">Refresh</button>
  </div>
</header>
<div class="wrap"><div id="app"><div class="spin">Loading your roster&hellip;</div></div></div>

<script>
/* =====================================================================
   rank_engine.js — the decision layer's arithmetic.

   NO DOM. NO fetch. NO globals but the single RankEngine export. Every
   function here is pure: same inputs, same answer, no clock, no timezone,
   no network. That is not stylistic — it is what lets the smoke harness
   run this under node:vm with no browser, and what lets the Phase 4
   waiver pages import the SAME BYTES rather than a second implementation
   that drifts.

   Built 2026-09-07 (Phase 3a of the in-season conversion).

   ---------------------------------------------------------------------
   WHAT THIS FILE KNOWS THAT THE BRIEF DID NOT
   ---------------------------------------------------------------------

   1. Rotowire's `pts_ppr` is SIX-point-passing-TD scoring. Both leagues
      pay FOUR. Solved live 2026-09-07 against Kyler Murray (5849) week 1:
      1.36 pass TD and 0.69 INT reconcile the feed's 19.42 only at
      ~6.03/TD and -2/INT. Re-scored to league rules he is 16.67, not
      19.42. Never display the vendor number as "your points".

   2. A bye week is JSON `null`. So is a player the feed simply has no
      row for. Spencer Shrader (12185) — Joop's ONLY kicker — returns
      null for weeks 2 THROUGH 18 while IND plays in every one of them.
      Measured 2026-09-07 across all 29 rostered players; he is the only
      one. Treating null as "bye" would silently bench Joop's only kicker
      from week 2 and report a phantom K hole for the rest of the season.
      weekState() exists solely to keep those two apart, and it needs the
      schedule to do it. A null is only a bye if the team is actually on
      one.

   3. Weeks 2-18 are a season-per-game average, not a forecast. Every
      player's weeks 2-18 carry `last_modified` inside one four-second
      batch (2026-08-29 07:45:5x UTC); only the imminent week is
      genuinely refreshed, and even that is staggered per player across
      about nine days. Callers get this via freshness() and are expected
      to SAY SO rather than imply a weekly projection exists.

   4. Kicker scoring is only half-computable, and which half depends on
      the league. The projection feed carries exactly eleven kicker keys:
      fga, fgm, fgm_20_29, fgm_30_39, fgm_40_49, fgm_yds, fgmiss_30_39,
      fgmiss_40_49, xpa, xpm, xpmiss. There is NO `fgm_yds_over_30` and
      no bare `fgmiss`. So Ball Knowers (pure distance, `fgm_yds` * 0.1)
      computes exactly; Joop (3.0/FG plus 0.1/yd over 30) cannot — its
      distance bonus has no source. rescore() returns that as an unmatched
      key so the row can be labelled a FLOOR. A missing number beats a
      fabricated one.

   5. Defense bucket keys are sparse ON PURPOSE. Only the pts_allow_* /
      yds_allow_* bucket a projection lands in appears in that week. So
      "scoring key with no matching stat" means two completely different
      things — a real hole (the kicker case) and a bucket that simply did
      not fire (the defense case, benign). rescore() separates them.
   ===================================================================== */

var RankEngine = (function () {
  "use strict";

  /* -------------------------------------------------------------------
     SCORING
     ------------------------------------------------------------------- */

  /* Scoring keys whose absence from a projection week is EXPECTED, because
     the feed emits only the bucket that fired. Absence here is not a defect
     and must never surface as a caveat on a row — if it did, every defense
     would carry a permanent warning about the eleven tiers it did not land
     in, and the caveat would stop meaning anything. */
  var BENIGN_ABSENT = [
    /^pts_allow_/,
    /^yds_allow_/,
    /^fgm_\d/,        // fgm_0_19, fgm_20_29, fgm_30_39, fgm_40_49, fgm_50p, fgm_60p
    /^fgmiss_\d/
  ];

  function isBenignAbsent(key) {
    for (var i = 0; i < BENIGN_ABSENT.length; i++) {
      if (BENIGN_ABSENT[i].test(key)) return true;
    }
    return false;
  }

  /* Which kind of football thing a scoring key is about.

     Without this, "the league pays for a stat the feed cannot give us" and
     "this player does not throw passes" come out as the same answer, and the
     caveat drowns. The first pass of rescore() reported TWENTY-SEVEN unmatched
     keys on Cameron Dicker — pass_td, rec_yd, sack, the lot — when the only
     real one was Joop's fgm_yds_over_30. A caveat that fires on every row is
     not a caveat, it is wallpaper.

     So a scoring key only counts as unmatched when the player has AT LEAST ONE
     stat from the same family. A kicker has kicking stats, so a missing
     kicking rule is a real hole; he has no passing stats at all, so a passing
     rule is simply not about him. */
  var FAMILY = [
    [/^pass_/, "pass"], [/^cmp_pct$/, "pass"],
    [/^rush_/, "rush"],
    [/^rec$|^rec_/, "rec"],
    [/^fg|^xp/, "kick"],
    [/^pts_allow|^yds_allow|^def_|^st_|^fum_rec/, "def"],
    [/^sack$|^int$|^safe$|^blk_kick$|^ff$/, "def"],
    [/^fum$|^fum_lost$/, "fum"],
    [/^bonus_/, "bonus"]
  ];

  function familyOf(key) {
    for (var i = 0; i < FAMILY.length; i++) {
      if (FAMILY[i][0].test(key)) return FAMILY[i][1];
    }
    return null;
  }

  /* What a position's points are actually made of. Given a position, this is
     exact and needs no guessing from the stat line — which is the point,
     because guessing failed twice. First by key name (a zero `def_fum_td` on
     every skill player switched the whole defensive family on); then by
     non-zero value, which still caught the return men — Parker Washington,
     Malik Washington and Jonah Coleman all carry real special-teams
     projections, so they "had" defensive stats and started reporting floor
     caveats for sacks and safeties. */
  var POS_FAMILIES = {
    QB:  { pass: 1, rush: 1, fum: 1, bonus: 1 },
    RB:  { rush: 1, rec: 1, fum: 1, bonus: 1 },
    WR:  { rush: 1, rec: 1, fum: 1, bonus: 1 },
    TE:  { rush: 1, rec: 1, fum: 1, bonus: 1 },
    K:   { kick: 1 },
    PK:  { kick: 1 },
    // No "st" key: familyOf() folds /^st_/ into "def", so an "st"
    // entry here could never match anything. Special teams IS "def".
    DEF: { def: 1 },
    DST: { def: 1 }
  };

  /* Scoring rules that are real but NOT WORTH A CAVEAT: nobody projects them,
     and their expected value is a rounding error. A kick-return touchdown is
     worth six points about once a season; a blocked kick less than that.
     Every number this engine produces is, strictly, a floor because of them.
     Saying so on every row would make the caveat wallpaper — and the caveat
     has exactly one job, which is to mark Joop's kicker, where the missing
     rule is worth about a point EVERY WEEK.

     This is a judgment call about materiality, not a fact, which is why it is
     an explicit list rather than a silent omission. Add to it deliberately. */
  var IMMATERIAL = {
    st_td: 1, st_ff: 1, st_fum_rec: 1,
    def_st_td: 1, def_st_ff: 1, def_st_fum_rec: 1,
    blk_kick: 1, safe: 1, fum_rec_td: 1,
    pass_2pt: 1, rush_2pt: 1, rec_2pt: 1
  };

  /* Which families the FEED models for this player, by key presence — value
     irrelevant. A key that exists and reads 0.0 still means Rotowire thought
     about it; a key that is absent entirely means it did not.

     This is the second half of the relevance test, and both halves are
     needed. Position alone says a wide receiver could rush, so Mike Evans
     reported a floor caveat for rush_yd and rush_td — but his projection
     carries no rushing key at all, because Rotowire has decided he does not
     rush. Nothing is missing there. Stat line alone was tried first and
     failed on kick returners. Position says what could matter; the stat line
     says whether the feed models it; a rule is only a real hole when both
     agree that it should be there and it is not. */
  function familiesInFeed(stats) {
    var seen = {};
    for (var k in stats) {
      if (!Object.prototype.hasOwnProperty.call(stats, k)) continue;
      var f = familyOf(k);
      if (f) seen[f] = 1;
    }
    return seen;
  }

  /* Sleeper's bare `fgmiss` is the general per-miss value; a `fgmiss_<range>`
     key OVERRIDES it for that range. The projection feed only ever reports
     misses bucketed (fgmiss_30_39, fgmiss_40_49), so a strict dot-product
     scores a bare `fgmiss` at zero and quietly drops a real penalty.

     This derivation applies the bare weight to every miss bucket the league
     has NOT explicitly priced itself. Joop prices fgmiss_0_19 and
     fgmiss_20_29 at 0.0 and says nothing about 30+ — so 30+ misses take the
     bare -1 and short ones take 0. Ball Knowers prices no buckets at all, so
     every miss takes -1.

     THIS IS AN INTERPRETATION OF SLEEPER'S SEMANTICS, NOT A MEASURED FACT.
     It is documented here rather than buried because it moves a real number,
     and if it is ever shown to be wrong this is the one place to change. */
  var DERIVED = {
    fgmiss: function (stats, scoring) {
      var total = 0, used = [];
      for (var k in stats) {
        if (!Object.prototype.hasOwnProperty.call(stats, k)) continue;
        if (!/^fgmiss_/.test(k)) continue;
        // An explicit bucket price in THIS league's scoring wins outright.
        if (Object.prototype.hasOwnProperty.call(scoring, k)) continue;
        total += num(stats[k]);
        used.push(k);
      }
      return used.length ? { value: total, from: used } : null;
    }
  };

  function num(v) {
    var n = typeof v === "number" ? v : parseFloat(v);
    return isFinite(n) ? n : 0;
  }

  /* rescore(stats, scoring) -> { pts, unmatched, benign, derived }

     pts        the league-rule total, rounded to 2dp
     unmatched  scoring keys with a NON-ZERO weight, IN A FAMILY THIS PLAYER
                HAS STATS FOR, and no way to source them. Non-empty means the
                number is a FLOOR and the caller must say so. This is the whole
                reason the function returns an object instead of a number.
     benign     keys absent because their bucket did not fire this week, or
                because they are about something this player does not do
     derived    keys satisfied by a DERIVED rule rather than a direct hit,
                so a reader can see the interpretation was applied

     A zero-weight scoring key is skipped entirely: it cannot change the
     total, so its absence is not worth reporting. */
  function rescore(stats, scoring, opts) {
    if (!stats || !scoring) {
      return { pts: null, unmatched: [], benign: [], derived: [] };
    }
    opts = opts || {};
    var pts = 0, unmatched = [], benign = [], derived = [];
    /* A family is relevant only where BOTH agree: this position scores from
       it, AND the feed models it for this player. Position comes from Sleeper
       live on the page and from the snapshot at build time; where it is
       missing entirely, fall back to the feed alone rather than guessing. */
    var inFeed = familiesInFeed(stats);
    var posFams = POS_FAMILIES[opts.pos];
    var fams = {};
    for (var f in inFeed) {
      if (!posFams || posFams[f]) fams[f] = 1;
    }

    for (var key in scoring) {
      if (!Object.prototype.hasOwnProperty.call(scoring, key)) continue;
      var w = num(scoring[key]);
      if (w === 0) continue;

      if (Object.prototype.hasOwnProperty.call(stats, key)) {
        pts += num(stats[key]) * w;
        continue;
      }
      if (DERIVED[key]) {
        var d = DERIVED[key](stats, scoring);
        if (d) {
          pts += d.value * w;
          derived.push({ key: key, from: d.from, units: d.value });
          continue;
        }
      }
      var fam = familyOf(key);
      var relevant = fam ? !!fams[fam] : true;
      var benignHere = isBenignAbsent(key) || !relevant || !!IMMATERIAL[key];
      (benignHere ? benign : unmatched).push(key);
    }

    return {
      pts: Math.round(pts * 100) / 100,
      unmatched: unmatched.sort(),
      benign: benign.sort(),
      derived: derived
    };
  }

  /* The vendor's own number, reproduced from components. Exists ONLY as a
     test control: if this lands within a whisker of the feed's reported
     pts_ppr, the component parsing is sound, which is what makes the
     league-rules assertion above it meaningful rather than circular. */
  var VENDOR_PPR = {
    pass_yd: 0.04, pass_td: 6, pass_int: -2, pass_2pt: 2,
    rush_yd: 0.1, rush_td: 6, rush_2pt: 2,
    rec: 1, rec_yd: 0.1, rec_td: 6, rec_2pt: 2,
    fum_lost: -2
  };
  function vendorPPR(stats) { return rescore(stats, VENDOR_PPR).pts; }

  /* -------------------------------------------------------------------
     WEEK STATE — the null that means two things
     ------------------------------------------------------------------- */

  /* weekState(weekRow, teamOnBye) -> "ok" | "bye" | "missing"

     weekRow    the projection row for this week, or null
     teamOnBye  true when the SCHEDULE says this player's live team has no
                game this week

     The schedule is the arbiter, not the projection. A null row on a bye
     week is a bye; a null row on a week the team plays is missing data and
     must be surfaced as such, never as a bye. Shrader is the live case. */
  function weekState(weekRow, teamOnBye) {
    if (teamOnBye) return "bye";
    if (weekRow == null) return "missing";
    if (!weekRow.stats) return "missing";
    return "ok";
  }

  /* freshness(weekRow, week, currentWeek) -> "current" | "season-average" | null

     Weeks other than the one being played were written in a single batch and
     are a per-game average. Callers label; they do not silently rank on it.

     THREE arguments, not two. The comment here previously said two, and a
     caller who believed it would have passed currentWeek as `week`, leaving
     currentWeek undefined — so `week === currentWeek` was never true and
     EVERY week came back "season-average", including the one being played.
     No throw, no null, just a plausible wrong answer on the function whose
     entire job is to stop you ranking on a season average. */
  function freshness(weekRow, week, currentWeek) {
    if (!weekRow) return null;
    if (week == null || currentWeek == null) return null;
    return week === currentWeek ? "current" : "season-average";
  }

  /* -------------------------------------------------------------------
     SLOT ELIGIBILITY
     ------------------------------------------------------------------- */

  /* Driven entirely by the league config's slot_eligible map, which is read
     from Sleeper's own roster_positions. SUPER_FLEX is NOT a second FLEX: it
     takes QB as well, and in Ball Knowers it is the ninth slot, not the
     seventh. Both league configs were checked against live roster_positions
     on 2026-09-07 and agree; the Quick-Reference does not, and is wrong. */
  function slotEligible(pos, slot, cfg) {
    if (!pos || !slot || !cfg || !cfg.slot_eligible) return false;
    var allowed = cfg.slot_eligible[slot];
    if (!allowed) return false;
    return allowed.indexOf(pos) >= 0;
  }

  /* How many slots a position could legally occupy in this lineup. Used to
     size the startable population for sigma: in a superflex league QB is
     startable in the QB slot AND the SUPER_FLEX slot, so a QB pool sized on
     the QB slot alone is roughly half the truth, sigma collapses, and every
     QB comparison reads "close" in the one league where QB actually
     decides games. */
  function slotsOpenTo(pos, cfg) {
    var n = 0;
    (cfg.lineup || []).forEach(function (slot) {
      if (slotEligible(pos, slot, cfg)) n++;
    });
    return n;
  }

  /* startablePool(pos, cfg) -> how many players at this position the league as
     a whole can start in a week. This sizes sigma, sigma sizes the close-call
     threshold, so an error here silently mis-calibrates every close call.

     Dedicated slots count whole. Shared slots (FLEX, SUPER_FLEX) use
     cfg.slot_fill when it exists — the MEASURED position mix of what the
     league's managers actually put there, counted from live starters[].

     An even split was the first version and it is badly wrong in the direction
     that matters most. Measured 2026-09-07 across all 8 Ball Knowers lineups:
     SEVEN of eight superflex slots hold a quarterback. An even split across
     {QB,RB,WR,TE} assigns QB a quarter of that slot; reality is 88%, so the
     QB pool came out about a third of its true size, sigma collapsed with it,
     and the threshold dropped — meaning FEWER quarterback decisions would have
     been flagged close, in the one league where quarterbacks decide games.
     Joop's FLEX measured 10 WR / 4 RB / 0 TE against an assumed third each.

     Falls back to the even split when slot_fill is absent, so a league nobody
     has measured still works. */
  function startablePool(pos, cfg) {
    var teams = cfg.teams || 0, per = 0;
    var fill = cfg.slot_fill || {};
    (cfg.lineup || []).forEach(function (slot) {
      if (!slotEligible(pos, slot, cfg)) return;
      var sharers = (cfg.slot_eligible[slot] || []).length || 1;
      if (sharers === 1) { per += 1; return; }
      var measured = fill[slot] && fill[slot][pos];
      per += (measured == null) ? (1 / sharers) : measured;
    });
    return Math.max(1, Math.round(teams * per));
  }

  /* -------------------------------------------------------------------
     LINEUP ASSIGNMENT
     ------------------------------------------------------------------- */

  /* assignLineup(cfg, players, opts) -> { assign, unfilled, total, benched }

     players  [{ sid, pos, pts, playable }]  pts may be null
     opts.pinned  { slotIndex: sid }  slots that cannot move (already locked)
     opts.exclude Set-ish of sids that may not be started at all

     Greedy, most-restrictive-slot first. That is OPTIMAL here and not a
     heuristic: the eligibility sets form a laminar family — QB and each of
     RB/WR/TE sit inside FLEX or SUPER_FLEX, FLEX sits inside SUPER_FLEX, and
     K and DEF are disjoint singletons. With nested sets, filling the
     tightest slot with its best available player never costs a wider slot
     anything it could not replace. If a league ever adds a slot that breaks
     the nesting (a WR/TE-only flex alongside an RB/WR flex, say), this stops
     being optimal and needs replacing with an assignment solve. */
  function assignLineup(cfg, players, opts) {
    opts = opts || {};
    var pinned = opts.pinned || {};
    var exclude = opts.exclude || {};
    var byId = {};
    players.forEach(function (p) { byId[String(p.sid)] = p; });

    var slots = (cfg.lineup || []).map(function (name, i) {
      return { i: i, name: name, width: (cfg.slot_eligible[name] || []).length };
    });

    var taken = {}, assign = {}, unfilled = [];

    // Pinned first — a locked slot is a fact, not a candidate.
    slots.forEach(function (s) {
      var sid = pinned[s.i];
      if (sid == null) return;
      assign[s.i] = String(sid);
      taken[String(sid)] = 1;
    });

    var open = slots.filter(function (s) { return assign[s.i] === undefined; })
                    .sort(function (a, b) { return a.width - b.width || a.i - b.i; });

    open.forEach(function (s) {
      var best = null;
      players.forEach(function (p) {
        var sid = String(p.sid);
        if (taken[sid] || exclude[sid]) return;
        if (p.playable === false) return;
        if (!slotEligible(p.pos, s.name, cfg)) return;
        if (p.pts == null) return;
        if (!best || p.pts > best.pts) best = p;
      });
      if (best) { assign[s.i] = String(best.sid); taken[String(best.sid)] = 1; }
      else { unfilled.push({ slot: s.name, i: s.i }); }
    });

    var total = 0;
    for (var i in assign) {
      var p = byId[assign[i]];
      if (p && p.pts != null) total += p.pts;
    }

    var benched = players.filter(function (p) { return !taken[String(p.sid)]; });

    return {
      assign: assign,
      unfilled: unfilled,
      total: Math.round(total * 100) / 100,
      benched: benched
    };
  }

  /* lineupDelta(cfg, players, actualStarters, optimal) -> { delta, swaps }

     The close-call test is a TOTAL-LINEUP delta, deliberately, not nine
     independent pairwise comparisons. A pairwise "your bench WR outscores
     your starting WR" can fire on a move worth exactly zero, because the
     bench WR was already going to be picked up by FLEX. Only a change in
     the lineup TOTAL is a real change. Each swap is then attributed back to
     the slot it came from, so the page can still speak in slots. */
  function lineupDelta(cfg, players, actualStarters, optimal) {
    var byId = {};
    players.forEach(function (p) { byId[String(p.sid)] = p; });

    var actualTotal = 0;
    (actualStarters || []).forEach(function (sid) {
      var p = byId[String(sid)];
      if (p && p.pts != null) actualTotal += p.pts;
    });
    actualTotal = Math.round(actualTotal * 100) / 100;

    var swaps = [];
    (cfg.lineup || []).forEach(function (slotName, i) {
      var was = actualStarters && actualStarters[i] != null ? String(actualStarters[i]) : null;
      var now = optimal.assign[i] != null ? String(optimal.assign[i]) : null;
      if (was === now) return;
      var a = was && was !== "0" ? byId[was] : null;
      var b = now ? byId[now] : null;
      swaps.push({
        slot: slotName,
        i: i,
        out: was,
        in: now,
        gain: Math.round((((b && b.pts) || 0) - ((a && a.pts) || 0)) * 100) / 100
      });
    });

    return {
      actualTotal: actualTotal,
      optimalTotal: optimal.total,
      delta: Math.round((optimal.total - actualTotal) * 100) / 100,
      swaps: swaps
    };
  }

  /* -------------------------------------------------------------------
     HOLES — the weeks no legal lineup exists
     ------------------------------------------------------------------- */

  /* holes(cfg, players) -> [{ slot, i, eligible, scoreable, reason }]

     A slot no legal lineup can fill. This is the highest-value
     thing the look-ahead can say, because unlike a close call it cannot be
     answered by moving anyone already on the roster — it needs an add, and
     it is knowable weeks early.

     Verified live 2026-09-07 against both rosters and the baked schedule:
       Ball Knowers wk7  — Herbert AND Dicker are both LAC, so the only
                           kicker is out in the same week as QB1
       Ball Knowers wk11 — SEA is the only DEF
       Joop wk10 — PHI is the only DEF
       Joop wk13 — Shrader is the only K
       Joop wk14 — McBride is the only TE, and week 14 is the last week
                   before playoffs start in week 15 (the brief said 13)

     K and DEF are included on purpose. They are the positions a
     skill-position-shaped design forgets, and four of those five holes are
     a kicker or a defense.

     TWO KINDS OF HOLE, and they need different actions.

       "no-body"       no eligible, available player exists. Only a waiver add
                       fixes it. All five real holes above are this kind.
       "no-projection" a body exists but nothing can be scored for him. Joop's
                       Spencer Shrader is exactly this in his 16 missing-data
                       weeks: IND plays, so he is not on a bye and not
                       unplayable, but the feed has no row for him.

     Collapsing those would be the Shrader bug wearing a different hat. Told
     "you have no kicker" Chris drops someone and spends FAAB; told "we cannot
     project your kicker" he starts him anyway, which is right.

     This also keeps holes() and assignLineup() in agreement. assignLineup
     refuses a player with a null projection, so before this fix it left the K
     slot unfilled and silently short while holes() reported nothing wrong. */
  function holes(cfg, players) {
    var out = [];
    (cfg.lineup || []).forEach(function (slotName, i) {
      var eligible = 0, scoreable = 0;
      players.forEach(function (p) {
        if (p.playable === false) return;
        if (!slotEligible(p.pos, slotName, cfg)) return;
        eligible++;
        if (p.pts != null) scoreable++;
      });
      if (eligible === 0) {
        out.push({ slot: slotName, i: i, eligible: 0, scoreable: 0, reason: "no-body" });
      } else if (scoreable === 0) {
        out.push({ slot: slotName, i: i, eligible: eligible, scoreable: 0, reason: "no-projection" });
      }
    });
    return out;
  }

  /* -------------------------------------------------------------------
     THIN WEEKS — a lineup that is legal but has run out of the position
     ------------------------------------------------------------------- */

  /* dominantPos(slot, cfg, minShare) -> the position this shared slot is a
     DEDICATED slot for in all but exceptional weeks, or null.

     Read from the MEASURED slot_fill, never assumed.

     THE BAR IS 0.80, NOT A MAJORITY, and the difference is not cosmetic. At a
     0.5 bar the three measured slots come out as:

       Ball Knowers SUPER_FLEX  QB 0.88   7 of 8 lineups
       Joop         FLEX        WR 0.71  10 of 14
       Ball Knowers FLEX        WR 0.56   a coin flip

     — and thinSlots() below then fired on Ball Knowers' TWO near-even FLEX
     slots, each counting the other as competition for a receiver corps that
     was never short. Measured, not reasoned: RB fills that slot 44% of the
     time. Calling it a WR slot is simply false.

     0.80 asks "does this position fill the slot in at least four lineups out
     of five" — i.e. is anything else genuinely the exception. QB in a
     superflex clears that; a FLEX, in either league, does not and should not.
     Joop's FLEX holding a running back is ordinary, and a warning that fires
     on the ordinary is a warning Chris learns to skip.

     A league with no slot_fill returns null and thinSlots() never fires for
     it — silence, not a guess, because the whole reason slot_fill exists is
     that the even-split assumption it replaced was wrong by a factor of
     three. An even 25% split must never produce a dominant position. */
  function dominantPos(slot, cfg, minShare) {
    var need = minShare == null ? 0.80 : minShare;
    var fill = (cfg && cfg.slot_fill) ? cfg.slot_fill[slot] : null;
    if (!fill) return null;
    var best = null, bestV = 0;
    for (var p in fill) {
      if (!Object.prototype.hasOwnProperty.call(fill, p)) continue;
      if (fill[p] > bestV) { bestV = fill[p]; best = p; }
    }
    return bestV >= need ? best : null;
  }

  /* thinSlots(cfg, players) -> [{ slot, i, pos, supply, demand }]

     A slot that is still LEGAL but whose natural occupant has run out, so a
     lesser position is about to be forced into it. Distinct from holes(),
     which is the slot no legal lineup can fill at all.

     Ball Knowers weeks 6 and 7 are the live case and the reason this exists.
     Week 6 loses Kyler Murray to a bye, week 7 loses Justin Herbert — either
     way exactly one quarterback remains, the dedicated QB slot eats him, and
     SUPER_FLEX takes a wide receiver. holes() is silent, correctly: a legal
     lineup exists. But it is the single most predictable points loss on the
     schedule and it is knowable in September, which is the whole argument for
     seeing it coming rather than discovering it on a Sunday morning.

     THE TEST IS SUPPLY, NOT OCCUPANCY. "What position is sitting in the slot"
     was the first shape and it is wrong in the direction that produces noise:
     Joop's FLEX holds a running back in 4 of 14 live lineups, which is
     ordinary and would have fired an amber warning on a third of the league
     every week. What is not ordinary is having no spare body of the dominant
     position left at all — which is exactly, and only, the Ball Knowers case.

     A player with no projection still counts toward supply. This is an
     AVAILABILITY test, not a ranking one: Spencer Shrader with sixteen weeks
     of missing data is still a kicker who can be started. */
  function thinSlots(cfg, players) {
    var out = [];
    var elig = (cfg && cfg.slot_eligible) || {};
    var lineup = (cfg && cfg.lineup) || [];

    lineup.forEach(function (slotName, i) {
      if (((elig[slotName]) || []).length < 2) return;   // shared slots only
      var dom = dominantPos(slotName, cfg);
      if (!dom) return;

      var supply = 0;
      players.forEach(function (p) {
        if (p.playable === false) return;
        if (p.pos !== dom) return;
        supply++;
      });

      /* Everything that must be fed BEFORE this slot can hope for a
         dominant-position body: every slot that takes only that position, plus
         any OTHER shared slot the same position dominates. Counting dedicated
         slots alone was the first version; it is right for both leagues today
         and would silently under-report the day a league runs two superflexes. */
      var demand = 0;
      lineup.forEach(function (other, j) {
        if (j === i) return;
        var allowed = elig[other] || [];
        if (allowed.length === 1 && allowed[0] === dom) { demand++; return; }
        if (allowed.length > 1 && dominantPos(other, cfg) === dom) demand++;
      });

      if (supply - demand <= 0) {
        out.push({ slot: slotName, i: i, pos: dom, supply: supply, demand: demand });
      }
    });
    return out;
  }

  /* lookahead(cfg, weeks) -> [{ week, holes, unfilled, thin, covered, legal }]

     weeks  [{ week, players, covered }] — one entry per week to scan, each
            carrying the players as they would be THAT week (bye players marked
            unplayable). `covered` is false when the schedule does not reach
            this week at all; default true.

     Pure, so the page can run it over four weeks for the strip and over all
     eighteen for the season roll-up with the same call, and so Phase 4 can run
     it over a candidate pool with a prospective add spliced in to answer "does
     signing this kicker actually fix week 13".

     ⚠️ `legal` COUNTS no-body ONLY, and that is the whole point of this
     function existing separately from holes().

     holes() returns two different things in one array — "no-body" (nobody
     eligible is available, only a waiver add fixes it) and "no-projection" (a
     body exists, we just cannot score him). Phase 3a split them deliberately;
     `legal: h.length === 0` then quietly glued them back together, and every
     caller downstream inherited it.

     Measured on the real rosters and the real schedule, that costs:

       Joop  legal===false in 17 weeks   real no-body holes: 3
       BKU   legal===false in  2 weeks   real no-body holes: 2

     Spencer Shrader is Joop's only kicker and returns null for weeks 2-18
     while Indianapolis plays sixteen of them, so the K slot emits a
     no-projection hole nearly every week of the season. A roll-up built on the
     old `legal` opens with "17 weeks have no legal lineup" on the league that
     matters most — confidently, in the one place on the page whose entire
     contract is that it speaks only when it has something to say.

     `unfilled` is exposed alongside the full `holes` array so a caller never
     has to re-derive the filter and get it wrong the same way twice. */
  function lookahead(cfg, weeks) {
    return (weeks || []).map(function (w) {
      var h = holes(cfg, w.players);
      var unfilled = h.filter(function (x) { return x.reason === "no-body"; });
      return {
        week: w.week,
        holes: h,
        unfilled: unfilled,
        thin: thinSlots(cfg, w.players),
        covered: w.covered !== false,
        legal: unfilled.length === 0
      };
    });
  }

  /* lookaheadState(entry) -> "hole" | "thin" | "unknown" | "clear"

     One lookahead entry reduced to the single word a week chip shows. Shared by
     the 4-week strip and the season roll-up so the two cannot disagree about
     what a week is — the failure this whole pair of functions exists to avoid.

     AN UNCOVERED WEEK SHORT-CIRCUITS FIRST, and that is not a style choice.
     When the schedule does not reach a week, nobody has a game, so every player
     is unplayable and holes() reports the entire lineup as no-body. Ordering
     "hole" ahead of "unknown" would paint a truncated schedule pull as a
     catastrophe in every uncovered week. Below that the order is
     hole > thin > clear, which is severity and never ambiguous: a week can be
     both short a body and thin at another slot, and the missing body wins.

     no-projection is CLEAR here, deliberately and for the same reason it is not
     counted in `legal`: this is an AVAILABILITY question. A kicker we cannot
     score is still a kicker who can be started, and telling Chris otherwise
     would have him spend FAAB on a problem he does not have. */
  function lookaheadState(entry) {
    if (!entry) return "unknown";
    if (entry.covered === false) return "unknown";
    if ((entry.unfilled || []).length) return "hole";
    if ((entry.thin || []).length) return "thin";
    return "clear";
  }

  /* unrankableSlots(cfg, players, unresolved, threshold, actualStarters)

     WHICH slots a failed fetch actually put in doubt — narrowly, on purpose.

     The naive version marks every slot an unresolved player is eligible for.
     In the superflex league one dropped call on a quarterback would mark the QB
     slot AND the SUPER_FLEX slot; one dropped call on a wide receiver marks two
     WR slots, two FLEX slots and SUPER_FLEX — five of eleven, from one flaky
     request, on a page whose entire contract is that silence means "checked and
     fine". A band that cries "couldn't rank" most Sundays is a band Chris stops
     reading, and then the one Sunday it matters he does not read it either.

     So a slot is only in doubt when the unresolved player could CHANGE it: his
     last known projection is at least within `threshold` of the man currently
     in that slot. Comfortably behind and it does not matter that we could not
     re-confirm him.

     A player with NO projection at all marks nothing. He is already excluded
     from ranking and his own row says so; holes() covers the case where his
     absence leaves a slot unfillable. Marking on his behalf here would put the
     five-of-eleven blowup back in through the other door. */
  function unrankableSlots(cfg, players, unresolved, threshold, actualStarters) {
    var byId = {};
    (players || []).forEach(function (p) { byId[String(p.sid)] = p; });
    var thr = threshold == null ? 1.0 : threshold;
    var seen = {}, out = [];

    (unresolved || []).forEach(function (sid) {
      var p = byId[String(sid)];
      if (!p || p.pts == null) return;
      (cfg.lineup || []).forEach(function (slotName, i) {
        if (seen[i]) return;
        if (!slotEligible(p.pos, slotName, cfg)) return;
        var incId = actualStarters && actualStarters[i] != null ? String(actualStarters[i]) : null;
        var inc = incId && incId !== "0" ? byId[incId] : null;
        var incPts = inc && inc.pts != null ? inc.pts : null;
        /* An empty or unscoreable incumbent means anyone eligible could change
           the answer, so the doubt is real rather than manufactured. */
        if (incPts != null && p.pts < incPts - thr) return;
        seen[i] = 1;
        out.push({
          slot: slotName, i: i, sid: String(p.sid),
          pts: p.pts, incumbent: incPts, threshold: thr
        });
      });
    });

    return out.sort(function (a, b) { return a.i - b.i; });
  }

  /* -------------------------------------------------------------------
     TILT AND THRESHOLD  (wired in Phase C; pure and tested from Phase A)
     ------------------------------------------------------------------- */

  /* usageTilt(pts, usage, cap) — a BOUNDED adjustment, never a blend.
     `usage` is the usage board's league-tuned 0-100 composite, centred at
     50 (measured: median 49.5, mean 49.0 across its 179 rows). A player at
     100 gets +cap, at 0 gets -cap, at 50 is untouched.

     Returns pts unchanged when usage is null. That is not a fallback, it is
     the common case at three positions: the usage board is 73 RB / 71 WR /
     35 TE and holds NO quarterbacks, kickers or defenses at all. Every QB
     decision in the superflex league therefore runs on the projection
     alone, and the page has to say so rather than imply a tilt it does not
     have. */
  function usageTilt(pts, usage, cap) {
    if (pts == null) return null;
    if (usage == null || !isFinite(usage)) return pts;
    var c = cap == null ? 0.08 : cap;
    var f = 1 + c * ((usage - 50) / 50);
    return Math.round(pts * f * 100) / 100;
  }

  function stdev(xs) {
    var v = (xs || []).filter(function (x) { return x != null && isFinite(x); });
    if (v.length < 2) return null;
    var m = v.reduce(function (a, b) { return a + b; }, 0) / v.length;
    var s = v.reduce(function (a, b) { return a + (b - m) * (b - m); }, 0) / (v.length - 1);
    return Math.sqrt(s);
  }

  /* closeThreshold(sigma, floor) — half a standard deviation of the
     startable population at that position, floored so a tight position
     cannot flag everything. Sigma MUST be computed over the same tilted
     values the comparison uses; a threshold built on untilted points and
     applied to tilted ones is calibrated on a different distribution, and
     on a 12-point player the +-8% tilt is +-0.96 — the whole floor. */
  function closeThreshold(sigma, floor) {
    var f = floor == null ? 1.0 : floor;
    if (sigma == null || !isFinite(sigma)) return f;
    return Math.max(f, Math.round(0.5 * sigma * 100) / 100);
  }

  return {
    rescore: rescore,
    vendorPPR: vendorPPR,
    VENDOR_PPR: VENDOR_PPR,
    weekState: weekState,
    freshness: freshness,
    slotEligible: slotEligible,
    slotsOpenTo: slotsOpenTo,
    startablePool: startablePool,
    assignLineup: assignLineup,
    lineupDelta: lineupDelta,
    holes: holes,
    dominantPos: dominantPos,
    thinSlots: thinSlots,
    lookahead: lookahead,
    lookaheadState: lookaheadState,
    unrankableSlots: unrankableSlots,
    usageTilt: usageTilt,
    stdev: stdev,
    closeThreshold: closeThreshold,
    _isBenignAbsent: isBenignAbsent,
    _POS_FAMILIES: POS_FAMILIES,
    _IMMATERIAL: IMMATERIAL
  };
})();
