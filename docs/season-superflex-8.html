      why = causePlain(e.unfilled[0].slot, ROLL.byWeek[e.week]);
    } else if(state === "thin"){
      word = "thin at " + e.thin.map(function(t){ return slotWord(t.slot); }).join(" and ");
      why = e.thin.map(function(t){
        return "no spare " + slotWord(t.pos) + " left (" + t.supply + " "
             + t.pos + (t.supply === 1 ? "" : "s") + ", " + t.demand + " needed before it)";
      }).join("; ");
    } else if(state === "unknown"){
      word = "can’t tell";
      why = "the schedule bake does not reach this week";
    }
    return {week: e.week, state: state, word: word, why: why};
  });

  var alert = weeks.some(function(w){ return w.state === "hole" || w.state === "thin"; });
  return {done:true, weeks: weeks, alert: alert,
          /* AN UNKNOWN WEEK NEVER FORCES THE STRIP OPEN. It is a gap in what we
             know, not a problem with the roster, and expanding on it would
             train Chris to dismiss the expansion. */
          open: STRIP_OPEN == null ? alert : STRIP_OPEN};
}

/* The cause in one plain phrase, for the chip line. The roll-up's expansion
   carries the full version; this is the version that fits on a phone. */
function causePlain(slotName, players){
  var c = holeCause(slotName, players);
  if(!c.length) return "nobody eligible on your roster";
  return c.map(function(x){ return x.name + " (" + x.why + ")"; }).join(", ");
}

function stripHTML(){
  var s = STRIP;
  if(!s) return "";
  if(s.pending){
    return '<div class="strip"><div class="stripline">Checking the next four weeks…</div></div>';
  }
  if(!s.weeks.length) return "";

  var h = '<div class="strip' + (s.alert ? " has" : "") + '">'
        + '<button class="stripline" onclick="toggleStrip()">'
        + '<span class="striplbl">Next ' + s.weeks.length
        + (s.weeks.length === 1 ? ' week' : ' weeks') + '</span>'
        + '<span class="chips">';
  s.weeks.forEach(function(w){
    h += '<span class="wkchip ' + w.state + '" title="week ' + w.week + ': '
       + esc(w.word) + '">' + w.week + '</span>';
  });
  h += '</span><span class="stripcar">' + (s.open ? "hide" : "show") + '</span></button>';

  if(s.open){
    h += '<div class="stripbody">';
    s.weeks.forEach(function(w){
      h += '<div class="striprow"><span class="wkchip ' + w.state + '">' + w.week + '</span>'
         + '<span class="stripwhy"><b>' + esc(w.word) + '</b>'
         + (w.why ? ' — ' + esc(w.why) : '') + '</span></div>';
    });
    h += '</div><div class="stripfoot">Availability, not points. Only the current '
       + 'week is a real projection — later weeks are a season average, so this asks '
       + 'whether you can field a legal lineup, not how many points it scores.</div>';
  }
  return h + '</div>';
}

function toggleStrip(){ STRIP_OPEN = !(STRIP && STRIP.open); render(); }

function render(){
  var app = el("app");

  if(!ROSTER && STATUS.state === "stale" && /not drafted/.test(STATUS.msg)){
    app.innerHTML = '<div class="msg"><b>' + esc(LG.name) + ' has not drafted yet.</b><br><br>'
      + 'This page comes alive the moment the draft finishes — it reads your roster '
      + 'straight from Sleeper, so there is nothing to set up. Until then the draft '
      + 'tools are the ones you want.</div>' + footHTML();
    return;
  }

  if(!ROSTER){
    app.innerHTML = '<div class="msg bad"><b>No roster loaded.</b><br><br>'
      + esc(STATUS.msg) + '<br><br>'
      + 'Tap <b>Refresh</b> to try again. If this page was opened from a saved file '
      + 'rather than the published hub, the browser may be blocking the call to Sleeper '
      + '— open it from the hub link instead.</div>' + footHTML();
    return;
  }

  var h = "";

  /* Viewing a week that is not the current one. Without this the page shows
     week-3 opponents next to THIS week's injury pills and an alerts panel
     announcing byes that have not happened, distinguished only by "WK 3" in
     the corner. Two taps of the arrow is all it takes to get there. */
  if(NOW_WEEK && WEEK !== NOW_WEEK){
    h += '<div class="msg"><b>You are looking at week ' + WEEK + '.</b> '
       + 'The NFL is on week ' + NOW_WEEK + ', and the injury designations below are '
       + 'today’s — not week ' + WEEK + '’s. '
       + '<button class="chip" onclick="setWeek(' + NOW_WEEK + ')">Back to week '
       + NOW_WEEK + '</button></div>';
  }

  /* A schedule that has quietly aged. Flex scheduling moves Sunday 1:00pm games
     to 8:20pm all through weeks 5–17; a stale bake would show "Sun 1p" and a
     LOCKED pill for a game that has not kicked off. */
  var age = scheduleAgeDays();
  if(age !== null && age > 7){
    h += '<div class="msg bad"><b>This schedule is ' + age + ' days old.</b> '
       + 'Kickoff times move when the NFL flexes a game, so the times and LOCKED '
       + 'marks below may be wrong. Ask Claude to re-run the weekly refresh.</div>';
  }

  /* THE BAND IS COMPUTED AND RENDERED IN THE SAME BREATH. Both Session A audit
     cycles caught a version of "computed and never rendered" — a stale flag
     and a stale team, each worked out correctly and then dropped on the floor,
     which is indistinguishable from never having checked. */
  BAND = computeBand();
  h += bandHTML();

  /* The roll-up is computed and rendered in the same breath, for the same
     reason the band is. It anchors on NOW_WEEK rather than the week being
     viewed, so paging back to week 1 does not quietly re-scope "the rest of
     the season" — the answer is the same wherever Chris is standing. */
  ROLL = computeRollup();
  /* Near view before far view: this week (the band), the next four, then the
     rest of the season. The strip reads ROLL's scan, so it is computed after. */
  STRIP = computeStrip();
  h += stripHTML();
  h += rollupHTML();

  /* On the live week the band has already said everything the Session-A
     alerts panel would say, with the arithmetic attached. Off the live week
     the band is gated, so the panel is the only thing watching and stays. */
  if(!BAND || BAND.gated){
    var al = alertList();
    if(al.length){
      var crit = al.some(function(a){ return a.crit; });
      h += '<div class="alerts' + (crit ? " crit" : "") + '"><h3>Needs you · ' + al.length + '</h3><ul>'
         + al.map(function(a){ return '<li><span>' + a.icon + '</span><span>' + a.txt + '</span></li>'; }).join("")
         + '</ul></div>';
    }
  }

  var st = ROSTER.starters || [];
  h += '<div class="sec">Starters <i>as set in Sleeper</i></div>';
  LG.lineup.forEach(function(slot, i){
    var flex = (slot === "FLEX" || slot === "SUPER_FLEX");
    h += rowHTML(slot === "SUPER_FLEX" ? "SFLX" : slot, st[i],
                 {starter:true, flex:flex, slotIndex:i});
  });

  /* ONLY the starters this lineup actually RENDERS count as in the lineup.
     starters[] is positional and its length is Sleeper's business, not ours:
     if it ever comes back longer than roster_positions — a league reshaped
     mid-season, a stale array, the wrong league's roster — the extra ids were
     silently dropped from BOTH halves of the page. They are past the end of
     LG.lineup so no slot renders them, and they were counted as "in the
     lineup" so the bench filtered them out too. A rostered player must never
     be invisible; when in doubt he goes on the bench, where he can be seen. */
  var inLineup = {};
  st.slice(0, LG.lineup.length).forEach(function(s){
    if(s && s !== "0") inLineup[String(s)] = 1;
  });
  var res = {}; (ROSTER.reserve || []).forEach(function(s){ res[String(s)] = 1; });
  var bench = ROSTER.players.filter(function(p){ return !inLineup[p] && !res[p]; });
  var ir = ROSTER.players.filter(function(p){ return res[p]; });

  h += '<div class="sec">Bench <i>' + bench.length + " of " + LG.bench + '</i></div>';
  bench.forEach(function(p){ h += rowHTML("BN", p, {}); });
  if(!bench.length) h += '<div class="row empty"><div class="slot">BN</div><div class="body">'
    + '<div class="nm dim">nobody on the bench</div></div></div>';

  if(LG.ir){
    h += '<div class="sec">IR <i>' + ir.length + " of " + LG.ir + '</i></div>';
    if(ir.length) ir.forEach(function(p){ h += rowHTML("IR", p, {}); });
    else h += '<div class="row empty"><div class="slot">IR</div><div class="body">'
      + '<div class="nm dim">empty</div></div></div>';
  }

  h += footHTML();
  app.innerHTML = h;
}

function scheduleAgeDays(){
  var p = (S.schedule._meta || {}).pulled;
  if(!p) return null;
  var t = Date.parse(p + "T12:00:00Z");
  if(isNaN(t)) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

function footHTML(){
  var sch = S.schedule._meta || {};
  var age = scheduleAgeDays();
  return '<div class="foot">'
    + '<b>Where these numbers come from.</b><br>'
    + 'Roster, starters, FAAB and every player’s team and injury designation are pulled '
    + 'live from Sleeper each time this page loads — nothing about them is baked in. '
    + 'Opponents, kickoff times and byes come from the ' + esc(sch.season || "2026")
    + ' schedule (' + esc(sch.source_url || "nflverse") + ', pulled ' + esc(sch.pulled || "?")
    + (age === null ? '' : ', ' + age + ' day' + (age === 1 ? '' : 's') + ' ago') + ').<br><br>'
    + 'Projected points are <b>re-scored at your league&rsquo;s own rules</b> from '
    + 'Rotowire&rsquo;s component projections — they are not the vendor&rsquo;s PPR '
    + 'number, which pays six points for a passing touchdown where this league pays four. '
    + (PROJ_STATE === "live" ? 'Pulled live this session.'
      : PROJ_STATE === "partial" ? 'Mostly live; some players fell back to the snapshot baked into this page.'
      : PROJ_STATE === "fallback" ? '<b>Live projections could not be reached — these came from the snapshot baked into this page.</b>'
      : 'Loading&hellip;')
    + '<br>Only the imminent week is genuinely refreshed by the vendor; weeks after it '
    + 'are a season-per-game average, which is why the look-ahead talks about '
    + 'availability rather than points.<br><br>'
    + 'All kickoff times are Eastern. Page built ' + esc(S.built) + '.'
    + (STATUS.at ? '<br>Last successful sync ' + esc(ago(STATUS.at)) + '.' : '')
    + (UNRESOLVED.length ? '<br><b>' + UNRESOLVED.length + ' player(s) could not be '
        + 'confirmed with Sleeper on the last sync</b> — those rows are marked “?”.' : '')
    + (PROJ_MISSING.length ? '<br><b>' + PROJ_MISSING.length + ' player(s) had no '
        + 'projection this sync</b> — they are excluded from ranking, and any slot '
        + 'they could actually have changed is named in the band above.' : '')
    + '</div>';
}

/* =====================================================================
   WEEK NAV + BOOT
   ===================================================================== */
function paintWeek(){
  el("wkNum").textContent = "WK " + WEEK;
  el("wkPrev").disabled = (WEEK <= 1);
  el("wkNext").disabled = (WEEK >= 18);
}
function setWeek(w){
  w = Math.max(1, Math.min(18, w));
  if(w === WEEK) return;
  WEEK = w; paintWeek(); render();
}

/* TWO-STAGE PAINT. The facts view goes up the moment the roster and the
   per-player facts land; the band follows when the projections do. On a phone
   ninety minutes before kickoff, eighteen more round-trips of blank screen is
   worse than a band that arrives a beat late — and the facts half is what
   Session A built to be useful on its own. */
function sync(force){
  setStatus("boot", "syncing…");
  /* Reset BOTH unconfirmed counts at the top. A sync that dies early confirmed
     nothing, and a previous run's count reported as this run's is the exact
     shape of the bug Session A's second cycle caught on UNRESOLVED. */
  PROJ_STATE = "pending";
  PROJ_MISSING = [];
  /* Sigma resets with them, for the same reason: a run that fetched no field
     must not report the previous run's spread as this run's measurement. */
  SIGMA = null;
  SIGMA_STATE = "pending";
  SIGMA_MISSING = [];
  return loadLeagueStatus().then(loadRoster).then(function(r){
    ROSTER = r;
    return loadPlayers(r.players, force);
  }).then(function(){
    STATUS.at = Date.now();
    setStatus(UNRESOLVED.length ? "stale" : "ok", "loading projections…");
    render();                                  // facts now, band pending
    /* THE FIELD IS FETCHED ALONGSIDE THE ROSTER, NOT BEFORE IT. Sigma only
       sizes the threshold; it can fail entirely and the band still works, on
       the 1.0 floor, saying so. So it never gates the paint and never rejects:
       four more calls that cannot cost Chris the page. */
    var field = loadSigma(NOW_WEEK || WEEK, force).catch(function(){
      SIGMA = null; SIGMA_STATE = "fallback"; return null;
    });
    var roster = loadProjections(ROSTER.players, force).catch(function(){
      /* A total projections failure is NOT a page failure. The facts view
         is already on screen and correct; the band degrades to the baked
         snapshot, or says plainly that it has nothing. */
      PROJ = {}; PROJ_MISSING = (ROSTER.players || []).map(String);
      PROJ_STATE = "fallback";
    });
    return Promise.all([roster, field]);
  }).then(function(){
    // A sync that could not confirm every player is NOT a clean sync, and must
    // not present itself as one.
    if(UNRESOLVED.length){
      setStatus("stale", UNRESOLVED.length + " player(s) unconfirmed · $" + ROSTER.faab + " FAAB");
    } else {
      setStatus("ok", "$" + ROSTER.faab + " FAAB · synced " + ago(STATUS.at));
    }
    render();
  }).catch(function(e){
    // A sync that died before reaching loadPlayers confirmed nothing, so a
    // previous run's count must not keep being reported as this run's.
    UNRESOLVED = [];
    PROJ_MISSING = [];
    SIGMA = null; SIGMA_STATE = "pending"; SIGMA_MISSING = [];
    /* And the band must not keep showing last sync's ranking under a red
       status dot. "pending" makes it say it is still working rather than
       present a stale answer as a current one. */
    PROJ_STATE = "pending";
    // A ghost payload must not clobber a roster we already have on screen.
    if(e && e.ghost && ROSTER){
      setStatus("stale", "Sleeper returned an empty roster — keeping the last good one");
    } else if(e && e.predraft){
      setStatus("stale", "not drafted yet");
      if(!ROSTER) render();
    } else {
      setStatus("bad", e && e.message ? e.message : "sync failed");
      if(!ROSTER) render();
    }
  });
}

(function boot(){
  el("lname").textContent = LG.name;
  el("wkPrev").onclick = function(){ setWeek(WEEK - 1); };
  el("wkNext").onclick = function(){ setWeek(WEEK + 1); };
  // Refresh FORCES a re-fetch past the cache — BOTH caches, facts and
  // projections. See loadPlayers() for why: a Refresh that re-uses a 10:00
  // cache at 11:30 on a Sunday and then reports "synced just now" is lying at
  // precisely the moment inactives drop.
  el("syncBtn").onclick = function(){ sync(true); };

  loadState().then(function(w){
    NOW_WEEK = w; WEEK = w; paintWeek();
    return sync();
  });
})();
</script>
</body>
</html>
