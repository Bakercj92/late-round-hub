   2026-09-07 — SEA week 11 comes back null, which is the bye behind Ball
   Knowers' week-11 hole). */
function projUrl(sid){
  return API_ROOT + "projections/nfl/player/" + encodeURIComponent(sid)
       + "?season=" + SEASON_YEAR + "&season_type=regular&grouping=week";
}

/* =====================================================================
   THE FIELD — a bulk per-position pull, for sigma (Phase C)

   CORRECTION TO THE NOTE ABOVE, measured 2026-09-08: there IS a bulk endpoint.
   It does not take an arbitrary id list — that part stands, which is why the
   roster is still fetched one player at a time — but it takes a POSITION:

     api.sleeper.com/projections/nfl/<season>/<week>?season_type=regular&position[]=WR

   and it returns FULL COMPONENT STAT LINES, not just totals. 355 QB rows, 750
   RB, 1363 WR, 647 TE for week 1, of which 32 / 103 / 162 / 100 carry a real
   projection. Four calls covers every position the threshold needs.

   ⚠️ RE-SCORE IT. The rows carry the vendor's pts_ppr and it is the wrong
   scale: sigma over the top 15 quarterbacks is 0.98 on pts_ppr and 1.12 at
   Ball Knowers' rules, because the vendor pays six for a passing touchdown
   where both leagues pay four.

   HONEST ABOUT ITS OWN EVIDENCE: at quarterback that difference currently
   changes NOTHING, because half of either figure — 0.49 or 0.56 — is under the
   1.00 floor and both produce a threshold of exactly 1.00. The rule earns its
   place at running back and receiver, where half a sigma is 1.31 to 1.70 and
   the scale moves the answer directly, and at quarterback the day the position
   spreads out. It is not, today, load-bearing at QB, and saying otherwise
   would be the page overstating a measurement it made itself.

   Still never order_by=ppr — it strips the stats block here exactly as it does
   on the per-player endpoint, and without components there is nothing to
   re-score.

   THE VENDOR'S OWN "HAS A PROJECTION" MARKER IS pts_ppr != null. Rows for
   third-string bodies carry a stats object with nothing in it; including them
   would drag a position's field down with players nobody could start and
   inflate sigma with noise from outside the startable pool. */
var SIGMA = null;               // {QB:{sigma,n,seen}, ...} or null
var SIGMA_STATE = "pending";    // pending | live | cached | partial | fallback
var SIGMA_MISSING = [];         // positions whose pull failed
var SIGMA_POS = ["QB", "RB", "WR", "TE"];

/* K and DEF are deliberately absent. Neither has a meaningful bulk field on
   this endpoint, and both are single-slot positions where the close-call
   question barely arises — Chris has one kicker and one defense. They fall
   back to the floor, and the panel says so. */
function fieldUrl(pos, week){
  return API_ROOT + "projections/nfl/" + SEASON_YEAR + "/" + week
       + "?season_type=regular&position[]=" + encodeURIComponent(pos);
}

function loadSigma(week, force){
  var cache = lsGet() || {};
  var hit = cache.sigma;
  var fresh = Date.now() - CACHE_MIN * 60000;
  SIGMA_MISSING = [];

  /* Same 90-minute window as the projections, and keyed on the WEEK as well as
     the clock: a cached week-1 field is not an answer about week 2. */
  if(!force && hit && hit.at > fresh && hit.week === week && hit.v){
    SIGMA = hit.v; SIGMA_STATE = "cached";
    return Promise.resolve(SIGMA);
  }

  var sc = SCORING || S.scoring;
  if(!sc){
    /* No scoring table means no league-rules re-score, and a sigma on the
       vendor's scale is worse than no sigma: it would silently mis-size every
       threshold while looking like a real measurement. */
    SIGMA = null; SIGMA_STATE = "fallback";
    return Promise.resolve(null);
  }

  return Promise.all(SIGMA_POS.map(function(pos){
    return getJSON(fieldUrl(pos, week)).then(function(rows){
      if(!Array.isArray(rows)) throw new Error("shape");
      var out = [];
      rows.forEach(function(r){
        if(!r || !r.stats || r.stats.pts_ppr == null) return;
        var s = RankEngine.rescore(r.stats, sc, {pos: pos});
        if(s && s.pts != null && isFinite(s.pts)) out.push({pos: pos, pts: s.pts});
      });
      return out.length ? out : null;
    }).catch(function(){ return null; });
  })).then(function(res){
    var rows = [];
    res.forEach(function(list, i){
      if(list) rows = rows.concat(list);
      else SIGMA_MISSING.push(SIGMA_POS[i]);
    });
    if(!rows.length){
      SIGMA = null; SIGMA_STATE = "fallback";
      return null;
    }
    SIGMA = RankEngine.sigmaByPos(rows, ECFG);
    SIGMA_STATE = SIGMA_MISSING.length ? "partial" : "live";
    lsPatch("sigma", {at: Date.now(), week: week, v: SIGMA});
    return SIGMA;
  });
}

function loadProjections(ids, force){
  var cache = lsGet() || {};
  var pj = cache.proj || {};
  var fresh = Date.now() - CACHE_MIN * 60000;
  var need = [], out = {};

  ids.forEach(function(sid){
    sid = String(sid);
    var hit = pj[sid];
    if(!force && hit && hit.at > fresh && hit.w){ out[sid] = hit; }
    else { need.push(sid); }
  });

  var finish = function(){
    PROJ = {};
    for(var sid in out){ PROJ[sid] = out[sid].w; }
    /* PARTIAL is not OK. A page that ranked nine of eleven slots and said
       nothing would be claiming a completeness it does not have. */
    PROJ_STATE = PROJ_MISSING.length
      ? (Object.keys(out).length ? "partial" : "fallback")
      : "live";
    lsPatch("proj", out);
    return PROJ;
  };

  if(!need.length){ PROJ_MISSING = []; return Promise.resolve(finish()); }

  return Promise.all(need.map(function(sid){
    return getJSON(projUrl(sid)).then(function(byWeek){
      if(!byWeek || typeof byWeek !== "object") throw new Error("shape");
      var w = {};
      for(var k = 1; k <= 18; k++){
        var row = byWeek[String(k)];
        /* A literal null is a BYE OR MISSING DATA and this layer does not
           decide which — it preserves the null and lets weekState() settle it
           against the schedule. Spencer Shrader is null for weeks 2-18 while
           Indianapolis plays every one of them; collapsing that here would
           bench Joop's only kicker for the season. */
        w[String(k)] = (row && row.stats) ? {
          stats: row.stats,
          /* The live feed says `opponent` / `is_away_team`; the baked snapshot
             says `opp` / `away`. Normalise here so one shape reaches the
             renderer and a fallback row is indistinguishable from a live one
             except where the page deliberately says which it used. */
          opp: row.opponent || null,
          away: row.is_away_team ? 1 : 0,
          lm: row.last_modified || null
        } : null;
      }
      return {sid:sid, v:{w:w, at:Date.now()}};
    }).catch(function(){ return {sid:sid, v:null}; });
  })).then(function(res){
    var failed = [];
    res.forEach(function(r){
      if(r && r.v){ out[r.sid] = r.v; }
      else if(r){
        // Same rule as the facts cache: keep the last good record rather than
        // dropping the player, but remember it was not confirmed this time.
        if(pj[r.sid]) out[r.sid] = pj[r.sid];
        failed.push(r.sid);
      }
    });
    PROJ_MISSING = failed;
    return finish();
  });
}

/* scoreFor(sid, week) -> {pts, vendor, opp, away, floor, unmatched, src} | null

   LIVE WINS OUTRIGHT, INCLUDING WHEN IT SAYS NULL. Same rule as team
   authority, for the same reason: if the live feed has a record for this
   player and reports no row for this week, that is an answer, and falling
   back to an August bake would resurrect exactly the staleness the live path
   exists to kill. The bake is for players the live fetch never reached. */
function scoreFor(sid, week){
  sid = String(sid); var wk = String(week);
  var rec = PROJ[sid];
  if(rec){
    var row = rec[wk];
    if(!row || !row.stats) return null;
    var sc = SCORING || S.scoring;
    if(sc){
      var r = RankEngine.rescore(row.stats, sc, {pos: facts(sid).pos});
      return {
        pts: r.pts, vendor: RankEngine.vendorPPR(row.stats),
        opp: row.opp, away: !!row.away,
        /* Non-empty unmatched means the league pays for something the feed
           cannot source, so this number is a FLOOR and the row must say so.
           Exactly one such key exists across both rosters: fgm_yds_over_30 on
           Joop's kickers. */
        floor: r.unmatched.length > 0, unmatched: r.unmatched,
        src: "live", lm: row.lm
      };
    }
  }
  var b = S.proj && S.proj[sid] && S.proj[sid].w ? S.proj[sid].w[wk] : null;
  if(b){
    var um = (S.proj[sid].unmatched || []);
    return {pts: b[0], vendor: b[3], opp: b[1], away: !!b[2],
            floor: um.length > 0, unmatched: um, src: "baked", lm: null};
  }
  return null;
}

/* buildPlayers(week) -> the {sid,pos,pts,playable} array the engine wants,
   plus the extra facts the band needs to explain itself.

   PLAYABLE is a certainty test, not a probability one. Out, IR, a roster
   reserve slot, a bye and "no game this week" are facts, so they set
   playable:false and the optimiser routes around them. DOUBTFUL DOES NOT:
   it is a hard flag the band always speaks about, but a doubtful starter can
   still be the right start, and marking him unplayable would have the page
   silently manufacture a certainty Sleeper has not given it. The band handles
   him by costing the alternative instead — "if he sits, X takes the slot". */
var HARD_OUT = {Out:1, IR:1, PUP:1, NA:1, Sus:1, COV:1, DNR:1};

/* =====================================================================
   THE USAGE TILT (Phase C)

   A bounded nudge, never a blend. The vendor projects a week; the usage board
   scores OPPORTUNITY — target share, red-zone share, snap share, the things
   that persist. Where they disagree, opportunity is the better bet, but not by
   enough to override a projection outright. So: +/-8% at the extremes, applied
   to the number, and shown.

   IT REACHES ROUGHLY HALF A LINEUP AND NONE OF THE SUPERFLEX LEAGUE'S MOST
   IMPORTANT SLOT. The bake is 60 RB / 70 WR / 35 TE — 165 of the board's 179
   rows, the other 14 having no usage value — and it holds no quarterback,
   kicker or defense — so a QB, K or DEF row is never tilted, and the panel says
   so on those rows rather than leaving Chris to assume a tilt that is not there.
   That is the same rule as the kicker floor marker: the page does not imply
   precision it does not have.

   50 IS NEUTRAL. usageTilt() reads the board's 0-100 score as a deviation from
   50, so a player at 50 is unchanged, 100 gets the full +8% and 0 the full -8%.
   Baked per league, because the board scores against each league's own scoring
   and roster shape — Ja'Marr Chase is 89.3 in Joop and 88.5 in Ball Knowers. */
/* =====================================================================
   THE JJ LAYER (Phase C)

   The opinion layer, and the only part of this page that is not arithmetic.

   IT NEVER MOVES A NUMBER. Chris's answer to the Phase C interview: ranking on
   a podcast take would make the arithmetic unauditable, and the whole band
   rests on being able to show its working. JJ's job is to say when the numbers
   and the opinion disagree — which is exactly when Chris wants to look, and
   exactly when he does not want the two silently averaged.

   IT ONLY SPEAKS WHEN IT DISAGREES WITH THE LINEUP, which falls out of the
   shape rather than needing a gate: a FADE on a player Chris is STARTING, or a
   BUY on the bench player nearest to taking a slot. Both are the show
   contradicting what the lineup currently does. A BUY on someone already
   starting, or a FADE on someone already benched, is agreement, and agreement
   is silence.

   ONE ITEM PER PLAYER, not per slot. The same bench receiver is the nearest
   challenger for FLEX1, FLEX2 and SUPER_FLEX; three identical lines about him
   is the cascade the set-diff was built to end, arriving through a different
   door.

   LATEST EPISODE WINS — enforced in season.py, where the corpus is collapsed
   to one take per player. Josh Downs and Xavier Hutchinson were both reversed
   on air inside a fortnight. */
var JJ = S.jj || {};
var JJ_META = S.jjMeta || {};
var JJ_STALE_DAYS = 10;

function jjAgeDays(){
  var d = JJ_META.newest;
  if(!d) return null;
  var t = Date.parse(d + "T12:00:00Z");
  if(!isFinite(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}

var USAGE = S.usage || {};
var USAGE_META = S.usageMeta || {};
var TILT_CAP = 0.08;
var USAGE_STALE_DAYS = 14;
function usageAgeDays(){
  var d = USAGE_META.boardMtime;
  if(!d) return null;
  var t = Date.parse(d + "T12:00:00Z");
  if(!isFinite(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
var TILT_POS = {RB:1, WR:1, TE:1};

/* One implementation, used by the ranking AND by the row, so the number Chris
   reads is the number the band ranked on. Two call sites computing this
   separately is how a page ends up recommending a swap its own numbers
   contradict. */
function usageOf(sid, pos){
  if(!pos || !TILT_POS[pos]) return null;
  var u = USAGE[String(sid)];
  return (u == null || !isFinite(u)) ? null : u;
}
function tilted(sid, pos, raw){
  if(raw == null) return null;
  var u = usageOf(sid, pos);
  return u == null ? raw : RankEngine.usageTilt(raw, u, TILT_CAP);
}

/* A FUTURE WEEK IS NOT THIS WEEK, AND TODAY'S INJURY ROOM IS A FACT ABOUT
   TODAY. Both `status` and the roster's reserve list describe week 1. Applied
   unchanged to week 12 they say "this player is out in December", which Sleeper
   has not claimed and nobody knows — and because the look-ahead's whole job is
   to find slots with nobody in them, a single Out designation on a single-body
   position would manufacture a hole in every remaining week of the season.

   So beyond the live week, availability is the part that is actually knowable
   in September: the bye calendar and the schedule. The strip and the roll-up
   both say in copy that they assume today's roster at full health, because that
   assumption is doing real work and hiding it would be the same class of lie as
   showing a season average as a weekly projection.

   A player Sleeper reports with no team stays unplayable — he genuinely has no
   game — but the roll-up reports that as one standing roster gap rather than as
   seventeen dated emergencies. See rollupItems(). */
function buildPlayers(week){
  var res = {}; (ROSTER.reserve || []).forEach(function(s){ res[String(s)] = 1; });
  var future = NOW_WEEK != null && week > NOW_WEEK;
  return (ROSTER.players || []).map(function(sid){
    sid = String(sid);
    var f = facts(sid);
    var bye = onBye(f.team, week);
    var g = bye ? null : gameFor(f.team, week);
    var sc = scoreFor(sid, week);
    var raw = sc ? sc.pts : null;
    var tp = tilted(sid, f.pos, raw);
    return {
      sid: sid, pos: f.pos, name: f.name, team: f.team,
      /* THE RANKING SEES THE TILTED NUMBER. Chris's answer to the Phase C
         interview: a bounded tilt that cannot change a decision is decoration,
         and the bound is what makes it safe to let it decide. */
      pts: tp,
      raw: raw,
      usage: usageOf(sid, f.pos),
      tilt: (tp != null && raw != null) ? Math.round((tp - raw) * 100) / 100 : null,
      score: sc,
      bye: bye, game: g, locked: !!(g && isLocked(g)),
      status: f.status, reserve: !!res[sid], stale: f.stale,
      noTeam: !f.team,
      state: RankEngine.weekState(sc ? {stats:1} : null, bye),
      playable: future
        ? (!bye && !!g)
        : (!bye && !!g && !res[sid] && !HARD_OUT[f.status])
    };
  });
}

/* =====================================================================
   RENDER
   ===================================================================== */
function setStatus(state, msg){
  STATUS.state = state; STATUS.msg = msg;
  var d = el("statusDot"), t = el("statusTxt");
  d.className = "dot" + (state === "ok" ? " ok" : state === "bad" ? " bad" : state === "stale" ? " stale" : "");
  t.textContent = msg;
}

function rowHTML(slotLabel, sid, opts){
  opts = opts || {};
  if(!sid || sid === "0"){
    return '<div class="row empty"><div class="slot">' + esc(slotLabel) + '</div>'
         + '<div class="body"><div class="nm dim">empty</div>'
         + '<div class="meta">nothing set in Sleeper</div></div></div>';
  }
  var f = facts(sid);
  var bye = onBye(f.team, WEEK);
  var g = bye ? null : gameFor(f.team, WEEK);
  var locked = g && isLocked(g);

  var pills = "";
  var sp = f.status && STATUS_PILL[f.status];
  if(sp) pills += '<span class="pill ' + sp.c + '">' + sp.t + '</span>';
  if(bye) pills += '<span class="pill bye">BYE</span>';
  if(locked) pills += '<span class="pill locked">LOCKED</span>';
  // An unconfirmed row is marked ON THE ROW. Computing a staleness flag and
  // then rendering the row identically is the same as not computing it.
  if(f.stale) pills += '<span class="pill unconf" title="not confirmed with Sleeper">?</span>';

  var line;
  if(bye){
    line = esc(f.team || "?") + " · on bye";
  } else if(g){
    line = esc(f.team) + " " + (g.home ? "vs " : "@ ") + esc(g.opp);
  } else if(f.team){
    line = esc(f.team) + " · no game this week";
  } else if(f.stale){
    line = "team not confirmed";
  } else {
    line = "no NFL team";
  }
  if(f.stale && f.team) line += " · unconfirmed";
  if(f.pos && f.pos !== "DEF") line = esc(f.pos) + " · " + line;

  /* The projected number, secondary to the kickoff by design (Session A:
     "tier first, number secondary and de-emphasised"). Three states, and they
     must read differently:
       12.4   a league-rules number, re-scored from live components
       ≥ 8.1  a FLOOR — the league pays for something the feed cannot source.
              Exactly one such key exists across both rosters, Joop's
              fgm_yds_over_30, so this marks Joop's two kickers and nobody
              else. It is never the vendor's number wearing a league label.
       —      no projection: excluded from ranking, and the row says so
                                                                            */
  var sc = (!bye && g) ? scoreFor(sid, WEEK) : null;
  var ptsHTML = "";
  if(!bye && g){
    if(sc && sc.pts != null){
      /* THE ROW SHOWS THE NUMBER THE BAND RANKED ON, tilt included, marked so
         it is never mistaken for the raw projection. A row showing the raw
         number under a band recommending on the tilted one would have the page
         contradict itself in adjacent inches — the same failure the locked-slot
         fix closed between the band and the panel. */
      var tRaw = sc.pts;
      var tPts = tilted(sid, f.pos, tRaw);
      var tDelta = Math.round((tPts - tRaw) * 100) / 100;
      var marked = Math.abs(tDelta) >= 0.05;
      ptsHTML = '<span class="pts' + (sc.floor ? ' floor' : '') + (marked ? ' tilt' : '') + '" title="'
              + (sc.floor ? 'a floor — this league pays for a stat the projection feed does not carry'
                          : 'projected at your league&#39;s scoring, not the vendor&#39;s')
              + (marked ? ' · usage tilt ' + (tDelta > 0 ? '+' : '') + tDelta.toFixed(2)
                          + ' from ' + tRaw.toFixed(1) : '')
              + '">' + (sc.floor ? '&ge;&nbsp;' : '') + (Math.round(tPts * 10) / 10).toFixed(1)
              + (marked ? '<i class="tmark">' + (tDelta > 0 ? '&uarr;' : '&darr;') + '</i>' : '')
              + '</span>';
    } else if(PROJ_STATE !== "pending"){
      ptsHTML = '<span class="pts none" title="no projection — excluded from ranking">&mdash;</span>';
    }
  }

  var right = "";
  if(!bye && g){
    right = '<div class="right"><b>' + esc(kickLabel(g) || "") + '</b>' + ptsHTML + '</div>';
  }

  /* An unconfirmed player says so ON HIS OWN ROW, every time. Whether that
     doubt reaches the band is a separate and much narrower test — see
     RankEngine.unrankableSlots() — because one dropped fetch marking five of
     eleven slots would train Chris to ignore the band entirely. */
  var norank = "";
  if(opts.starter && PROJ_STATE !== "pending"
     && (PROJ_MISSING.indexOf(sid) >= 0 || (f.stale && (!sc || sc.pts == null)))){
    norank = '<div class="norank">couldn&rsquo;t rank &mdash; not confirmed with Sleeper</div>';
  }

  var cls = "row";
  if(opts.starter && (bye || f.status === "Out" || f.status === "IR")) cls += " alert";
  else if(opts.starter && (f.status === "Doubtful")) cls += " soft";

  /* TAP-THROUGH. Only a starter slot on the live week has anything to show —
     off the live week the band is gated and there is no arithmetic to open, and
     a bench row has no slot decision behind it. Rows that cannot open must not
     look like they can. */
  var i = opts.slotIndex;
  var tappable = opts.starter && i != null && BAND && BAND.detail && BAND.detail[i];
  if(tappable) cls += " tap" + (OPEN_SLOT === i ? " open" : "");

  var row = '<div class="' + cls + '"'
       + (tappable ? ' onclick="togglePanel(' + i + ')"' : '')
       + '><div class="slot' + (opts.flex ? " flex" : "") + '">' + esc(slotLabel) + '</div>'
       + '<div class="body"><div class="nm">' + esc(f.name) + pills
       + (tappable ? '<span class="tapcar">' + (OPEN_SLOT === i ? '&minus;' : '+') + '</span>' : '')
       + '</div>'
       + '<div class="meta">' + line + '</div>' + norank + '</div>'
       + right + '</div>';

  if(!tappable) return row;
  return '<div class="rw">' + row + (OPEN_SLOT === i ? panelHTML(i) : "") + '</div>';
}

/* =====================================================================
   THE TAP-THROUGH PANEL

   OPEN STATE LIVES HERE, NOT ON THE NODE, and that is load-bearing rather than
   stylistic. render() ends with app.innerHTML = h, and it is called by the
   "+N more" disclosure, by week navigation, by both halves of the two-stage
   paint and by every toggle on this page — so the tracker's own .open/.detail
   pattern, which toggles a class on a node that persists, would snap the panel
   shut the moment projections landed underneath Chris while he was reading it.
   Holding the open slot in a variable and re-emitting it on every render is the
   only version that survives.

   WHAT GOES WHERE. Player facts stay on the row; the panel holds comparisons
   and arithmetic. Same split the compare tray already uses, for the same
   reason: a panel that repeats the row is a panel Chris stops opening.

   Every starter row opens, not just flagged ones. A quiet band raises exactly
   one question — "you say this slot is settled; settled against what?" — and
   only an unflagged slot can answer it.
   ===================================================================== */
/* The positions Rotowire's PPR scale actually models. */
var VENDOR_POS = {QB:1, RB:1, WR:1, TE:1};

var OPEN_SLOT = null;
function togglePanel(i){ OPEN_SLOT = (OPEN_SLOT === i ? null : i); render(); }

function dRow(k, v){ return '<div class="dk">' + k + '</div><div class="dv">' + v + '</div>'; }

function panelHTML(i){
  var d = BAND && BAND.detail ? BAND.detail[i] : null;
  if(!d) return "";
  var h = '<div class="det">';

  /* ---- 1. the comparison, which is the reason the panel exists ---- */
  h += '<div class="dsec">The comparison</div><div class="dgrid">';
  if(d.hole && d.hole.reason === "no-body"){
    h += dRow("Verdict", "<b>Nobody eligible.</b> No move between your own players "
      + "fixes this slot — only a waiver add does.");
  } else if(!d.sid){
    h += dRow("Verdict", "<b>Nothing set in Sleeper.</b> An empty slot scores zero "
      + "whatever the rest of the lineup does.");
  } else if(d.pts == null){
    h += dRow("Verdict", "<b>Not ranked.</b> There is no projection for "
      + esc(d.name) + ", so he is excluded from the comparison — start him anyway; "
      + "this is missing data, not a missing player.");
  } else if(!d.challenger){
    h += dRow("Verdict", "<b>No alternative exists.</b> Nobody on your bench is "
      + "eligible for this slot, so it is " + esc(d.name) + "&rsquo;s either way.");
    h += dRow("In the slot", esc(d.name) + " · " + one(d.pts) + " pts");
  } else {
    var c = d.challenger, absGap = Math.abs(d.gap);
    h += dRow("In the slot", esc(d.name) + " · <b>" + one(d.pts) + "</b> pts"
      + (d.status ? " · " + esc(d.status) : " · healthy"));
    h += dRow(c.proposed ? "Proposed" : "Nearest on your bench",
      esc(c.name) + " · <b>" + one(c.pts) + "</b> pts"
      + (c.status ? " · " + esc(c.status) : " · healthy"));
    h += dRow("Gap", one(absGap) + " pts "
      + (d.gap >= 0 ? "in " + esc(d.name) + "&rsquo;s favour" : "in " + esc(c.name) + "&rsquo;s favour"));
    h += dRow("Threshold", two(d.thr) + " pts");
    h += dRow("Verdict", absGap < d.thr
      ? "<b>Inside the threshold</b> — the gap is smaller than the noise, so the "
        + "numbers alone do not decide this."
      : "<b>Settled</b> — " + one(absGap) + " is wider than the " + two(d.thr)
        + "-point threshold, so this is not close.");
  }
  h += '</div>';

  /* ---- 2. where the number came from ---- */
  if(d.pts != null){
    h += '<div class="dsec">Where the number comes from</div><div class="dgrid">';
    h += dRow("Your league", "<b>" + one(d.pts) + "</b>"
      + (d.floor ? " — a <b>floor</b>: this league pays for a stat the feed does not carry"
                 : " — re-scored from components at your league&rsquo;s own rules"));
    /* THE VENDOR CONTRAST IS ONLY MEANINGFUL WHERE THE VENDOR'S SCALE MODELS
       THE POSITION. vendorPPR() is an offensive PPR scale, so it returns 0.0
       for a kicker and 0.0 for a defense — and printing "Rotowire 0.0" next to
       a league number of 11.5 reads as the vendor projecting nothing, which is
       a claim about Cameron Dicker rather than about the scale. Show it for the
       four positions it actually covers, and nowhere else. */
    if(d.vendor != null && VENDOR_POS[d.pos] && Math.abs(d.vendor - d.pts) >= 0.05){
      h += dRow("Rotowire", one(d.vendor) + " — the vendor&rsquo;s PPR number, which pays "
        + "six for a passing touchdown where this league pays four. Never shown as yours.");
    }
    h += dRow("Freshness", d.fresh === "current"
      ? "this week&rsquo;s projection, genuinely refreshed"
      : "a season-per-game average — only the current week is refreshed by the vendor");
    h += dRow("Source", d.src === "live" ? "fetched live this session"
                                         : "the baked snapshot — live did not reach him");
    h += '</div>';
  }

  /* ---- 3. the field the threshold was drawn against ---- */
  h += '<div class="dsec">The field</div><div class="dgrid">';
  if(d.pool != null){
    h += dRow("Startable pool", "about " + d.pool + " across the league at this position — "
      + "measured from every manager&rsquo;s live lineup, not assumed from an even split");
  }
  /* THE SIGMA SHOWN AND THE THRESHOLD USED CAN COME FROM DIFFERENT POSITIONS,
     and the panel has to say when they do. A quarterback in a SUPER_FLEX whose
     nearest bench challenger is a receiver is compared at the RECEIVER's
     threshold, because thresholdBetween() takes the larger of the two — the
     noisier side decides how big a gap has to be. Explaining the quarterback's
     spread and then quoting a number that came from the receiver's, with no
     word about it, is the kind of arithmetic Chris would have to take on faith,
     which is the one thing this panel exists not to ask of him. */
  var ownThr = RankEngine.thresholdFor(d.pos, BAND ? BAND.sigmas : null,
                                       {floor: CLOSE_FLOOR, cap: CLOSE_CAP});
  var fromOther = d.challenger && d.challenger.pos && d.challenger.pos !== d.pos
                  && d.thr > ownThr + 0.001;
  var whyThr = fromOther
    ? "The threshold is <b>" + two(d.thr) + "</b>, taken from the "
      + esc(d.challenger.pos) + " side of this comparison — the noisier of the two "
      + "positions decides how big a gap has to be before it means anything."
    : (d.thr <= CLOSE_FLOOR + 0.001 && d.sigma && d.sigma.sigma != null
       && d.sigma.sigma / 2 < CLOSE_FLOOR)
      ? "Half of it is " + two(d.sigma.sigma / 2) + ", under the "
        + two(CLOSE_FLOOR) + "-point floor — so the floor is the threshold."
      : d.sigma && d.sigma.sigma != null && d.thr >= CLOSE_CAP - 0.001
        ? "Half of it is " + two(d.sigma.sigma / 2) + ", over the "
          + two(CLOSE_CAP) + "-point cap — so the cap is the threshold."
        : "The threshold is <b>" + two(d.thr) + "</b>.";

  if(d.sigma && d.sigma.sigma != null){
    h += dRow("&sigma;", "<b>" + two(d.sigma.sigma) + "</b> across the top "
      + d.sigma.n + " at " + esc(d.pos) + ", measured from " + d.sigma.seen
      + " projected players and re-scored at your rules, never the vendor&rsquo;s. "
      + whyThr);
  } else {
    h += dRow("&sigma;", "<b>not measured at " + esc(d.pos || "this position") + ".</b> "
      + (d.pos === "K" || d.pos === "DEF"
         ? "There is no meaningful league-wide field for a "
           + (d.pos === "K" ? "kicker" : "defense") + ", so this position always uses "
           + "the " + two(CLOSE_FLOOR) + "-point floor. "
         : "The league-wide field could not be reached this load. ")
      + whyThr);
  }
  /* THE TILT, AND WHERE IT CANNOT REACH. Both matter: a row that was nudged
     has to say by how much, and a row that could not be has to say why, or
     Chris is left to assume an opportunity signal that does not exist for that
     position. */
  if(d.usage != null && d.tilt != null){
    h += dRow("Usage", "<b>" + (Math.round(d.usage * 10) / 10) + "</b>/100 opportunity — target, red-zone "
      + "and snap share, scored for this league. 50 is neutral, so this moves the "
      + "projection " + (d.tilt >= 0 ? "+" : "") + two(d.tilt) + " pts, from "
      + one(d.raw) + " to <b>" + one(d.pts) + "</b>. Bounded at &plusmn;8% — it can "
      + "tip a close call and can never take one over.");
  } else if(d.pos && !TILT_POS[d.pos]) {
    h += dRow("Usage", "<b>none for " + esc(d.pos) + ".</b> The usage board covers "
      + "running backs, receivers and tight ends only — " + (USAGE_META.rows || 0)
      + " players — so this position ranks on the projection alone.");
  } else if(d.pos) {
    h += dRow("Usage", "<b>not on the usage board.</b> " + esc(d.name || "He")
      + " ranks on the projection alone.");
  }

  h += '</div>';

  /* ---- 4. anything the clock already took off the table ---- */
  if(d.suppressed || d.locked){
    h += '<div class="dsec">The clock</div><div class="dgrid">';
    if(d.locked){
      h += dRow("Locked", esc(d.name) + " kicked off " + esc(d.lockedWhen || "already")
        + " — this slot is settled whatever the numbers say.");
    }
    if(d.suppressed){
      h += dRow("Too late", "<b>" + esc(d.suppressed.inName) + "</b> for "
        + esc(d.suppressed.name) + " would have been the move, but "
        + esc(d.suppressed.name) + " kicked off " + esc(d.suppressed.when) + ".");
    }
    h += '</div>';
  }

  return h + '</div>';
}

/* Alerts: only things that need a decision. An empty list renders nothing at
   all rather than a reassuring green box — silence is the signal that the
   lineup is fine, which is the whole "stay quiet unless it matters" stance. */
function alertList(){
  var out = [];
  var st = ROSTER.starters || [];
  LG.lineup.forEach(function(slot, i){
    var sid = String(st[i] || "0");
    if(sid === "0"){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(slot) + " is empty</b> — no player set in Sleeper"});
      return;
    }
    var f = facts(sid);
    if(onBye(f.team, WEEK)){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> is on bye (" + esc(f.team) + ") but is in your " + esc(slot)});
    } else if(f.status === "Out" || f.status === "IR"){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> is " + esc(f.status) + " and is in your " + esc(slot)});
    } else if(f.status === "Doubtful"){
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> is Doubtful in your " + esc(slot)});
    } else if(f.status === "Questionable"){
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> is Questionable in your " + esc(slot)});
    } else if(f.stale || !f.team){
      // A starter the page could not verify is worth saying out loud. Silence
      // here reads as "all clear", and the one row we know nothing about is the
      // last row that should be silently reassuring.
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> in your " + esc(slot)
        + " could not be confirmed with Sleeper — check him yourself"});
    } else if(!gameFor(f.team, WEEK)){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> (" + esc(f.team)
        + ") has no game in week " + WEEK + " but is in your " + esc(slot)});
    }
  });
  return out;
}

/* =====================================================================
   THE DECISION BAND
   ---------------------------------------------------------------------
   QUIET STATE IS THE FEATURE. A band that speaks every week is a band Chris
   scrolls past, and then the week it matters he scrolls past that too. When
   nothing fires this renders ONE line plus the threshold it used and any
   count it could not confirm — never a reassuring green summary of nine
   healthy slots.

   IT SUPERSEDES THE SESSION-A ALERTS PANEL ON THE LIVE WEEK, deliberately.
   The band says everything alertList() said and shows the arithmetic behind
   it; rendering both would tell Chris about the same bye twice, in two
   different voices, eleven inches apart. Off the live week the band is gated
   and alertList() is still the only thing watching, so it stays.
   ===================================================================== */

var BAND = null;        // computed once per render, consumed by bandHTML()
var BAND_MORE = false;  // "+N more" disclosure

function one(n){ return (Math.round(n * 10) / 10).toFixed(1); }
/* THRESHOLDS PRINT TO TWO DECIMALS. Points are a one-decimal quantity and stay
   that way, but a threshold of 1.29 shown as "1.3" beside a gap of 1.29 reads
   as a tie the page then calls settled. The number Chris checks the rule
   against has to be the number the rule used. */
function two(n){ return (Math.round(n * 100) / 100).toFixed(2); }
function signed(n){ var v = Math.round(n * 10) / 10; return (v > 0 ? "+" : "") + v.toFixed(1); }

/* The rule that fired, in words, on the page. Not a tooltip and not a
   console log — if Chris cannot see why a slot was flagged he has to trust
   it, and trust is the one thing a lineup tool has to earn every week. */
function ruleFor(gap, thr){
  return "gap " + one(gap) + " vs threshold " + two(thr)
       + " — " + (gap < thr ? "under it, so this is close" : "over it, so this is clear");
}
/* THE FOOTER PRINTS THE THRESHOLDS ACTUALLY IN USE, one per position, because
   they are no longer one number and a single figure would now be a lie about
   three of the four. The rule that produced them is printed with them: a flag
   Chris cannot check is a flag he has to take on faith. */
/* Provenance on every JJ line: which show, when, and how emphatic. An opinion
   with no date is indistinguishable from an opinion from August. */
function jjRule(t, why){
  var age = jjAgeDays();
  return (t.sp || "Late Round") + " · " + (t.s || "podcast") + " · " + (t.d || "?")
       + " · conviction " + (t.c == null ? "?" : t.c) + " of 3 — " + why
       + (age != null && age > JJ_STALE_DAYS
          ? " · the corpus is " + age + " days old, so this may already be stale" : "");
}

function thresholdNote(b){
  var st = b ? b.sigmaState : "pending";
  if(st === "fallback" || !b || !b.sigmas){
    return "Threshold " + two(CLOSE_FLOOR) + " pts everywhere — the league-wide "
         + "field could not be reached this load, so this falls back to the floor "
         + "and errs toward speaking up.";
  }
  var parts = [];
  SIGMA_POS.forEach(function(pos){
    var rec = b.sigmas[pos];
    if(!rec || rec.sigma == null) return;
    parts.push(pos + " " + two(b.thrOf(pos)));
  });
  var note = "Threshold = half a standard deviation, floored at " + two(CLOSE_FLOOR)
           + " and capped at " + two(CLOSE_CAP) + ". "
           + (parts.length ? "In use: " + parts.join(" · ") + "." : "");
  if(st === "cached") note += " Field cached this session.";
  if(st === "partial" && b.sigmaMissing && b.sigmaMissing.length){
    note += " " + b.sigmaMissing.join(", ")
          + (b.sigmaMissing.length === 1 ? " could not be measured and uses"
                                         : " could not be measured and use")
          + " the floor.";
  }
  note += " Kickers and defenses always use the floor — there is no meaningful "
        + "league-wide field for them.";
  return note;
}

function computeBand(){
  if(!ROSTER) return null;
  /* WEEK GATING. Ranking this week's lineup against the starters[] Chris set
     for week 1 while he is looking at week 9 produces confident nonsense —
     the array is positional and has no idea which week it belongs to. */
  if(NOW_WEEK && WEEK !== NOW_WEEK) return {gated:true, week:WEEK, now:NOW_WEEK};
  if(PROJ_STATE === "pending") return {pending:true};

  var st = [];
  (ROSTER.starters || []).forEach(function(s, i){ st[i] = (s == null ? null : String(s)); });

  var players = buildPlayers(WEEK);
  var byId = {}; players.forEach(function(p){ byId[p.sid] = p; });
  /* THE THRESHOLD IS PER POSITION NOW (Phase C). It used to be one number for
     the whole band; measured, the positions are nothing like each other —
     Joop reads QB 1.00, TE 1.09, WR 1.31, RB 1.70 — and a single figure was
     simultaneously too twitchy for running backs and exactly right for
     quarterbacks.

     A comparison that spans two positions takes the LARGER of the two, because
     the noisier side decides how big a gap has to be before it means anything.
     See thresholdBetween() in the engine for the argument. */
  var thrOpts = {floor: CLOSE_FLOOR, cap: CLOSE_CAP};
  var thrPair = function(a, b){ return RankEngine.thresholdBetween(a, b, SIGMA, thrOpts); };
  var thrPos  = function(pos){ return RankEngine.thresholdFor(pos, SIGMA, thrOpts); };

  /* LOCK AWARENESS. A starter whose game has kicked off is a fact, not a
     candidate, so he is pinned; a bench player whose game has kicked off can
     no longer be moved in, so he is excluded. Seattle kicks off Wednesday
     09-09 while the rest of both lineups stay open until Sunday — the DEF
     slot locks four days before anything else, and a band that offered a
     defense swap on Saturday would be offering something Sleeper will refuse. */
  var pinned = {}, exclude = {}, inLineup = {};
  st.forEach(function(sid){ if(sid && sid !== "0") inLineup[sid] = 1; });
  LG.lineup.forEach(function(slot, i){
    var sid = st[i];
    if(!sid || sid === "0") return;
    var p = byId[sid];
    if(p && p.locked) pinned[i] = sid;
  });
  players.forEach(function(p){ if(p.locked && !inLineup[p.sid]) exclude[p.sid] = 1; });

  var opt = RankEngine.assignLineup(ECFG, players, {pinned: pinned, exclude: exclude});
  var delta = RankEngine.lineupDelta(ECFG, players, st, opt);

  /* A MOVE IS SOMEONE ENTERING OR LEAVING THE LINEUP — never a permutation
     inside it.

     lineupDelta() reports every slot whose occupant changed, which is the
     right primitive and the wrong unit for a human. Measured against one
     bench receiver worth 20: the optimiser produced FOUR slot changes —
     Wilson into WR1, Jefferson down to WR2, London to the first FLEX,
     Montgomery to the second — for a single decision worth +7.0. Three of
     those four are Sleeper shuffling equivalent players between
     interchangeable slots; none is a choice Chris makes, and a band that
     lists them has buried its one real sentence under three fake ones.

     So diff the SETS. Whoever is in the optimal lineup and not the actual one
     is coming in; whoever is in the actual and not the optimal is going out;
     everything else is noise the page never mentions. This is the same
     reasoning that made close a total-lineup delta rather than nine pairwise
     claims — applied one level further out. */
  var wasSet = {}, nowSet = {};
  st.forEach(function(sid){ if(sid && sid !== "0") wasSet[sid] = 1; });
  for(var ai in opt.assign){ nowSet[String(opt.assign[ai])] = 1; }

  var movesOf = function(assign){
    var inSet = {};
    for(var k in assign){ inSet[String(assign[k])] = 1; }
    var coming = [], going = [];
    for(var a in inSet){ if(!wasSet[a]) coming.push(a); }
    for(var b in wasSet){ if(!inSet[b]) going.push(b); }
    var pts = function(s){ var p = byId[s]; return (p && p.pts != null) ? p.pts : 0; };
    coming.sort(function(x, y){ return pts(y) - pts(x); });
    going.sort(function(x, y){ return pts(x) - pts(y); });
    return coming.map(function(sid, k){
      var outSid = going[k] || null;
      /* Attribute the move to the slot the OUTGOING player was in, because
         that is the slot Chris is looking at. */
      var at = outSid ? st.indexOf(outSid) : -1;
      if(at < 0){ for(var s2 in assign){ if(String(assign[s2]) === sid){ at = Number(s2); break; } } }
      return {"in": sid, out: outSid, i: at,
              slot: at >= 0 ? LG.lineup[at] : null,
              gain: Math.round((pts(sid) - (outSid ? pts(outSid) : 0)) * 100) / 100};
    });
  };

  var moves = movesOf(opt.assign);
  var moveByOutSlot = {};
  moves.forEach(function(m){ if(m.i >= 0) moveByOutSlot[m.i] = m; });

  /* What the lock actually cost: the same solve with nothing pinned or
     excluded, diffed against the real one. The suppressed moves are never
     offered as actions — they are unreachable — but the COUNT belongs in the
     quiet line, because "nothing to change" and "one thing to change that you
     no longer can" are different sentences. */
  var freeOpt = RankEngine.assignLineup(ECFG, players, {});
  var taken = {}; moves.forEach(function(m){ taken[m["in"]] = 1; });
  var suppressed = [];
  movesOf(freeOpt.assign).forEach(function(m){
    if(taken[m["in"]]) return;              // this move is available, not lost
    var outgoing = m.out ? byId[m.out] : null;
    var incoming = byId[m["in"]];
    /* Only a LOCK can suppress a move. Anything else that differs between the
       two solves is the permutation noise filtered out above, and reporting it
       as "too late" would invent a loss that never existed. */
    var blocker = (outgoing && outgoing.locked) ? outgoing
                : ((incoming && incoming.locked) ? incoming : null);
    if(!blocker) return;
    suppressed.push({slot: m.slot, i: m.i, name: blocker.name,
                     inName: incoming ? incoming.name : m["in"],
                     when: kickLabel(blocker.game) || "already started"});
  });

  var hs = RankEngine.holes(ECFG, players);
  var holeBy = {}; hs.forEach(function(h){ holeBy[h.i] = h; });

  /* Unconfirmed players: every one of them marks its own ROW. Only the ones
     that could actually change a slot reach the band. */
  var unconfirmed = [];
  UNRESOLVED.forEach(function(s){ if(unconfirmed.indexOf(s) < 0) unconfirmed.push(s); });
  PROJ_MISSING.forEach(function(s){ if(unconfirmed.indexOf(s) < 0) unconfirmed.push(s); });
  var unrank = RankEngine.unrankableSlots(ECFG, players, unconfirmed, thrPair, st);

  /* ITEM ORDER, worst-first and deliberately not by severity alone:
       0  a hole — no legal lineup exists and only a waiver add fixes it
       1  a hard flag — empty slot, Out, bye, Doubtful
       2  a clear upgrade
       3  a close call
       4  a slot a failed fetch genuinely put in doubt
       5  a body with no projection — start him anyway
     A hole outranks a bye because it is strictly worse: the bye tells Chris to
     move someone, the hole tells him there is nobody to move. Only the first
     three items show without tapping, so this order decides what he sees. */
  /* Slot indexes the "too late to make" footer line already covers. */
  var suppressedAt = {};
  suppressed.forEach(function(x){ if(x.i != null && x.i >= 0) suppressedAt[x.i] = 1; });

  var items = [];
  /* Slots the clock has already closed, but which carry a flag worth stating.
     Rendered in the footer — see the lock note in the slot loop below. */
  var lockedFlagged = [];
  var add = function(rank, crit, line, rule){
    items.push({rank: rank, crit: !!crit, line: line, rule: rule || null});
  };

  LG.lineup.forEach(function(slot, i){
    var label = slot === "SUPER_FLEX" ? "SFLX" : slot;
    var sid = st[i];
    var swap = moveByOutSlot[i];

    /* A slot with a no-body hole is handled ONCE, by the hole item below.
       Without this, week 11 said "SEA DEF is on bye" and "No DEF available"
       as two separate lines — the same problem, twice, in two voices, and
       neither of them mentioning the other. The hole item is the one that
       tells Chris what to actually do. */
    if(holeBy[i] && holeBy[i].reason === "no-body") return;

    if(!sid || sid === "0"){
      var fill = swap && swap["in"] ? byId[String(swap["in"])] : null;
      add(1, true, "<b>" + esc(label) + " is empty</b> — nothing set in Sleeper"
        + (fill ? ". Best available: " + esc(fill.name) + " (" + one(fill.pts) + ")" : ""),
        "an unset slot scores zero, whatever else the lineup does");
      return;
    }

    var p = byId[sid];
    if(!p) return;

    /* A LOCKED SLOT CANNOT CHANGE, SO THE BAND MUST NOT ASK CHRIS TO CHANGE IT.
       (Fixed 2026-09-08, Reviewer-Auditor D1. This was live.)

       The hard-flag items below — Out, Doubtful, bye — fired identically
       whether or not the incumbent's game had already kicked off, so a
       Thursday-night starter ruled Out on Friday produced "start Y instead" on
       Saturday, for a move Sleeper will refuse. The panel, in the same render,
       said "Locked — this slot is settled whatever the numbers say". The page
       contradicted itself about one slot, and the actionable-looking half was
       the wrong one. Reachable every week: Seattle's defense locks Wednesday
       and any Thursday starter locks three days before the rest of the lineup.

       The information is not dropped — that would be the other standing
       failure, computing a flag and not rendering it. It moves to the footer,
       phrased as what it is: a fact about a slot that is already closed.

       AND IT DEFERS TO `suppressed`, WHICH OFTEN ALREADY HAS THE SLOT. The
       first version of this claimed the two sets were disjoint, on the grounds
       that a pinned starter is never offered up. He is: Out is a hard exclude,
       so the free solve drops him whatever his projection, and every locked-Out
       case landed in both lists — printing one slot twice, in two voices, which
       is the exact failure the bye/hole merge was built to end. `suppressed`
       is the better line of the two because it names the move that was lost, so
       it wins and this one stays quiet.

       ONLY Out and Doubtful reach here. A player on bye has no game, and
       `buildPlayers` derives `locked` from the game, so bye and locked cannot
       both be true — checked across all 18 weeks of both leagues. Testing for
       it would be an unreachable branch and a comment that lies to the next
       reader. */
    if(p.locked){
      if((HARD_OUT[p.status] || p.status === "Doubtful") && !suppressedAt[i]){
        lockedFlagged.push({
          slot: label, name: p.name, why: p.status,
          when: kickLabel(p.game) || "already"
        });
      }
      return;
    }

    var repl = swap && swap["in"] ? byId[String(swap["in"])] : null;

    if(p.bye){
      add(1, true, "<b>" + esc(p.name) + "</b> is on bye (" + esc(p.team || "?")
        + ") in your " + esc(label)
        + (repl ? " — start <b>" + esc(repl.name) + "</b> instead (" + one(repl.pts) + ")" : ""),
        "a bye is a certainty, not a projection");
      return;
    }
    if(HARD_OUT[p.status]){
      add(1, true, "<b>" + esc(p.name) + "</b> is " + esc(p.status) + " in your " + esc(label)
        + (repl ? " — start <b>" + esc(repl.name) + "</b> instead (" + one(repl.pts) + ")" : ""),
        "Out and IR are hard flags: they fire whatever the gap is");
      return;
    }
    if(p.status === "Doubtful"){
      /* Doubtful is a hard flag but NOT an automatic bench — costing the
         alternative is more use than pretending to know he will sit. */
      var ex2 = {}; for(var k in exclude) ex2[k] = 1; ex2[p.sid] = 1;
      var pin2 = {};
      for(var k2 in pinned){ if(String(pinned[k2]) !== p.sid) pin2[k2] = pinned[k2]; }
      var alt = RankEngine.assignLineup(ECFG, players, {pinned: pin2, exclude: ex2});
      var cost = Math.round((opt.total - alt.total) * 100) / 100;
      var taker = alt.assign[i] != null ? byId[String(alt.assign[i])] : null;
      add(1, true, "<b>" + esc(p.name) + "</b> is Doubtful in your " + esc(label)
        + (taker ? " — if he sits, <b>" + esc(taker.name) + "</b> takes it" : " — and nobody else is eligible"),
        taker ? "costs " + one(cost) + " pts to bench him now; Doubtful is a hard flag, so decide it deliberately"
              : "no eligible replacement exists, so this slot is his either way");
      return;
    }

    if(swap && swap.gain > 0 && repl){
      var thr = thrPair(p.pos, repl.pos);
      if(swap.gain >= thr){
        add(2, false, "<b>" + esc(label) + ":</b> start <b>" + esc(repl.name) + "</b> ("
          + one(repl.pts) + ") over " + esc(p.name) + " (" + one(p.pts) + ")",
          ruleFor(swap.gain, thr)
          + (p.status === "Questionable" ? " · and " + esc(p.name) + " is Questionable" : ""));
      } else {
        /* Questionable is never a flag on its own — here it is the tiebreak
           that tips an already-close slot toward the HEALTHY player, and it
           has to work in BOTH directions. The first version only looked at the
           incumbent, so a Questionable challenger read as a reason to bench a
           healthy starter, which is precisely backwards. It breaks the tie
           only when exactly one of the two is Questionable; if both are, it
           says nothing, because it distinguishes nothing. */
        var qOut = (p.status === "Questionable");
        var qIn = (repl.status === "Questionable");
        var tie = "";
        if(qOut && !qIn){
          tie = " — and " + esc(p.name) + " is Questionable, which breaks the tie toward "
              + esc(repl.name);
        } else if(qIn && !qOut){
          tie = " — and " + esc(repl.name) + " is Questionable, which breaks the tie toward "
              + esc(p.name) + ", who you already have in";
        }
        add(3, false, "<b>" + esc(label) + ":</b> " + esc(repl.name) + " (" + one(repl.pts)
          + ") and " + esc(p.name) + " (" + one(p.pts) + ") are too close to call" + tie,
          ruleFor(swap.gain, thr));
      }
    }
    /* THE COIN FLIP (Phase B2). Everything above needs a beneficial swap to
       exist — gain > 0 — so a slot the incumbent wins by 0.4 says nothing,
       while the same 0.4 the other way is called too close to call. Found on
       the live week-1 board: Garrett Wilson 13.5 on the bench, David
       Montgomery 13.9 in the FLEX, 0.4 apart under a 1.0 threshold, and the
       band silent.

       Silence is still right MOST of the time — there is no action, and a
       band that narrates every near-tie is one Chris stops reading. It is
       wrong in exactly one shape: the incumbent is Questionable and the
       challenger is healthy. Then the coin flip has a tiebreak, and the
       decision is real even though the arithmetic says the gap is noise.

       So this fires only there, ranks below everything actionable, and is
       marked as a note rather than an instruction. On Chris's live 2026-09-08
       values it fires on ZERO slots in either league — Montgomery is healthy,
       and every Questionable starter's nearest healthy challenger is more than
       a point behind. That is the quiet default working, not a dead feature. */
    if(!(swap && swap.gain > 0 && repl) && p.status === "Questionable" && p.pts != null){
      var ch = RankEngine.nearestChallenger(ECFG, players, slot, inLineup, {exclude: exclude});
      /* ⚠️ THE THRESHOLD IS RESOLVED INSIDE THE GUARD, and that is not style.
         nearestChallenger returns null whenever no eligible bench body exists
         for a slot, which is the ORDINARY case for a kicker and for any lineup
         with no spare quarterback — FOUR live slots across the two rosters
         today: Herbert at QB and Dicker at K in Ball Knowers, McBride at TE and
         Shrader at K in Joop. (Not the defenses, though the crash looked like
         it should reach them: facts() hardcodes status:null for a DEF, so a
         defense can never be Questionable and never enters this branch. The
         guard covers them anyway; the count does not pretend to.) Reading
         ch.pos before the null check threw a TypeError out of computeBand,
         through render(), into sync's catch, which sets a red status and does
         NOT re-render because ROSTER is truthy. A Friday Questionable on Justin
         Herbert would have left Chris looking at a dead page. */
      var chHealthy = ch && !ch.status;
      if(chHealthy && Math.abs(p.pts - ch.pts) < thrPair(p.pos, ch.pos)){
        var thr = thrPair(p.pos, ch.pos);
        var chP = byId[ch.sid];
        add(6, false, "<b>" + esc(label) + " is a coin flip:</b> " + esc(p.name) + " ("
          + one(p.pts) + ", Questionable) and " + esc(chP ? chP.name : ch.sid) + " ("
          + one(ch.pts) + ", healthy) are inside the threshold",
          "gap " + one(Math.abs(p.pts - ch.pts)) + " vs threshold " + two(thr)
          + " — no move is worth making on the numbers, but only one of them is healthy. "
          + "Nothing to do unless he is ruled out.");
      }
    }
    /* Not close and not behind, and both healthy: Questionable alone stays
       quiet by design. It is a pill on the row and nothing more. */
  });

  /* PER-SLOT DETAIL FOR THE TAP-THROUGH PANEL.
     Built HERE, from the same numbers the band itself used, and never
     recomputed in the renderer. Two copies of this arithmetic would be two
     chances to disagree, and the panel's whole purpose is to show the working
     behind what the band just said. */
  var detail = {};
  LG.lineup.forEach(function(slot, i){
    var sid = st[i] && st[i] !== "0" ? st[i] : null;
    var p = sid ? byId[sid] : null;
    var swap = moveByOutSlot[i];
    var repl = swap && swap["in"] ? byId[String(swap["in"])] : null;

    /* The challenger shown is the one the SET DIFF actually named, when it
       named one. Only when no move exists do we fall back to "nearest on the
       bench", which is a description of the field, not a recommendation. */
    var ch = null;
    if(repl){
      ch = {name: repl.name, pos: repl.pos, pts: repl.pts,
            status: repl.status || null, proposed: true};
    } else {
      var nc = RankEngine.nearestChallenger(ECFG, players, slot, inLineup, {exclude: exclude});
      if(nc){
        var ncP = byId[nc.sid];
        ch = {name: ncP ? ncP.name : nc.sid, pos: nc.pos, pts: nc.pts,
              status: nc.status, proposed: false};
      }
    }

    detail[i] = {
      slot: slot, i: i, sid: sid,
      name: p ? p.name : null,
      pos: p ? p.pos : null,
      /* The tilt, carried through so the panel can show the arithmetic rather
         than recompute it — two copies of this would be two chances to print a
         number the ranking did not use. */
      raw: p ? p.raw : null,
      usage: p ? p.usage : null,
      tilt: p ? p.tilt : null,
      pts: p ? p.pts : null,
      vendor: (p && p.score) ? p.score.vendor : null,
      floor: !!(p && p.score && p.score.floor),
      src: (p && p.score) ? p.score.src : null,
      fresh: (p && p.score) ? RankEngine.freshness({stats: 1}, WEEK, NOW_WEEK) : null,
      status: p ? p.status : null,
      challenger: ch,
      gap: (p && p.pts != null && ch && ch.pts != null)
             ? Math.round((p.pts - ch.pts) * 100) / 100 : null,
      thr: thrPair(p ? p.pos : null, ch ? ch.pos : null),
      sigma: p ? (SIGMA && SIGMA[p.pos] ? SIGMA[p.pos] : null) : null,
      pool: p ? RankEngine.startablePool(p.pos, ECFG) : null,
      hole: holeBy[i] || null,
      locked: !!(p && p.locked),
      lockedWhen: (p && p.locked) ? kickLabel(p.game) : null,
      suppressed: null
    };
  });
  suppressed.forEach(function(s){
    if(s.i != null && s.i >= 0 && detail[s.i]) detail[s.i].suppressed = s;
  });

  /* THE JJ PASS. Runs after the slot loop so it can see what the ranking
     already said, and emits at rank 7 — below every number, including the coin
     flip. It is colour, never an instruction. */
  /* JJ ITEMS ARE NOT BAND ITEMS, and this separation is load-bearing.

     Measured on the real corpus against the real rosters: Joop draws FIVE JJ
     lines in a week where the numbers have nothing to say — three fades on
     starters, two buys on the bench. Folded into `items`, that turns "Lineup
     checked, nothing to change" into a five-item band with a coloured border,
     every week, forever. The quiet state is the feature; an opinion layer that
     abolishes it has broken the thing it was added to enrich.

     So they render in their own block, under the band, with their own count.
     The band stays a report about DECISIONS, and silence there still means
     what it has always meant: checked, and fine. */
  var jjItems = [];
  var jjAdd = function(line, rule){ jjItems.push({line: line, rule: rule}); };
  var jjSeen = {};
  LG.lineup.forEach(function(slot, i){
    var label = slot === "SUPER_FLEX" ? "SFLX" : slot;
    var sid = st[i];
    if(!sid || sid === "0") return;
    var p = byId[sid];
    /* A locked slot cannot change, so an opinion about it is not a decision —
       the same rule the hard flags follow. */
    if(!p || p.locked) return;

    var onStarter = JJ[sid];
    if(onStarter && onStarter.l === "FADE" && !jjSeen[sid]){
      jjSeen[sid] = 1;
      jjAdd("<b>JJ fades " + esc(p.name) + "</b>, who is in your "
        + esc(label) + " — &ldquo;" + esc(onStarter.t) + "&rdquo;",
        jjRule(onStarter, "the numbers have him starting; this is the show disagreeing, "
                        + "not a projection"));
    }

    var ch = RankEngine.nearestChallenger(ECFG, players, slot, inLineup, {exclude: exclude});
    var onBench = ch ? JJ[ch.sid] : null;
    if(onBench && onBench.l === "BUY" && !jjSeen[ch.sid]){
      jjSeen[ch.sid] = 1;
      var chP = byId[ch.sid];
      jjAdd("<b>JJ buys " + esc(chP ? chP.name : ch.sid)
        + "</b>, who is on your bench and nearest to your " + esc(label)
        + " — &ldquo;" + esc(onBench.t) + "&rdquo;",
        jjRule(onBench, "the numbers have him benched; this is the show disagreeing, "
                      + "not a projection"));
    }
  });

  hs.forEach(function(h){
    var label = h.slot === "SUPER_FLEX" ? "SFLX" : h.slot;
    if(h.reason === "no-body"){
      /* Name the man who WAS in the slot, so the item reads as one story
         rather than an abstract complaint about a position. */
      var was = st[h.i] && st[h.i] !== "0" ? byId[st[h.i]] : null;
      var why = was ? (was.bye ? esc(was.name) + " is on bye and "
                               : esc(was.name) + " is " + esc(was.status || "unavailable") + " and ") : "";
      add(0, true, "<b>No " + esc(label) + " available</b> — " + why
        + "nobody else on the roster can fill it",
        "only a waiver add fixes this; no move between your own players will");
    } else {
      add(5, false, "<b>" + esc(label) + " cannot be projected</b> — you have a body, "
        + "the feed has no numbers for him",
        "start him anyway; this is missing data, not a missing player");
    }
  });

  unrank.forEach(function(u){
    var label = u.slot === "SUPER_FLEX" ? "SFLX" : u.slot;
    var p = byId[u.sid];
    add(4, false, "<b>" + esc(label) + " could not be ranked</b> — "
      + esc(p ? p.name : u.sid) + " did not come back from Sleeper",
      "his last known " + one(u.pts) + " is within " + one(u.threshold) + " of the slot, "
      + "so it could change the answer");
  });

  items.sort(function(a, b){ return a.rank - b.rank; });

  return {
    items: items, jj: jjItems, delta: delta, suppressed: suppressed,
    sigmas: SIGMA, sigmaState: SIGMA_STATE, sigmaMissing: SIGMA_MISSING.slice(),
    thrOf: thrPos,
    unconfirmed: unconfirmed, projState: PROJ_STATE, detail: detail,
    lockedFlagged: lockedFlagged,
    crit: items.some(function(i){ return i.crit; })
  };
}

function bandHTML(){
  var b = BAND;
  if(!b) return "";

  if(b.gated){
    return '<div class="band"><div class="bhead"><h3>Decisions</h3></div>'
      + '<div class="bquiet">Decisions are live-week only. You are on week ' + b.week
      + '; the NFL is on week ' + b.now + ', and the lineup below is the one you set '
      + 'for week ' + b.now + ' — ranking it against week ' + b.week
      + ' would be comparing two different questions.</div></div>';
  }
  if(b.pending){
    return '<div class="band"><div class="bhead"><h3>Decisions</h3></div>'
      + '<div class="bpend">Ranking your lineup&hellip;</div></div>';
  }

  var foot = [];
  if(b.suppressed.length){
    foot.push(b.suppressed.length + ' change' + (b.suppressed.length === 1 ? '' : 's')
      + ' too late to make — ' + b.suppressed.map(function(s){
          return esc(s.inName) + ' for ' + esc(s.name) + ', but '
               + esc(s.name) + ' kicked off ' + esc(s.when);
        }).join('; '));
  }
  if(b.lockedFlagged && b.lockedFlagged.length){
    foot.push(b.lockedFlagged.map(function(l){
      return esc(l.slot) + ' is closed &mdash; ' + esc(l.name) + ' is '
           + esc(l.why) + ', but his game kicked off ' + esc(l.when)
           + ', so there is nothing left to decide there.';
    }).join('<br>'));
  }
  /* THE USAGE BOARD GOES STALE SILENTLY. It is refreshed BY HAND, outside this
     build, and it feeds the ranking — so an old board is a wrong ranking, not
     just an old number. season.py stamps its date for exactly this line; the
     first version of this feature stamped it and then never read it, which is
     the same defect as computing a flag and not rendering it. */
  var uAge = usageAgeDays();
  if(uAge != null && uAge > USAGE_STALE_DAYS){
    foot.push('The usage board is ' + uAge + ' days old (' + esc(USAGE_META.boardMtime)
      + ') and it feeds the ranking, not just the display. Ask Claude to refresh it.');
  }
  var jjAge = jjAgeDays();
  if(jjAge != null && jjAge > JJ_STALE_DAYS){
    foot.push('The podcast corpus is ' + jjAge + ' days old (newest episode '
      + esc(JJ_META.newest) + ') — the opinion layer may be behind the show. '
      + 'Ask Claude to run an episode ingest.');
  }
  if(b.unconfirmed.length){
    foot.push(b.unconfirmed.length + ' player' + (b.unconfirmed.length === 1 ? '' : 's')
      + ' could not be confirmed with Sleeper');
  }
  if(b.projState === "fallback"){
    foot.push('Projections came from the baked snapshot, not live — the numbers may be stale.');
  } else if(b.projState === "partial"){
    foot.push('Some projections came from the baked snapshot.');
  }

  if(!b.items.length){
    /* THE QUIET LINE. One sentence, the threshold it used, and anything it
       could not confirm. Silence must only ever mean "checked and fine" — and
       it still does, because the opinion block below is not a decision and
       does not disturb it. */
    return '<div class="band quiet"><div class="bhead"><h3>Decisions</h3></div>'
      + '<div class="bquiet"><b>Lineup checked, nothing to change.</b></div>'
      + '<div class="bfoot">' + esc(thresholdNote(b))
      + (foot.length ? '<br>' + foot.join('<br>') : '') + '</div></div>'
      + jjHTML(b);
  }

  var shown = BAND_MORE ? b.items : b.items.slice(0, 3);
  var hidden = b.items.length - shown.length;

  var h = '<div class="band ' + (b.crit ? 'crit' : 'act') + '">'
    + '<div class="bhead"><h3>Decisions · ' + b.items.length + '</h3>'
    + (b.delta.delta > 0
        ? '<span class="bdelta">' + signed(b.delta.delta) + ' pts</span>' : '')
    + '</div><ul class="bitems">';

  shown.forEach(function(it){
    h += '<li class="bitem' + (it.crit ? ' hard' : '') + '">'
       + '<div class="bl">' + it.line + '</div>'
       + (it.rule ? '<div class="brule">' + esc(it.rule) + '</div>' : '')
       + '</li>';
  });
  h += '</ul>';

  if(hidden > 0){
    h += '<button class="bmore" onclick="toggleMore()" style="margin:0 12px">+'
       + hidden + ' more</button>';
  } else if(BAND_MORE && b.items.length > 3){
    h += '<button class="bmore" onclick="toggleMore()" style="margin:0 12px">show fewer</button>';
  }

  h += '<div class="bfoot">' + esc(thresholdNote(b))
     + (foot.length ? '<br>' + foot.join('<br>') : '') + '</div></div>';
  return h + jjHTML(b);
}

function toggleMore(){ BAND_MORE = !BAND_MORE; render(); }

/* THE OPINION BLOCK. Separate from the band, quieter than the band, and
   explicitly not a list of things to do. It carries its own disclosure because
   five fades in a week is normal and five lines of podcast quote is not what
   Chris opened the page for. */
var JJ_MORE = false;
function toggleJJ(){ JJ_MORE = !JJ_MORE; render(); }

function jjHTML(b){
  if(!b || !b.jj || !b.jj.length) return "";
  var shown = JJ_MORE ? b.jj : b.jj.slice(0, 2);
  var hidden = b.jj.length - shown.length;
  var h = '<div class="jjb"><div class="bhead"><h3>What JJ says &middot; '
        + b.jj.length + '</h3></div><ul class="bitems">';
  shown.forEach(function(it){
    h += '<li class="bitem"><div class="bl">' + it.line + '</div>'
       + '<div class="brule">' + esc(it.rule) + '</div></li>';
  });
  h += '</ul>';
  if(hidden > 0){
    h += '<button class="bmore" onclick="toggleJJ()" style="margin:0 12px">+'
       + hidden + ' more</button>';
  } else if(JJ_MORE && b.jj.length > 2){
    h += '<button class="bmore" onclick="toggleJJ()" style="margin:0 12px">show fewer</button>';
  }
  h += '<div class="bfoot">Opinion only — the Late Round podcast, conviction 2 or '
     + 'higher, newest take per player. It never moves a number and never '
     + 'reorders your lineup; it is here to show you where the show and the '
     + 'arithmetic disagree.</div></div>';
  return h;
}

/* =====================================================================
   THE LATER-THIS-SEASON ROLL-UP

   A four-week strip viewed in week 1 covers weeks 2-5 and shows none of the
   five weeks where no legal lineup exists — the earliest is Ball Knowers week
   7. So the strip is not enough on its own, and this scans every week left in
   the season instead.

   It answers ONE question: which weeks from here to the end have a slot with
   nobody in it. That is knowable in September, it is the most expensive thing
   on this page to discover late, and every row of it hands straight to the
   waiver tool.

   AVAILABILITY ONLY. Nothing here reads a projection, by construction:
   holes() reports a slot with no BODY separately from a slot it cannot score,
   and this consumes lookahead()'s `unfilled`, which is the no-body half. So
   the roll-up is correct before a single projection has arrived, and a dead
   projection fetch cannot invent a hole or hide one.
   ===================================================================== */
var ROLL = null;
var ROLL_OPEN = false;

/* The regular season is 18 weeks. Scanning to a CONSTANT rather than to the
   last week the bake happens to contain is what makes the "can't tell" state
   reachable: a truncated schedule pull then shows as weeks we cannot answer
   for, instead of silently shortening the season and reporting all-clear on
   the part it still has. */
var SEASON_WEEKS = 18;

/* A slot that is empty in this many or more of the scanned weeks is a STANDING
   ROSTER GAP, not a run of dated emergencies. The five real bye-week holes are
   one week each, so this never touches them — it exists for the shape that
   would otherwise fill the list with noise: a player Sleeper reports with no
   NFL team has no game in EVERY remaining week, so a cut kicker would print
   seventeen identical rows and bury the five that matter. One line, named
   cause, once. */
var STANDING_MIN = 4;

/* Who is eligible for this slot and why none of them can play. The reason is
   the actionable half — "LAC bye" is a date you can plan around, "no NFL team"
   is a roster problem that will not fix itself. */
function holeCause(slotName, players){
  var out = [];
  (players || []).forEach(function(p){
    if(!RankEngine.slotEligible(p.pos, slotName, ECFG)) return;
    out.push({
      name: p.name, team: p.team,
      cut: !!p.noTeam,
      why: p.noTeam ? "no NFL team"
         : p.bye ? ((p.team || "?") + " bye")
         : "no game"
    });
  });
  return out;
}

/* The slot CHIP keeps the league's own code (K, DEF, SFLX) because that is what
   Sleeper shows Chris. The PROSE spells it out, because "your only K" reads
   like a typo and "your only kicker" reads like a sentence. */
var SLOT_WORD = {
  QB:"quarterback", RB:"running back", WR:"receiver", TE:"tight end",
  K:"kicker", DEF:"defense", FLEX:"flex", SUPER_FLEX:"superflex"
};
function slotWord(slot){ return SLOT_WORD[slot] || slot; }
function slotChip(slot){ return slot === "SUPER_FLEX" ? "SFLX" : slot; }

function computeRollup(){
  if(NOW_WEEK == null) return {pending:true};
  if(!ROSTER.players || !ROSTER.players.length) return null;

  /* ONE source for the span. `from` is both the loop bound and the number the
     page prints — a mutation test caught them as two, where moving the scan
     silently left the label saying something else. */
  var from = NOW_WEEK + 1;
  var weeks = [], byWeek = {};
  for(var w = from; w <= SEASON_WEEKS; w++){
    var ps = buildPlayers(w);
    byWeek[w] = ps;
    weeks.push({week:w, players:ps, covered: !!S.schedule.weeks[String(w)]});
  }
  /* NOTHING LEFT TO SCAN IS NOT THE SAME AS NOTHING WRONG.
     (Fixed 2026-09-08, Reviewer-Auditor D2.) In week 18 `from` is 19 and the
     span is empty, and the quiet line rendered that literally: "Nothing
     unfillable between week 19 and week 18." weekFromSchedule() clamps at 18
     and never advances, so the page said it for the whole of week 18 and every
     day of the offseason after it. The strip already hides itself in this
     state; the roll-up now does too, because a section about the weeks ahead
     has nothing to say when there are none. */
  if(!weeks.length) return {done:true, exhausted:true, items:[], thin:[],
                            standing:[], unknown:[], weekCount:0,
                            from:from, last:SEASON_WEEKS};

  var scan = RankEngine.lookahead(ECFG, weeks);

  /* ONE source for what counts as a hole, too, for the same reason. Both the
     counting pass and the row pass below read THIS list — deriving the filter
     twice is how the no-projection bug got into `legal` in the first place, and
     a mutation that flipped only one of the two copies came back green. */
  var holeAt = {};
  scan.forEach(function(e){
    if(RankEngine.lookaheadState(e) !== "hole") return;
    holeAt[e.week] = e.unfilled;
  });

  /* Count first, then decide how to say it. A slot short in most of the
     remaining season is one fact; the same slot short in one week is another.
     Deciding per row would report the standing gap once per week. */
  var slotWeeks = {};
  scan.forEach(function(e){
    (holeAt[e.week] || []).forEach(function(hl){
      (slotWeeks[hl.slot] = slotWeeks[hl.slot] || []).push(e.week);
    });
  });

  var items = [], standing = [], thin = [], unknown = [], holeWeeks = {};
  var pw = (LG.playoffs && LG.playoffs.start_week) || null;

  for(var slot in slotWeeks){
    if(!Object.prototype.hasOwnProperty.call(slotWeeks, slot)) continue;
    if(slotWeeks[slot].length >= STANDING_MIN){
      var first = slotWeeks[slot][0];
      standing.push({
        slot: slot, weeks: slotWeeks[slot].slice(),
        from: first, count: slotWeeks[slot].length,
        cause: holeCause(slot, byWeek[first])
      });
    }
  }

  scan.forEach(function(e){
    var state = RankEngine.lookaheadState(e);
    if(state === "unknown"){ unknown.push(e.week); return; }
    if(state === "hole"){
      (holeAt[e.week] || []).forEach(function(hl){
        if(slotWeeks[hl.slot].length >= STANDING_MIN) return;   // said once, above
        holeWeeks[e.week] = 1;
        items.push({
          week: e.week, slot: hl.slot, i: hl.i,
          cause: holeCause(hl.slot, byWeek[e.week]),
          prePlayoff: pw ? (e.week === pw - 1) : false,
          inPlayoff:  pw ? (e.week >= pw) : false
        });
      });
    }
    e.thin.forEach(function(t){
      thin.push({week:e.week, slot:t.slot, pos:t.pos, supply:t.supply, demand:t.demand});
    });
  });

  items.sort(function(a,b){ return a.week - b.week || a.i - b.i; });
  thin.sort(function(a,b){
    if(a.week !== b.week) return a.week - b.week;
    return a.slot < b.slot ? -1 : a.slot > b.slot ? 1 : 0;
  });

  return {
    done: true, items: items, standing: standing, thin: thin, unknown: unknown,
    weekCount: Object.keys(holeWeeks).length,
    from: from, last: SEASON_WEEKS, playoffStart: pw,
    /* THE STRIP IS A WINDOW ONTO THIS SAME SCAN, not a second one. Running
       lookahead() twice over overlapping spans is how the strip and the
       roll-up would come to disagree about a week — which is the exact failure
       lookaheadState() was extracted to prevent, so re-introducing it here
       would be undoing the fix one function later. */
    scan: scan, byWeek: byWeek
  };
}

function causeText(cause){
  if(!cause || !cause.length) return "nobody on your roster plays this slot";
  return cause.map(function(c){
    return '<span' + (c.cut ? ' class="cut"' : '') + '>' + esc(c.name)
         + " — " + esc(c.why) + "</span>";
  }).join(" · ");
}

function unfixableText(slot, cause){
  var n = cause ? cause.length : 0;
  if(n === 0) return "No " + slotWord(slot) + " on your roster at all";
  if(n === 1) return "Your only " + slotWord(slot);
  return "All " + n + " of your " + slotWord(slot) + " options are out";
}

function rollupHTML(){
  var r = ROLL;
  if(!r) return "";
  if(r.exhausted) return "";        // no weeks left ahead — see computeRollup
  if(r.pending){
    return '<div class="roll"><div class="rollline">'
         + 'Checking the rest of the season…</div></div>';
  }

  /* THE HEADLINE COUNTS HOLES ONLY. Thin weeks are real and they are in the
     expansion, but a legal-but-awkward lineup is not "no legal lineup" and
     folding them into one number would inflate the only figure on this page
     Chris is meant to act on. */
  var n = r.weekCount, st = r.standing.length;
  var clean = !n && !st;
  var head;
  if(clean){
    head = '<b>Nothing unfillable</b> between week ' + r.from + ' and week ' + r.last + '.';
  } else {
    var bits = [];
    if(n) bits.push('<b>' + n + (n === 1 ? ' week' : ' weeks') + '</b> with no legal lineup');
    if(st) bits.push('<b>' + st + ' standing ' + (st === 1 ? 'gap' : 'gaps') + '</b>');
    head = bits.join(" and ") + ' between week ' + r.from + ' and week ' + r.last + '.';
  }
  if(r.unknown.length){
    head += ' ' + r.unknown.length + ' week' + (r.unknown.length === 1 ? '' : 's')
          + ' can’t be checked.';
  }

  var open = ROLL_OPEN && !clean;
  var h = '<div class="roll ' + (clean ? "clean" : "has") + '">';
  h += clean
    ? '<div class="rollline"><span class="rolltxt">' + head + '</span></div>'
    : '<button class="rollline" onclick="toggleRollup()"><span class="rolltxt">' + head
      + '</span><span class="rollcar">' + (open ? "hide" : "show") + '</span></button>';

  if(open){
    h += '<div class="rollbody">';

    var span = r.last - r.from + 1;
    r.standing.forEach(function(s){
      h += '<div class="rollrow"><div class="rollwk">Weeks ' + s.from + '–' + r.last
         + ' · <span class="slot">' + esc(slotChip(s.slot)) + '</span>'
         + '<span class="rolltag">standing gap</span></div>'
         + '<div class="rollwhy">' + causeText(s.cause) + '. '
         + esc(s.count >= span
             ? 'Every one of the ' + span + ' weeks left.'
             : s.count + ' of the ' + span + ' weeks left.')
         + ' This is a roster problem, not a bye — one add fixes all of them at once.'
         + '</div></div>';
    });

    r.items.forEach(function(it){
      var tag = it.prePlayoff
        ? '<span class="rolltag pre">last week before playoffs</span>'
        : it.inPlayoff ? '<span class="rolltag">playoff week</span>' : '';
      h += '<div class="rollrow"><div class="rollwk">Week ' + it.week
         + ' · <span class="slot">' + esc(slotChip(it.slot)) + '</span>' + tag + '</div>'
         + '<div class="rollwhy">' + causeText(it.cause) + '. '
         + esc(unfixableText(it.slot, it.cause)) + ' — only a waiver add fixes it.'
         + '</div></div>';
    });

    if(r.thin.length){
      h += '<div class="rollsub"><b>Thin, but legal:</b> '
         + r.thin.map(function(t){
             return 'week ' + t.week + ' ' + esc(slotChip(t.slot))
                  + ' (' + esc(t.pos) + ' ' + t.supply + ' left, ' + t.demand + ' needed first)';
           }).join(" · ")
         + '. A lineup exists, but the position that normally fills that slot has '
         + 'run out, so something lesser goes in.</div>';
    }

    if(r.unknown.length){
      h += '<div class="rollsub">Week' + (r.unknown.length === 1 ? ' ' : 's ')
         + r.unknown.join(", ") + ' can’t be checked — the schedule bake does not '
         + 'reach that far. Not a clean bill of health for those weeks.</div>';
    }

    h += '</div>';
    h += '<div class="rollfoot">Availability only — no projection is used or implied. '
       + 'Assumes today’s roster at full health: an injury designation is a fact about '
       + 'this week, not about November.</div>';
  }

  return h + '</div>';
}

function toggleRollup(){ ROLL_OPEN = !ROLL_OPEN; render(); }

/* =====================================================================
   THE 4-WEEK AVAILABILITY STRIP

   The near view. Collapsed to four chips, one per week, and it opens itself
   the moment one of them is not clear.

   IT IS AN AVAILABILITY STRIP, NOT A PROJECTION STRIP, and the page says so on
   the strip itself. Only the imminent week is genuinely refreshed by the
   vendor; weeks after it all carry a last_modified inside one four-second
   batch and are a season-per-game average. A points number here would be a lie
   with a decimal point in it.

   It reads the roll-up's scan rather than running its own, so the two cannot
   disagree about a week, and it anchors on NOW_WEEK so paging around does not
   move it.
   ===================================================================== */
var STRIP = null;
/* null = decide automatically (open iff something needs attention). true/false
   = Chris has said. A strip that re-opens itself after he closes it is a strip
   that is arguing with him. */
var STRIP_OPEN = null;
var STRIP_WEEKS = 4;

function computeStrip(){
  if(!ROLL) return null;
  if(ROLL.pending) return {pending:true};
  if(!ROLL.scan) return null;

  /* Each week gets a WORD and a WHY. The word names the specific thing — "no
     kicker", not "no lineup" — because the slot is the actionable half and a
     generic state label makes every bad week look the same. */
  var weeks = ROLL.scan.slice(0, STRIP_WEEKS).map(function(e){
    var state = RankEngine.lookaheadState(e), word = "clear", why = "";
    if(state === "hole"){
      word = "no " + e.unfilled.map(function(h){ return slotWord(h.slot); }).join(", no ");
