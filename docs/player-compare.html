<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Compare</title>
<style>
:root{--bg:#0f1720;--card:#18222e;--card2:#1e2a38;--ink:#eaf0f6;--mut:#9fb2c4;--line:#2a3947;
--qb:#7c5cff;--rb:#22b07d;--wr:#3a95e6;--te:#e6893a;--gold:#e9c46a;--tar:#22b07d;--fade:#e05a5a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:19px;margin-bottom:2px}
.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--mut);border:0;padding:7px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--card2);color:var(--ink);font-weight:600}
input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:16px;flex:1;min-width:150px}
main{max-width:820px;margin:0 auto;padding:14px 16px}
.pos{font-size:10px;font-weight:700;text-align:center;border-radius:5px;padding:2px 5px;color:#0f1720;display:inline-block}
.RB{background:var(--rb)}.WR{background:var(--wr)}.TE{background:var(--te)}.QB{background:var(--qb);color:#fff}
.badges{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px}
.b{font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
.bR{background:var(--gold);color:#0f1720}
.bM{background:#8a5cf6;color:#fff}
.bOUT{background:var(--fade);color:#fff}
.bUP{color:var(--tar)}.bDN{color:var(--fade)}.bNEU{color:var(--mut)}
.s-hi{color:var(--tar)}.s-mid{color:var(--gold)}.s-lo{color:var(--mut)}
/* search results */
#results{margin-bottom:10px}
#results.show{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.ritem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ritem:last-child{border-bottom:0}
.ritem:hover{background:var(--card2)}
.ritem .rn{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rn small{color:var(--mut);font-weight:400;margin-left:6px}
.ritem .ru{font-size:16px;font-weight:800;min-width:30px;text-align:right}
.ritem.dim{opacity:.5}
.ritem .added{font-size:10px;color:var(--tar);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ritem.none{color:var(--mut);cursor:default;justify-content:center}
/* selected chips */
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;min-height:4px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px 10px 6px 8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--fade)}
.chip b{color:var(--mut);font-size:15px;font-weight:700}
#chips .hint{color:var(--mut);font-size:12px}
/* compare table */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
table.h2h{width:100%;border-collapse:collapse;font-size:13px;min-width:320px}
table.h2h th,table.h2h td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.h2h tr:last-child td{border-bottom:0}
table.h2h th:first-child,table.h2h td:first-child{text-align:left;color:var(--mut);position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line)}
table.h2h thead th{color:var(--ink);font-size:13px;background:var(--card2);position:sticky;top:0}
table.h2h thead th:first-child{background:var(--card2)}
.thsub{color:var(--mut);font-weight:400;font-size:11px}
td.best{color:var(--tar);font-weight:700}
.legend{color:var(--mut);font-size:11.5px;margin:0 2px 14px}
.legend .sw{color:var(--tar);font-weight:700}
/* verdict */
.verdict{margin-top:6px;padding:12px 14px;background:var(--card2);border-left:3px solid var(--tar);border-radius:0 8px 8px 0}
.verdict b{font-size:15px}
/* empty state */
#empty{color:var(--mut);font-size:13px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center}
#empty b{color:var(--ink)}
footer{max-width:820px;margin:26px auto 10px;padding:0 16px;color:var(--mut);font-size:11.5px}
footer li{margin-bottom:4px;margin-left:16px}
footer h4{color:var(--ink);font-size:12px;margin-bottom:6px}
</style></head><body>
<header>
  <h1>Player Compare</h1>
  <div class="sub">Head-to-head usage from the 2026 Usage Board &middot; same data, same method</div>
  <div class="controls">
    <div class="seg" id="lgseg">
      <button data-lg="joop" class="on">Joop Squad &middot; 14tm PPR</button>
      <button data-lg="bk">Ball Knowers &middot; 8tm SF</button>
    </div>
    <input type="search" id="q" placeholder="Search a player to add&hellip;" autocomplete="off">
  </div>
</header>
<main>
  <div id="results"></div>
  <div id="chips"></div>
  <div id="empty"></div>
  <div class="tablewrap" id="cmpwrap" style="display:none"></div>
  <div class="legend" id="legend" style="display:none"><span class="sw">Green</span> = best value in each row. Verdict weighs the top two by Usage in the selected league.</div>
  <div id="vbox"></div>
</main>
<footer id="caveats"></footer>

n Fleury (ex-49ers TE coach) hired as OC.","pass_rate_2025":"48.7% overall pass rate (30th, only 481 att)","pace_2025":"average (~58 plays/gm)","target_concentration_2025":"Most concentrated in NFL: Jaxon Smith-Njigba 163 targets, 33.9% share \u2014 highest since 2017","flag":"neutral","note":"New play-caller, same Shanahan-tree run-first philosophy, so don't expect a volume spike. JSN's historic share is the offense; he finished WR2 in PPR despite 29th-ranked pass attempts.","confidence":"high"},{"team":"SF","coach_change":"No offensive change: Kyle Shanahan remains HC and play-caller (Raheem Morris hired as DC).","pass_rate_2025":"54.4% overall pass rate (mid-pack, 574 att)","pace_2025":"fast in volume (~62 plays/gm)","target_concentration_2025":"RB-centric: Christian McCaffrey led team with 129 targets (4th-most ever by a RB); WR tree spread","flag":"neutral","note":"Total continuity. CMC's historic receiving volume is the defining usage fact; the WR pecking order behind him remains unsettled.","confidence":"high"},{"team":"TB","coach_change":"Todd Bowles remains HC; Zac Robinson (ex-Falcons OC) hired as OC and play-caller.","pass_rate_2025":"54.2% overall pass rate (mid-pack)","pace_2025":"fast in volume (~61 plays/gm)","target_concentration_2025":"Fairly spread: Emeka Egbuka 127 targets (22.8% share); Mike Evans elite per-route when active","flag":"neutral","note":"Robinson ran a competent, London-funneling pass game in Atlanta and inherits Baker with Egbuka ascending. Volume steady; Egbuka is the share bet.","confidence":"medium"},{"team":"TEN","coach_change":"Brian Callahan fired during 2025. New HC Robert Saleh (defense-side); Brian Daboll hired as OC and play-caller.","pass_rate_2025":"60.1% overall pass rate (3rd) \u2014 heavily loss-script inflated","pace_2025":"slow (~56 plays/gm)","target_concentration_2025":"Spread and weak: Calvin Ridley the nominal lead; no elite target earner","flag":"down","note":"The 60% pass rate was a losing-team artifact; Saleh will want balance and defense. Daboll's history with young QBs helps Cam Ward's development, and free-agent add Wan'Dale Robinson (140 targets with NYG) reshapes the tree.","confidence":"medium"},{"team":"WAS","coach_change":"Dan Quinn remains HC; David Blough promoted internally to OC as a first-time play-caller; new DC as well.","pass_rate_2025":"49.2% overall pass rate (29th)","pace_2025":"slow (~56 plays/gm)","target_concentration_2025":"Spread: Deebo Samuel led with 99 targets; Terry McLaurin missed 7 games","flag":"neutral","note":"Unknown first-time play-caller around Jayden Daniels, and the tree got more crowded \u2014 Stefon Diggs reportedly signed in August 2026, clouding McLaurin's and Deebo's shares. Bounce-back health could lift everyone, but shares are murky.","confidence":"medium"}];
const TMAP = {}; TEAMS.forEach(t=>TMAP[t.team]=t);

/* ---- state + accessors (verbatim from 2026-Usage-Board.html) ---- */
let LG='joop', Q='', SEL=[];
const usage = p => LG==='joop' ? p.usage_joop : p.usage_bk;
const proven = p => LG==='joop' ? p.proven_joop : p.proven_bk;
const tier = p => LG==='joop' ? p.tier_joop : p.tier_bk;
const adp = p => LG==='joop' ? p.adp_ppr : p.adp_2qb;
const scls = v => v>=70?'s-hi':(v>=45?'s-mid':'s-lo');
const flagArrow = f => f==='up'?'<span class="bUP">&#9650;</span>':(f==='down'?'<span class="bDN">&#9660;</span>':'<span class="bNEU">&#9654;</span>');
function badges(p){
  let h='';
  if(p.rookie) h+='<span class="b bR" title="Rookie &mdash; projected-only score">R</span>';
  if(!p.rookie && !p.has25 && !p.out) h+='<span class="b bR" title="No 2025 sample (injury/no role) &mdash; projected-only score">P</span>';
  if(p.mover) h+='<span class="b bM" title="Changed teams: 2025 usage earned with '+p.team25+'">'+p.team25+'&rarr;</span>';
  if(p.out) h+='<span class="b bOUT" title="'+p.out+'">OUT</span>';
  return h;
}

/* ---- head-to-head row + verdict (verbatim from the board's compare tray) ---- */
function h2hRow(lbl, vals, hiGood=true, fmtFn=(v)=>v==null?'&ndash;':v){
  const nums = vals.map(v=>v==null?(hiGood?-1e9:1e9):v);
  const best = hiGood ? Math.max(...nums) : Math.min(...nums);
  return `<tr><td>${lbl}</td>` + vals.map((v,i)=>`<td class="${nums[i]===best&&vals.filter(x=>x!=null).length>1?'best':''}">${fmtFn(v)}</td>`).join('') + '</tr>';
}
function verdict(ps){
  const ranked = [...ps].sort((a,b)=>(usage(b)??-1)-(usage(a)??-1));
  const A = ranked[0], B = ranked[1];
  if(usage(A)==null) return '<b>No verdict:</b> missing scores.';
  const gap = usage(A) - (usage(B)??0);
  let strength = gap>=8 ? 'a clear edge' : gap>=3 ? 'a modest edge' : 'a coin flip &mdash; break the tie on roster need';
  let why = [];
  if(A.comp_pct && B && B.comp_pct){
    const diffs = ['tgt','snap','rz','air','ypt'].map(k=>({k, d:(A.comp_pct[k]||0)-(B.comp_pct[k]||0)})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    const names = {tgt:'target share', snap:'snap share', rz:'RZ role', air:'downfield role', ypt:'efficiency'};
    diffs.slice(0,2).forEach(x=>{ if(Math.abs(x.d)>8) why.push((x.d>0?A.name:B.name)+' wins '+names[x.k]); });
  }
  let cautions = [];
  ps.forEach(p=>{
    if(p.out) cautions.push(p.name+': '+p.out);
    if(p.rookie) cautions.push(p.name+' is projection-only (rookie)');
    if(p.mover) cautions.push(p.name+"'s proven usage came with "+p.team25);
    if(p.has25 && p.gp && p.gp<8) cautions.push(p.name+': '+p.gp+'-game sample');
    if(p.scheme_flag==='up') cautions.push(p.name+': scheme trending up ('+p.team26+')');
    if(p.scheme_flag==='down') cautions.push(p.name+': scheme trending down ('+p.team26+')');
  });
  return `<b>${A.name}</b> &mdash; ${strength} (${usage(A).toFixed(0)} vs ${usage(B)==null?'&ndash;':usage(B).toFixed(0)} usage in this league).`
    + (why.length?'<br>'+why.join(' &middot; ')+'.':'')
    + (cautions.length?'<br><span style="color:var(--mut)">Watch: '+cautions.join(' &middot; ')+'.</span>':'');
}

/* ---- Part-A additions: read-only rows the board shows elsewhere (tier / PPR finish / status) ---- */
function statusText(p){ return p.out ? p.out : (p.injury || 'Active'); }
function textRow(lbl, vals){
  return `<tr><td>${lbl}</td>` + vals.map(v=>`<td>${v==null?'&ndash;':v}</td>`).join('') + '</tr>';
}
function finishRow(ps){ // PPR positional finish; lower rank = best, mirrors h2hRow highlight logic
  const ranks = ps.map(p=>p.pos_rank_ppr==null?1e9:p.pos_rank_ppr);
  const best = Math.min(...ranks);
  const nHas = ps.filter(p=>p.pos_rank_ppr!=null).length;
  return `<tr><td>PPR finish (2025)</td>` + ps.map((p,i)=>{
    const isBest = ranks[i]===best && nHas>1;
    const txt = p.pos_rank_ppr==null ? '&ndash;' : p.pos+p.pos_rank_ppr;
    return `<td class="${isBest?'best':''}">${txt}</td>`;
  }).join('') + '</tr>';
}

/* ---- search / chips ---- */
function renderResults(){
  const box = document.getElementById('results');
  if(!Q){ box.innerHTML=''; box.classList.remove('show'); return; }
  const list = PLAYERS.filter(p => (p.name+' '+(p.team26||'')).toLowerCase().includes(Q)).slice(0,8);
  if(!list.length){ box.innerHTML='<div class="ritem none">no match</div>'; box.classList.add('show'); return; }
  box.innerHTML = list.map(p=>{
    const sel = SEL.includes(p.pid), u = usage(p);
    return `<div class="ritem ${sel?'dim':''}" onclick="add('${p.pid}')">
      <span class="pos ${p.pos}">${p.pos}</span>
      <span class="rn">${p.name}<small>${p.team26||'FA'}</small><span class="badges">${badges(p)} ${flagArrow(p.scheme_flag)}</span></span>
      ${sel?'<span class="added">added</span>':`<span class="ru ${scls(u||0)}">${u==null?'&ndash;':u.toFixed(0)}</span>`}
    </div>`;
  }).join('');
  box.classList.add('show');
}
function add(pid){
  if(SEL.includes(pid)){ remove(pid); return; }
  if(SEL.length>=4) return;
  SEL.push(pid);
  Q=''; document.getElementById('q').value='';
  renderAll();
}
function remove(pid){ SEL = SEL.filter(x=>x!==pid); renderAll(); }
function renderChips(){
  const c = document.getElementById('chips');
  if(!SEL.length){ c.innerHTML='<span class="hint">No players selected &mdash; search above to add 2&ndash;4.</span>'; return; }
  c.innerHTML = SEL.map(pid=>{
    const p = PLAYERS.find(x=>x.pid===pid);
    return `<span class="chip" title="tap to remove" onclick="remove('${pid}')"><span class="pos ${p.pos}">${p.pos}</span> ${p.name} <b>&times;</b></span>`;
  }).join('');
}

/* ---- compare table + verdict ---- */
function renderCompare(){
  const wrap = document.getElementById('cmpwrap');
  const vb = document.getElementById('vbox');
  const empty = document.getElementById('empty');
  const legend = document.getElementById('legend');
  if(SEL.length<2){
    wrap.style.display='none'; wrap.innerHTML='';
    legend.style.display='none';
    vb.innerHTML='';
    empty.style.display='block';
    empty.innerHTML = SEL.length===0
      ? 'Search and add <b>2&ndash;4 players</b> to see the head-to-head.'
      : 'Add <b>one more player</b> to compare.';
    return;
  }
  empty.style.display='none';
  const ps = SEL.map(pid=>PLAYERS.find(x=>x.pid===pid));
  let h = `<table class="h2h"><thead><tr><th></th>${ps.map(p=>'<th>'+p.name+'<br><span class="thsub">'+p.pos+' &middot; '+(p.team26||'FA')+' '+flagArrow(p.scheme_flag)+'</span></th>').join('')}</tr></thead><tbody>`;
  h += h2hRow('Usage score', ps.map(p=>usage(p)), true, v=>v==null?'&ndash;':v.toFixed(0));
  h += h2hRow('Proven (2025)', ps.map(p=>proven(p)), true, v=>v==null?'&ndash;':v.toFixed(0));
  h += h2hRow('Projected (2026)', ps.map(p=>p.projected), true, v=>v==null?'&ndash;':v.toFixed(0));
  h += h2hRow('ADP', ps.map(p=>adp(p)), false, v=>v==null?'&ndash;':v.toFixed(1));
  h += h2hRow('Tier', ps.map(p=>tier(p)), false, v=>v==null?'&ndash;':v);
  h += h2hRow('Target share %', ps.map(p=>p.tgt_share));
  h += h2hRow('Snap share %', ps.map(p=>p.snap_share));
  h += h2hRow('RZ-tgt share %', ps.map(p=>p.rz_share));
  h += h2hRow('Air-yards share %', ps.map(p=>p.air_share));
  h += h2hRow('Yards/target', ps.map(p=>p.ypt));
  h += h2hRow('Proj rec share %', ps.map(p=>p.proj_rec_share_adj));
  h += h2hRow('2025 games', ps.map(p=>p.gp));
  h += finishRow(ps);
  h += textRow('Injury / status', ps.map(p=>statusText(p)));
  h += '</tbody></table>';
  wrap.innerHTML = h;
  wrap.style.display='block';
  legend.style.display='block';
  vb.innerHTML = '<div class="verdict">'+verdict(ps)+'</div>';
}

function renderAll(){ renderChips(); renderResults(); renderCompare(); }

document.getElementById('lgseg').onclick = e=>{ if(e.target.dataset.lg){ LG=e.target.dataset.lg; document.querySelectorAll('#lgseg button').forEach(b=>b.classList.toggle('on',b.dataset.lg===LG)); renderAll(); }};
document.getElementById('q').oninput = e=>{ Q=e.target.value.toLowerCase(); renderResults(); };

document.getElementById('caveats').innerHTML = `<h4>How to read this</h4><ul>
<li><b>Usage score</b> = 60% Projected (2026 role) + 40% Proven (2025 per-game shares), percentile-normalized within position. Rookies / no-2025 vets are projection-only (R / P badge). Full method: 2026-Usage-Rubric.md.</li>
<li><b>Proven shares</b> are per-game rates vs the player's 2025 team totals (so injured stars aren't punished for missed games) &mdash; samples under 8 games are flagged in the verdict.</li>
<li><b>Team-changers</b> (purple badge) earned their proven usage elsewhere; the projected side already reflects the new team.</li>
<li><b>Scheme arrows</b> (&#9650;/&#9654;/&#9660;) are coarse 2026 coaching-change reads &mdash; they nudge projected reception share &plusmn;8%, nothing more.</li>
<li>Ball Knowers view uses superflex ADP (adp_2qb) and 8-team tiers; Joop uses PPR ADP and 14-team tiers.</li>
<li>Numbers mirror the <b>2026 Usage Board</b> exactly (same embedded data, pulled 2026-08-25; same scoring code).</li></ul>`;

renderAll();
