<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Team — Joop Squad</title>
<style>
/* Navy & Gold, matching hub.py SKINS['navy']. Phone-first: the base rules ARE
   the phone rules; the only desktop concession is a max-width so the column
   does not stretch to 1500px on a laptop. Decided 2026-09-03 — Sunday lineup
   calls and Tuesday waiver bids both happen on a phone. */
:root{
  --surface:#0A0F1A; --raised:#131B2E; --line-soft:#22304A;
  --text:#EDF1F7; --text-mute:#93A0B8; --brand:#F5C451; --brand-fill:#43370F;
  --positive:#5CE39B; --urgent:#FF6B6B; --warn:#F5A551;
  --fs-body:13px; --fs-support:15px; --fs-head:17px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--text);
  font:var(--fs-support)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line-soft);
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
}
.hrow{display:flex;align-items:baseline;gap:8px;max-width:560px;margin:0 auto}
.lname{font-size:var(--fs-head);font-weight:700;letter-spacing:-.2px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px}
.wk button{
  background:var(--raised);color:var(--text);border:1px solid var(--line-soft);
  border-radius:7px;font:600 var(--fs-body)/1 inherit;padding:7px 9px;cursor:pointer;
  min-width:32px;min-height:32px;
}
.wk button:disabled{opacity:.35;cursor:default}
.wk b{font-size:var(--fs-body);color:var(--brand);min-width:52px;text-align:center;
  font-variant-numeric:tabular-nums}
.sub{max-width:560px;margin:3px auto 0;font-size:var(--fs-body);color:var(--text-mute);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-mute);flex:none}
.dot.ok{background:var(--positive)} .dot.bad{background:var(--urgent)}
.dot.stale{background:var(--warn)}
.sync{margin-left:auto;background:none;border:1px solid var(--line-soft);color:var(--text-mute);
  border-radius:6px;font:600 11px/1 inherit;padding:6px 8px;cursor:pointer}

/* ---------- alerts ---------- */
.alerts{margin:12px 0 0;border:1px solid var(--line-soft);border-left:3px solid var(--warn);
  border-radius:9px;background:var(--raised);padding:10px 12px}
.alerts.crit{border-left-color:var(--urgent)}
.alerts h3{margin:0 0 6px;font-size:var(--fs-body);letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-mute);font-weight:700}
.alerts ul{margin:0;padding:0;list-style:none}
.alerts li{padding:4px 0;font-size:var(--fs-body);display:flex;gap:7px;align-items:flex-start}
.alerts li span:first-child{flex:none}

/* ---------- section heads ---------- */
.sec{margin:20px 0 7px;font-size:var(--fs-body);letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-mute);font-weight:700;display:flex;align-items:baseline;gap:8px}
.sec i{font-style:normal;font-weight:500;color:var(--line-soft);margin-left:auto;
  text-transform:none;letter-spacing:0}

/* ---------- player rows ---------- */
.row{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;
  background:var(--raised);border:1px solid transparent;margin-bottom:5px;min-height:52px}
.row.empty{background:none;border:1px dashed var(--line-soft)}
.row.alert{border-color:var(--urgent)}
.row.soft{border-color:var(--warn)}
.slot{flex:none;width:38px;font-size:10px;font-weight:800;letter-spacing:.04em;
  color:var(--brand);text-align:center;line-height:1.15}
.slot.flex{color:var(--text-mute)}
.body{min-width:0;flex:1}
.nm{font-size:var(--fs-support);font-weight:650;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.dim{color:var(--text-mute);font-weight:500}
.meta{font-size:var(--fs-body);color:var(--text-mute);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{flex:none;text-align:right;font-size:11px;line-height:1.3;color:var(--text-mute);
  font-variant-numeric:tabular-nums}
.right b{display:block;font-size:var(--fs-body);color:var(--text);font-weight:600}
.pill{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:800;
  letter-spacing:.04em;vertical-align:1px;margin-left:5px}
.pill.out{background:#4A1416;color:#FFAFAF}
.pill.doub{background:#4A2E14;color:#FFCB8F}
.pill.q{background:#3A3416;color:#F0E08F}
.pill.ir{background:#3A1440;color:#E0AFFF}
.pill.bye{background:var(--brand-fill);color:var(--brand)}
.pill.locked{background:#1B2436;color:var(--text-mute)}
.pill.unconf{background:#3A2A16;color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-fill);
  color:var(--brand);border:none;border-radius:6px;font:700 11px/1 inherit;
  padding:6px 8px;cursor:pointer;margin-left:auto}

/* ---------- states ---------- */
.msg{margin:16px 0;padding:14px;border:1px solid var(--line-soft);border-radius:9px;
  background:var(--raised);font-size:var(--fs-body);line-height:1.55}
.msg b{color:var(--text)}
.msg.bad{border-left:3px solid var(--urgent)}
.foot{margin:26px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--text-mute);line-height:1.6}
.foot a{color:var(--text-mute)}
.spin{padding:40px 12px;text-align:center;color:var(--text-mute);font-size:var(--fs-body)}
</style>
</head>

<header>
  <div class="hrow">
    <div class="lname" id="lname">&nbsp;</div>

    <button class="sync" id="syncBtn">Refresh</button>
  </div>
</header>

   The draft board answers "who should I pick from a static ADP board". This

   -----------------------------------------------------

   opponents in November, which is worse than showing nothing. */
/* The current week is the last week whose games are OVER, plus one — not the
   last week that has started. Those differ for the three days that matter
   most: Tuesday through Thursday, when Chris is setting waiver claims. Taking
   "last week whose first kickoff has passed" would call Tuesday of week 5

    var first = null, last = null;
    for(var t in teams){

    if(isNaN(hh)) return g.day ? g.day.slice(0,3) : null;
    var ap0 = hh >= 12 ? "p" : "a"; var h0 = hh % 12 || 12;
    return (g.day ? g.day.slice(0,3) : "") + " " + h0 + (mm !== "00" ? ":" + mm : "") + ap0 + " ET";
  }
  var parts = {};
  f.formatToParts(new Date(ms)).forEach(function(p){ parts[p.type] = p.value; });
  var mins = parts.minute && parts.minute !== "00" ? ":" + parts.minute : "";
  var ap = (parts.dayPeriod || "").toLowerCase().charAt(0);
  return parts.weekday + " " + parts.hour + mins + ap + " ET";
}

function isLocked(g){
  var ms = g ? kickMs(g.kick) : null;
  return ms !== null && Date.now() >= ms;
}

/* ---------- schedule join ---------- */
function gameFor(team, week){
  if(!team) return null;
  var w = S.schedule.weeks[String(week)];
  return (w && w[team]) || null;
}
function onBye(team, week){
  return !!team && S.schedule.byes[team] === week && !gameFor(team, week);
}

/* ---------- player resolution ----------
   Baked index gives an instant first paint; the live pull corrects it. Only
   the live layer is trusted for team and injury status (see the header note).
   DEF entries ("SEA") are their own team and never appear in players/nfl. */
/* A Sleeper DEF id is the team abbreviation itself. Testing "2-3 capitals"
   also matches junk keys that live in the baked index (e.g. "NA"), which would
   silently turn a broken row into a phantom defence. Check membership in the
   actual 32-team set the schedule was built from instead. */
var NFL_TEAMS = (function(){
  var s = {}, w = S.schedule.byes || {};
  for(var t in w) s[t] = 1;
  return s;
})();
function isDef(sid){ return NFL_TEAMS[String(sid)] === 1; }

function facts(sid){
  sid = String(sid);
  var live = LIVE[sid] || null;
  var baked = S.players[sid] || null;
  if(isDef(sid)){
    return {id:sid, name:(baked && baked.n) || (sid + " DEF"), pos:"DEF",
            team:sid, status:null, stale:false};
  }
  return {
    id: sid,
    name: (live && live.name) || (baked && baked.n) || ("Sleeper #" + sid),
    pos:  (live && live.pos)  || (baked && baked.p)  || "?",
    /* TEAM: a live record wins OUTRIGHT, including when it says null.
       `live.team || baked.tm` looks equivalent and is not: Sleeper reports
       team:null for a cut or unsigned player, `||` reads that as "no answer",
       and the page falls back to an August board value — resurrecting the exact
       stale-team bug this rule exists to kill, in the one case where Sleeper is
       authoritatively telling us the player has no game at all. */
    team: live ? (live.team || null) : ((baked && baked.tm) || null),
    status: live ? live.status : null,
    /* UNCONFIRMED means "this row was not verified against Sleeper on the last
       sync" — which covers TWO cases, not one:
         (a) we have never fetched him, so `live` is missing entirely;
         (b) this sync's fetch for him FAILED and loadPlayers fell back to the
             cached record, so `live` is truthy but may be 90 minutes old.
       Checking only (a) was the first version, and it made (b) invisible: the
       footer announced "N players could not be confirmed — those rows are
       marked ?" while no row carried the mark and no alert fired. That is the
       10:00-load / 11:30-Refresh path on a Sunday, showing a stale injury
       designation with nothing to say so. */
    stale: !live || UNRESOLVED.indexOf(sid) >= 0
  };
}

var STATUS_PILL = {
  "Out":{c:"out",t:"OUT"}, "Doubtful":{c:"doub",t:"DOUB"},
  "Questionable":{c:"q",t:"Q"}, "IR":{c:"ir",t:"IR"},
  "PUP":{c:"ir",t:"PUP"}, "Sus":{c:"ir",t:"SUSP"}, "NA":{c:"ir",t:"NA"},
  "COV":{c:"ir",t:"COV"}, "DNR":{c:"ir",t:"DNR"}
};

/* =====================================================================
   FETCHES
   ===================================================================== */
function getJSON(url){
  return fetch(url, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

function loadState(){
  return getJSON(API + "state/nfl").then(function(st){
    var w = parseInt(st && (st.display_week || st.week), 10);
    return (w >= 1 && w <= 18) ? w : weekFromSchedule();
  }).catch(function(){ return weekFromSchedule(); });
}

/* Rosters. THE GUARD IS THE POINT.
   Verified 2026-09-03: api.sleeper.app returned HTTP 200 with a complete,
   well-formed rosters array in which EVERY players[] was empty — a stale edge
   response, not an error. Rendered naively that is an empty roster and a
   waiver wire containing the entire league. A sync that returns a league of
   ghosts is a FAILED sync, and it must not overwrite good data. */
/* League status, so an undrafted league reads as "not drafted yet" rather than
   as the ghost-payload failure. Joop drafts 2026-09-06 and its rosters are
   legitimately empty until then; without this the page would greet Chris with
   a data-corruption warning for a league that is simply early. */
var LEAGUE_STATUS = null;
function loadLeagueStatus(){
  return getJSON(API + "league/" + LG.leagueId).then(function(l){
    LEAGUE_STATUS = (l && l.status) || null;
    return LEAGUE_STATUS;
  }).catch(function(){ return null; });
}

function loadRoster(){
  return getJSON(API + "league/" + LG.leagueId + "/rosters").then(function(rs){
    if(!Array.isArray(rs) || !rs.length) throw new Error("no rosters returned");

    var withPlayers = rs.filter(function(r){ return (r.players || []).length; });
    if(!withPlayers.length){
      var e;
      if(LEAGUE_STATUS === "pre_draft" || LEAGUE_STATUS === "drafting"){
        e = new Error("This league has not drafted yet — there is no roster to show.");
        e.predraft = true;
      } else {
        e = new Error("Sleeper returned " + rs.length + " rosters with no players on any of them");
        e.ghost = true;
      }
      throw e;
    }

    var mine = rs.filter(function(r){ return r.owner_id === LG.sleeperUserId; })[0];
    if(!mine) throw new Error("no roster in this league is owned by user " + LG.sleeperUserId);
    if(!(mine.players || []).length){
      var e2 = new Error("your roster came back empty"); e2.ghost = true; throw e2;
    }

    var rostered = {};
    rs.forEach(function(r){ (r.players || []).forEach(function(p){ rostered[String(p)] = 1; }); });
    var faabOf = function(r){ return LG.faab - ((r.settings && r.settings.waiver_budget_used) || 0); };
    var rivals = rs.filter(function(r){ return r.roster_id !== mine.roster_id; })
                   .map(faabOf).sort(function(a,b){ return a - b; });

    return {
      players: (mine.players || []).map(String),
      starters: (mine.starters || []).map(String),
      reserve: (mine.reserve || []).map(String),
      faab: faabOf(mine),
      maxRivalFaab: rivals.length ? rivals[rivals.length - 1] : LG.faab,
      rostered: rostered,
      rosterId: mine.roster_id
    };
  });
}

/* Per-player facts. One small request each (~1KB), for roster players only —
   about 18 of them. The 5MB players/nfl dump is deliberately NOT used; it
   would dominate load time on a phone to answer a question about 18 people.
   Cached for CACHE_MIN so a page reopened during the same sitting is instant;
   injury designations move fast enough that a long TTL would be a liar. */
var CACHE_MIN = 90;
var UNRESOLVED = [];   // ids whose live facts could not be fetched this sync

/* force=true bypasses the TTL. The Refresh button MUST force.
   Without it, tapping Refresh at 11:30 on a Sunday re-uses a 10:00 cache and
   then reports "synced just now" — which is precisely when inactives drop and
   precisely the moment the page would be lying. The cache exists to make a
   page REOPENED in the same sitting instant, not to ignore a deliberate ask. */
function loadPlayers(ids, force){
  var cache = lsGet() || {};
  var pc = cache.players || {};
  var fresh = Date.now() - CACHE_MIN * 60000;
  var need = [], out = {};

  ids.forEach(function(sid){
    sid = String(sid);
    if(isDef(sid)) return;
    var hit = pc[sid];
    if(!force && hit && hit.at > fresh){ out[sid] = hit; } else { need.push(sid); }
  });

  if(!need.length){ LIVE = out; UNRESOLVED = []; return Promise.resolve(out); }

  return Promise.all(need.map(function(sid){
    return getJSON(API + "players/nfl/" + sid).then(function(p){
      return {sid:sid, v:{
        name: ((p.first_name || "") + " " + (p.last_name || "")).trim() || null,
        pos: p.position || null,
        team: p.team || null,
        status: p.injury_status || null,
        depth: (p.depth_chart_order == null ? null : p.depth_chart_order),
        at: Date.now()
      }};
    }).catch(function(){ return {sid:sid, v:null}; });
  })).then(function(res){
    var failed = [];
    res.forEach(function(r){
      if(r && r.v){ out[r.sid] = r.v; }
      else if(r){
        // Keep a previous good record rather than dropping the player entirely,
        // but remember that we did not confirm it this time round.
        if(pc[r.sid]) out[r.sid] = pc[r.sid];
        failed.push(r.sid);
      }
    });
    LIVE = out;
    UNRESOLVED = failed;
    cache.players = out;
    cache.at = Date.now();
    lsSet(cache);
    return out;
  });
}

/* =====================================================================
   RENDER
   ===================================================================== */
function setStatus(state, msg){
  STATUS.state = state; STATUS.msg = msg;
  var d = el("statusDot"), t = el("statusTxt");
  d.className = "dot" + (state === "ok" ? " ok" : state === "bad" ? " bad" : state === "stale" ? " stale" : "");
  t.textContent = msg;
}

function rowHTML(slotLabel, sid, opts){
  opts = opts || {};
  if(!sid || sid === "0"){
    return '<div class="row empty"><div class="slot">' + esc(slotLabel) + '</div>'
         + '<div class="body"><div class="nm dim">empty</div>'
         + '<div class="meta">nothing set in Sleeper</div></div></div>';
  }
  var f = facts(sid);
  var bye = onBye(f.team, WEEK);
  var g = bye ? null : gameFor(f.team, WEEK);
  var locked = g && isLocked(g);

  var pills = "";
  var sp = f.status && STATUS_PILL[f.status];
  if(sp) pills += '<span class="pill ' + sp.c + '">' + sp.t + '</span>';
  if(bye) pills += '<span class="pill bye">BYE</span>';
  if(locked) pills += '<span class="pill locked">LOCKED</span>';
  // An unconfirmed row is marked ON THE ROW. Computing a staleness flag and
  // then rendering the row identically is the same as not computing it.
  if(f.stale) pills += '<span class="pill unconf" title="not confirmed with Sleeper">?</span>';

  var line;
  if(bye){
    line = esc(f.team || "?") + " · on bye";
  } else if(g){
    line = esc(f.team) + " " + (g.home ? "vs " : "@ ") + esc(g.opp);
  } else if(f.team){
    line = esc(f.team) + " · no game this week";
  } else if(f.stale){
    line = "team not confirmed";
  } else {
    line = "no NFL team";
  }
  if(f.stale && f.team) line += " · unconfirmed";
  if(f.pos && f.pos !== "DEF") line = esc(f.pos) + " · " + line;

  var right = "";
  if(!bye && g){
    right = '<div class="right"><b>' + esc(kickLabel(g) || "") + '</b></div>';
  }

  var cls = "row";
  if(opts.starter && (bye || f.status === "Out" || f.status === "IR")) cls += " alert";
  else if(opts.starter && (f.status === "Doubtful")) cls += " soft";

  return '<div class="' + cls + '">'
       + '<div class="slot' + (opts.flex ? " flex" : "") + '">' + esc(slotLabel) + '</div>'
       + '<div class="body"><div class="nm">' + esc(f.name) + pills + '</div>'
       + '<div class="meta">' + line + '</div></div>'
       + right + '</div>';
}

/* Alerts: only things that need a decision. An empty list renders nothing at
   all rather than a reassuring green box — silence is the signal that the
   lineup is fine, which is the whole "stay quiet unless it matters" stance. */
function alertList(){
  var out = [];
  var st = ROSTER.starters || [];
  LG.lineup.forEach(function(slot, i){
    var sid = String(st[i] || "0");
    if(sid === "0"){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(slot) + " is empty</b> — no player set in Sleeper"});
      return;
    }
    var f = facts(sid);
    if(onBye(f.team, WEEK)){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> is on bye (" + esc(f.team) + ") but is in your " + esc(slot)});
    } else if(f.status === "Out" || f.status === "IR"){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> is " + esc(f.status) + " and is in your " + esc(slot)});
    } else if(f.status === "Doubtful"){
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> is Doubtful in your " + esc(slot)});
    } else if(f.status === "Questionable"){
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> is Questionable in your " + esc(slot)});
    } else if(f.stale || !f.team){
      // A starter the page could not verify is worth saying out loud. Silence
      // here reads as "all clear", and the one row we know nothing about is the
      // last row that should be silently reassuring.
      out.push({crit:false, icon:"○", txt:"<b>" + esc(f.name) + "</b> in your " + esc(slot)
        + " could not be confirmed with Sleeper — check him yourself"});
    } else if(!gameFor(f.team, WEEK)){
      out.push({crit:true, icon:"●", txt:"<b>" + esc(f.name) + "</b> (" + esc(f.team)
        + ") has no game in week " + WEEK + " but is in your " + esc(slot)});
    }
  });
  return out;
}

function render(){
  var app = el("app");

  if(!ROSTER && STATUS.state === "stale" && /not drafted/.test(STATUS.msg)){
    app.innerHTML = '<div class="msg"><b>' + esc(LG.name) + ' has not drafted yet.</b><br><br>'
      + 'This page comes alive the moment the draft finishes — it reads your roster '
      + 'straight from Sleeper, so there is nothing to set up. Until then the draft '
      + 'tools are the ones you want.</div>' + footHTML();
    return;
  }

  if(!ROSTER){
    app.innerHTML = '<div class="msg bad"><b>No roster loaded.</b><br><br>'
      + esc(STATUS.msg) + '<br><br>'
      + 'Tap <b>Refresh</b> to try again. If this page was opened from a saved file '
      + 'rather than the published hub, the browser may be blocking the call to Sleeper '
      + '— open it from the hub link instead.</div>' + footHTML();
    return;
  }

  var h = "";

  /* Viewing a week that is not the current one. Without this the page shows
     week-3 opponents next to THIS week's injury pills and an alerts panel
     announcing byes that have not happened, distinguished only by "WK 3" in
     the corner. Two taps of the arrow is all it takes to get there. */
  if(NOW_WEEK && WEEK !== NOW_WEEK){
    h += '<div class="msg"><b>You are looking at week ' + WEEK + '.</b> '
       + 'The NFL is on week ' + NOW_WEEK + ', and the injury designations below are '
       + 'today’s — not week ' + WEEK + '’s. '
       + '<button class="chip" onclick="setWeek(' + NOW_WEEK + ')">Back to week '
       + NOW_WEEK + '</button></div>';
  }

  /* A schedule that has quietly aged. Flex scheduling moves Sunday 1:00pm games
     to 8:20pm all through weeks 5–17; a stale bake would show "Sun 1p" and a
     LOCKED pill for a game that has not kicked off. */
  var age = scheduleAgeDays();
  if(age !== null && age > 7){
    h += '<div class="msg bad"><b>This schedule is ' + age + ' days old.</b> '
       + 'Kickoff times move when the NFL flexes a game, so the times and LOCKED '
       + 'marks below may be wrong. Ask Claude to re-run the weekly refresh.</div>';
  }

  var al = alertList();
  if(al.length){
    var crit = al.some(function(a){ return a.crit; });
    h += '<div class="alerts' + (crit ? " crit" : "") + '"><h3>Needs you · ' + al.length + '</h3><ul>'
       + al.map(function(a){ return '<li><span>' + a.icon + '</span><span>' + a.txt + '</span></li>'; }).join("")
       + '</ul></div>';
  }

  var st = ROSTER.starters || [];
  h += '<div class="sec">Starters <i>as set in Sleeper</i></div>';
  LG.lineup.forEach(function(slot, i){
    var flex = (slot === "FLEX" || slot === "SUPER_FLEX");
    h += rowHTML(slot === "SUPER_FLEX" ? "SFLX" : slot, st[i], {starter:true, flex:flex});
  });

  var inLineup = {};
  st.forEach(function(s){ if(s && s !== "0") inLineup[String(s)] = 1; });
  var res = {}; (ROSTER.reserve || []).forEach(function(s){ res[String(s)] = 1; });
  var bench = ROSTER.players.filter(function(p){ return !inLineup[p] && !res[p]; });
  var ir = ROSTER.players.filter(function(p){ return res[p]; });

  h += '<div class="sec">Bench <i>' + bench.length + " of " + LG.bench + '</i></div>';
  bench.forEach(function(p){ h += rowHTML("BN", p, {}); });
  if(!bench.length) h += '<div class="row empty"><div class="slot">BN</div><div class="body">'
    + '<div class="nm dim">nobody on the bench</div></div></div>';

  if(LG.ir){
    h += '<div class="sec">IR <i>' + ir.length + " of " + LG.ir + '</i></div>';
    if(ir.length) ir.forEach(function(p){ h += rowHTML("IR", p, {}); });
    else h += '<div class="row empty"><div class="slot">IR</div><div class="body">'
      + '<div class="nm dim">empty</div></div></div>';
  }

  h += footHTML();
  app.innerHTML = h;
}

function scheduleAgeDays(){
  var p = (S.schedule._meta || {}).pulled;
  if(!p) return null;
  var t = Date.parse(p + "T12:00:00Z");
  if(isNaN(t)) return null;
  return Math.max(0, Math.floor((Date.now() - t) / 86400000));
}

function footHTML(){
  var sch = S.schedule._meta || {};
  var age = scheduleAgeDays();
  return '<div class="foot">'
    + '<b>Where these numbers come from.</b><br>'
    + 'Roster, starters, FAAB and every player’s team and injury designation are pulled '
    + 'live from Sleeper each time this page loads — nothing about them is baked in. '
    + 'Opponents, kickoff times and byes come from the ' + esc(sch.season || "2026")
    + ' schedule (' + esc(sch.source_url || "nflverse") + ', pulled ' + esc(sch.pulled || "?")
    + (age === null ? '' : ', ' + age + ' day' + (age === 1 ? '' : 's') + ' ago') + ').<br><br>'
    + 'All kickoff times are Eastern. Page built ' + esc(S.built) + '.'
    + (STATUS.at ? '<br>Last successful sync ' + esc(ago(STATUS.at)) + '.' : '')
    + (UNRESOLVED.length ? '<br><b>' + UNRESOLVED.length + ' player(s) could not be '
        + 'confirmed with Sleeper on the last sync</b> — those rows are marked “?”.' : '')
    + '</div>';
}

/* =====================================================================
   WEEK NAV + BOOT
   ===================================================================== */
function paintWeek(){
  el("wkNum").textContent = "WK " + WEEK;
  el("wkPrev").disabled = (WEEK <= 1);
  el("wkNext").disabled = (WEEK >= 18);
}
function setWeek(w){
  w = Math.max(1, Math.min(18, w));
  if(w === WEEK) return;
  WEEK = w; paintWeek(); render();
}

function sync(force){
  setStatus("boot", "syncing…");
  return loadLeagueStatus().then(loadRoster).then(function(r){
    ROSTER = r;
    return loadPlayers(r.players, force);
  }).then(function(){
    STATUS.at = Date.now();
    // A sync that could not confirm every player is NOT a clean sync, and must
    // not present itself as one.
    if(UNRESOLVED.length){
      setStatus("stale", UNRESOLVED.length + " player(s) unconfirmed · $" + ROSTER.faab + " FAAB");
    } else {
      setStatus("ok", "$" + ROSTER.faab + " FAAB · synced " + ago(STATUS.at));
    }
    render();
  }).catch(function(e){
    // A sync that died before reaching loadPlayers confirmed nothing, so a
    // previous run's count must not keep being reported as this run's.
    UNRESOLVED = [];
    // A ghost payload must not clobber a roster we already have on screen.
    if(e && e.ghost && ROSTER){
      setStatus("stale", "Sleeper returned an empty roster — keeping the last good one");
    } else if(e && e.predraft){
      setStatus("stale", "not drafted yet");
      if(!ROSTER) render();
    } else {
      setStatus("bad", e && e.message ? e.message : "sync failed");
      if(!ROSTER) render();
    }
  });
}

(function boot(){
  el("lname").textContent = LG.name;
  el("wkPrev").onclick = function(){ setWeek(WEEK - 1); };
  el("wkNext").onclick = function(){ setWeek(WEEK + 1); };
  // Refresh FORCES a re-fetch past the cache — see loadPlayers().
  el("syncBtn").onclick = function(){ sync(true); };

  loadState().then(function(w){
    NOW_WEEK = w; WEEK = w; paintWeek();
    return sync();
  });
})();
</script>
</body>
</html>
