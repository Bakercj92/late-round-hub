<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Late-Round Tracker</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0f131a;color:#e6e9ef;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:30;background:#151a23;border-bottom:1px solid #232c3b}
.hb{padding:8px 12px 0}
h1{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1 .ttl{display:flex;align-items:center;gap:7px;min-width:0}
.mode{font-size:9.5px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:9px;background:#123a5c;color:#7fb2f0;border:1px solid #1d4f7d;cursor:pointer;white-space:nowrap}
.mode.season{background:#0d4429;color:#5ce39b;border-color:#17663f}
.sub{font-size:10.5px;color:#7f8a9c;margin-top:2px}
.hbtn{background:#222a38;border:0;color:#c3cede;border-radius:6px;padding:5px 9px;font-size:11.5px;cursor:pointer}
.tabs{display:flex;margin-top:8px;border-bottom:1px solid #232c3b;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:0;border:0;border-bottom:2px solid transparent;color:#8a94a6;padding:9px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:#3b82f6;font-weight:600}
.ctl{padding:8px 12px}
input,select,textarea,button{font:inherit;background:#1c232f;color:#e6e9ef;border:1px solid #2c3648;border-radius:6px;padding:7px 9px}
#q{width:100%;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.row select{flex:1 1 auto;min-width:80px;font-size:12.5px;padding:6px 7px}
.tgl{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tgl button{flex:1 1 auto;font-size:11.5px;padding:7px 5px;cursor:pointer}
.tgl button.on{background:#1d4ed8;border-color:#2563eb;color:#fff;font-weight:600}
main{padding:0 12px 80px}
.warn{background:#332612;border:1px solid #63491a;color:#eecd99;padding:7px 10px;border-radius:6px;font-size:11px;margin:8px 0}
.info{background:#122436;border:1px solid #1d3a5c;color:#9ecbff;padding:7px 10px;border-radius:6px;font-size:11px;margin:8px 0}
/* Round headers stick BELOW the header, not behind it. `top:0` put them under
   an 84-205px opaque sticky header, so they were invisible for the entire time
   they were stuck — the one moment a sticky header exists to be visible.
   --hh is written by JS from the real header height, which changes with the
   filter strip and with wrapping. */
.rh{position:sticky;top:var(--hh,84px);background:#0f131a;padding:11px 0 5px;font-size:11.5px;font-weight:700;letter-spacing:.7px;color:#7fb2f0;text-transform:uppercase;border-bottom:1px solid #232c3b;z-index:5}
.rh span{color:#6b7688;font-weight:400;text-transform:none;letter-spacing:0}
.rh.now{color:#5ce39b}
.c{background:#161c26;border:1px solid #212a38;border-radius:8px;padding:7px 9px;margin-top:6px;display:flex;gap:8px;align-items:stretch}
.c.taken{opacity:.3}
.c.taken .nm{text-decoration:line-through}
.c.mine{border-color:#2b6b45;background:#13211a}
.c.wall{border-bottom:2px solid #8a5a1a}
.acts{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;justify-content:center}
.tk,.mn{width:36px;height:32px;border-radius:6px;border:1px solid #33405480;background:#1b2330;color:#9aa6b8;font-size:14px;cursor:pointer;padding:0;line-height:1}
.tk.on{background:#7f1d3a;border-color:#a11d47;color:#fff}
.mn{color:#5ce39b;border-color:#2b6b4580}
.mn.on{background:#17663f;border-color:#2b8a57;color:#fff}
.cc{flex:1;min-width:0;cursor:pointer}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:600;font-size:14px}
.meta{font-size:10.5px;color:#7f8a9c;margin-top:2px}
.adp{font-size:12px;color:#c3cede;text-align:right;white-space:nowrap}
.adp b{font-size:14.5px;color:#fff;display:block}
.adp i{font-size:9.5px;font-style:normal;color:#8a94a6}
.mvu{color:#ff8fa3;font-size:10px;font-weight:700}
.mvd{color:#5ce39b;font-size:10px;font-weight:700}
.pill{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:9px;margin:4px 4px 0 0;letter-spacing:.4px}
.BUY{background:#0d4429;color:#5ce39b}.FADE{background:#4a1620;color:#ff8fa3}
.NEUTRAL{background:#28303e;color:#a9b6c9}.WATCH{background:#3a3210;color:#ecd07a}
.rev{background:#45206b;color:#d3a6ff}
.deep{background:#103647;color:#7fd4f0}
.REACH{background:#5a2410;color:#ffb08a}
.WAIT{background:#0e3a3a;color:#7fe3d4}
.lg{display:block;font-size:9.5px;font-style:normal;color:#c98fd8;margin-top:1px;white-space:nowrap}
.lg b{display:inline;font-size:11px;color:#e0b6ee}
.lgna{display:block;font-size:9.5px;font-style:normal;color:#5d6675;margin-top:1px}
.stale{background:#4a2a10;color:#f0b775}
.tier{background:#3a2a0a;color:#e0b050}
.cv{color:#77818f;font-size:10px}
.snip{font-size:12px;color:#a4afc0;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ov{display:none;position:fixed;inset:0;background:#0b0e14;z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov.show{display:block}
.oh{position:sticky;top:0;background:#151a23;border-bottom:1px solid #232c3b;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.ob{padding:12px 12px 60px}
.x{background:#28303e;border:0;border-radius:6px;padding:7px 13px;cursor:pointer;font-size:13px;color:#e6e9ef;white-space:nowrap}
.ev{border-left:2px solid #2a3446;padding:0 0 14px 12px;margin-left:5px;position:relative}
.ev:before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:#3b82f6}
.evd{font-size:10.5px;color:#7f8a9c}
.evt{font-size:13px;margin-top:4px;color:#d2d9e4}
.evs{font-size:11.5px;color:#8a9ab2;margin-top:4px;font-style:italic}
.msv{display:inline-block;background:#1e3a5f;color:#9ecbff;border:1px solid #2b5488;border-radius:4px;padding:1px 5px;font-size:10px;font-style:normal;font-weight:600;margin-left:4px}
.evn{font-size:11px;color:#eecd99;background:#332612;border:1px solid #63491a;border-radius:5px;padding:5px 7px;margin-top:5px;font-style:normal}
.src{background:#1b2637;border:1px solid #2a3a52;color:#7fb2f0;border-radius:5px;padding:3px 8px;font-size:10.5px;cursor:pointer;margin-top:6px}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#77818f;margin:16px 0 7px;border-bottom:1px solid #212a38;padding-bottom:4px}
.box{background:#131922;border-radius:6px;padding:9px;font-size:11.5px;color:#8a94a6;margin:9px 0}
.cn{font-size:12px;color:#b3bdcd;padding:6px 0;border-bottom:1px solid #1b2330}
.ep{background:#161c26;border:1px solid #212a38;border-radius:8px;padding:9px 11px;margin-top:6px;cursor:pointer}
.md h1{font-size:17px;margin:0 0 10px}
.md h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:#7fb2f0;margin:20px 0 7px;border-bottom:1px solid #232c3b;padding-bottom:4px}
.md h3{font-size:14.5px;margin:16px 0 5px;color:#fff;scroll-margin-top:60px}
.md h3.hl{background:#1d3a5c;margin-left:-8px;padding:4px 8px;border-radius:5px}
.md li,.md p{font-size:12.5px;color:#b3bdcd}
.md li{margin:3px 0}
.md code{background:#1c232f;padding:1px 4px;border-radius:3px;font-size:11.5px}
.md strong{color:#dfe6ef}
.empty{text-align:center;color:#69748a;padding:40px 12px;font-size:13px}
a{color:#68a9f0}
/* roster grid */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.slot{background:#161c26;border:1px dashed #2c3648;border-radius:7px;padding:7px 9px;min-height:52px}
.slot.filled{border-style:solid;border-color:#2b6b45;background:#13211a}
.slot .lb{font-size:9.5px;letter-spacing:.7px;color:#7f8a9c;text-transform:uppercase}
.slot .pn{font-size:13px;font-weight:600;margin-top:2px}
.slot .px{font-size:10px;color:#8a94a6}
.slot .rm{float:right;background:0;border:0;color:#6b7688;cursor:pointer;font-size:14px;padding:0 2px}
.need{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.need div{flex:1 1 auto;background:#131922;border:1px solid #212a38;border-radius:6px;padding:6px 8px;text-align:center;min-width:56px}
.need b{display:block;font-size:16px;color:#fff}
.need span{font-size:9.5px;color:#7f8a9c;letter-spacing:.5px}
.need.crit{border-color:#7f1d3a}
.bar{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.bar label{font-size:11px;color:#8a94a6}
.bar select,.bar input{padding:5px 7px;font-size:12px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f131a;z-index:99;font-size:13px;color:#8a94a6;text-align:center;padding:20px}
.fab{position:fixed;right:12px;bottom:14px;z-index:40;display:flex;gap:8px}
.fab button{background:#1d4ed8;border:1px solid #2563eb;color:#fff;border-radius:20px;padding:9px 15px;font-size:12.5px;font-weight:600;box-shadow:0 3px 12px #0008;cursor:pointer}
.fab button.ghost{background:#222a38;border-color:#2c3648;color:#c3cede}
.spark{display:inline-block;vertical-align:middle;margin-left:4px}
/* ---------- draft room ---------- */
.lvbar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;background:#131922;border:1px solid #212a38;border-radius:8px;padding:7px 10px;margin-top:8px}
.lvtop{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.lvbar .lvst{flex:1 1 200px}
.lvbar.onclock{background:#13211a;border-color:#2b6b45}
.dot{width:9px;height:9px;border-radius:50%;background:#4a5568;flex:0 0 auto}
.dot.live{background:#5ce39b;animation:pulse 2s infinite}
.dot.err{background:#ff8fa3}
.dot.man{background:#ecd07a}
@keyframes pulse{0%{box-shadow:0 0 0 0 #5ce39b99}70%{box-shadow:0 0 0 7px #5ce39b00}100%{box-shadow:0 0 0 0 #5ce39b00}}
.lvst{font-size:11.5px;color:#8a94a6;flex:1 1 auto;min-width:0}
.lvst b{color:#e6e9ef}
.clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:#e6e9ef;letter-spacing:.5px}
.clock.warn{color:#ecd07a}.clock.crit{color:#ff8fa3}
.pk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pk div{flex:1 1 auto;background:#131922;border:1px solid #212a38;border-radius:6px;padding:7px 9px;text-align:center;min-width:66px}
.pk b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums}
.pk span{font-size:9px;color:#7f8a9c;letter-spacing:.5px;text-transform:uppercase}
/* ---- the shortlist row -------------------------------------------------
   Grid, not flex, so the survival pair can drop to its own strip on a narrow
   screen without duplicating the markup. Reading order left to right is:
   rank, VERDICT, who, the numbers, the button. The verdict leads because it is
   the only token on the row that is an instruction rather than a fact. */
.rec{background:#161c26;border:1px solid #212a38;border-radius:8px;padding:8px 10px;margin-top:6px;
 display:grid;grid-template-columns:auto minmax(0,1fr) auto;
 grid-template-areas:"n b a" "s s s";gap:5px 9px;align-items:center}
.rec.n1{border-color:#2b6b45;background:#141d1b}
.recn{grid-area:n;width:17px;font-size:18px;font-weight:700;color:#3d4657;line-height:1;text-align:center}
.rec.n1 .recn{color:#5ce39b}
.recb{grid-area:b;min-width:0;cursor:pointer}
.racts{grid-area:a;display:flex;align-items:center}
/* The verdict chip and the name share a line, chip first. It used to be 9.5px
   and the LAST element in the card — the smallest, lowest-placed thing on the
   screen was the one telling him what to do. */
.rh1{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.rh1 .nm{font-size:14.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vd{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;
 letter-spacing:.6px;white-space:nowrap;flex:0 0 auto;border:1px solid transparent}
.vd.now{background:#5a1020;color:#ffb3c1;border-color:#8d2038}
.vd.wait{background:#0e3a3a;color:#8fe9db;border-color:#1c5d57}
.vd.flip{background:#3a3210;color:#f0d68a;border-color:#5f5118}
/* Both survival numbers are the SAME SIZE and both are labelled. The old card
   printed national at 17px and the room number at 12.5px underneath, while the
   verdict was computed off the room number — the eye landed on the figure that
   was not driving the recommendation. */
.svpair{grid-area:s;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
 border-top:1px solid #1e2836;padding-top:5px;margin-top:1px}
.svone{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.sv{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sv.hi{color:#5ce39b}.sv.mid{color:#ecd07a}.sv.lo{color:#ff8fa3}
.svl{font-size:10px;color:#95a1b5;letter-spacing:.3px}
.svthin{font-size:9.5px;color:#f0c46a;background:#2a2110;border:1px solid #3f3315;border-radius:4px;padding:1px 5px;display:inline-block}
.why{font-size:11.5px;color:#9db1c9;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why em{color:#77839a;font-style:normal}
.jjq{color:#b6c6da;font-style:italic}
.jjl{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:1px 5px;border-radius:4px;margin-right:2px}
.jjl.BUY{background:#0d4429;color:#5ce39b}
.jjl.FADE{background:#4a1620;color:#ff8fa3}
/* Need flag. The shortlist stays pure best-available — this marks the rows
   that also plug an open starting slot, so roster need is visible without
   being allowed to reorder anything. */
.nf{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
 color:#9ecbff;background:#12243a;border:1px solid #24456d;border-radius:4px;
 padding:2px 6px;flex:0 0 auto;white-space:nowrap}
/* "I drafted him", reachable with a pointer. Before this the only path was
   Ctrl+Enter in the quick-entry box, which does not exist on a touch device. */
.dh{background:#17663f;border:1px solid #2b8a57;color:#eafff3;border-radius:7px;
 padding:8px 10px;font-size:11.5px;font-weight:700;line-height:1.15;cursor:pointer;
 min-width:46px;min-height:44px;text-align:center}
.dh:hover{background:#1d7d4d}
.dh.sm{min-height:36px;padding:6px 8px;font-size:11px}
/* ---- gone-before: deliberately NOT a recommendation ----
   These used to reuse .rec verbatim, differing only by a missing rank digit.
   Under a clock a "he is about to be gone" name read as "take him". */
.gone{display:flex;align-items:baseline;gap:8px;font-size:12px;color:#9aa6b8;
 padding:5px 8px;border-left:2px solid #5a3a1a;background:#14161d;border-radius:0 5px 5px 0;
 margin-top:3px;cursor:pointer}
.gone .gn{font-weight:600;color:#cdd6e3;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gone .gm{font-size:10.5px;color:#8590a3;flex:0 0 auto}
.gone .gs{margin-left:auto;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap}
.gs.hi{color:#5ce39b}.gs.mid{color:#ecd07a}.gs.lo{color:#ff8fa3}
.runbar{display:flex;gap:2px;margin-top:7px;height:9px;border-radius:5px;overflow:hidden;background:#1b2330}
.runbar i{display:block;height:100%}
.cRB{background:#5ce39b}.cWR{background:#7fb2f0}.cTE{background:#d3a6ff}.cQB{background:#ecd07a}.cK{background:#8a94a6}.cDEF{background:#69748a}
.rl{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:#8a94a6;margin-top:6px}
.rl b{color:#e6e9ef;font-variant-numeric:tabular-nums}
.hot{background:#4a1620;border:1px solid #7f1d3a;color:#ff8fa3;padding:7px 10px;border-radius:6px;font-size:11.5px;margin-top:8px}
.hot b{color:#ffc0cb}
.qe{position:relative;margin-top:8px}
#qei{width:100%;font-size:16px;border-color:#2b6b45}
.qed{position:absolute;left:0;right:0;top:100%;z-index:20;background:#161c26;border:1px solid #2c3648;border-radius:0 0 7px 7px;max-height:44vh;overflow-y:auto;box-shadow:0 8px 22px #000a}
.qer{padding:6px 8px;font-size:13px;cursor:pointer;border-bottom:1px solid #1b2330;display:flex;justify-content:space-between;gap:8px;align-items:center}
.qer.sel{background:#1d3a5c}
.qer small{color:#7f8a9c;font-size:10.5px;white-space:nowrap}
.log{font-size:11.5px;color:#a4afc0;padding:4px 0;border-bottom:1px solid #1b2330;display:flex;gap:8px}
.log b{color:#6b7688;font-variant-numeric:tabular-nums;flex:0 0 34px}
.log.me{color:#5ce39b}
.log.unm{color:#ecd07a}
.path{background:#131922;border:1px solid #212a38;border-radius:7px;padding:8px 10px;margin-top:6px}
.path .ph{font-size:11.5px;color:#7fb2f0;font-weight:700}
.path .pb{font-size:11.5px;color:#a4afc0;margin-top:3px}
.path .pb em{color:#8590a3;font-style:normal}

/* ================= contrast repairs =====================================
   These are the captions that explain the numbers — "national", "on the
   clock", "conviction". Every one of them was under 3:1 on its own
   background, at 9-10px, in a room with bad lighting and a clock running. */
.pk span{color:#95a1b5}
.cv{color:#95a1b5}
.lvst{color:#a4b0c2}
.box{color:#9aa6b8}
.rl{color:#9aa6b8}
.meta{color:#95a1b5}
.sub{color:#95a1b5}

/* ================= collapsible secondary sections =======================
   Everything below the decision is real information that is real ballast in a
   two-minute window. <details> keeps it one click away without keeping it in
   the scroll path. Open state is remembered per section in S.open. */
.fold{border:1px solid #212a38;border-radius:8px;background:#131922;margin-top:8px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:9px 11px;font-size:11.5px;
 text-transform:uppercase;letter-spacing:.8px;color:#a4b0c2;font-weight:700;
 display:flex;align-items:center;gap:8px;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:before{content:"\25b8";color:#68748a;font-size:11px;transition:transform .12s}
.fold[open]>summary:before{transform:rotate(90deg)}
.fold>summary .cnt{margin-left:auto;font-size:10.5px;font-weight:600;color:#8590a3;
 background:#1b2330;border-radius:9px;padding:1px 8px;letter-spacing:0;text-transform:none}
.fold>summary.alert{color:#ffb3c1}
.fold>summary.alert .cnt{background:#4a1620;color:#ff9fb0}
.foldb{padding:0 11px 11px}

/* ================= the draft room, laid out for a screen =================
   There were ZERO media queries in this file. On a laptop the phone column
   stretched to the full window: the name at the far left, the ADP at the far
   right, and most of the screen empty — while the thing he actually had to
   read was below the fold. */
.roomgrid{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}
.rcolB,.rcolC{min-width:0}
.rtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.rtiles div{background:#131922;border:1px solid #212a38;border-radius:6px;padding:6px 8px;text-align:center}
.rtiles b{display:block;font-size:17px;color:#fff;font-variant-numeric:tabular-nums;line-height:1.2}
.rtiles span{font-size:9px;color:#95a1b5;letter-spacing:.2px;text-transform:uppercase;white-space:nowrap}

@media(min-width:560px){
 .rec{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"n b s a"}
 .svpair{border-top:0;padding-top:0;margin-top:0;flex-direction:column;gap:3px;
  align-items:flex-end;min-width:104px}
 .svone{gap:6px}
}
@media(min-width:900px){
 main{padding:0 16px 80px}
 /* The filter strip was three stacked full-width rows — search, three selects,
    five toggles — costing ~120px of every Board and Players screen on a
    machine with width to spare. One row. */
 .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 .ctl #q{flex:1 1 240px;width:auto;font-size:13.5px;padding:6px 9px}
 .ctl .row{margin-top:0;flex:0 1 auto;gap:6px}
 .ctl .row select{min-width:92px;flex:0 0 auto}

<script>
/* ---------- payload acquisition ----------
   This page carries NO data of its own. There are exactly two ways data gets
   in, and they must stay equivalent — the same base64 blobs reach the same two
   variables either way:

   1. HUB MODE (build/hub.py). manifest.js names content-hashed payload files
      which are pulled in by <script> tag. A rebuild rewrites those files and
      leaves this page untouched, so a refresh is the whole update procedure.
      That is the point of the split: nothing has to be hand-carried again.

   2. PARACHUTE MODE (build/artifact.py). The payload is inlined into the page
      ABOVE this script, so window.__P is already populated and nothing is
      loaded over the network. This is the single self-contained file that opens
      off a laptop with no wifi — the draft-table fallback.

   Script tags, NOT fetch(). fetch() is blocked on file:// in Chrome
   ("URL scheme file is not supported"), and the hub must work from a local
   bookmark as well as from a web server. <script src> works under both, so one
   loader covers both without a protocol check. Verified 2026-08-13. */
const LEAGUE_KEY="joop-14";
let B64M=null, B64T=null, BUILT="", SOURCE="";
function loadScript(src){
 return new Promise((res,rej)=>{
  const s=document.createElement('script');
  s.src=src; s.async=false;
  s.onload=()=>res(src);
  s.onerror=()=>rej(new Error('could not load '+src));
  document.head.appendChild(s);
 });
}
async function acquire(){
 if(window.__P && window.__P.main){
  B64M=window.__P.main; B64T=window.__P.text; BUILT=window.__BUILT__||"";
  return 'inline';
 }
 /* Cache-bust the manifest and ONLY the manifest. Everything it points at is
    content-hashed, so those files are safe to cache forever: an unchanged board
    reloads instantly, and a changed one arrives under a new name and therefore
    cannot be served stale. Getting this backwards is how a "self-updating" page
    quietly shows week-old data. */
 await loadScript('./manifest.js?t='+Date.now());
 const M=window.__MANIFEST__;
 if(!M) throw new Error('manifest.js loaded but did not define __MANIFEST__');
 const e=M.leagues && M.leagues[LEAGUE_KEY];
 if(!e) throw new Error('manifest.js has no entry for league "'+LEAGUE_KEY+'"');
 await loadScript('./'+e.main);
 await loadScript('./'+e.text);
 if(!window.__P || !window.__P.main || !window.__P.text)
  throw new Error('payload scripts loaded but did not populate window.__P');
 B64M=window.__P.main; B64T=window.__P.text; BUILT=M.built||"";
 return 'hub';
}

let D,EPTXT,PL,BOARD,CN,EPS,DEPTH,META,BYID={},BYSL={};
let TAKEN={}, MINE=[], HIST=[], SLOT=0, MODE='draft', LEAGUE=null;
/* tab defaults to the Draft Room, not the Board. It used to open on 'board',
   and renderTabs() only redirects when the saved tab is absent from the mode's
   tab list — which 'board' is not — so draft day started on the wrong screen
   every time. `open` holds the collapsed-section state; it is deliberately NOT
   persisted to the hash, so a fresh page is always in the default shape. */
let S={tab:'room',q:'',p:'',l:'',c:'',deep:0,rev:0,hideTaken:0,hasTakes:0,lshift:0,
       open:{gone:1,runs:1,path:0,log:0,drift:0}};

/* ---------- who is off the board, and who says so ----------
   TAKEN and MINE are now DERIVED, not authoritative. Two independent sources
   feed them and they must not be able to clobber each other:

     MANUAL / MANUAL_MINE / SUPPRESS   what Chris marked by hand. Persisted in
                                       the URL hash, exactly as before.
     FEED / FEED_MINE                  what Sleeper's draft endpoint says.
                                       Never persisted — it is re-fetched.

   The failure this shape prevents: a poll returning a short or empty list (a
   blip, a paused draft, a 500) rebuilding TAKEN from scratch and silently
   erasing two hours of hand-marked picks. Manual marks live in their own
   object and survive every poll. SUPPRESS is the reverse override — the feed
   claims a player Chris knows it got wrong, and he can veto it. */
let MANUAL={}, MANUAL_MINE=[], SUPPRESS={};
let FEED={}, FEED_MINE=[];
let DRIFT={n:0,ready:false,nat:0,room:0};
let SDBANDS=[];

const LIVE={
 on:0,            // polling right now
 draftId:null, cfg:null, status:'', type:'', teams:null, rounds:null,
 pickTimer:120, pollMs:3000, lastPicked:0, order:null, myRoster:null,
 seq:[],          // the real pick log, INCLUDING players not on our board
 maxPick:0, unmatched:0, err:'', lastOk:0, fails:0, timer:null, tick:null,
 autoSlot:null, serverNow:0, drew:0
};

/* ---------- league-adjusted price ----------
   A second price for every board player, derived from THIS league's own 2024 and
   2025 drafts: where the nth player at a position actually left this board.
   See build/league_pace.py. It is DISPLAY ONLY — bestAvailable(), the tier
   walls, deep_flag and the round filters all still read national ADP, so
   turning this on cannot move a recommendation. */
const LP=()=> (typeof META!=='undefined' && META.leaguePace) || null;
const lpMaterial=()=>{const l=LP();return l&&l.material!=null?l.material:8;};
const LP_WHY={
 'beyond-board':'never drafted this deep at his position here — a waiver name, not a late pick',
 'tail-censored':'lands in the last two rounds of the sample, where a 196-pick board censors the measurement',
 'off-board':'not on the national board at all, so there is no positional slot to price',
 'no-positional-rank':'no positional rank on this board',
 'unmeasured':'not measured in both prior drafts'};

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Last name for the compact lists. Naively taking the final token renders
   Marvin Harrison Jr. as "Jr." and Oronde Gadsden II as "II" — which is not a
   cosmetic problem, it is a list of players you cannot identify. */
const SUFFIX=/^(jr|sr|ii|iii|iv|v)\.?$/i;
function surname(n){
 const w=(n||'').trim().split(/\s+/).filter(x=>!SUFFIX.test(x));
 return w.length?w[w.length-1]:(n||'');
}
const RS=()=>META.roundSize;
const rdOf=a=> a==null?null:Math.ceil(a/RS());

async function ungz(b64){
 const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(typeof DecompressionStream==='undefined') throw new Error('no DecompressionStream');
 const s=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
 return JSON.parse(await new Response(s).text());
}

/* ---------- state persistence via the URL hash ----------
   No storage APIs. The hash survives a reload and can be bookmarked, which is
   what matters at a draft table where an accidental refresh would otherwise
   wipe two hours of picks.

   Players are referenced by gsis_id, NOT by index into PL. Indices are derived
   from the ADP board and are not stable across rebuilds — a mid-draft bookmark
   reopened after a fresh ADP pull would have silently pointed ~94% of the marked
   picks at different players. Ids are stable by construction. The shared
   "00-00" prefix is stripped to keep the hash short. */
let STATE_OK=true;
/* The escape prefix must NOT be the field separator. It was '~' for both, so
   an id that did not start with '00-00' emitted a '~' INSIDE a field, the
   split('~') in loadState() sheared into the wrong number of segments, and the
   picks were silently misparsed — taken list emptied, roster list read from the
   wrong segment, and the trailing segment dropped without even incrementing the
   `miss` counter that exists to warn about exactly this. Total silent loss of a
   mid-draft state, which is the failure this whole id-based scheme was written
   to prevent.

   Dormant in production only because every nflverse gsis_id happens to start
   with '00-00', so the escape branch never fired. That is a property of the
   data, not a guarantee — and "it has not happened yet" is not a fix. '!' is
   not the separator and is legal in a fragment, so both id shapes now round
   trip. Existing bookmarks are unaffected: they contain only stripped ids. */
const encId=g=>g.startsWith('00-00')?g.slice(5):('!'+g);
const decId=s=>s.startsWith('!')?s.slice(1):('00-00'+s);
/* Segments 5 and 6 (SUPPRESS, live draft id) were appended, never inserted.
   A hash written before the Draft Room existed has four segments, so those two
   destructure to undefined and load exactly as they used to. Old bookmarks
   keep working; that is the whole reason they went on the end. */
function saveState(){
 try{
  const t=Object.keys(MANUAL).filter(k=>MANUAL[k]&&!MANUAL_MINE.includes(k)).map(encId);
  const m=MANUAL_MINE.map(encId);
  const x=Object.keys(SUPPRESS).filter(k=>SUPPRESS[k]).map(encId);
  history.replaceState(null,'','#s'+SLOT+'~'+MODE[0]+'~'+t.join('.')+'~'+m.join('.')
    +'~'+x.join('.')+'~'+(LIVE.draftId||''));
  if(!STATE_OK){STATE_OK=true;render();}
 }catch(e){
  // An opaque-origin iframe can refuse replaceState. Say so rather than
  // letting the user believe their picks are being saved.
  if(STATE_OK){STATE_OK=false;render();}
 }
}
function loadState(){
 try{
  const h=decodeURIComponent(location.hash||'');
  if(!h.startsWith('#s'))return;
  const [a,md,t,m,x,dr]=h.slice(2).split('~');
  SLOT=parseInt(a)||0;
  if(md==='s')MODE='season'; else if(md==='d')MODE='draft';
  let miss=0;
  (t||'').split('.').filter(Boolean).forEach(s=>{
   const g=decId(s); if(BYID[g])MANUAL[g]=1; else miss++;});
  MANUAL_MINE=(m||'').split('.').filter(Boolean).map(decId).filter(g=>{
   if(BYID[g])return 1; miss++;return 0;});
  (x||'').split('.').filter(Boolean).forEach(s=>{
   const g=decId(s); if(BYID[g])SUPPRESS[g]=1;});
  if(dr)LIVE.draftId=dr;
  recompute();
  if(miss)setTimeout(()=>alert(miss+' saved pick'+(miss==1?'':'s')+' referenced players that are not in this build and were dropped.'),300);
 }catch(e){}
}

/* Wipe every pick, from both sources. "Clear all picks" used to empty TAKEN and
   MINE, which are now derived — that would have cleared the screen for exactly
   one render and then been undone by the next poll. */
function resetPicks(){
 MANUAL={};MANUAL_MINE=[];SUPPRESS={};FEED={};FEED_MINE=[];
 LIVE.seq=[];LIVE.maxPick=0;LIVE.unmatched=0;
 DRIFT={n:0,ready:false,nat:0,room:0,spread:1,spreadReady:false};
 recompute();
}

/* The single place TAKEN and MINE are produced. Everything else writes to
   MANUAL / SUPPRESS / FEED and calls this. */
function recompute(){
 rcBust();          // every derived cache dies with the thing it was derived from
 TAKEN={};
 Object.keys(FEED).forEach(g=>{if(!SUPPRESS[g])TAKEN[g]=1;});
 Object.keys(MANUAL).forEach(g=>{if(MANUAL[g])TAKEN[g]=1;});
 const mine=[];
 FEED_MINE.forEach(g=>{if(!SUPPRESS[g]&&mine.indexOf(g)<0)mine.push(g);});
 MANUAL_MINE.forEach(g=>{if(mine.indexOf(g)<0)mine.push(g);});
 MINE=mine;
 MINE.forEach(g=>{TAKEN[g]=1;});
}

/* ---------- draft maths ----------

   picksMade() USED to be "how many players are marked taken", which is only
   the same number as "how many picks have been made" while every pick lands on
   a player this board knows about. It does not. The board is 256 players deep
   and a 14-team draft is 196 picks, but the rooms drafts kickers, defenses and
   names FFC never priced — run #10's own data has 26 defenses on the board and
   the league has taken players off it in both prior drafts.

   Every pick that lands on an off-board player used to advance nothing: the
   round header, "your next pick", the survival maths and best-available would
   all sit one pick behind reality for the rest of the draft, and the error
   accumulates. Sleeper hands us the authoritative counter — pick_no — so when
   the feed is live, use it. Hand marks the feed has not caught up on are added
   on top, because being ahead of the commissioner is normal at a live table. */
/* ---------- per-render memo ----------
   These functions were being recomputed thousands of times inside a single
   render pass:

     bestAvailable() calls multiSlots() INSIDE its 256-iteration loop, and every
                     call does a .slice().sort()
     rosterState()   calls multiSlots() once per lineup slot, and need() calls
                     rosterState() again
     liveSd()        is asked for the same player's spread over a thousand times
                     by goneBefore() and rosterPath(), and effSd() does a linear
                     band scan each time

   What is cached here is deliberately ONLY the things that are pure over
   (META, MINE, DRIFT). Nothing derived from the live pick counter is cached —
   see the note on currentPick() below. The cache is dropped on every render, on
   every recompute() and whenever the drift model moves, so the window in which
   it can be wrong is a single synchronous pass. */
let RC=null;
function rcBust(){RC=null;}
function rc(k,f){ if(!RC)RC={}; if(!(k in RC))RC[k]=f(); return RC[k]; }

/* NOT memoised, on purpose. picksMade() reads TAKEN directly, and caching it
   would mean any code path that touches TAKEN without going through
   recompute() would silently read a stale pick number — and a stale pick
   number is the one error in this file that corrupts everything downstream.
   The cost is removed instead by HOISTING it: the hot loops (goneBefore,
   rosterPath) now compute the current pick once and pass it down, rather than
   asking for it 256 or 1,280 times. */
function picksMade(){
 if(LIVE.maxPick){
  const ahead=Object.keys(MANUAL).filter(g=>MANUAL[g]&&!FEED[g]).length;
  return LIVE.maxPick+ahead;
 }
 return Object.keys(TAKEN).filter(k=>TAKEN[k]).length;
}
function currentPick(){return picksMade()+1;}
function myPicks(){
 // snake order. SLOT is 1-based; 0 means "not set".
 if(!SLOT)return [];
 const out=[],n=META.teams;
 for(let r=1;r<=META.lineup.length+META.bench;r++){
  out.push(r%2===1 ? (r-1)*n+SLOT : (r-1)*n+(n-SLOT+1));
 }
 return out;
}
function nextMyPick(){const cp=currentPick();return myPicks().find(p=>p>=cp)||null;}

/* Which positions may fill a given lineup slot. Data-driven, from the league
   config — a hardcoded 'FLEX' test cannot express a superflex slot, which
   accepts QB as well as RB/WR/TE.

   These read META lazily. META is not assigned until the payload is unzipped
   at boot, so a module-scope `const X = META.foo` here throws a ReferenceError
   before the loader ever clears — the page just hangs on the spinner. */
function slotOK(){ return (typeof META!=='undefined' && META.slotEligible) || {}; }
function slotTakes(slot,pos){
 const list = slotOK()[slot] || [slot];
 return list.indexOf(pos) >= 0;
}
/* Slots that accept more than one position, narrowest first. */
function multiSlots(){
 return rc('ms',()=>{
  const se = slotOK();
  return ((typeof META!=='undefined' && META.flexSlots) || []).slice()
    .sort((a,b)=>(se[a]||[]).length-(se[b]||[]).length);
 });
}

/* Positional need from the starting lineup that is still unfilled.

   Fill order matters and is not cosmetic. Dedicated slots go first; then the
   NARROWEST multi-position slot; then wider ones. Filling a superflex before a
   plain flex would let a spare RB occupy SFLEX and leave FLEX empty, which
   reports a need for a position the roster already has and — worse — hides the
   fact that the superflex is the slot a quarterback should be competing for. */
function rosterState(){ return rc('rs',_rosterState); }
function _rosterState(){
 const bench=[];
 const mine=MINE.map(g=>BYID[g]).filter(Boolean);
 const used=new Set();
 const slots=[...META.lineup].map(s=>({slot:s,p:null}));
 slots.forEach(s=>{
  if(multiSlots().indexOf(s.slot)>=0)return;
  const cand=mine.find(p=>!used.has(p.g)&&slotTakes(s.slot,p.p));
  if(cand){s.p=cand;used.add(cand.g);}
 });
 multiSlots().forEach(ms=>{
  slots.forEach(s=>{
   if(s.slot!==ms||s.p)return;
   const cand=mine.find(p=>!used.has(p.g)&&slotTakes(s.slot,p.p));
   if(cand){s.p=cand;used.add(cand.g);}
  });
 });
 mine.forEach(p=>{if(!used.has(p.g))bench.push(p);});
 return {slots,bench};
}
/* Which NFL roster statuses actually free an IR slot in THIS league.
   nflverse status codes: RES = reserve/IR, PUP, NON = non-football injury,
   EXE = exempt. ACT is an active player and never qualifies. */
const IR_STATUS=new Set(['RES','PUP','NON','IR','NFI','OUT','DOU-NO']);
function irEligible(p){
 const st=(p.st||'').toUpperCase();
 if(!st)return false;
 if(st==='ACT')return false;
 return IR_STATUS.has(st);
}
function need(){
 return rc('need',()=>{
  const {slots}=rosterState(),n={};
  slots.forEach(s=>{if(!s.p)n[s.slot]=(n[s.slot]||0)+1;});
  return n;
 });
}

/* Best available for THIS roster at THIS pick.

   Scored as an EFFECTIVE ADP — lower is better — so every adjustment is in
   units you can reason about ("he's ADP 120 but effectively 95 for you").

   The previous version summed (adp - yourNextPick) as the base, which meant the
   ADP term ran to +165 while every other term was worth ~20. That made the sort
   monotonically INCREASING in ADP: it ranked the board in reverse and
   confidently recommended the 179th player at pick 23. Base is now -adp, and
   every adjustment is bounded, so talent leads and the adjustments move a
   player by at most a round or two. */
function bestAvailable(limit){
 const cp=currentPick(), np=nextMyPick()||cp, n=need();
 const starters=new Set(Object.keys(n));
 const remaining=SLOT?myPicks().filter(p=>p>=cp).length:(META.lineup.length+META.bench);
 // K and DEF are MANDATORY starters that nothing else can fill. Suppress them
 // early, then force them up once the picks you have left no longer cover the
 // slots you must fill. Derived from the lineup rather than hardcoded, so a
 // league without a kicker slot simply has none of them.
 const LATE_SLOTS=['K','DEF'].filter(s=>META.lineup.indexOf(s)>=0);
 const mandatoryLeft=LATE_SLOTS.filter(s=>starters.has(s)).length;
 const mustTakeKDef=mandatoryLeft>0 && remaining<=mandatoryLeft+1;
 const out=[];
 PL.forEach(p=>{
  if(TAKEN[p.g]||p.adp==null)return;
  let eff=p.adp, why=[];
  // Dedicated slot beats a multi-position slot: a QB who fills the only QB
  // slot is worth more than one who merely COULD fill the superflex.
  const MS=multiSlots();
  const dedicated=[...starters].filter(s=>MS.indexOf(s)<0&&slotTakes(s,p.p));
  const flexible=[...starters].filter(s=>MS.indexOf(s)>=0&&slotTakes(s,p.p));
  if(dedicated.length){eff-=20;why.push('fills '+dedicated[0]);}
  else if(flexible.length){eff-=10;why.push('fills '+flexible[0]);}
  else if(!starters.size){why.push('lineup full — best available');}
  else {eff+=10;why.push('no open '+p.p+' slot');}
  if(p.lean==='BUY'){eff-=5*(p.cv||1);why.push('BUY conv '+p.cv);}
  if(p.lean==='FADE'){eff+=8*(p.cv||1);why.push('FADE conv '+p.cv);}
  if(p.tw){eff-=8;why.push('last of tier '+p.tr);}
  if(p.p==='K'||p.p==='DEF'){
   if(mustTakeKDef){eff-=120;why.push('MANDATORY — only '+remaining+' picks left');}
   else{eff+=90;why.push('K/DEF can wait');}
  }
  if(p.adp>np+META.roundSize)why.push('likely still there at #'+np);
  // Which OPEN starting slot he actually fills, carried out so the row can flag
  // it visually. The shortlist stays pure best-available — this marks the ones
  // that plug a hole rather than reordering anything.
  const fills=dedicated.length?dedicated[0]:(flexible.length?flexible[0]:null);
  out.push({p,eff,why,fills});
 });
 out.sort((a,b)=>a.eff-b.eff);
 return out.slice(0,limit||25);
}

/* ================= DRAFT ROOM =================================================

   Everything from here to the end of this block exists for one two-minute
   window. The design constraint is not cleverness, it is that Chris is looking
   at this while fourteen people wait for him.

   Three separate things are happening:
     1. the FEED   — Sleeper says who is gone, so nothing has to be typed
     2. the MATHS  — who survives to his next pick, nationally and in this room
     3. the FALLBACK — the venue wifi dies and none of the above matters
   ============================================================================ */

/* ---------- where a player goes, as a distribution ----------

   Draft position is modelled as LOGISTIC, not normal, and the reason is the
   tail — which is the only part of it this tool actually reads.

   Every survival number here is CONDITIONAL: given he is still on the board at
   pick c, does he reach pick k. Under a normal curve that conditional is
   unusable for exactly the players who matter most. A normal has an increasing
   hazard rate in the tail, so a player three sigma past his ADP who is
   somehow still sitting there comes out at 0.0000 — the model reports a
   mathematical certainty that he is gone in the next eight picks, about a
   player who is visibly, presently, not gone. That is the distribution's tail
   artefact, not a forecast, and acting on it at a draft table would be acting
   on nothing.

   A logistic has an asymptotically CONSTANT hazard: past his price, a player
   carries a steady per-pick chance of being taken and the estimate degrades
   gracefully instead of collapsing. It is also the better description of what
   actually happens — a player falling well past ADP is usually falling on
   information the board has not priced, and those players keep falling.

   Scale is variance-matched to the reported stddev, s = sd*sqrt(3)/pi, so the
   spread still means what the ADP feed says it means.

   Everything is in log space via softplus, because exp((k-mu)/s) overflows for
   a deep player and Infinity/Infinity is NaN — which would render as a blank
   card rather than a wrong number, and be noticed only at the table. */
const softplus=z=>z>30?z:Math.log1p(Math.exp(z));
function logistS(mu,sd,x){        // log P(still available at pick x)
 const s=Math.max(0.6,sd*0.5513);
 return -softplus((x-0.5-mu)/s);
}
function condSurvive(mu,sd,c,k){  // P(reaches k | available at c)
 if(k<=c)return 1;
 return Math.max(0,Math.min(1,Math.exp(logistS(mu,sd,k)-logistS(mu,sd,c))));
}

/* ---------- how wide is a player's price? ----------
   Every board row carries a stddev, but only rows with times_drafted >= 100
   are flagged sdok, and the deep band is where that bites: on the 08-13 board
   100% of the top 50 are rankable and 41% of the 113-180 band are. That band
   is exactly the part of the draft this whole project exists to cover, so
   "suppress the number" and "trust the number" are both wrong answers.

   What is stable is the RATIO. Median sd/adp runs .147 / .118 / .108 / .093
   across the four bands — a smooth, shallow decline. So a thin-sample stddev
   gets clamped toward the band model rather than believed or discarded, and
   the player is visibly flagged.

   The worked example is Ricky Pearsall: stddev 6.3 on n=87, which read as the
   tightest price inside the top 130 while he was on season-ending IR. A tight
   spread on a stale feed is not a consensus. Clamping upward is what stops
   that becoming a confident survival curve. */
function buildSdModel(){
 const edges=[[0,50],[50,113],[113,180],[180,1e9]];
 SDBANDS=edges.map(([lo,hi])=>{
  const r=PL.filter(p=>p.adp!=null&&p.adp>=lo&&p.adp<hi&&p.sdok&&p.sd>0)
            .map(p=>p.sd/p.adp).sort((a,b)=>a-b);
  return {lo,hi,n:r.length,ratio:r.length?r[Math.floor(r.length/2)]:null};
 });
 // A band with no rankable rows inherits the last measured one rather than a
 // made-up constant. The 180+ band has zero on this board.
 let last=0.12;
 SDBANDS.forEach(b=>{if(b.ratio==null)b.ratio=last;else last=b.ratio;});
}
function effSd(p){
 const b=SDBANDS.find(b=>p.adp>=b.lo&&p.adp<b.hi)||SDBANDS[SDBANDS.length-1]||{ratio:.12};
 const model=Math.max(1.5,p.adp*b.ratio);
 if(p.sd==null||p.sd<=0)
  return {sd:model,thin:true,why:'no usable spread on this board — width modelled from the band'};
 if(p.sdok)return {sd:p.sd,thin:false,why:''};
 const clamped=Math.min(Math.max(p.sd,model*0.6),model*1.6);
 return {sd:clamped,thin:true,
   why:'n='+(p.nd||0)+' drafts, under the 100 floor — spread pulled toward the band model'};
}
/* The spread the SURVIVAL maths actually uses.

   FFC's stddev is the dispersion of a player's ADP across mock drafts, and a
   mock field is more homogeneous than fourteen humans in a room reacting to
   each other. Used raw over a long wait it reads far too confident: at 13 picks
   out it put an entire screen of different players at "0%", which is both
   almost certainly too tight AND useless, because a column of zeroes cannot
   tell you which of three players to take.

   Rather than invent an inflation factor, measure it. As picks arrive, compare
   the observed scatter of (pick_no - ADP) against what the board's own spreads
   predicted, and scale by the ratio. That is the same self-calibration as the
   drift, applied to the width instead of the centre: this room's actual chaos,
   measured live, on this draft. Before there is enough data it is exactly 1 and
   changes nothing.

   There is no external calibration available for this — the project has no
   2024/2025 historical ADP, so the two prior drafts cannot supply an empirical
   spread. Measuring it live is the only honest source. */
function liveSd(p){
 // Memoised per player per render: goneBefore() and rosterPath() between them
 // ask for the same player's spread well over a thousand times in one pass,
 // and effSd() does a linear band scan every time.
 return rc('sd:'+p.g,()=>{
  const e=effSd(p);
  return {...e,sd:e.sd*(DRIFT.spread||1)};
 });
}

/* ---------- live pace calibration ----------
   Compare where players ACTUALLY went against where the board said they would.
   Positive drift = the room is taking players later than market = things last
   longer than the national curve implies.

   Measured twice, because there are two curves: against national ADP, and
   against this league's own pace price. They are different questions and
   sharing one number would double-count this room's known tendencies.

   Median, not mean — one manager reaching 40 picks early should not move it.
   Last 24 picks, so it tracks the draft as it changes rather than averaging a
   frantic round 2 into a slow round 9. Needs 12 picks before it says anything,
   and is clamped to +/-25 because beyond that it has stopped being calibration
   and started being a different draft.

   Honest caveat, stated in the UI: this is measured only on players who HAVE
   been drafted, so it is survivorship-biased by construction. It reads the
   room's aggression, not the whole board. */
function computeDrift(){
 const rows=[];
 LIVE.seq.forEach(s=>{
  if(!s.g)return; const p=BYID[s.g]; if(!p||p.adp==null)return;
  // Carry the base spread on the row. Looking the player back up by pick number
  // later would break on any duplicated pick_no a commissioner edit can create.
  rows.push({no:s.no,dn:s.no-p.adp,dr:p.al!=null?s.no-p.al:null,sd:effSd(p).sd});
 });
 // Hand-marked players carry no pick number, so they cannot calibrate pace.
 // They are excluded rather than assigned a guessed position in the order.
 rows.sort((a,b)=>a.no-b.no);
 const recent=rows.slice(-24);
 const med=a=>{a=a.filter(v=>v!=null).sort((x,y)=>x-y);
  return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):0;};
 const cl=v=>Math.max(-25,Math.min(25,v));
 const ready=rows.length>=12;
 const nat=ready?cl(med(recent.map(r=>r.dn))):0;

 /* Width, measured the same way as the centre. MAD scaled by 1.4826 is the
    robust sigma estimate; the model side deliberately reads effSd (the BASE
    spread) and not liveSd, or this would feed on its own output and run away.
    Needs 20 priced picks — more than the centre, because a spread estimate is
    noisier than a median — and is clamped to [0.8, 2.5] so one strange round
    cannot make the whole board read as a coin toss. */
 let spread=1;
 if(rows.length>=20){
  const dev=rows.map(r=>Math.abs(r.dn-nat));
  const obs=med(dev)*1.4826;
  const mod=med(rows.map(r=>r.sd));
  if(mod>0&&obs>0)spread=Math.max(0.8,Math.min(2.5,obs/mod));
 }
 rcBust();   // liveSd() is memoised against DRIFT.spread
 DRIFT={n:rows.length,ready,nat,
   room:ready?cl(med(recent.map(r=>r.dr))):0,
   spread,spreadReady:rows.length>=20};
}

/* ---------- survival ----------
   P(still on the board at pick k, GIVEN he is on the board now).

   The conditional is the whole point. Unconditionally, a player with ADP 40
   has a low chance of lasting to pick 60. But if it is already pick 55 and he
   is still sitting there, the market in this room has already told you
   something, and the conditional form uses it. That is what makes a faller
   read correctly instead of being written off. */
/* `c` (the current pick) is an optional parameter so the callers that ask for
   hundreds of players in one pass can compute it ONCE and pass it down.
   Omitted, it behaves exactly as before. */
function survivalAt(p,k,c){
 if(c==null)c=currentPick();
 const {sd,thin,why}=liveSd(p);
 const out={thin,why,sd,nat:condSurvive(p.adp+DRIFT.nat,sd,c,k),room:null};
 if(LP()&&p.al!=null)out.room=condSurvive(p.al+DRIFT.room,sd,c,k);
 return out;
}
function survivalNext(p){
 const np=nextMyPick();
 if(!np||p.adp==null)return null;
 return survivalAt(p,np);
}
const svClass=v=>v>=.65?'hi':v>=.35?'mid':'lo';
function verdict(s){
 if(!s)return null;
 // The room number decides when it exists. It is measured on this league's own
 // two drafts, and the reason it exists is that this room is not the market:
 // TE goes 30+ picks early here and defenses 26-37 late. Deferring to national
 // in a room known to be different would be the wrong way round.
 const v=s.room!=null?s.room:s.nat;
 if(v<.30)return {k:'now',t:'TAKE NOW'};
 if(v>.70)return {k:'wait',t:'HE LASTS'};
 return {k:'flip',t:'COIN FLIP'};
}

/* ---------- the live Sleeper feed ---------------------------------------- */
const SLEEPER='https://api.sleeper.app/v1/draft/';

function liveEnabled(){return META.liveDraft&&META.liveDraft.enabled&&(LIVE.draftId||META.liveDraft.draftId);}
function liveStart(id){
 LIVE.draftId=(id||LIVE.draftId||META.liveDraft.draftId||'').trim();
 if(!LIVE.draftId){LIVE.err='no draft id';render();return;}
 LIVE.on=1;LIVE.err='';LIVE.fails=0;
 LIVE.pollMs=Math.max(2000,((META.liveDraft&&META.liveDraft.pollSeconds)||3)*1000);
 saveState();
 livePoll(true);
 if(LIVE.timer)clearInterval(LIVE.timer);
 LIVE.timer=setInterval(()=>livePoll(false),LIVE.pollMs);
 if(!LIVE.tick)LIVE.tick=setInterval(tickClock,500);
}
function liveStop(){
 LIVE.on=0;
 if(LIVE.timer){clearInterval(LIVE.timer);LIVE.timer=null;}
 render();
}
async function livePoll(force){
 if(!LIVE.on)return;
 try{
  const d=await fetch(SLEEPER+LIVE.draftId,{cache:'no-store'}).then(r=>{
   if(!r.ok)throw new Error('draft '+r.status);return r.json();});
  if(!d||!d.draft_id)throw new Error('no draft at that id');
  const moved=(d.last_picked||0)!==LIVE.lastPicked;
  LIVE.cfg=d; LIVE.status=d.status||''; LIVE.type=d.type||'';
  LIVE.lastPicked=d.last_picked||0;
  const st=d.settings||{};
  // Read the shape from the draft itself, every poll. The config file carries
  // only the id precisely so a stale local number can never drive pick maths.
  if(st.pick_timer)LIVE.pickTimer=st.pick_timer;
  if(st.teams)LIVE.teams=st.teams;
  if(st.rounds)LIVE.rounds=st.rounds;
  LIVE.order=d.draft_order||null;
  autoSlot();
  if(force||moved||LIVE.drew%5===0){
   const picks=await fetch(SLEEPER+LIVE.draftId+'/picks',{cache:'no-store'}).then(r=>{
    if(!r.ok)throw new Error('picks '+r.status);return r.json();});
   if(Array.isArray(picks))applyPicks(picks);
  }
  LIVE.drew++; LIVE.fails=0; LIVE.err=''; LIVE.lastOk=Date.now();
  renderIfChanged();
 }catch(e){
  LIVE.fails++; LIVE.err=e.message||'network';
  // Back off, but never stop and NEVER touch FEED. A failed poll must leave
  // the board exactly as it was — the one thing worse than a stale board at a
  // draft table is a board that empties itself.
  if(LIVE.timer&&LIVE.fails===3){
   clearInterval(LIVE.timer);
   LIVE.timer=setInterval(()=>livePoll(false),Math.min(LIVE.pollMs*4,15000));
  }
  renderIfChanged();
 }
}

/* Rebuild FEED from the full pick list every time, rather than appending.
   Picks can be edited or removed by a commissioner mid-draft; an append-only
   log would keep a player marked gone after he was handed back. */
function applyPicks(picks){
 const feed={}, mine=[], seq=[]; let unmatched=0, max=0;
 picks.forEach(pk=>{
  const no=pk.pick_no||0; if(no>max)max=no;
  const md=pk.metadata||{};
  const nm=((md.first_name||'')+' '+(md.last_name||'')).trim()||md.player_id||'?';
  const pos=(md.position||'').toUpperCase();
  const g=matchPick(pk);
  if(g){
   feed[g]=({no,rid:pk.roster_id,by:pk.picked_by});
   if(isMyPick(pk)&&mine.indexOf(g)<0)mine.push(g);
  }else unmatched++;
  seq.push({no,g,nm:g?BYID[g].n:nm,pos:pos||(g?BYID[g].p:''),
            rid:pk.roster_id,me:isMyPick(pk),slot:pk.draft_slot});
 });
 seq.sort((a,b)=>a.no-b.no);
 FEED=feed; FEED_MINE=mine; LIVE.seq=seq; LIVE.maxPick=max; LIVE.unmatched=unmatched;
 recompute(); computeDrift();
}

/* Sleeper's player_id is the join key and it covers essentially the whole
   board — one player on the 08-13 board has no sleeper_id, and team defenses
   join natively because Sleeper uses the team abbreviation as the id, which is
   exactly what this board stores. Name matching is the backstop for that one
   gap, not the primary path. */
function matchPick(pk){
 const id=String(pk.player_id||'');
 if(id&&BYSL[id])return BYSL[id];
 const md=pk.metadata||{};
 const nm=normName((md.first_name||'')+' '+(md.last_name||''));
 if(!nm)return null;
 const pos=(md.position||'').toUpperCase();
 const hit=PL.filter(p=>normName(p.n)===nm&&(!pos||p.p===pos));
 return hit.length===1?hit[0].g:null;
}
const normName=s=>(s||'').toLowerCase().replace(/[^a-z]/g,'');
function isMyPick(pk){
 if(META.sleeperUserId&&pk.picked_by&&String(pk.picked_by)===String(META.sleeperUserId))return true;
 if(LIVE.myRoster&&pk.roster_id===LIVE.myRoster)return true;
 return false;
}
/* Chris's draft slot, without him setting it. draft_order is {user_id: slot}
   and is null until the order is randomised, so fall back to reading it off
   his own first pick. Manual selection still wins if he has set one. */
function autoSlot(){
 let s=null;
 if(LIVE.order&&META.sleeperUserId&&LIVE.order[META.sleeperUserId])s=LIVE.order[META.sleeperUserId];
 if(!s){const m=LIVE.seq.find(x=>x.me&&x.slot);if(m)s=m.slot;}
 LIVE.autoSlot=s||null;
 if(s&&!SLOT){SLOT=s;saveState();}
}
function tickClock(){
 if(S.tab==='room'&&LIVE.on)paintClock();
}
function clockLeft(){
 if(!LIVE.lastPicked||!LIVE.pickTimer)return null;
 const el=(Date.now()-LIVE.lastPicked)/1000;
 return Math.max(0,Math.min(LIVE.pickTimer,LIVE.pickTimer-el));
}
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function paintClock(){
 const el=document.getElementById('clk'); if(!el)return;
 const l=clockLeft(); if(l==null){el.textContent='--:--';return;}
 el.textContent=mmss(l);
 el.className='clock'+(l<=15?' crit':l<=40?' warn':'');
}

/* ---------- runs ---------- */
function runStats(){
 const seq=LIVE.seq.filter(s=>s.pos);
 const last=seq.slice(-12);
 const cnt=a=>{const o={};a.forEach(s=>{o[s.pos]=(o[s.pos]||0)+1;});return o;};
 const myLast=(()=>{const m=LIVE.seq.filter(s=>s.me);return m.length?m[m.length-1].no:0;})();
 const since=seq.filter(s=>s.no>myLast);
 const l12=cnt(last), sinceC=cnt(since);
 // A run worth naming: 5+ of the last 12 at one position. In a 14-team league
 // the flat expectation for any one position is nowhere near that.
 const hot=Object.keys(l12).filter(k=>l12[k]>=5&&k!=='K'&&k!=='DEF')
   .sort((a,b)=>l12[b]-l12[a]);
 return {last:last.length,l12,since:sinceC,sinceN:since.length,myLast,hot};
}
/* How many players are left at a position before the next tier wall breaks.
   Tier walls are computed over the FULL board by the pipeline, so this counts
   real remaining supply, not supply among players JJ happened to mention. */
function tierLeft(pos){
 const av=PL.filter(p=>!TAKEN[p.g]&&p.p===pos&&p.adp!=null).sort((a,b)=>a.adp-b.adp);
 const i=av.findIndex(p=>p.tw);
 return i<0?null:{n:i+1,wall:av[i]};
}
/* The panel: good players who probably will NOT be there next time round.
   Ranked by what you lose, not by how likely they are to go — a 95%-gone K is
   not news. */
/* `skip` is the set of players already on the shortlist. Without it the same
   name appears twice on one screen — recommended at #4 with TAKE NOW, and
   again three inches to the right under "gone before your pick". Both are
   true and saying it twice costs a re-read at exactly the wrong moment. */
function goneBefore(limit,skip){
 const np=nextMyPick(); if(!np)return [];
 const cp=currentPick();          // hoisted: this used to be recomputed 256 times
 const out=[];
 PL.forEach(p=>{
  if(TAKEN[p.g]||p.adp==null)return;
  if(skip&&skip.has(p.g))return;
  const s=survivalAt(p,np,cp); const v=s.room!=null?s.room:s.nat;
  if(v>=.55)return;
  if(p.p==='K'||p.p==='DEF')return;
  // What you LOSE = how good he is x how likely he is to be gone. A 95%-gone
  // K is not news; a 60%-gone player 40 picks better than your next pick is.
  out.push({p,s,v,risk:(1-v)*(1/Math.max(1,p.adp))});
 });
 /* This used to sort by ADP while computing `risk` and never reading it — the
    comment above the function claimed "ranked by what you lose, not by how
    likely they are to go", and the code did the opposite of both. */
 out.sort((a,b)=>b.risk-a.risk);
 return out.slice(0,limit||8);
}
/* What the board looks like at each of your remaining picks. "Projected" is
   doing real work here: a player only appears at a pick if he is more likely
   than not to still be there. */
function rosterPath(){
 const cp=currentPick(), np=myPicks().filter(p=>p>=cp).slice(0,5);
 const n=need(), open=Object.keys(n);
 return np.map(pick=>{
  const pool={};
  PL.forEach(p=>{
   if(TAKEN[p.g]||p.adp==null||p.p==='K'||p.p==='DEF')return;
   const s=survivalAt(p,pick,cp); const v=s.room!=null?s.room:s.nat;   // cp hoisted
   if(v<.5)return;
   (pool[p.p]=pool[p.p]||[]).push(p);
  });
  Object.keys(pool).forEach(k=>pool[k].sort((a,b)=>a.adp-b.adp));
  return {pick,round:Math.ceil(pick/RS()),pool,open};
 });
}

/* ---------- quick entry ----------
   The fallback that has to work when nothing else does. Subsequence match, so
   "jjett" finds Jaxon Smith-Njigba and "cmc" finds McCaffrey, with a hard
   preference for surname prefixes because that is what gets called out at a
   draft table. */
let QE={q:'',sel:0,rows:[]};
/* 🔴 THE WORST BUG IN THE DRAFT ROOM, and it was silent.

   An UNDRAFTED player has adp === null, and every branch below read
   `1000 - p.adp`. That is NOT NaN — in JavaScript `null` coerces to 0 — so
   every undrafted player scored a perfect 1000 and swept the top of the
   dropdown ahead of the entire priced board.

   Measured on the 2026-08-13 build, typing "smi" returned, in this order:
       Arian Smith, Brashard Smith, Geno Smith, JuJu Smith-Schuster,
       Jaxon Smith-Njigba (ADP 6), DeVonta Smith (ADP 29)
   and "gib" returned Antonio Gibson ahead of Jahmyr Gibbs (ADP 2).

   Enter marks rows[0]. So at the table someone calls "Smith" or "Gibbs", he
   types three letters and hits Enter, and the board silently records the WRONG
   player as drafted — with nothing to notice until the name he actually meant
   turns up still available several rounds later, by which point the pick
   counter, best-available and every survival number have been running on a
   corrupted board.

   Undrafted players must stay typeable — they are the FAAB watch list — so
   they are ranked BEHIND the priced board rather than excluded. The floor sits
   below the deepest real ADP, which keeps them reachable without letting one
   outrank a priced player inside the same match tier. */
const qeAdp=p=>(p.adp==null?900:p.adp);
function qeScore(p,q){
 const n=p.n.toLowerCase(), parts=n.split(' '), last=parts[parts.length-1]||'';
 const a=qeAdp(p);
 if(last.startsWith(q))return 4000-a;
 if(n.startsWith(q))return 3000-a;
 if(n.indexOf(q)>=0)return 2000-a;
 const initials=parts.map(x=>x[0]||'').join('');
 if(initials.startsWith(q))return 1500-a;
 let i=0; for(const ch of n){if(ch===q[i])i++; if(i===q.length)break;}
 return i===q.length?1000-a:-1;
}
function qeMatch(q){
 q=(q||'').toLowerCase().trim();
 if(q.length<2)return [];
 return PL.filter(p=>!TAKEN[p.g]).map(p=>({p,s:qeScore(p,q)}))
   .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.p);
}

/* ---------- filtering ---------- */
function pass(x){
 if(S.q && x.n.toLowerCase().indexOf(S.q)<0) return 0;
 if(S.p && x.p!==S.p) return 0;
 if(S.l && x.lean!==S.l) return 0;
 if(S.c && (x.cv||0)<+S.c) return 0;
 if(S.deep && !x.dp) return 0;
 if(S.rev && !x.rev) return 0;
 if(S.hideTaken && TAKEN[x.g]) return 0;
 if(S.hasTakes && !x.m) return 0;
 if(S.lshift && !(x.ls!=null && Math.abs(x.ls)>=lpMaterial())) return 0;
 return 1;
}

/* The league-adjusted price, as it appears on a card. Returns '' when this
   league has no draft history at all, so the whole feature disappears for
   superflex-8 rather than rendering a row of em-dashes. */
function leagueLine(x){
 if(!LP())return '';
 if(x.al==null)return '<i class="lgna">no league price</i>';
 return '<i class="lg">→ <b>'+x.al.toFixed(1)+'</b> R'+(x.lr||rdOf(x.al))+'</i>';
}
function leaguePill(x){
 if(!LP()||!x.lf||x.lf==='MARKET')return '';
 return '<span class="pill '+x.lf+'">'+x.lf+' '+(x.ls>0?'+':'')+Math.round(x.ls)+'</span>';
}

function movePill(x){
 // POSITIVE move = bigger ADP number = drafted later = FALLING = cheaper = good
 // for you. It must render green with a down arrow. The previous version put
 // positive moves in fade-red, so Tucker Kraft showed a red down-arrow beside a
 // green BUY pill and an EDGE INTACT status.
 const m=x.mv;
 if(!m)return '';
 return '<span class="'+(m>0?'mvd':'mvu')+'" title="'+(m>0?'fell '+m.toFixed(1)+' spots \u2014 cheaper':'rose '+Math.abs(m).toFixed(1)+' spots \u2014 pricier')+'">'
   +(m>0?'\u25bc':'\u25b2')+Math.abs(m).toFixed(1)+'</span>';
}

function card(x){
 const a=x.adp, i=x._i, isMine=MINE.includes(x.g);
 const snip=x.h&&x.h.length?esc((x.h[x.h.length-1].t||'').slice(0,150)):
   '<span style="color:#69748a">No podcast take \u2014 on the ADP board only.</span>';
 return '<div class="c'+(TAKEN[x.g]?' taken':'')+(isMine?' mine':'')+(x.tw?' wall':'')+'" id="c'+i+'">'
  +'<div class="acts">'
  +'<button class="tk'+(TAKEN[x.g]&&!isMine?' on':'')+'" onclick="event.stopPropagation();mark('+i+')" title="Someone drafted him">'+(TAKEN[x.g]&&!isMine?'\u2715':'\u25cb')+'</button>'
  +'<button class="mn'+(isMine?' on':'')+'" onclick="event.stopPropagation();claim('+i+')" title="I drafted him">'+(isMine?'\u2713':'+')+'</button>'
  +'</div>'

/* ---------- one reason, not a chain ----------
   bestAvailable() emits every clause that applied, in the order it happened to
   test them: "fills FLEX · BUY conv 3 · last of tier 4 · likely still there at
   #47". Four clauses at 11.5px is not a reason, it is a paragraph, and the
   order it arrives in has nothing to do with which one matters.
   Rank them, lead with the strongest, and put a count on the rest — the full
   list is one tap away in the player overlay. */
const WHY_PRI=[[/^MANDATORY/,0],[/^last of tier/,1],[/^BUY conv/,2],[/^FADE conv/,2],
               [/^fills /,3],[/^likely still there/,4],[/^K\/DEF can wait/,5],
               [/^no open /,6],[/^lineup full/,7]];
function whyPri(s){for(let i=0;i<WHY_PRI.length;i++)if(WHY_PRI[i][0].test(s))return WHY_PRI[i][1];return 9;}
function whyTop(why){
 if(!why||!why.length)return{top:'',rest:0,all:[]};
 const w=why.slice().sort((a,b)=>whyPri(a)-whyPri(b));
 return {top:w[0],rest:w.length-1,all:w};
}
/* JJ's own words, when he actually committed to them.
   The structural why ("fills FLEX", "last of tier 4") is always available and
   always the same shape, which makes it reliable and slightly lifeless. Where
   JJ has taken a real position — a BUY or a FADE at conviction 2 or better —
   his sentence is the more useful thing to read, because it is the reason the
   player is on this board at all. Below that bar the structural clause wins:
   a conviction-1 aside is not a reason to spend a pick.

   `·` is stripped because the reason line is deliberately ONE clause and a
   middot inside a quote would read as a second one. */
const JJ_CONV_FLOOR=2;
function jjLine(p){
 if(!p.h||!p.h.length)return null;
 if(p.lean!=='BUY'&&p.lean!=='FADE')return null;
 if((p.cv||0)<JJ_CONV_FLOOR)return null;
 let t=(p.h[p.h.length-1].t||'').replace(/\s+/g,' ').replace(/·/g,',').trim();
 if(t.length<12)return null;
 if(t.length>80){t=t.slice(0,80); const c=t.lastIndexOf(' '); if(c>52)t=t.slice(0,c); t+='…';}
 return t;
}
/* `fills` is the slot already shown as a chip beside the name. Passing it here
   drops the duplicate "fills QB" clause, so each row says a thing once and the
   reason line is free to carry the NEXT strongest clause instead of echoing
   the chip. */
function whyLine(why,p,fills){
 const w=whyTop(fills?(why||[]).filter(x=>x!=='fills '+fills):why);
 const q=p?jjLine(p):null;
 if(q)return '<div class="why" title="'+esc(w.all.join(' · '))+'">'
   +'<b class="jjl '+esc(p.lean)+'">'+esc(p.lean)+' '+(p.cv||'')+'</b> '
   +'<span class="jjq">“'+esc(q)+'”</span></div>';
 if(!w.top)return '';
 return '<div class="why" title="'+esc(w.all.join(' · '))+'">'+esc(w.top)
  +(w.rest?' <em>+'+w.rest+' more</em>':'')+'</div>';
}

/* Collapsible section. Everything below the decision is genuinely useful and
   genuinely ballast while the clock runs — 596px of "gone before" used to sit
   between the recommendations and the run tracker. Open state persists in S. */
function fold(key,title,body,o){
 o=o||{};
 const open=o.force||S.open[key];
 return '<details class="fold"'+(open?' open':'')
  +' ontoggle="S.open[\''+key+'\']=this.open?1:0">'
  +'<summary'+(o.alert?' class="alert"':'')+'>'+title
  +(o.count!=null?'<span class="cnt">'+o.count+'</span>':'')+'</summary>'
  +'<div class="foldb">'+body+'</div></details>';
}

/* "0%" is a claim of impossibility and this model is not entitled to make one —
   a top-35 player does occasionally fall twenty picks on news the board has not
   caught. Anything under a half point reads "<1%", and 99.5+ reads ">99%".
   Same reason the project would rather show a missing number than a made-up
   one: the rounding was inventing certainty at both ends. */
function pct(v){
 if(v<0.005)return '&lt;1%';
 if(v>0.995)return '&gt;99%';
 return Math.round(v*100)+'%';
}
/* Both numbers, same size, both labelled, never blended.
   The old block printed national at 17px with the room number at 12.5px
   underneath — while verdict() defers to the room number whenever one exists.
   The largest figure on the card was not the one driving the recommendation. */
function survBlock(s){
 if(!s)return '<div class="svpair"><span class="svl">survival needs your slot</span></div>';
 let h='<div class="svpair">'
  +'<span class="svone"><b class="sv '+svClass(s.nat)+'">'+pct(s.nat)+'</b><i class="svl">national</i></span>';
 if(s.room!=null)
  h+='<span class="svone"><b class="sv '+svClass(s.room)+'">'+pct(s.room)+'</b><i class="svl">this room</i></span>';
 else if(LP())h+='<span class="svone"><i class="svl">no room price</i></span>';
 if(s.thin)h+='<span class="svthin" title="'+esc(s.why)+'">thin</span>';
 return h+'</div>';
}

function runBlock(){
 const r=runStats();
 if(!r.last)return '<div class="box">No picks seen yet. Once the feed is live this shows '
   +'position runs and how much supply is left above each tier wall.</div>';
 const order=['RB','WR','TE','QB','K','DEF'];
 const tot=Object.values(r.l12).reduce((a,b)=>a+b,0)||1;
 let h='<div class="runbar">'+order.filter(k=>r.l12[k]).map(k=>
   '<i class="c'+k+'" style="width:'+(100*r.l12[k]/tot)+'%" title="'+k+' '+r.l12[k]+'"></i>').join('')+'</div>';
 h+='<div class="rl">'+order.filter(k=>r.l12[k]).map(k=>k+' <b>'+r.l12[k]+'</b>').join('')+'</div>';
 h+='<div class="rl" style="color:#7f8a9c">last '+r.last+' picks'
  +(r.sinceN?' · since your last pick: '+order.filter(k=>r.since[k]).map(k=>r.since[k]+' '+k).join(', '):'')+'</div>';
 r.hot.forEach(k=>{
  h+='<div class="hot"><b>'+k+' run — '+r.l12[k]+' of the last '+r.last+'.</b> '
   +'Supply at '+k+' is leaving faster than the board prices it.</div>';
 });
 const walls=['RB','WR','TE','QB'].map(p=>({p,t:tierLeft(p)})).filter(x=>x.t&&x.t.n<=6);
 walls.forEach(w=>{
  h+='<div class="rl" style="color:#e0b050">▾ <b>'+w.t.n+'</b> '+w.p
   +' left before the tier breaks at '+esc(w.t.wall.n)+'</div>';

function driftBox(){
 if(!LIVE.seq.length)return '';
 if(!DRIFT.ready)return '<div class="box">Pace calibration needs 12 drafted players that this '
   +'board prices; it has '+DRIFT.n+'. Until then the survival numbers run on the pre-draft '
   +'board with no live adjustment.</div>';

 return '<div class="box"><b style="color:#dfe6ef">Live pace</b><br>'
  +'Over the last 24 priced picks this room is drafting <b>'+Math.abs(DRIFT.nat).toFixed(0)
  +'</b> picks '+dir(DRIFT.nat)+' national ADP'
  +(LP()?', and <b>'+Math.abs(DRIFT.room).toFixed(0)+'</b> picks '+dir(DRIFT.room)+' its own two-draft pace price':'')
  +'. Both survival curves are shifted by that much.'
  +(DRIFT.spreadReady?'<br>Scatter around that centre is <b>'+DRIFT.spread.toFixed(2)+'×</b> what the '
    +'board’s own spreads predicted, so every curve is widened by the same factor. '
    +(DRIFT.spread>1.15?'This room is messier than the mock-draft field — treat single-pick certainties with suspicion.'
      :DRIFT.spread<0.9?'This room is running tighter to the board than the mock field does.'
      :'This room is tracking the board’s own dispersion closely.'):'')
  +'<div style="margin-top:6px;color:#69748a">Median, not mean, so one reach cannot move it. '
  +'Measured only on players who have actually been drafted — it reads this room’s '
  +'aggression, not the whole board, and it is survivorship-biased by construction.</div></div>';
}

/* FAAB as a share of REMAINING budget, priced against what rivals can still
   spend. A 30% bid means something different when the league is broke. */
function faabBid(p){
 const my=LEAGUE?LEAGUE.myFaab:META.faab;
 let base=6;
 if(p.lean==='BUY')base+=8*(p.cv||1);
 if(p.lean==='WATCH')base+=4;
 if(p.lean==='FADE')base=2;
 if(p.dp)base+=3;
 const rivalPressure=LEAGUE?Math.min(1.6,Math.max(.5,LEAGUE.maxFaab/Math.max(1,my))):1;
 const pct=Math.max(1,Math.min(60,Math.round(base*rivalPressure)));
 return {pct,dollars:Math.max(1,Math.round(my*pct/100))};
}

/* A cheap fingerprint of everything the Draft Room draws from. livePoll() used

   screen from a string and swapping innerHTML. That destroyed text selection,

function roomSig(){

}

 rcBust();

/* ---------- the quick-entry box ----------
   Rebuilt on every render, so the listeners are attached here rather than once
   at boot. Focus and caret position are restored because a poll arriving
   mid-word must not eat what he is typing — at three seconds a poll, that
   would happen constantly. */
function wireRoom(){
 const i=document.getElementById('qei'); if(!i)return;
 /* Focus restoration used to sit INSIDE `if(QE.q)`, so an EMPTY box lost the
    caret on the next poll: tap it, hesitate for three seconds, and the cursor
    silently vanished before the first keystroke. Restore whenever the box was
    focused, empty or not. */
 i.value=QE.q||'';
 if(QE.focus){i.focus(); const n=(QE.q||'').length; try{i.setSelectionRange(n,n);}catch(e){}}
 i.oninput=e=>{QE.q=e.target.value;QE.sel=0;QE.focus=1;qeDraw();};
 i.onblur=()=>{QE.focus=0;setTimeout(qeDraw,150);};
 i.onfocus=()=>{QE.focus=1;qeDraw();};
 i.onkeydown=e=>{
  const rows=QE.rows;
  if(e.key==='ArrowDown'){e.preventDefault();QE.sel=Math.min(QE.sel+1,rows.length-1);qeDraw();}
  else if(e.key==='ArrowUp'){e.preventDefault();QE.sel=Math.max(QE.sel-1,0);qeDraw();}
  else if(e.key==='Enter'){
   e.preventDefault();
   const p=rows[QE.sel]; if(!p)return;
   if(e.ctrlKey||e.metaKey)claimById(p.g); else markById(p.g);
   QE.q='';QE.sel=0;QE.focus=1;
  }
  else if(e.key==='Escape'){QE.q='';qeDraw();}
 };
 qeDraw();
}
function qeDraw(){
 const d=document.getElementById('qed'); if(!d)return;
 QE.rows=qeMatch(QE.q);
 if(!QE.rows.length||!QE.focus){d.style.display='none';d.innerHTML='';return;}
 d.style.display='block';
 /* Each row carries BOTH actions. The row used to call markById only, so on a
    touch device — where Ctrl+Enter does not exist — there was no pointer path
    to "I drafted him" anywhere in the Draft Room. */
 d.innerHTML=QE.rows.map((p,i)=>
  '<div class="qer'+(i===QE.sel?' sel':'')+'">'
  +'<span onmousedown="event.preventDefault();markById(\''+p.g+'\')" style="flex:1;min-width:0">'
  +esc(p.n)+'</span>'
  +'<small>'+esc(p.p)+' '+esc(p.tm)+' · '+(p.adp==null?'undrafted':p.adp.toFixed(1))+'</small>'
  +'<button class="dh sm" onmousedown="event.preventDefault();event.stopPropagation();claimById(\''+p.g+'\')">Mine</button>'
  +'</div>').join('');
}

/* ---------- actions ----------
   These write to the HAND-MARK objects, never to TAKEN. TAKEN is rebuilt from
   the hand marks and the feed together by recompute(). Un-marking a player the
   feed says is gone records a SUPPRESS override rather than doing nothing —
   that is the escape hatch for a bad id match, and without it a single wrong
   match would be uncorrectable for the rest of the draft. */
function snap(){HIST.push(JSON.stringify({A:MANUAL,M:MANUAL_MINE,S:SUPPRESS}));}
function mark(i){const p=PL[i];if(!p)return;markById(p.g);}
function markById(g){
 if(!BYID[g])return;
 snap();
 if(TAKEN[g]&&MINE.indexOf(g)<0){
  delete MANUAL[g];
  if(FEED[g])SUPPRESS[g]=1;
 }else{
  MANUAL[g]=1; delete SUPPRESS[g];
  MANUAL_MINE=MANUAL_MINE.filter(x=>x!==g);
 }
 recompute();saveState();render();}
function claim(i){const p=PL[i];if(!p)return;claimById(p.g);}
function claimById(g){
 if(!BYID[g])return;
 snap();
 if(MINE.indexOf(g)>=0){
  MANUAL_MINE=MANUAL_MINE.filter(x=>x!==g);
  delete MANUAL[g];
  if(FEED[g])SUPPRESS[g]=1;
 }else{
  MANUAL_MINE.push(g); delete SUPPRESS[g];
 }
 recompute();saveState();render();}
function undo(){if(!HIST.length)return;const s=JSON.parse(HIST.pop());
 MANUAL=s.A;MANUAL_MINE=s.M;SUPPRESS=s.S||{};recompute();saveState();render();}
function setSlot(v){SLOT=parseInt(v)||0;saveState();render();}

/* The league-adjusted price, explained. This is where the model has to justify
   itself: both prices, the gap, what it means in rounds, and the caveat that it
   is positional PACE rather than a per-pick reach claim about any manager. */
function leagueBox(x){
 const l=LP();
 if(!l)return '';
 if(x.al==null){
  const why=LP_WHY[x.lc]||'not measured in both prior drafts';
  return '<div class="box"><b style="color:#dfe6ef">League-adjusted price</b> — none. '
   +esc(why)+'. National ADP is the only price for him.</div>';
 }
 const gap=x.ls, rd=x.lr||rdOf(x.al), natRd=rdOf(x.adp);
 const verdict = gap<=-lpMaterial()
   ? '<b style="color:#ffb08a">Take him earlier than the board says.</b> He goes about '
     +Math.abs(Math.round(gap))+' picks sooner in this room'
     +(rd<natRd?' — round '+rd+' here versus round '+natRd+' nationally.':'.')
   : gap>=lpMaterial()
   ? '<b style="color:#7fe3d4">He lasts longer here.</b> About '+Math.round(gap)
     +' picks of extra patience'+(rd>natRd?' — round '+rd+' here versus round '+natRd+' nationally.':'.')
   : '<b>Trades at market.</b> This room prices him within '+lpMaterial()+' picks of the national board.';
 return '<div class="box"><b style="color:#dfe6ef">League-adjusted price</b><br>'
  +'National ADP <b>'+x.adp.toFixed(1)+'</b> (R'+natRd+') → this league <b>'+x.al.toFixed(1)+'</b> (R'+rd+') '
  +'· shift <b>'+(gap>0?'+':'')+gap.toFixed(1)+'</b><br>'+verdict
  +'<div style="margin-top:6px;color:#69748a">'+esc(l.caveat)+'</div>'
  +'<div style="margin-top:4px;color:#69748a">Display only — best-available, tier walls and the '
  +'round filters all still run on national ADP.</div></div>';
}

function md(t){
 const L=t.split('\n');let o='',inl=0;
 for(let ln of L){
  let s=ln.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')
     .replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  if(/^###\s/.test(s)){if(inl){o+='</ul>';inl=0}o+='<h3>'+s.slice(4)+'</h3>';}
  else if(/^##\s/.test(s)){if(inl){o+='</ul>';inl=0}o+='<h2>'+s.slice(3)+'</h2>';}
  else if(/^#\s/.test(s)){if(inl){o+='</ul>';inl=0}o+='<h1>'+s.slice(2)+'</h1>';}
  else if(/^\s*[-*]\s/.test(s)){if(!inl){o+='<ul>';inl=1}o+='<li>'+s.replace(/^\s*[-*]\s/,'')+'</li>';}
  else{if(inl){o+='</ul>';inl=0} if(s.trim())o+='<p>'+s+'</p>';}
 }
 if(inl)o+='</ul>';return o;}
