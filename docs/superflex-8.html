     +(d.pick!==d.act?' · last usable pick '+d.pick:'')+'</div></div>'
     +'<div class="adp"><b>'+(live?Math.max(0,d.act-next+1):'—')+'</b><i>'+(live?'picks left':'passed')+'</i></div>'
     +'</div><div class="snip" style="-webkit-line-clamp:unset;display:block">'+esc(d.note)+'</div></div>';
  });
  h+='</div>';
 }

 h+='<div class="sec">The sheet</div><div class="plansheet">';
 PLAN.picks.forEach(p=>{
  const past=p.pick<next, now=(p.pick===nowPick);
  h+='<div class="planrow'+(past?' past':'')+'">';
  h+='<div class="rh'+(now?' now':'')+'">ROUND '+p.r+' · PICK '+p.pick
    +' <span>'+esc(p.target)+(now?' — you are up':'')+'</span></div>';
  h+='<div class="c" style="display:block'+(now?';border-color:var(--positive)':'')+'">';
  const prim=(p.primary||[]), fb=(p.fallbacks||[]);
  if(prim.length)h+=prim.map(planName).join('');
  else h+='<div class="cv" style="padding:3px 0">Best available — no pre-committed name.</div>';
  if(fb.length)h+='<details style="margin-top:5px"><summary class="cv" style="cursor:pointer">'
    +fb.length+' fallback'+(fb.length>1?'s':'')+'</summary><div style="margin-top:3px">'
    +fb.map(planName).join('')+'</div></details>';
  if(p.avoid&&p.avoid.length)h+='<div style="margin-top:5px"><span class="cv">not here: </span>'
    +p.avoid.map(n=>'<span class="pill FADE">'+esc(n)+'</span>').join('')+'</div>';
  if(p.why)h+='<details style="margin-top:5px"><summary class="cv" style="cursor:pointer">why</summary>'
    +'<div class="snip" style="-webkit-line-clamp:unset;display:block">'+esc(p.why)+'</div></details>';
  h+='</div></div>';
 });
 h+='</div>';

 if(PLAN.basis)h+='<div class="box"><b>Board.</b> '+esc(PLAN.basis)+'</div>';
 if(PLAN.caveats&&PLAN.caveats.length){
  h+='<details class="box"><summary style="cursor:pointer"><b>What this plan does not know ('
    +PLAN.caveats.length+')</b></summary><div style="margin-top:6px">'
    +PLAN.caveats.map(c=>'<div class="cn">'+esc(c)+'</div>').join('')+'</div></details>';
 }
 return h;
}

/* Board and Players were two tabs on the same 378-player dataset, the same
   filter chrome and the same card — round-grouped browse vs search-first lookup.
   They are ONE tab now (a browse/search toggle inside it), which frees a nav
   slot and un-crowds the phone bar: draft mode goes 7 tabs -> 6. Season mode
   never had a board, so its search-only Players tab stays. */
const TABS={draft:[['room','Draft Room'],['plan','Plan'],['board','Board & Players'],['team','My Team'],['compare','Compare'],['usage','Usage']],
            season:[['waivers','Waivers'],['team','My Team'],['players','Players']]};
/* Intel + Contingency demoted out of the main tab row (2026-08-26) — reference
   surfaces, not draft-clock surfaces. They live in the "More" overflow, still
   one tap; their views and all their logic are unchanged. */
const MORE={draft:[['outlines','Intel'],['cont','Contingency']],
            season:[['outlines','Intel'],['cont','Contingency']]};
let MOREOPEN=false;

/* ---------- land where you are ----------
   The Board and the Plan are both ordered by round from round 1, so mid-draft
   they open on picks that are already gone. Only the ENTRY POINT moves: the
   top of the board is still one scroll up, and nothing has been removed.
   Deliberately NOT called from the poll loop — a screen that re-seeks itself
   every three seconds is worse than one that opens in the wrong place. */
function seekNow(){
 if(S.tab!=='board'&&S.tab!=='plan')return;
 const el=document.querySelector('.rh.now'); if(!el)return;
 const hdr=document.querySelector('header');
 const y=el.getBoundingClientRect().top+window.scrollY-((hdr?hdr.offsetHeight:0)+10);
 if(y>4)window.scrollTo(0,y);
}

function renderTabs(){
 const t=TABS[MODE], m=MORE[MODE]||[];
 // Guard now considers the overflow items too, so a demoted tab (Intel /
 // Contingency) is a legal current tab and is NOT bounced to the first one.
 if(!t.concat(m).find(x=>x[0]===S.tab))S.tab=t[0][0];
 const inMore=m.some(x=>x[0]===S.tab);
 const el=document.getElementById('tabs');
 el.innerHTML=t.map(([k,l])=>
  '<button data-t="'+k+'"'+(S.tab===k?' class="on"':'')+'>'+l+'</button>').join('')
  +(m.length?('<button class="moretab'+(inMore?' on':'')+'" data-more="1" aria-haspopup="true" aria-expanded="'+(MOREOPEN?'true':'false')+'">More ▾</button>'
   +'<div class="moremenu'+(MOREOPEN?' open':'')+'" id="moremenu" role="menu">'
   +m.map(([k,l])=>'<button data-t="'+k+'" role="menuitem"'+(S.tab===k?' class="on"':'')+'>'+l+'</button>').join('')
   +'</div>'):'');
 el.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{
  S.tab=b.dataset.t;S.q='';S.showAll=0;MOREOPEN=false;
  const qq=document.getElementById('q');if(qq)qq.value='';
  renderTabs();render();window.scrollTo(0,0);seekNow();});
 const mb=el.querySelector('button[data-more]');
 if(mb)mb.onclick=e=>{e.stopPropagation();MOREOPEN=!MOREOPEN;renderTabs();};
 if(!renderTabs._dismiss){renderTabs._dismiss=1;
  document.addEventListener('click',ev=>{if(MOREOPEN&&!ev.target.closest('#tabs')){MOREOPEN=false;renderTabs();}});}
 if(MOREOPEN)positionMoreMenu();
}
function positionMoreMenu(){
 const b=document.querySelector('#tabs button[data-more]'), mm=document.getElementById('moremenu');
 if(b&&mm){const r=b.getBoundingClientRect();
  mm.style.top=r.bottom+'px'; mm.style.right=Math.max(6,window.innerWidth-r.right)+'px';}
}

/* A cheap fingerprint of everything the Draft Room draws from. livePoll() used
   to call render() unconditionally on every successful poll — every three
   seconds, whether or not a single thing had changed — rebuilding a ~2,250px
   screen from a string and swapping innerHTML. That destroyed text selection,
   scroll position inside the folds, and the caret in the quick-entry box.
   Nothing here is expensive: it is counters and ids, not board state. */
function roomSig(){
 const d=DRIFT||{}, f=v=>(typeof v==='number'?v.toFixed(2):'-');
 return [S.tab,MODE,SLOT,picksMade(),MINE.length,LIVE.on?1:0,LIVE.status,LIVE.err,
   LIVE.seq.length,LIVE.unmatched,LIVE.fails,LIVE.autoSlot,d.n,
   f(d.nat),f(d.room),f(d.spread),
   QE.q,STATE_OK?1:0].join('|');
}
let LASTSIG=null;
function renderIfChanged(){
 rcBust();
 const sig=roomSig();
 if(sig===LASTSIG)return false;
 render();
 return true;
}

function render(){
 rcBust();
 LASTSIG=roomSig();
 const v=document.getElementById('view');
 /* The active tab, on <body>, so the stylesheet can scope a rule to one screen
    without the JS having to know about presentation. Used by exactly one rule
    today — the Board's take snippet, which folds behind the tap on a laptop. */
 document.body.dataset.tab=S.tab;
 // Board&Players sub-mode, so the stylesheet can keep the take snippet folded on
 // a laptop while BROWSING (a scanning surface) but show it while SEARCHING (a
 // lookup, where the snippet is the point of the result row).
 document.body.dataset.boardview=boardView();
 document.getElementById('ctl').style.display=(S.tab==='cont'||S.tab==='outlines'||S.tab==='team'||S.tab==='room'||S.tab==='plan'||S.tab==='compare'||S.tab==='usage')?'none':'block';
 document.getElementById('fab').style.display=(S.tab==='board'||S.tab==='team'||S.tab==='players'||S.tab==='room')?'flex':'none';
 /* Round headers stick below the real header, whatever height it currently is.
    Measured AFTER the #ctl show/hide above, because #ctl lives inside <header>:
    a tab that hides it (Intel, Plan, My Team, Contingency) has a SHORTER header,
    and reading --hh before the toggle kept the previous tab's taller height —
    which left the sticky "N EPISODES"/round header floating mid-screen with the
    cards overlapping it. */
 const hdr=document.querySelector('header');
 if(hdr)document.documentElement.style.setProperty('--hh',hdr.offsetHeight+'px');
 document.getElementById('undoBtn').textContent='Undo'+(HIST.length?' ('+HIST.length+')':'');
 if(S.tab==='room'){
   // Snapshot the LIVE input before the swap — see the QE_SWAP note above.
   const qi0=document.getElementById('qei');
   if(qi0){ if(document.activeElement===qi0)QE.focus=1;
            try{QE.caret=qi0.selectionStart;}catch(e){QE.caret=null;} }
   QE_SWAP=1; v.innerHTML=viewRoom(); QE_SWAP=0;
   wireRoom();
 }
 else if(S.tab==='plan')v.innerHTML=viewPlan();
 else if(S.tab==='board')v.innerHTML=viewBoard();
 else if(S.tab==='team')v.innerHTML=viewTeam();
 else if(S.tab==='players')v.innerHTML=viewPlayers();
 else if(S.tab==='waivers')v.innerHTML=viewWaivers();
 else if(S.tab==='compare'){ if(v.dataset.ub!=='compare'||!v.querySelector('.ub')){UB.mountCompare(v,META.superflex?'bk':'joop');v.dataset.ub='compare';} }
 else if(S.tab==='usage'){ if(v.dataset.ub!=='usage'||!v.querySelector('.ub')){UB.mountUsage(v,META.superflex?'bk':'joop');v.dataset.ub='usage';} }
 else if(S.tab==='outlines'){v.innerHTML=viewOutlines();
   document.getElementById('q2').oninput=e=>{S.q=e.target.value.toLowerCase().trim();renderEps();};renderEps();}
 else {v.innerHTML=viewCont();
   document.getElementById('q3').oninput=e=>{S.q=e.target.value.toLowerCase().trim();render();};}
 // The build stamp is not decoration. A hub page that silently serves a
 // week-old payload looks exactly like a fresh one, and that failure is the
 // whole reason this page stopped carrying its own data. Show when it was made.
 const sub=picksMade()+' drafted \u00b7 '+MINE.length+' on your roster \u00b7 '
  +META.takes+' takes \u00b7 '+META.eps+' episodes \u00b7 '
  +(META.draft ? 'draft '+META.draft : 'draft date TBD')
  +(BUILT?' \u00b7 built '+esc(BUILT.slice(0,16).replace('T',' '))+'Z':'');
 document.getElementById('sub').textContent=sub;
}

/* ---------- the quick-entry box ----------
   Rebuilt on every render, so the listeners are attached here rather than once
   at boot. Focus and caret position are restored because a poll arriving
   mid-word must not eat what he is typing — at three seconds a poll, that
   would happen constantly. */
function wireRoom(){
 const i=document.getElementById('qei'); if(!i)return;
 /* Focus restoration used to sit INSIDE `if(QE.q)`, so an EMPTY box lost the
    caret on the next poll: tap it, hesitate for three seconds, and the cursor
    silently vanished before the first keystroke. Restore whenever the box was
    focused, empty or not. */
 i.value=QE.q||'';
 if(QE.focus){i.focus();
  const n=(QE.caret!=null?Math.min(QE.caret,i.value.length):i.value.length);
  try{i.setSelectionRange(n,n);}catch(e){}}
 i.oninput=e=>{QE.q=e.target.value;QE.sel=0;QE.focus=1;QE.caret=e.target.selectionStart;qeDraw();};
 /* A blur caused by the re-render is not the user leaving the box. */
 i.onblur=()=>{if(QE_SWAP)return;QE.focus=0;QE.caret=null;setTimeout(qeDraw,150);};
 i.onfocus=()=>{QE.focus=1;qeDraw();};
 i.onkeydown=e=>{
  const rows=QE.rows;
  if(e.key==='ArrowDown'){e.preventDefault();QE.sel=Math.min(QE.sel+1,rows.length-1);qeDraw();}
  else if(e.key==='ArrowUp'){e.preventDefault();QE.sel=Math.max(QE.sel-1,0);qeDraw();}
  else if(e.key==='Enter'){
   e.preventDefault();
   const p=rows[QE.sel]; if(!p)return;
   if(e.ctrlKey||e.metaKey)claimById(p.g); else markById(p.g);
   QE.q='';QE.sel=0;QE.focus=1;QE.caret=0;
  }
  else if(e.key==='Escape'){QE.q='';qeDraw();}
 };
 qeDraw();
}
function qeDraw(){
 const d=document.getElementById('qed'); if(!d)return;
 QE.rows=qeMatch(QE.q);
 if(!QE.rows.length||!QE.focus){d.style.display='none';d.innerHTML='';return;}
 d.style.display='block';
 /* Each row carries BOTH actions. The row used to call markById only, so on a
    touch device — where Ctrl+Enter does not exist — there was no pointer path
    to "I drafted him" anywhere in the Draft Room. */
 d.innerHTML=QE.rows.map((p,i)=>
  '<div class="qer'+(i===QE.sel?' sel':'')+'">'
  +'<span onmousedown="event.preventDefault();markById(\''+p.g+'\')" style="flex:1;min-width:0">'
  +esc(p.n)+'</span>'
  +'<small>'+esc(p.p)+' '+esc(p.tm)+' · '+(p.adp==null?'undrafted':p.adp.toFixed(1))+'</small>'
  +'<button class="dh sm" onmousedown="event.preventDefault();event.stopPropagation();claimById(\''+p.g+'\')">Mine</button>'
  +'</div>').join('');
}

/* ---------- actions ----------
   These write to the HAND-MARK objects, never to TAKEN. TAKEN is rebuilt from
   the hand marks and the feed together by recompute(). Un-marking a player the
   feed says is gone records a SUPPRESS override rather than doing nothing —
   that is the escape hatch for a bad id match, and without it a single wrong
   match would be uncorrectable for the rest of the draft. */
function snap(){HIST.push(JSON.stringify({A:MANUAL,M:MANUAL_MINE,S:SUPPRESS}));}
function mark(i){const p=PL[i];if(!p)return;markById(p.g);}
function markById(g){
 if(!BYID[g])return;
 snap();
 if(TAKEN[g]&&MINE.indexOf(g)<0){
  delete MANUAL[g];
  if(FEED[g]||ROSTER[g])SUPPRESS[g]=1;
 }else{
  MANUAL[g]=1; delete SUPPRESS[g];
  MANUAL_MINE=MANUAL_MINE.filter(x=>x!==g);
 }
 recompute();saveState();render();}
function claim(i){const p=PL[i];if(!p)return;claimById(p.g);}
function claimById(g){
 if(!BYID[g])return;
 snap();
 if(MINE.indexOf(g)>=0){
  MANUAL_MINE=MANUAL_MINE.filter(x=>x!==g);
  delete MANUAL[g];
  if(FEED[g]||ROSTER[g])SUPPRESS[g]=1;
 }else{
  MANUAL_MINE.push(g); delete SUPPRESS[g];
 }
 recompute();saveState();render();}
function undo(){if(!HIST.length)return;const s=JSON.parse(HIST.pop());
 MANUAL=s.A;MANUAL_MINE=s.M;SUPPRESS=s.S||{};recompute();saveState();render();}
function setSlot(v){SLOT=parseInt(v)||0;saveState();render();}
/* recompute() on every flip: TAKEN/MINE now derive from a mode-dependent
   source (feed in draft, rosters in season), so the flip must re-derive or the
   screen shows the OTHER mode's truth. seasonAutoLoad() self-populates a
   season view reached by tapping the badge, not just by the calendar — it is
   gated inside (season mode + per-league auto flag + not already connected),
   so in every other case it is a no-op. */
function toggleMode(){MODE=MODE==='draft'?'season':'draft';recompute();applyMode();saveState();renderTabs();render();seasonAutoLoad();}
function applyMode(){
 const b=document.getElementById('modeBadge');
 b.textContent=MODE==='draft'?'DRAFT':'SEASON';
 b.className='mode'+(MODE==='season'?' season':'');
}

/* The league-adjusted price, explained. This is where the model has to justify
   itself: both prices, the gap, what it means in rounds, and the caveat that it
   is positional PACE rather than a per-pick reach claim about any manager. */
function leagueBox(x){
 const l=LP();
 if(!l)return '';
 if(x.al==null){
  const why=LP_WHY[x.lc]||'not measured in both prior drafts';
  return '<div class="box"><b style="color:var(--text)">League-adjusted price</b> — none. '
   +esc(why)+'. National ADP is the only price for him.</div>';
 }
 const gap=x.ls, rd=x.lr||rdOf(x.al), natRd=rdOf(x.adp);
 const verdict = gap<=-lpMaterial()
   ? '<b style="color:var(--caution)">Take him earlier than the board says.</b> He goes about '
     +Math.abs(Math.round(gap))+' picks sooner in this room'
     +(rd<natRd?' — round '+rd+' here versus round '+natRd+' nationally.':'.')
   : gap>=lpMaterial()
   ? '<b style="color:var(--accent)">He lasts longer here.</b> About '+Math.round(gap)
     +' picks of extra patience'+(rd>natRd?' — round '+rd+' here versus round '+natRd+' nationally.':'.')
   : '<b>Trades at market.</b> This room prices him within '+lpMaterial()+' picks of the national board.';
 return '<div class="box"><b style="color:var(--text)">League-adjusted price</b><br>'
  +'National ADP <b>'+x.adp.toFixed(1)+'</b> (R'+natRd+') → this league <b>'+x.al.toFixed(1)+'</b> (R'+rd+') '
  +'· shift <b>'+(gap>0?'+':'')+gap.toFixed(1)+'</b><br>'+verdict
  +'<div style="margin-top:6px;color:var(--text-mute)">'+esc(l.caveat)+'</div>'
  +'<div style="margin-top:4px;color:var(--text-mute)">Display only — best-available, tier walls and the '
  +'round filters all still run on national ADP.</div></div>';
}

function openP(i){
 const x=PL[i],a=x.adp;
 document.getElementById('on').textContent=x.n+'  \u00b7  '+x.p+' '+x.tm;
 let h='<div class="box"><b style="color:var(--text)">ADP</b> '+(a==null

     +(x.mv?'<br>Moved '+(x.mv>0?'+':'')+x.mv.toFixed(1)+' since '+esc(META.adpPrev)+' \u2192 <b>'+esc(x.es)+'</b>':'<br>Edge status: <b>'+esc(x.es)+'</b>')
     +(x.sd!=null?'<br>stddev '+x.sd.toFixed(1)+' on n='+x.nd+(x.sdok?'':' \u2014 <b>below n=100, do not rank on this</b>'):''))
   +'</div>';
 h+=survBox(x);
 h+=leagueBox(x);
 if(x.tc)h+='<div class="warn"><b>Team changed since these takes.</b> The outlines have him on '

 if(x.ro===false)h+='<div class="warn"><b>Not on a 2026 NFL roster.</b> The team shown is his last known team, not a current one.</div>';
 const d=DEPTH[x.g];
 if(d)h+='<div class="box"><b style="color:var(--text)">Posted depth chart</b> \u2014 '+esc(d.t)+' '+esc(d.s)+', rank '+esc(d.r)+' (as of '+esc(META.depthAsOf)+'). This is the team\u2019s own listing, not the podcast\u2019s inference.</div>';
 if(x.tg&&x.tg.length)h+='<div>'+x.tg.map(t=>'<span class="pill NEUTRAL">'+esc(t)+'</span>').join('')+'</div>';

 if(!x.h||!x.h.length){h+='<div class="box">No podcast take on this player. He is here because he is on the ADP board.</div>';}
 else{
  h+='<div class="sec">Opinion history \u2014 oldest first \u00b7 '+x.h.length+'</div>';
  h+=x.h.map(e=>'<div class="ev"><div class="evd">'+esc(e.d)+' \u00b7 '+esc(e.s)+(e.e?' ep '+esc(e.e):'')+' \u00b7 '+esc(e.sp)+'</div>'
   +'<div>'+(e.l?'<span class="pill '+e.l+'">'+esc(e.l)+'</span>':'')+'<span class="cv">conv '+(e.c||'\u2014')+'</span>'
   +(e.rk&&e.rk!=='blank'?'<span class="cv"> \u00b7 stated '+esc(e.rk)+'</span>':'')+'</div>'
   +'<div class="evt">'+esc(e.t)+'</div>'
   +(e.st&&e.st!=='none'?'<div class="evs">Stats: '+esc(e.st)+(e.ms?'<span class="msv">Market Score '+esc(e.ms)+'</span>':'')+'</div>':'')
   +(e.mv&&e.mv!=='n/a'?'<div class="evs">Model vs JJ: '+esc(e.mv)+'</div>':'')
   +(e.nr?'<div class="evn">\u26a0 '+esc(e.nr)+'</div>':'')
   +'<div><button class="src" onclick="openEp(\''+e.f+'\',\''+x.n.replace(/'/g,"\\'")+'\')">Read the outline \u2192</button>'
   +(e.u?' <a href="'+esc(e.u)+'" target="_blank" rel="noopener" style="font-size:var(--fs-meta)">episode</a>':'')+'</div></div>').join('');
 }
 const rel=CN.filter(c=>c.r.toLowerCase().indexOf(x.n.toLowerCase())>=0);
 h+='<div class="sec">Contingency ('+rel.length+')</div>'+(rel.length
  ?rel.map(c=>'<div class="cn">'+esc(c.r)+'</div>').join('')
  :'<div class="cn" style="color:var(--text-mute)">No contingency relationship logged. The podcast never addressed this situation \u2014 that is an absence of data, not a judgement.</div>');
 document.getElementById('ob').innerHTML=h;
 const ov=document.getElementById('ov');ov.classList.add('show');ov.scrollTop=0;}
function closeOv(){document.getElementById('ov').classList.remove('show');}
function closeOv2(){document.getElementById('ov2').classList.remove('show');}
function closeOv3(){document.getElementById('ov3').classList.remove('show');}

function md(t){
 const L=t.split('\n');let o='',inl=0;
 for(let ln of L){
  let s=ln.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')
     .replace(/\[(.+?)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  if(/^###\s/.test(s)){if(inl){o+='</ul>';inl=0}o+='<h3>'+s.slice(4)+'</h3>';}
  else if(/^##\s/.test(s)){if(inl){o+='</ul>';inl=0}o+='<h2>'+s.slice(3)+'</h2>';}
  else if(/^#\s/.test(s)){if(inl){o+='</ul>';inl=0}o+='<h1>'+s.slice(2)+'</h1>';}
  else if(/^\s*[-*]\s/.test(s)){if(!inl){o+='<ul>';inl=1}o+='<li>'+s.replace(/^\s*[-*]\s/,'')+'</li>';}
  else{if(inl){o+='</ul>';inl=0} if(s.trim())o+='<p>'+s+'</p>';}
 }
 if(inl)o+='</ul>';return o;}

function openEp(f,hl){
 const e=EPS.find(x=>x.f===f)||{t:f};
 document.getElementById('on2').textContent=e.t;
 document.getElementById('ob2').innerHTML=md(EPTXT[f]||'Outline not found.');
 const ov=document.getElementById('ov2');ov.classList.add('show');ov.scrollTop=0;
 if(hl){setTimeout(()=>{
   const hs=[...document.querySelectorAll('#ob2 h3')];
   const t=hs.find(h=>h.textContent.toLowerCase().indexOf(hl.toLowerCase())>=0);
   if(t){t.classList.add('hl');t.scrollIntoView({block:'center'});}
 },60);}}

/* ---------- setup / league sync ---------- */

    +(LIVE.teams||'?')+' teams · '+(LIVE.rounds||'?')+' rounds · '+LIVE.pickTimer+'s clock':'')
  +'<br><br>Rounds, teams, clock, snake type and the draft order are all re-read from Sleeper '

  +'<div id="syncMsg" style="font-size:var(--fs-body);color:var(--text-mute);margin-top:8px"></div>'
  /* headerNote() has always promised "tap Setup to see them" about the

  +(function(){

 document.getElementById('ov3').classList.add('show');

async function syncLeague(){
 /* #syncMsg only exists while the Setup overlay is open. This function now
    also runs unattended at boot (seasonAutoLoad), so writing status into a
    throwaway object when the panel is closed keeps every assignment below
    valid without sprinkling null checks through it. */
 const m=document.getElementById('syncMsg')||{};
 m.textContent='Contacting Sleeper\u2026';
 try{
  const L=META.leagueId;
  const [rosters,users]=await Promise.all([
   fetch('https://api.sleeper.app/v1/league/'+L+'/rosters').then(r=>r.json()),
   fetch('https://api.sleeper.app/v1/league/'+L+'/users').then(r=>r.json())
  ]);
  const rostered=[];const faabOf={};
  rosters.forEach(r=>{(r.players||[]).forEach(p=>rostered.push(p));
    faabOf[r.roster_id]=META.faab-((r.settings&&r.settings.waiver_budget_used)||0);});
  // Identify by user_id, not display name. A display-name lookup that misses
  // used to fall through to a full $100 budget while still reporting success.
  const mine=rosters.find(r=>r.owner_id===META.sleeperUserId);
  if(!mine){
   LEAGUE=null;
   MYROSTER=null;recompute();   // roster authority off -> fall back to the feed
   m.innerHTML='<b style="color:var(--urgent)">Could not find your roster.</b> No team in this league is owned by '
     +'user id '+esc(META.sleeperUserId)+'. FAAB advice would be guesswork, so the waiver view stays off.';
   render();return;
  }
  /* The live rosters, kept for TAKEN/MINE derivation (recompute) and for the
     My Team starters mirror (_rosterState). Union of every roster = who is
     actually off the waiver wire TODAY; Chris's own roster = MINE. This is
     what lets the season page track adds/drops/trades instead of replaying
     draft night. */
  MYROSTER=mine;
  ROSTER={};
  rosters.forEach(r=>{(r.players||[]).forEach(sid=>{ROSTER[rosterGid(sid)]=1;});});
  ROSTER_MINE=(mine.players||[]).map(sid=>rosterGid(sid));
  recompute();
  const myFaab=faabOf[mine.roster_id];
  const rivals=rosters.filter(r=>r.roster_id!==mine.roster_id).map(r=>faabOf[r.roster_id]).sort((a,b)=>a-b);
  const mid=rivals.length?(rivals.length%2?rivals[(rivals.length-1)/2]
            :(rivals[rivals.length/2-1]+rivals[rivals.length/2])/2):META.faab;
  LEAGUE={name:META.league,teams:rosters.length,rostered,myFaab,
    maxFaab:rivals.length?rivals[rivals.length-1]:META.faab,   // rivals only, not you
    medFaab:mid};
  m.innerHTML='<b style="color:var(--positive)">Synced.</b> '+rosters.length+' rosters, '+rostered.length
    +' players rostered. Your FAAB $'+myFaab+', richest rival $'+LEAGUE.maxFaab+'.';
  render();
 }catch(e){
  m.innerHTML='<b style="color:var(--urgent)">Could not reach Sleeper.</b> '
   +'This can happen if the artifact sandbox blocks outbound requests \u2014 open the saved HTML file '
   +'in a normal browser tab and try again. The draft board works fully offline either way.';
 }
}

/* One request at boot, not a polling loop. Deliberate: this page is public, and
   a hub that hammers Sleeper every three seconds for anyone who happens to open
   it is both rude and pointless. If the draft is actually running, polling
   starts by itself and Chris does not have to remember anything on the day. */
async function liveProbe(){
 if(MODE!=='draft'||!liveEnabled())return;
 const id=LIVE.draftId||META.liveDraft.draftId;
 try{
  const d=await fetch(SLEEPER+id,{cache:'no-store'}).then(r=>r.ok?r.json():null);
  if(!d||!d.draft_id)return;
  LIVE.cfg=d;LIVE.status=d.status||'';LIVE.draftId=id;
  // Take the clock from the probe too. It costs nothing — the response is
  // already here — and without it the timer reads --:-- until the first poll
  // lands, which on draft day is the first three seconds of being on the clock.
  LIVE.lastPicked=d.last_picked||0;
  const st=d.settings||{};
  if(st.pick_timer)LIVE.pickTimer=st.pick_timer;
  if(st.teams)LIVE.teams=st.teams; if(st.rounds)LIVE.rounds=st.rounds;
  LIVE.order=d.draft_order||null;
  if(d.status==='drafting'||d.status==='paused')liveStart(id);
  else render();
 }catch(e){ /* offline, blocked, or the id is wrong. The board still works,
    and the Draft Room says so rather than pretending to be connected. */ }
}

/* SEASON auto-load (run #31). The plain hub link — no url hash, no taps — must
   come up populated: the finished draft's picks AND the live league rosters.
   Two pulls, the same two the Setup buttons fire, in order:

     1. the draft feed, ONCE (livePoll without a timer). Same manners as
        liveProbe above: this page is public and its draft is over, so it has
        no business polling Sleeper every three seconds for whoever opens it.
        The one shot fills the pick log (picksMade), FEED as the fallback
        source, and SLMETA for roster-id name resolution.
     2. syncLeague(), which pulls rosters + FAAB and hands TAKEN/MINE to the
        roster authority (recompute).

   Gates, in order: SEASON only (draft day belongs to liveProbe, untouched);
   per-league opt-in via META.liveDraft.auto — "live_auto" in leagues/<id>.json,
   ON for superflex-8 only, so joop-14 ships this code dormant; and LIVE.on,
   so a page already connected (url-hash draft id, mid-draft toggle) is not
   connected twice. Failures degrade exactly as before: feed-only, or the
   "Open Setup and tap Sync league" empty state. */
async function seasonAutoLoad(){
 if(MODE!=='season')return;
 if(!(META.liveDraft&&META.liveDraft.auto))return;
 if(!LIVE.on&&liveEnabled()){
  LIVE.draftId=(LIVE.draftId||META.liveDraft.draftId||'').trim();
  LIVE.on=1;             // livePoll refuses to run otherwise
  await livePoll(true);  // draft + picks, one shot — no interval is created
  LIVE.on=0;
 }
 await syncLeague();
}

/* ---------- boot ---------- */
(async()=>{
 try{ SOURCE=await acquire(); }
 catch(err){
  document.getElementById('load').innerHTML=
    '<div style="max-width:470px;text-align:left;line-height:1.6">'
   +'<b style="color:var(--urgent)">The data files did not load.</b><br><br>'
   +'<code style="font-size:var(--fs-body)">'+esc(err.message)+'</code><br><br>'
   +'This page deliberately holds no data of its own \u2014 it reads <code>manifest.js</code> and the '
   +'payload files sitting in the same folder. Check that they were copied across together. '
   +'If you need a board right now, <b>tracker-artifact.html</b> is the self-contained build and '
   +'needs no other files.</div>';
  return;
 }
 try{ D=await ungz(B64M); EPTXT=await ungz(B64T); }
 catch(err){ document.getElementById('load').textContent=
   'This browser cannot unpack the data (it needs DecompressionStream). Try Chrome, Edge, or Safari 16.4+.'; return; }
 META=D.meta; CN=D.cont; EPS=D.eps; DEPTH=D.depth||{}; PLAN=D.plan||null;

 // Merge the full ADP board with the players who have podcast takes, so the
 // board is a real board rather than only the names JJ happened to mention.
 const withTakes={}; D.players.forEach(p=>withTakes[p.g]=p);
 PL=[];
 D.board.forEach(b=>{
  const p=withTakes[b.g];
  // A player WITH takes still gets his bye week from the board row — build_players
  // never carries one, so bye was shipped on all 256 board rows and rendered
  // nowhere.
  if(p){if(p.bye==null)p.bye=b.bye; PL.push(p); delete withTakes[b.g];}
  else PL.push({g:b.g,n:b.n,p:b.p,tm:b.tm,sl:b.sl,adp:b.adp,pr:b.pr,sd:b.sd,nd:b.nd,bi:b.bi,
    sdok:b.sdok,mv:null,es:'',dp:Math.ceil(b.adp/META.roundSize)>=META.deepRound,lean:'',cv:0,m:0,rev:0,tg:[],h:[],
    ro:true,tc:false,tcf:'',
    /* 🔴 These were hardcoded `tr:null, tw:0` — for every board player without a
       podcast take, which is roughly TWO THIRDS OF THE BOARD.
       payload.py's compute_tiers() carries a docstring insisting tiers must run
       over the whole board and not the take subset, and it does: every board row
       ships a real `tr` and `tw`. The client then threw them away and substituted
       zeroes. The result was that the TIER WALL pill, the LAST OF TIER chip, the
       .c.wall border, bestAvailable()'s -8 tier bonus and tierLeft()'s
       "3 WR left before the tier breaks" all silently ignored ~170 of 256
       players — the exact failure the Python comment exists to prevent,
       reintroduced on this side of the wire.
       `st` was dropped the same way, which made irEligible() false for every
       board-only player, so the My Team IR stash could never fill from one. */
    tr:b.tr,tw:b.tw,st:b.st,bye:b.bye,
    // Most of the board has no podcast take. The league-adjusted price is a
    // property of the BOARD, so it has to ride along here too — omitting it
    // would leave the second price visible only on the ~1 in 3 players JJ
    // happened to mention.
    al:b.al,ls:b.ls,lf:b.lf,lr:b.lr,lc:b.lc,
    // 2C rushing-QB tier (rq/rfg) and big-leg kicker flag (bl/kl) are BOARD
    // properties. Kickers and take-less QBs are rebuilt here, so — exactly like
    // tr/tw/st above — the flags must ride along or they vanish for every player
    // JJ never discussed (which is all of them, for kickers).
    rq:b.rq,rfg:b.rfg,bl:b.bl,kl:b.kl});
 });
 Object.values(withTakes).forEach(p=>PL.push(p));   // discussed but undrafted
 // Tie-break on the snapshot rank (bi), not the name: FFC shows ADP to a tenth
 // but ranks at full precision, so top-of-board ties are routine and an
 // alphabetical tie-break disagreed with the rank-ordered board sort.
 PL.sort((a,b)=>(a.adp==null)-(b.adp==null)||(a.adp||0)-(b.adp||0)||
   ((a.bi==null?1e9:a.bi)-(b.bi==null?1e9:b.bi))||a.n.localeCompare(b.n));
 PL.forEach((p,i)=>{p._i=i;BYID[p.g]=p;if(p.sl)BYSL[String(p.sl)]=p.g;});
 buildSdModel();

 /* On a laptop the context sections cost nothing — the decision already fits
    above them and there is column left over. On a phone every one of them is
    a screen of scrolling between him and the next thing he needs. So the
    default differs by the only thing that actually differs: how much room
    there is. */
 if(window.innerWidth>=1280)S.open={gone:1,runs:1,path:1,log:1,drift:0};
 else if(window.innerWidth>=900)S.open={gone:1,runs:1,path:0,log:1,drift:0};

 // Mode defaults to the calendar but the badge always wins if the hash says so.
 MODE = (META.draft && new Date().toISOString().slice(0,10) > META.draft) ? 'season' : 'draft';
 loadState();
 applyMode();

 document.getElementById('q').oninput=e=>{S.q=e.target.value.toLowerCase().trim();render();};
 ['fp','fl','fc'].forEach((id,k)=>{document.getElementById(id).onchange=e=>{S[['p','l','c'][k]]=e.target.value;render();};});
 [['bd','deep'],['br','rev'],['bt','hideTaken'],['bk','hasTakes'],['bl','lshift']].forEach(([id,key])=>{
  document.getElementById(id).onclick=e=>{S[key]^=1;e.target.classList.toggle('on');render();};});
 // A league with no prior drafts on file has no second price to filter by.
 if(!LP())document.getElementById('bl').style.display='none';
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOv();closeOv2();closeOv3();}});

 document.getElementById('load').remove();
 renderTabs();render();
 liveProbe();       // DRAFT mode: one probe, polls only if the draft is live
 seasonAutoLoad();  // SEASON mode: auto-connect + auto-sync, gated per league
 // Test hook. The suite needs to assert that the hub path and the parachute
 // path deliver byte-identical payloads; without this it can only compare
 // rendered HTML, which would pass even if one path silently truncated a blob.
 window.__READY__={source:SOURCE,built:BUILT,league:LEAGUE_KEY,
   mainLen:B64M.length,textLen:B64T.length,
   players:PL.length,board:D.board.length,eps:EPS.length,takes:META.takes};
})();
</script></body></html>
