/* The single place TAKEN and MINE are produced. Everything else writes to
   MANUAL / SUPPRESS / FEED and calls this. */
function recompute(){
 rcBust();          // every derived cache dies with the thing it was derived from
 /* SEASON mode, once the league rosters have been pulled: the rosters are the
    authority. MINE is what Sleeper says is on Chris's team TODAY — adds, drops
    and trades included — and TAKEN is the union of every roster, so a dropped
    player comes back to the waiver list instead of staying "gone" forever
    because he was once drafted. DRAFT mode keeps the feed authoritative and
    never reads ROSTER: the draft board is untouched. MANUAL and SUPPRESS still
    layer on top in both modes, exactly as before. */
 const ra=(MODE==='season'&&MYROSTER);
 const src=ra?ROSTER:FEED, srcMine=ra?ROSTER_MINE:FEED_MINE;
 TAKEN={};
 Object.keys(src).forEach(g=>{if(!SUPPRESS[g])TAKEN[g]=1;});
 Object.keys(MANUAL).forEach(g=>{if(MANUAL[g])TAKEN[g]=1;});
 const mine=[];
 srcMine.forEach(g=>{if(!SUPPRESS[g]&&mine.indexOf(g)<0)mine.push(g);});
 MANUAL_MINE.forEach(g=>{if(mine.indexOf(g)<0)mine.push(g);});
 MINE=mine;
 MINE.forEach(g=>{TAKEN[g]=1;});
}

/* ---------- draft maths ----------

   picksMade() USED to be "how many players are marked taken", which is only
   the same number as "how many picks have been made" while every pick lands on
   a player this board knows about. It does not. The board is 256 players deep
   and a 14-team draft is 196 picks, but the rooms drafts kickers, defenses and
   names FFC never priced — run #10's own data has 26 defenses on the board and
   the league has taken players off it in both prior drafts.

   Every pick that lands on an off-board player used to advance nothing: the
   round header, "your next pick", the survival maths and best-available would
   all sit one pick behind reality for the rest of the draft, and the error
   accumulates. Sleeper hands us the authoritative counter — pick_no — so when
   the feed is live, use it. Hand marks the feed has not caught up on are added
   on top, because being ahead of the commissioner is normal at a live table. */
/* ---------- per-render memo ----------
   These functions were being recomputed thousands of times inside a single
   render pass:

     bestAvailable() calls multiSlots() INSIDE its 256-iteration loop, and every
                     call does a .slice().sort()
     rosterState()   calls multiSlots() once per lineup slot, and need() calls
                     rosterState() again
     liveSd()        is asked for the same player's spread over a thousand times
                     by goneBefore() and rosterPath(), and effSd() does a linear
                     band scan each time

   What is cached here is deliberately ONLY the things that are pure over
   (META, MINE, DRIFT). Nothing derived from the live pick counter is cached —
   see the note on currentPick() below. The cache is dropped on every render, on
   every recompute() and whenever the drift model moves, so the window in which
   it can be wrong is a single synchronous pass. */
let RC=null;
function rcBust(){RC=null;}
function rc(k,f){ if(!RC)RC={}; if(!(k in RC))RC[k]=f(); return RC[k]; }

/* NOT memoised, on purpose. picksMade() reads TAKEN directly, and caching it
   would mean any code path that touches TAKEN without going through
   recompute() would silently read a stale pick number — and a stale pick
   number is the one error in this file that corrupts everything downstream.
   The cost is removed instead by HOISTING it: the hot loops (goneBefore,
   rosterPath) now compute the current pick once and pass it down, rather than
   asking for it 256 or 1,280 times. */
function picksMade(){
 if(LIVE.maxPick){
  const ahead=Object.keys(MANUAL).filter(g=>MANUAL[g]&&!FEED[g]).length;
  return LIVE.maxPick+ahead;
 }
 return Object.keys(TAKEN).filter(k=>TAKEN[k]).length;
}
function currentPick(){return picksMade()+1;}
function myPicks(){
 // snake order. SLOT is 1-based; 0 means "not set".
 if(!SLOT)return [];
 const out=[],n=META.teams;
 for(let r=1;r<=META.lineup.length+META.bench;r++){
  out.push(r%2===1 ? (r-1)*n+SLOT : (r-1)*n+(n-SLOT+1));
 }
 return out;
}
function nextMyPick(){const cp=currentPick();return myPicks().find(p=>p>=cp)||null;}

/* Which positions may fill a given lineup slot. Data-driven, from the league
   config — a hardcoded 'FLEX' test cannot express a superflex slot, which
   accepts QB as well as RB/WR/TE.

   These read META lazily. META is not assigned until the payload is unzipped
   at boot, so a module-scope `const X = META.foo` here throws a ReferenceError
   before the loader ever clears — the page just hangs on the spinner. */
function slotOK(){ return (typeof META!=='undefined' && META.slotEligible) || {}; }
function slotTakes(slot,pos){
 const list = slotOK()[slot] || [slot];
 return list.indexOf(pos) >= 0;
}
/* Slots that accept more than one position, narrowest first. */
function multiSlots(){
 return rc('ms',()=>{
  const se = slotOK();
  return ((typeof META!=='undefined' && META.flexSlots) || []).slice()
    .sort((a,b)=>(se[a]||[]).length-(se[b]||[]).length);
 });
}

/* Positional need from the starting lineup that is still unfilled.

   Fill order matters and is not cosmetic. Dedicated slots go first; then the
   NARROWEST multi-position slot; then wider ones. Filling a superflex before a
   plain flex would let a spare RB occupy SFLEX and leave FLEX empty, which
   reports a need for a position the roster already has and — worse — hides the
   fact that the superflex is the slot a quarterback should be competing for. */
function rosterState(){ return rc('rs',_rosterState); }
/* Sleeper id -> board id, never failing. A roster id the ADP board has never
   heard of (a future waiver add of someone FFC never priced) still has to
   RENDER — silently dropping him would show a 17-man roster and call it 18.
   Resolution order: the board (BYSL), else the draft feed's own metadata
   (SLMETA, captured in applyPicks), else a labelled stub carrying the raw id.
   The stub registers in BYID under a synthetic 'sl-' key so rosterState() and
   My Team can treat it like any other player; it is NOT pushed into PL, so the
   Board, Players and Waivers lists never see it. */
function rosterGid(sid){
 sid=String(sid);
 if(BYSL[sid])return BYSL[sid];
 const g='sl-'+sid;
 if(!BYID[g]){
  const md=SLMETA[sid]||{};
  BYID[g]={g:g,n:md.n||('Sleeper #'+sid),p:md.p||'?',tm:'',sl:sid,adp:null,pr:'',sd:null,nd:null,bi:null,
   sdok:0,mv:null,es:'',dp:false,lean:'',cv:0,m:0,rev:0,tg:[],h:[],ro:true,tc:false,tcf:'',
   tr:null,tw:0,st:'',bye:null,al:null,ls:null,lf:null,lr:null,lc:'',rq:0,rfg:null,bl:0,kl:null};
 }
 return g;
}
function _rosterState(){
 /* SEASON + live roster: mirror Sleeper exactly. starters[] is index-aligned
    with the league's roster_positions, which is what META.lineup was built
    from, and '0' marks an empty slot. Deliberately NOT an optimizer — the
    lineup shown is the lineup Chris set in Sleeper, per his call. Bench is
    everyone else on the roster; the existing status-based IR split below
    still carves the IR stash out of it. */
 if(MODE==='season'&&MYROSTER){
  const used=new Set();
  const slots=[...META.lineup].map((s,i)=>{
   const sid=String((MYROSTER.starters||[])[i]||'0');
   const p=(sid!=='0'&&sid!=='')?BYID[rosterGid(sid)]:null;
   if(p)used.add(p.g);
   return {slot:s,p:p||null};
  });
  const rbench=[];
  (MYROSTER.players||[]).forEach(sid=>{
   const p=BYID[rosterGid(String(sid))];
   if(p&&!used.has(p.g)){used.add(p.g);rbench.push(p);}
  });
  return {slots,bench:rbench};
 }
 const bench=[];
 const mine=MINE.map(g=>BYID[g]).filter(Boolean);
 const used=new Set();
 const slots=[...META.lineup].map(s=>({slot:s,p:null}));
 slots.forEach(s=>{
  if(multiSlots().indexOf(s.slot)>=0)return;
  const cand=mine.find(p=>!used.has(p.g)&&slotTakes(s.slot,p.p));
  if(cand){s.p=cand;used.add(cand.g);}
 });
 multiSlots().forEach(ms=>{
  slots.forEach(s=>{
   if(s.slot!==ms||s.p)return;
   const cand=mine.find(p=>!used.has(p.g)&&slotTakes(s.slot,p.p));
   if(cand){s.p=cand;used.add(cand.g);}
  });
 });
 mine.forEach(p=>{if(!used.has(p.g))bench.push(p);});
 return {slots,bench};
}
/* Which NFL roster statuses actually free an IR slot in THIS league.
   nflverse status codes: RES = reserve/IR, PUP, NON = non-football injury,
   EXE = exempt. ACT is an active player and never qualifies. */
const IR_STATUS=new Set(['RES','PUP','NON','IR','NFI','OUT','DOU-NO']);
function irEligible(p){
 const st=(p.st||'').toUpperCase();
 if(!st)return false;
 if(st==='ACT')return false;
 return IR_STATUS.has(st);
}
function need(){
 return rc('need',()=>{
  const {slots}=rosterState(),n={};
  slots.forEach(s=>{if(!s.p)n[s.slot]=(n[s.slot]||0)+1;});
  return n;
 });
}

/* Best available for THIS roster at THIS pick.

   Scored as an EFFECTIVE ADP — lower is better — so every adjustment is in
   units you can reason about ("he's ADP 120 but effectively 95 for you").

   The previous version summed (adp - yourNextPick) as the base, which meant the
   ADP term ran to +165 while every other term was worth ~20. That made the sort
   monotonically INCREASING in ADP: it ranked the board in reverse and
   confidently recommended the 179th player at pick 23. Base is now -adp, and
   every adjustment is bounded, so talent leads and the adjustments move a
   player by at most a round or two. */
/* ---------- the stage-aware value layer (run #22) ----------
   THE PROBLEM: the shortlist ranks sensibly LATE — its whole purpose — but
   produced nonsense EARLY, because flat conviction/slot-fill nudges (a BUY-3 was
   a flat -15 ADP spots at EVERY stage) overwhelmed real ADP gaps. After Gibbs
   went 1.1, pick 1.2 put Amon-Ra (WR, ADP 15.8, BUY-3) ahead of Bijan (RB, 2.6)
   and Lamar (QB, 7.5) — a mid-round conviction call leapfrogging top-5 talent.

   THE FIX is a value-anchored, stage-aware layer in FRONT of the existing engine,
   not a rewrite. Early: national ADP is the value anchor and the conviction /
   slot-fill / tier-wall nudges are scaled to near-zero tints (stageWeight) that
   cannot flip a large value gap. Late (deepRound+): the nudges reach full
   strength, so the conviction/edge/survival engine that is the reason this tool
   exists is preserved untouched. The blend is by draft stage (round).

   Separately QBs get a SUPERFLEX BARBELL: the elite/rushing tier is lifted so an
   elite QB clears cheaper skill players (and can lead), the lift GROWS as that
   tier depletes (the "count QBs out loud" rule made numeric), and the mid-tier
   "dead zone" QBs get nothing — so nothing manufactures urgency for a mediocre
   QB2. OFF in 1QB leagues, where waiting on QB is correct. This supersedes
   draft-rules-8team.md §3's "two startable QBs by round 5" rule (Chris,
   2026-08-20).

   NOTHING here reads the league-adjusted price (al/ls/lf); the six tests that
   assert bestAvailable ignores it stay green. */
const STAGE_FLOOR=0.12;   // how much a nudge still bites in the value-anchored zone
const STAGE_EARLY=3;      // rounds 1..EARLY are pure value + the QB curve
function stageWeight(cp){
 const rd=Math.ceil(cp/RS()), deep=META.deepRound||9;
 if(rd<=STAGE_EARLY)return STAGE_FLOOR;
 if(rd>=deep)return 1;
 return STAGE_FLOOR+(1-STAGE_FLOOR)*(rd-STAGE_EARLY)/(deep-STAGE_EARLY);
}
// Superflex QB barbell knobs. The "elite/rushing tier" proxy is positional rank
// by ADP (top QB_ELITE); a true rushing-QB flag is a Phase-2 data add. The
// premium decays with rank and grows as the tier depletes, bounded so it lifts
// an elite QB over cheaper skill players without blowing past a clearly elite RB
// while QB supply is healthy.
const QB_ELITE=4, QB_PREM_MAX=3, QB_SCARCITY_GAIN=0.8, QB_PREM_CAP=6;
// Phase 2C plumbed the big-leg flag into the payload: every kicker with a
// documented 60+ make (nflverse play-by-play 2023-25) ships p.bl=1 and
// p.kl=<longest>. The hardcoded Cam-Little stopgap is gone. DISPLAY ONLY, never
// scored — nothing in bestAvailable sorts on it.
function qbEliteRanks(){
 // gsis -> 1-based QB rank by national ADP, kept only for the top QB_ELITE.
 return rc('qbrk',()=>{
  const qbs=PL.filter(p=>p.p==='QB'&&p.adp!=null).slice().sort((a,b)=>a.adp-b.adp);
  const m={}; qbs.forEach((p,i)=>{if(i<QB_ELITE)m[p.g]=i+1;}); return m;
 });
}
/* ---------- VONA: value over next available (Phase 2A, run #23) ----------
   The honest value layer the Phase-1 proxies stood in for. For each undrafted
   player, ask how much better he is than the best player at his position that
   the survival math expects to still be on the board at Chris's pick AFTER the
   one this shortlist is for. A cliff there — nobody comparable comes back — is a
   reason to take him now; if a near-equal player survives, he is not.

   It REUSES the existing logistic survival-to-next-pick math (survivalAt); it
   does NOT rebuild survival. The lookahead is the exact snake window W: with N
   teams and slot s, W = 2*(N-s) after an odd round and 2*(s-1) after an even
   one — which is exactly the gap between two consecutive picks in myPicks(), so
   it falls out of the snake order without a hardcoded formula (m0 -> vnp below).

   VONA is a SEED adjustment, not a naked sort: eff = adp - lift, lift >= 0 and
   capped at one round, so it lifts a player toward his true urgency without ever
   letting a scarce lesser player leapfrog clearly better talent — the exact bug
   Phase 1 killed. The conviction / slot-fill / tier-wall / QB-barbell nudges
   still ride on top, stage-scaled, unchanged.

   GATED and BLENDED, never a hard switch. It stays fully OFF until the live feed
   has calibrated — >=VONA_GATE priced picks AND past round 2 AND the survival
   SPREAD has stabilised (DRIFT.spreadReady) — then fades in over VONA_BLEND
   picks. Below the gate, DRIFT.n is 0 and lift is 0, so the board is byte-for-
   byte the run-22 stage engine. Nothing here reads the league-adjusted price. */
const VONA_GATE=20, VONA_BLEND=8, VONA_GAIN=0.5, VONA_CAP_RD=1.0, VONA_SURV=0.5;
function vonaWeight(cp){
 const rd=Math.ceil(cp/RS());
 if(rd<=2)return 0;                                   // past round 2, always
 if(!DRIFT.spreadReady||DRIFT.n<VONA_GATE)return 0;   // feed must have calibrated
 return Math.max(0,Math.min(1,(DRIFT.n-VONA_GATE)/VONA_BLEND));  // blend in over ~8 picks
}
/* Best (lowest-ADP) player at each position expected to survive to pick `k`,
   given the board as it is now. K/DEF excluded — they are a wait, never a VONA
   reach. Memoised per render per lookahead pick. */
function vonaRepl(k,cp){
 return rc('vrepl:'+k,()=>{
  const m={};
  if(!k)return m;
  PL.forEach(p=>{
   if(TAKEN[p.g]||p.adp==null||p.p==='K'||p.p==='DEF')return;
   const s=survivalAt(p,k,cp), v=s.room!=null?s.room:s.nat;
   if(v<VONA_SURV)return;                     // only players more likely than not to last
   if(m[p.p]==null||p.adp<m[p.p])m[p.p]=p.adp;
  });
  return m;
 });
}

/* ======================= PHASE 2B — ZIG WHEN THEY ZAG =======================
   The descriptive run detector (runStats().hot) becomes a VALUE input on top of
   VONA. A live run is JOINED when a tier cliff sits inside the window W (the
   running position's VONA gap is large) and FADED when it is FEAR (near-equal
   players remain) — then the neglected position's faller wins. Everything is
   decided by VONA; a run only ever pulls a pick forward WITHIN a tier, never
   across a value cliff (the guard in bestAvailable). The anti-correlation weight
   is conservative and STRONGER in fewer-team leagues, where one manager owns
   more of the room. Inert below the VONA gate (vw>0) or with no run — then the
   board is byte-for-byte 2A. Never reads the league-adjusted price. */
const RUN_LAMBDA=6, RUN_CLIFF_RD=0.75, RUN_CAP_RD=0.5;
function runLambda(){return RUN_LAMBDA*(14/META.teams);}   // one 8-team seat = 12.5% of the room -> stronger anti-correlation
/* what the room is DOING: share of the last 12 picks at each position */
function roomShares(rs){
 const tot=Object.values(rs.l12).reduce((a,b)=>a+b,0)||1, o={};
 for(const k in rs.l12)o[k]=rs.l12[k]/tot;
 return o;
}
/* what the board is OFFERING: share of the next W undrafted by ADP. A position
   drafted faster than its supply is HOT; slower is COLD. K/DEF excluded. */
function baseShares(cp,vnp){
 const win=Math.max(12,Math.min(40,(vnp||cp)-cp));
 const up=PL.filter(p=>!TAKEN[p.g]&&p.adp!=null&&p.p!=='K'&&p.p!=='DEF')
   .sort((a,b)=>a.adp-b.adp).slice(0,win);
 const o={}, tot=up.length||1;
 up.forEach(p=>{o[p.p]=(o[p.p]||0)+1;});
 for(const k in o)o[k]/=tot;
 return o;
}
/* Classify each HOT position: TIER-DROP (a cliff to the next survivor sits in W)
   vs FEAR (near-equal players remain). Uses the same VONA replacement gap the
   sort already trusts; tierLeft() supply only colours the wording. */
function classifyRuns(rs,vrepl,bestAdp){
 const cliff=RUN_CLIFF_RD*RS(), out={};
 rs.hot.forEach(pos=>{
  const r=vrepl?vrepl[pos]:null, b=bestAdp[pos];
  const posVona=(r!=null&&b!=null)?Math.max(0,r-b):0;
  const tl=tierLeft(pos);
  out[pos]={kind:posVona>=cliff?'tier-drop':'fear',posVona:+posVona.toFixed(1),
            n:rs.l12[pos]||0,wall:tl?tl.n:null};
 });
 return out;
}
/* Probe/inspection hook — the run classification at a pick, without rendering. */
function runDebug(cp){
 const rs=runStats(); if(!rs.hot.length)return {hot:[]};
 const vw=vonaWeight(cp); if(!vw)return {hot:rs.hot,gate:'closed'};
 const m0=nextMyPick(), vnp=m0?myPicks().find(p=>p>m0):null;
 const vr=vonaRepl(vnp,cp), bestAdp={};
 PL.forEach(p=>{if(TAKEN[p.g]||p.adp==null)return;if(bestAdp[p.p]==null||p.adp<bestAdp[p.p])bestAdp[p.p]=p.adp;});
 return {hot:rs.hot,vnp,vw:+vw.toFixed(2),lambda:+runLambda().toFixed(1),cls:classifyRuns(rs,vr,bestAdp)};
}
function bestAvailable(limit){
 const cp=currentPick(), np=nextMyPick()||cp, n=need();
 const starters=new Set(Object.keys(n));
 const remaining=SLOT?myPicks().filter(p=>p>=cp).length:(META.lineup.length+META.bench);
 // K and DEF are MANDATORY starters that nothing else can fill. Suppress them
 // early, then force them up once the picks you have left no longer cover the
 // slots you must fill. Derived from the lineup rather than hardcoded, so a
 // league without a kicker slot simply has none of them.
 const LATE_SLOTS=['K','DEF'].filter(s=>META.lineup.indexOf(s)>=0);
 const mandatoryLeft=LATE_SLOTS.filter(s=>starters.has(s)).length;
 const mustTakeKDef=mandatoryLeft>0 && remaining<=mandatoryLeft+1;
 const w=stageWeight(cp);                 // 0..1 — how much the nudges bite now
 // VONA lookahead: m0 is the pick this shortlist is FOR; vnp is my pick AFTER
 // that (the snake window W). VONA compares each player to the best survivor at
 // vnp. Computed once here, not per player.
 const m0=nextMyPick(), vnp=m0?myPicks().find(p=>p>m0):null;
 const vw=vonaWeight(cp), vrepl=vw>0?vonaRepl(vnp,cp):{};
 // Superflex QB barbell scarcity, on BOTH tracks (the blend Chris chose for 2C):
 //   ADP track  — the top QB_ELITE by market price (qbEliteRanks)
 //   RUSH track — the real rushing-elite (payload rq===2, nflverse 2023-25 rushing)
 // A QB is lifted if he is on EITHER track; the premium is the larger of the two.
 const qbRank=META.superflex?qbEliteRanks():{};
 let eliteGone=0;
 if(META.superflex)for(const g in qbRank){if(TAKEN[g])eliteGone++;}
 let rushN=0, rushGone=0;
 if(META.superflex)PL.forEach(q=>{if(q.p==='QB'&&q.rq===2&&q.adp!=null){rushN++;if(TAKEN[q.g])rushGone++;}});
 const out=[];
 PL.forEach(p=>{
  if(TAKEN[p.g]||p.adp==null)return;
  let eff=p.adp, why=[]; let vona=0, vlift=0;
  // VONA seed adjustment — value over next available, taken off the ADP seed.
  // Gated+blended (vw), capped at one round so it can never panic-reach across
  // talent. K/DEF are a wait, never a VONA reach.
  if(vw>0 && p.p!=='K' && p.p!=='DEF'){
   const r=vrepl[p.p];
   vona=(r!=null)?Math.max(0,r-p.adp):0;
   if(vona>0){
    vlift=Math.min(RS()*VONA_CAP_RD,VONA_GAIN*vona)*vw;
    eff-=vlift;
    why.push('VONA −'+vlift.toFixed(1)+' ('+Math.round(vona)+' to next '+p.p+' @#'+vnp+')');
   }
  }
  // Dedicated slot beats a multi-position slot: a QB who fills the only QB
  // slot is worth more than one who merely COULD fill the superflex.
  const MS=multiSlots();
  const dedicated=[...starters].filter(s=>MS.indexOf(s)<0&&slotTakes(s,p.p));
  const flexible=[...starters].filter(s=>MS.indexOf(s)>=0&&slotTakes(s,p.p));
  // Slot-fill is a bounded tint early (w≈floor), full weight late. On an empty
  // roster early this is uniform across positions and cancels in the sort; it
  // earns its keep mid-draft, when a filled slot should push its position down.
  if(dedicated.length){eff-=20*w;why.push('fills '+dedicated[0]);}
  else if(flexible.length){eff-=10*w;why.push('fills '+flexible[0]);}
  else if(!starters.size){why.push('lineup full — best available');}
  else {eff+=10*w;why.push('no open '+p.p+' slot');}
  // Podcast conviction: near-zero early, full late. THIS is the change that
  // kills the Amon-Ra bug — a BUY-3 can no longer flip a top-10 ADP gap.
  if(p.lean==='BUY'){eff-=5*(p.cv||1)*w;why.push('BUY conv '+p.cv);}
  if(p.lean==='FADE'){eff+=8*(p.cv||1)*w;why.push('FADE conv '+p.cv);}
  if(p.tw){eff-=8*w;why.push('last of tier '+p.tr);}
  // Superflex QB barbell — a VALUE term, at full strength regardless of stage
  // (getting the elite QB early is the whole point). Elite tier only; grows as
  // the tier depletes; self-extinguishes once the top QBs are gone.
  // Barbell premium = MAX of the ADP-market premium and the rushing premium, so an
  // elite RUSHER cheap by ADP (Daniels/Hurts/Dart/Kyler) is lifted AND a top-market
  // pocket passer (Burrow) keeps a lift too. Rushing scales with real rush pts/game
  // and grows as the rushing-elite deplete. Superflex only; never reads the price.
  if(META.superflex && (qbRank[p.g] || p.rq===2)){
   let adpPrem=0;
   if(qbRank[p.g]){const r=qbRank[p.g];
    adpPrem=QB_PREM_MAX*(1-(r-1)/QB_ELITE)*(1+QB_SCARCITY_GAIN*(eliteGone/QB_ELITE));}
   let rushPrem=0;
   if(p.rq===2){const strength=Math.max(0.5,Math.min(1.4,(p.rfg||5)/6));
    rushPrem=QB_PREM_MAX*strength*(1+QB_SCARCITY_GAIN*(rushGone/Math.max(1,rushN)));}
   const prem=Math.min(QB_PREM_CAP,Math.max(adpPrem,rushPrem));
   if(prem>0){eff-=prem;why.push(rushPrem>=adpPrem?'superflex QB — elite rusher':'superflex QB — elite (market)');}
  }
  if(p.p==='K'||p.p==='DEF'){
   if(mustTakeKDef){eff-=120;why.push('MANDATORY — only '+remaining+' picks left');}
   else{eff+=90;why.push('K/DEF can wait');}
  }
  if(p.adp>np+META.roundSize)why.push('likely still there at #'+np);
  // Which OPEN starting slot he actually fills, carried out so the row can flag
  // it visually. The shortlist stays pure best-available — this marks the ones
  // that plug a hole rather than reordering anything.
  const fills=dedicated.length?dedicated[0]:(flexible.length?flexible[0]:null);
  const bigLeg=p.p==='K'&&!!p.bl;   // data-derived (payload p.bl): documented 60+ make. Display only, never scored
  if(bigLeg)why.push('big leg'+(p.kl?' ('+p.kl+'y+)':'')+' — long-FG value in distance scoring');
  out.push({p,eff,why,fills,bigLeg,vona,vlift});
 });
 // ---- PHASE 2B: zig-when-they-zag — the run response, on the VONA seed ----
 // Gated exactly like VONA (vw>0) and only when a run is live. Below the gate,
 // or with no run, this block is inert and every eff is identical to 2A.
 const rstat=runStats();
 if(vw>0 && rstat.hot.length){
  const bestAdp={};
  out.forEach(o=>{if(bestAdp[o.p.p]==null||o.p.adp<bestAdp[o.p.p])bestAdp[o.p.p]=o.p.adp;});
  const cls=classifyRuns(rstat,vrepl,bestAdp);
  const feared=rstat.hot.filter(h=>cls[h]&&cls[h].kind==='fear');
  // The anti-correlation FADE/ZAG runs on FEAR only. A tier-drop run is rational
  // and is JOINED by VONA itself, so we add no λ against it — otherwise lifting
  // the cold positions would fight the very join we just decided on. With no
  // fear run live, eff stays == 2A and only the reason line gains a JOIN label.
  const useLam=feared.length>0;   // FADE/ZAG on fear only; a tier-drop is JOINED by VONA
  const rShare=roomShares(rstat), bShare=baseShares(cp,vnp);
  const lam=runLambda(), cap=RS()*RUN_CAP_RD;
  out.forEach(o=>o.base=o.eff);
  // Anti-panic anchor: the current best-VALUE pick is never faded by a run, and
  // every run adj is capped at RUN_CAP_RD (0.5 round) < RUN_CLIFF_RD (0.75), so
  // no other player can be lifted across a value cliff to displace it. Together
  // a run reorders WITHIN a tier and can never pull a pick across a value cliff.
  let minBase=Infinity, leader=null;
  out.forEach(o=>{if(o.base<minBase){minBase=o.base;leader=o;}});
  out.forEach(o=>{
   const pos=o.p.p, me=cls[pos];
   let adj=0;
   if(useLam && pos!=='K' && pos!=='DEF'){
    let gap=(bShare[pos]||0)-(rShare[pos]||0);            // + cold (lift), - hot (damp)
    if(me&&me.kind==='tier-drop')gap=Math.max(gap,0);     // JOIN: never fade a tier-drop runner
    adj=Math.max(-cap,Math.min(cap,lam*gap*w));           // + promotes (lowers eff)
    if(o===leader)adj=Math.max(0,adj);                    // the anchor: best value is never faded
    o.eff=o.base-adj;
   }
   o.runAdj=+adj.toFixed(2);
   o.runLeader=(o===leader)?1:0;
   if(me&&me.kind==='tier-drop'){
    o.why.unshift('RUN join '+pos+' — tier cliff inside your window');
    o.run={call:'JOIN',pos};
   }else if(me&&me.kind==='fear'){
    o.why.unshift('RUN '+pos+' run is fear — value elsewhere');
    o.run={call:'FADE',pos};
   }else if(useLam && (adj>0.3 || o===leader)){
    // the recommended pick (the anchor) always carries the run story, even when
    // its own lift is small — on the clock, "why the top name" is the decision.
    o.why.unshift('RUN zag — '+pos+' value while they chase '+feared.join('/'));
    o.run={call:'ZAG',pos,src:feared.join('/')};
   }
  });
 }
 out.sort((a,b)=>a.eff-b.eff);
 return out.slice(0,limit||25);
}

/* ================= DRAFT ROOM =================================================

   Everything from here to the end of this block exists for one two-minute
   window. The design constraint is not cleverness, it is that Chris is looking
   at this while fourteen people wait for him.

   Three separate things are happening:
     1. the FEED   — Sleeper says who is gone, so nothing has to be typed
     2. the MATHS  — who survives to his next pick, nationally and in this room
     3. the FALLBACK — the venue wifi dies and none of the above matters
   ============================================================================ */

/* ---------- where a player goes, as a distribution ----------

   Draft position is modelled as LOGISTIC, not normal, and the reason is the
   tail — which is the only part of it this tool actually reads.

   Every survival number here is CONDITIONAL: given he is still on the board at
   pick c, does he reach pick k. Under a normal curve that conditional is
   unusable for exactly the players who matter most. A normal has an increasing
   hazard rate in the tail, so a player three sigma past his ADP who is
   somehow still sitting there comes out at 0.0000 — the model reports a
   mathematical certainty that he is gone in the next eight picks, about a
   player who is visibly, presently, not gone. That is the distribution's tail
   artefact, not a forecast, and acting on it at a draft table would be acting
   on nothing.

   A logistic has an asymptotically CONSTANT hazard: past his price, a player
   carries a steady per-pick chance of being taken and the estimate degrades
   gracefully instead of collapsing. It is also the better description of what
   actually happens — a player falling well past ADP is usually falling on
   information the board has not priced, and those players keep falling.

   Scale is variance-matched to the reported stddev, s = sd*sqrt(3)/pi, so the
   spread still means what the ADP feed says it means.

   Everything is in log space via softplus, because exp((k-mu)/s) overflows for
   a deep player and Infinity/Infinity is NaN — which would render as a blank
   card rather than a wrong number, and be noticed only at the table. */
const softplus=z=>z>30?z:Math.log1p(Math.exp(z));
function logistS(mu,sd,x){        // log P(still available at pick x)
 const s=Math.max(0.6,sd*0.5513);
 return -softplus((x-0.5-mu)/s);
}
function condSurvive(mu,sd,c,k){  // P(reaches k | available at c)
 if(k<=c)return 1;
 return Math.max(0,Math.min(1,Math.exp(logistS(mu,sd,k)-logistS(mu,sd,c))));
}

/* ---------- how wide is a player's price? ----------
   Every board row carries a stddev, but only rows with times_drafted >= 100
   are flagged sdok, and the deep band is where that bites: on the 08-13 board
   100% of the top 50 are rankable and 41% of the 113-180 band are. That band
   is exactly the part of the draft this whole project exists to cover, so
   "suppress the number" and "trust the number" are both wrong answers.

   What is stable is the RATIO. Median sd/adp runs .147 / .118 / .108 / .093
   across the four bands — a smooth, shallow decline. So a thin-sample stddev
   gets clamped toward the band model rather than believed or discarded, and
   the player is visibly flagged.

   The worked example is Ricky Pearsall: stddev 6.3 on n=87, which read as the
   tightest price inside the top 130 while he was on season-ending IR. A tight
   spread on a stale feed is not a consensus. Clamping upward is what stops
   that becoming a confident survival curve. */
function buildSdModel(){
 const edges=[[0,50],[50,113],[113,180],[180,1e9]];
 SDBANDS=edges.map(([lo,hi])=>{
  const r=PL.filter(p=>p.adp!=null&&p.adp>=lo&&p.adp<hi&&p.sdok&&p.sd>0)
            .map(p=>p.sd/p.adp).sort((a,b)=>a-b);
  return {lo,hi,n:r.length,ratio:r.length?r[Math.floor(r.length/2)]:null};
 });
 // A band with no rankable rows inherits the last measured one rather than a
 // made-up constant. The 180+ band has zero on this board.
 let last=0.12;
 SDBANDS.forEach(b=>{if(b.ratio==null)b.ratio=last;else last=b.ratio;});
}
function effSd(p){
 const b=SDBANDS.find(b=>p.adp>=b.lo&&p.adp<b.hi)||SDBANDS[SDBANDS.length-1]||{ratio:.12};
 const model=Math.max(1.5,p.adp*b.ratio);
 if(p.sd==null||p.sd<=0)
  return {sd:model,thin:true,why:'no usable spread on this board — width modelled from the band'};
 if(p.sdok)return {sd:p.sd,thin:false,why:''};
 const clamped=Math.min(Math.max(p.sd,model*0.6),model*1.6);
 return {sd:clamped,thin:true,
   why:'n='+(p.nd||0)+' drafts, under the 100 floor — spread pulled toward the band model'};
}
/* The spread the SURVIVAL maths actually uses.

   FFC's stddev is the dispersion of a player's ADP across mock drafts, and a
   mock field is more homogeneous than fourteen humans in a room reacting to
   each other. Used raw over a long wait it reads far too confident: at 13 picks
   out it put an entire screen of different players at "0%", which is both
   almost certainly too tight AND useless, because a column of zeroes cannot
   tell you which of three players to take.

   Rather than invent an inflation factor, measure it. As picks arrive, compare
   the observed scatter of (pick_no - ADP) against what the board's own spreads
   predicted, and scale by the ratio. That is the same self-calibration as the
   drift, applied to the width instead of the centre: this room's actual chaos,
   measured live, on this draft. Before there is enough data it is exactly 1 and
   changes nothing.

   There is no external calibration available for this — the project has no
   2024/2025 historical ADP, so the two prior drafts cannot supply an empirical
   spread. Measuring it live is the only honest source. */
function liveSd(p){
 // Memoised per player per render: goneBefore() and rosterPath() between them
 // ask for the same player's spread well over a thousand times in one pass,
 // and effSd() does a linear band scan every time.
 return rc('sd:'+p.g,()=>{
  const e=effSd(p);
  return {...e,sd:e.sd*(DRIFT.spread||1)};
 });
}

/* ---------- live pace calibration ----------
   Compare where players ACTUALLY went against where the board said they would.
   Positive drift = the room is taking players later than market = things last
   longer than the national curve implies.

   Measured twice, because there are two curves: against national ADP, and
   against this league's own pace price. They are different questions and
   sharing one number would double-count this room's known tendencies.

   Median, not mean — one manager reaching 40 picks early should not move it.
   Last 24 picks, so it tracks the draft as it changes rather than averaging a
   frantic round 2 into a slow round 9. Needs 12 picks before it says anything,
   and is clamped to +/-25 because beyond that it has stopped being calibration
   and started being a different draft.

   Honest caveat, stated in the UI: this is measured only on players who HAVE
   been drafted, so it is survivorship-biased by construction. It reads the
   room's aggression, not the whole board. */
function computeDrift(){
 const rows=[];
 LIVE.seq.forEach(s=>{
  if(!s.g)return; const p=BYID[s.g]; if(!p||p.adp==null)return;
  // Carry the base spread on the row. Looking the player back up by pick number
  // later would break on any duplicated pick_no a commissioner edit can create.
  rows.push({no:s.no,dn:s.no-p.adp,dr:p.al!=null?s.no-p.al:null,sd:effSd(p).sd});
 });
 // Hand-marked players carry no pick number, so they cannot calibrate pace.
 // They are excluded rather than assigned a guessed position in the order.
 rows.sort((a,b)=>a.no-b.no);
 const recent=rows.slice(-24);
 const med=a=>{a=a.filter(v=>v!=null).sort((x,y)=>x-y);
  return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):0;};
 const cl=v=>Math.max(-25,Math.min(25,v));
 const ready=rows.length>=12;
 const nat=ready?cl(med(recent.map(r=>r.dn))):0;

 /* Width, measured the same way as the centre. MAD scaled by 1.4826 is the
    robust sigma estimate; the model side deliberately reads effSd (the BASE
    spread) and not liveSd, or this would feed on its own output and run away.
    Needs 20 priced picks — more than the centre, because a spread estimate is
    noisier than a median — and is clamped to [0.8, 2.5] so one strange round
    cannot make the whole board read as a coin toss. */
 let spread=1;
 if(rows.length>=20){
  const dev=rows.map(r=>Math.abs(r.dn-nat));
  const obs=med(dev)*1.4826;
  const mod=med(rows.map(r=>r.sd));
  if(mod>0&&obs>0)spread=Math.max(0.8,Math.min(2.5,obs/mod));
 }
 rcBust();   // liveSd() is memoised against DRIFT.spread
 DRIFT={n:rows.length,ready,nat,
   room:ready?cl(med(recent.map(r=>r.dr))):0,
   spread,spreadReady:rows.length>=20};
}

/* ---------- survival ----------
   P(still on the board at pick k, GIVEN he is on the board now).

   The conditional is the whole point. Unconditionally, a player with ADP 40
   has a low chance of lasting to pick 60. But if it is already pick 55 and he
   is still sitting there, the market in this room has already told you
   something, and the conditional form uses it. That is what makes a faller
   read correctly instead of being written off. */
/* `c` (the current pick) is an optional parameter so the callers that ask for
   hundreds of players in one pass can compute it ONCE and pass it down.
   Omitted, it behaves exactly as before. */
function survivalAt(p,k,c){
 if(c==null)c=currentPick();
 const {sd,thin,why}=liveSd(p);
 const out={thin,why,sd,nat:condSurvive(p.adp+DRIFT.nat,sd,c,k),room:null};
 if(LP()&&p.al!=null)out.room=condSurvive(p.al+DRIFT.room,sd,c,k);
 return out;
}
function survivalNext(p){
 const np=nextMyPick();
 if(!np||p.adp==null)return null;
 return survivalAt(p,np);
}
const svClass=v=>v>=.65?'hi':v>=.35?'mid':'lo';
/* ---------- the verdict chip, made RELATIVE ----------
   It used to threshold each row's survival on its own: under 30% TAKE NOW, over
   70% HE LASTS, otherwise COIN FLIP. Measured 2026-08-20 on a 60%-drafted board
   with a 19-pick wait, that printed TAKE NOW, TAKE NOW, TAKE NOW, TAKE NOW,
   TAKE NOW — the loudest element on the most valuable real estate in the tool,
   carrying no discriminating information, five times over. Deep in a draft with
   a long wait, EVERY good player is unlikely to survive, so an absolute
   threshold degenerates to a constant exactly when the stakes are highest.

   The question that matters is not "is this player at risk" but "which of THESE
   FIVE can I not get back". So the chip is computed across the shortlist:

     TAKE NOW  the best-value row that is also MATERIALLY less likely than the
               field to survive (<= 0.6x the shortlist median). At most one.
     HE LASTS  the single safest row, and ONLY when a TAKE NOW exists to
               contrast it with, and only at >= 75%. The pair reads "take this
               one, that one keeps". Without a TAKE NOW there is no tension to
               resolve and the chip would just be decoration.
     nothing   everything else — including all five when the five are
               interchangeable on availability, which is itself the answer:
               these differ on value, not on urgency, so take the top one.

   The survival percentages themselves are unchanged and still shown on every
   row. This governs only the chip, and nothing here can reorder anything —
   bestAvailable() is untouched and the six tests asserting it ignores the
   league price still hold. The room number still decides when it exists, for
   the reason it always did: this room is not the market. */
const VD_URGENT=0.6, VD_SAFE_ABS=0.75, VD_URGENT_ABS=0.5;
function verdicts(list){
 const v=list.map(s=>!s?null:(s.room!=null?s.room:s.nat));
 const out=list.map(()=>null);
 const known=v.filter(x=>x!=null).slice().sort((a,b)=>a-b);
 if(known.length<3)return out;
 const med=known[Math.floor(known.length/2)];
 let ti=-1;
 for(let i=0;i<v.length;i++){
  if(v[i]!=null&&v[i]<=med*VD_URGENT&&v[i]<VD_URGENT_ABS){ti=i;break;}
 }
 if(ti<0)return out;                       // nothing urgent -> no chips at all
 out[ti]={k:'now',t:'TAKE NOW'};
 let si=-1;
 for(let i=0;i<v.length;i++){
  if(i===ti||v[i]==null||v[i]<VD_SAFE_ABS)continue;
  if(si<0||v[i]>v[si])si=i;
 }
 if(si>=0)out[si]={k:'wait',t:'HE LASTS'};
 return out;
}
/* The single-player detail view has no field to compare against, so an absolute
   read is the only one available there. Unchanged. */
function verdict(s){
 if(!s)return null;
 const v=s.room!=null?s.room:s.nat;
 if(v<.30)return {k:'now',t:'TAKE NOW'};
 if(v>.70)return {k:'wait',t:'HE LASTS'};
 return {k:'flip',t:'COIN FLIP'};
}

/* ---------- the live Sleeper feed ---------------------------------------- */
const SLEEPER='https://api.sleeper.app/v1/draft/';

function liveEnabled(){return META.liveDraft&&META.liveDraft.enabled&&(LIVE.draftId||META.liveDraft.draftId);}
function liveStart(id){
 LIVE.draftId=(id||LIVE.draftId||META.liveDraft.draftId||'').trim();
 if(!LIVE.draftId){LIVE.err='no draft id';render();return;}
 LIVE.on=1;LIVE.err='';LIVE.fails=0;
 LIVE.pollMs=Math.max(2000,((META.liveDraft&&META.liveDraft.pollSeconds)||3)*1000);
 saveState();
 livePoll(true);
 if(LIVE.timer)clearInterval(LIVE.timer);
 LIVE.timer=setInterval(()=>livePoll(false),LIVE.pollMs);
 if(!LIVE.tick)LIVE.tick=setInterval(tickClock,500);
}
function liveStop(){
 LIVE.on=0;
 if(LIVE.timer){clearInterval(LIVE.timer);LIVE.timer=null;}
 render();
}
async function livePoll(force){
 if(!LIVE.on)return;
 try{
  const d=await fetch(SLEEPER+LIVE.draftId,{cache:'no-store'}).then(r=>{
   if(!r.ok)throw new Error('draft '+r.status);return r.json();});
  if(!d||!d.draft_id)throw new Error('no draft at that id');
  const moved=(d.last_picked||0)!==LIVE.lastPicked;
  LIVE.cfg=d; LIVE.status=d.status||''; LIVE.type=d.type||'';
  LIVE.lastPicked=d.last_picked||0;
  const st=d.settings||{};
  // Read the shape from the draft itself, every poll. The config file carries
  // only the id precisely so a stale local number can never drive pick maths.
  if(st.pick_timer)LIVE.pickTimer=st.pick_timer;
  if(st.teams)LIVE.teams=st.teams;
  if(st.rounds)LIVE.rounds=st.rounds;
  LIVE.order=d.draft_order||null;
  autoSlot();
  if(force||moved||LIVE.drew%5===0){
   const picks=await fetch(SLEEPER+LIVE.draftId+'/picks',{cache:'no-store'}).then(r=>{
    if(!r.ok)throw new Error('picks '+r.status);return r.json();});
   if(Array.isArray(picks))applyPicks(picks);
  }
  LIVE.drew++; LIVE.fails=0; LIVE.err=''; LIVE.lastOk=Date.now();
  renderIfChanged();
 }catch(e){
  LIVE.fails++; LIVE.err=e.message||'network';
  // Back off, but never stop and NEVER touch FEED. A failed poll must leave
  // the board exactly as it was — the one thing worse than a stale board at a
  // draft table is a board that empties itself.
  if(LIVE.timer&&LIVE.fails===3){
   clearInterval(LIVE.timer);
   LIVE.timer=setInterval(()=>livePoll(false),Math.min(LIVE.pollMs*4,15000));
  }
  renderIfChanged();
 }
}

/* Rebuild FEED from the full pick list every time, rather than appending.
   Picks can be edited or removed by a commissioner mid-draft; an append-only
   log would keep a player marked gone after he was handed back. */
function applyPicks(picks){
 const feed={}, mine=[], seq=[]; let unmatched=0, max=0;
 picks.forEach(pk=>{
  const no=pk.pick_no||0; if(no>max)max=no;
  const md=pk.metadata||{};
  const nm=((md.first_name||'')+' '+(md.last_name||'')).trim()||md.player_id||'?';
  const pos=(md.position||'').toUpperCase();
  /* Remember what the feed said this Sleeper id is called. Costs nothing here
     and it is the name fallback for roster ids that are not on the ADP board
     (see rosterGid) — today that is nobody, after a waiver add it is the add. */
  if(pk.player_id)SLMETA[String(pk.player_id)]={n:nm,p:pos};
  const g=matchPick(pk);
  if(g){
   feed[g]=({no,rid:pk.roster_id,by:pk.picked_by});
   if(isMyPick(pk)&&mine.indexOf(g)<0)mine.push(g);
  }else unmatched++;
  seq.push({no,g,nm:g?BYID[g].n:nm,pos:pos||(g?BYID[g].p:''),
            rid:pk.roster_id,me:isMyPick(pk),slot:pk.draft_slot});
 });
 seq.sort((a,b)=>a.no-b.no);
 FEED=feed; FEED_MINE=mine; LIVE.seq=seq; LIVE.maxPick=max; LIVE.unmatched=unmatched;
 recompute(); computeDrift();
}

/* Sleeper's player_id is the join key and it covers essentially the whole
   board — one player on the 08-13 board has no sleeper_id, and team defenses
   join natively because Sleeper uses the team abbreviation as the id, which is
   exactly what this board stores. Name matching is the backstop for that one
   gap, not the primary path. */
function matchPick(pk){
 const id=String(pk.player_id||'');
 if(id&&BYSL[id])return BYSL[id];
 const md=pk.metadata||{};
 const nm=normName((md.first_name||'')+' '+(md.last_name||''));
 if(!nm)return null;
 const pos=(md.position||'').toUpperCase();
 const hit=PL.filter(p=>normName(p.n)===nm&&(!pos||p.p===pos));
 return hit.length===1?hit[0].g:null;
}
const normName=s=>(s||'').toLowerCase().replace(/[^a-z]/g,'');
function isMyPick(pk){
 if(META.sleeperUserId&&pk.picked_by&&String(pk.picked_by)===String(META.sleeperUserId))return true;
 if(LIVE.myRoster&&pk.roster_id===LIVE.myRoster)return true;
 return false;
}
/* Chris's draft slot, without him setting it. draft_order is {user_id: slot}
   and is null until the order is randomised, so fall back to reading it off
   his own first pick. Manual selection still wins if he has set one. */
function autoSlot(){
 let s=null;
 if(LIVE.order&&META.sleeperUserId&&LIVE.order[META.sleeperUserId])s=LIVE.order[META.sleeperUserId];
 if(!s){const m=LIVE.seq.find(x=>x.me&&x.slot);if(m)s=m.slot;}
 LIVE.autoSlot=s||null;
 if(s&&!SLOT){SLOT=s;saveState();}
}
function tickClock(){
 if(S.tab==='room'&&LIVE.on)paintClock();
}
function clockLeft(){
 if(!LIVE.lastPicked||!LIVE.pickTimer)return null;
 const el=(Date.now()-LIVE.lastPicked)/1000;
 return Math.max(0,Math.min(LIVE.pickTimer,LIVE.pickTimer-el));
}
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function paintClock(){
 const el=document.getElementById('clk'); if(!el)return;
 const l=clockLeft(); if(l==null){el.textContent='--:--';return;}
 el.textContent=mmss(l);
 el.className='clock'+(l<=15?' crit':l<=40?' warn':'');
}

/* ---------- runs ---------- */
function runStats(){
 const seq=LIVE.seq.filter(s=>s.pos);
 const last=seq.slice(-12);
 const cnt=a=>{const o={};a.forEach(s=>{o[s.pos]=(o[s.pos]||0)+1;});return o;};
 const myLast=(()=>{const m=LIVE.seq.filter(s=>s.me);return m.length?m[m.length-1].no:0;})();
 const since=seq.filter(s=>s.no>myLast);
 const l12=cnt(last), sinceC=cnt(since);
 // A run worth naming: 5+ of the last 12 at one position. In a 14-team league
 // the flat expectation for any one position is nowhere near that.
 const hot=Object.keys(l12).filter(k=>l12[k]>=5&&k!=='K'&&k!=='DEF')
   .sort((a,b)=>l12[b]-l12[a]);
 return {last:last.length,l12,since:sinceC,sinceN:since.length,myLast,hot};
}
/* How many players are left at a position before the next tier wall breaks.
   Tier walls are computed over the FULL board by the pipeline, so this counts
   real remaining supply, not supply among players JJ happened to mention. */
function tierLeft(pos){
 const av=PL.filter(p=>!TAKEN[p.g]&&p.p===pos&&p.adp!=null).sort((a,b)=>a.adp-b.adp);
 const i=av.findIndex(p=>p.tw);
 return i<0?null:{n:i+1,wall:av[i]};
}
/* The panel: good players who probably will NOT be there next time round.
   Ranked by what you lose, not by how likely they are to go — a 95%-gone K is
   not news. */
/* `skip` is the set of players already on the shortlist. Without it the same
   name appears twice on one screen — recommended at #4 with TAKE NOW, and
   again three inches to the right under "gone before your pick". Both are
   true and saying it twice costs a re-read at exactly the wrong moment. */
function goneBefore(limit,skip){
 const np=nextMyPick(); if(!np)return [];
 const cp=currentPick();          // hoisted: this used to be recomputed 256 times
 const out=[];
 PL.forEach(p=>{
  if(TAKEN[p.g]||p.adp==null)return;
  if(skip&&skip.has(p.g))return;
  const s=survivalAt(p,np,cp); const v=s.room!=null?s.room:s.nat;
  if(v>=.55)return;
  if(p.p==='K'||p.p==='DEF')return;
  // What you LOSE = how good he is x how likely he is to be gone. A 95%-gone
  // K is not news; a 60%-gone player 40 picks better than your next pick is.
  out.push({p,s,v,risk:(1-v)*(1/Math.max(1,p.adp))});
 });
 /* This used to sort by ADP while computing `risk` and never reading it — the
    comment above the function claimed "ranked by what you lose, not by how
    likely they are to go", and the code did the opposite of both. */
 out.sort((a,b)=>b.risk-a.risk);
 return out.slice(0,limit||8);
}
/* What the board looks like at each of your remaining picks. "Projected" is
   doing real work here: a player only appears at a pick if he is more likely
   than not to still be there. */
function rosterPath(){
 const cp=currentPick(), np=myPicks().filter(p=>p>=cp).slice(0,5);
 const n=need(), open=Object.keys(n);
 return np.map(pick=>{
  const pool={};
  PL.forEach(p=>{
   if(TAKEN[p.g]||p.adp==null||p.p==='K'||p.p==='DEF')return;
   const s=survivalAt(p,pick,cp); const v=s.room!=null?s.room:s.nat;   // cp hoisted
   if(v<.5)return;
   (pool[p.p]=pool[p.p]||[]).push(p);
  });
  Object.keys(pool).forEach(k=>pool[k].sort((a,b)=>a.adp-b.adp));
  return {pick,round:Math.ceil(pick/RS()),pool,open};
 });
}

/* ---------- quick entry ----------
   The fallback that has to work when nothing else does. Subsequence match, so
   "jjett" finds Jaxon Smith-Njigba and "cmc" finds McCaffrey, with a hard
   preference for surname prefixes because that is what gets called out at a
   draft table. */
let QE={q:'',sel:0,rows:[],caret:null,focus:0};
/* Set for the duration of a #view innerHTML swap. Replacing the view kills
   the focused quick-entry input and fires its onblur SYNCHRONOUSLY, which
   cleared QE.focus — so wireRoom() then read a flag the swap itself had just
   reset and never restored focus, and the blur's delayed qeDraw() emptied the
   suggestion list. Measured 2026-08-20: type three letters, and the very next
   poll (even one carrying no new picks, because roomSig() includes QE.q) left
   the value in place with the caret at 0 and the box unfocused. */
let QE_SWAP=0;
/* 🔴 THE WORST BUG IN THE DRAFT ROOM, and it was silent.

   An UNDRAFTED player has adp === null, and every branch below read
   `1000 - p.adp`. That is NOT NaN — in JavaScript `null` coerces to 0 — so
   every undrafted player scored a perfect 1000 and swept the top of the
   dropdown ahead of the entire priced board.

   Measured on the 2026-08-13 build, typing "smi" returned, in this order:
       Arian Smith, Brashard Smith, Geno Smith, JuJu Smith-Schuster,
       Jaxon Smith-Njigba (ADP 6), DeVonta Smith (ADP 29)
   and "gib" returned Antonio Gibson ahead of Jahmyr Gibbs (ADP 2).

   Enter marks rows[0]. So at the table someone calls "Smith" or "Gibbs", he
   types three letters and hits Enter, and the board silently records the WRONG
   player as drafted — with nothing to notice until the name he actually meant
   turns up still available several rounds later, by which point the pick
   counter, best-available and every survival number have been running on a
   corrupted board.

   Undrafted players must stay typeable — they are the FAAB watch list — so
   they are ranked BEHIND the priced board rather than excluded. The floor sits
   below the deepest real ADP, which keeps them reachable without letting one
   outrank a priced player inside the same match tier. */
const qeAdp=p=>(p.adp==null?900:p.adp);
function qeScore(p,q){
 const n=p.n.toLowerCase(), parts=n.split(' '), last=parts[parts.length-1]||'';
 const a=qeAdp(p);
 if(last.startsWith(q))return 4000-a;
 if(n.startsWith(q))return 3000-a;
 if(n.indexOf(q)>=0)return 2000-a;
 const initials=parts.map(x=>x[0]||'').join('');
 if(initials.startsWith(q))return 1500-a;
 let i=0; for(const ch of n){if(ch===q[i])i++; if(i===q.length)break;}
 return i===q.length?1000-a:-1;
}
function qeMatch(q){
 q=(q||'').toLowerCase().trim();
 if(q.length<2)return [];
 return PL.filter(p=>!TAKEN[p.g]).map(p=>({p,s:qeScore(p,q)}))
   .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(x=>x.p);
}

/* ---------- filtering ---------- */
function pass(x){
 if(S.q && x.n.toLowerCase().indexOf(S.q)<0) return 0;
 if(S.p && x.p!==S.p) return 0;
 if(S.l && x.lean!==S.l) return 0;
 if(S.c && (x.cv||0)<+S.c) return 0;
 if(S.deep && !x.dp) return 0;
 if(S.rev && !x.rev) return 0;
 if(S.hideTaken && TAKEN[x.g]) return 0;
 if(S.hasTakes && !x.m) return 0;
 if(S.lshift && !(x.ls!=null && Math.abs(x.ls)>=lpMaterial())) return 0;
 return 1;
}

/* The league-adjusted price, as it appears on a card. Returns '' when this
   league has no draft history at all, so the whole feature disappears for
   superflex-8 rather than rendering a row of em-dashes. */
function leagueLine(x){
 if(!LP())return '';
 if(x.al==null)return '<i class="lgna">no league price</i>';
 return '<i class="lg">→ <b>'+x.al.toFixed(1)+'</b> R'+(x.lr||rdOf(x.al))+'</i>';
}
function leaguePill(x){
 if(!LP()||!x.lf||x.lf==='MARKET')return '';
 return '<span class="pill '+x.lf+'">'+x.lf+' '+(x.ls>0?'+':'')+Math.round(x.ls)+'</span>';
}

function movePill(x){
 // POSITIVE move = bigger ADP number = drafted later = FALLING = cheaper = good
 // for you. It must render green with a down arrow. The previous version put
 // positive moves in fade-red, so Tucker Kraft showed a red down-arrow beside a
 // green BUY pill and an EDGE INTACT status.
 const m=x.mv;
 if(!m)return '';
 return '<span class="'+(m>0?'mvd':'mvu')+'" title="'+(m>0?'fell '+m.toFixed(1)+' spots \u2014 cheaper':'rose '+Math.abs(m).toFixed(1)+' spots \u2014 pricier')+'">'
   +(m>0?'\u25bc':'\u25b2')+Math.abs(m).toFixed(1)+'</span>';
}

function card(x){
 const a=x.adp, i=x._i, isMine=MINE.includes(x.g);
 const snip=x.h&&x.h.length?esc((x.h[x.h.length-1].t||'').slice(0,150)):
   '<span style="color:var(--text-mute)">No podcast take \u2014 on the ADP board only.</span>';
 return '<div class="c'+(TAKEN[x.g]?' taken':'')+(isMine?' mine':'')+(x.tw?' wall':'')+'" id="c'+i+'">'
  +'<div class="acts">'
  +'<button class="tk'+(TAKEN[x.g]&&!isMine?' on':'')+'" onclick="event.stopPropagation();mark('+i+')" title="Someone drafted him">'+(TAKEN[x.g]&&!isMine?'\u2715':'\u25cb')+'</button>'
  +'<button class="mn'+(isMine?' on':'')+'" onclick="event.stopPropagation();claim('+i+')" title="I drafted him">'+(isMine?'\u2713':'+')+'</button>'
  +'</div>'
  +'<div class="cc" onclick="openP('+i+')"><div class="ch"><div style="min-width:0">'
  +'<div class="nm">'+esc(x.n)+'</div>'
  +'<div class="meta">'+esc(x.p)+' \u00b7 '+esc(x.tm)+(x.pr?' \u00b7 '+esc(x.pr):'')
    +' \u00b7 '+(x.m?x.m+' mention'+(x.m==1?'':'s'):'no takes')+'</div>'
  +'<div>'+(x.lean?'<span class="pill '+x.lean+'">'+esc(x.lean)+'</span>':'')
  +(x.rev?'<span class="pill rev">REVERSAL</span>':'')
  +(x.dp?'<span class="pill deep">DEEP</span>':'')
  +(x.tw?'<span class="pill tier">TIER WALL</span>':'')
  +(x.tc?'<span class="pill stale">TEAM CHANGED</span>':'')
  +leaguePill(x)
  +(x.cv?'<span class="cv">conv '+x.cv+'</span>':'')+'</div>'
  +'<div class="snip">'+snip+'</div></div>'
  +'<div class="adp"><b>'+(a==null?'\u2014':a.toFixed(1))+'</b>'+movePill(x)
  +'<i>'+(a==null?'undrafted':'R'+rdOf(a)+(x.sd!=null&&x.sdok?' \u00b7 sd'+x.sd.toFixed(0):''))+'</i>'
  +(a==null?'':leagueLine(x))+'</div>'
  +'</div></div></div>';
}

/* ---------- views ---------- */
/* ---------- Board & Players: one tab, browse or search ----------
   Two tabs became one. They always shared the dataset, the #ctl filter chrome
   and the card; all that differed was the presentation. A toggle picks it now:
   Browse is round-grouped and is the default (the scanning surface at the
   table, and it seeks to your current round); Search is the flat, search-first
   lookup. Both honour the same filters. Season mode still calls boardSearch()
   directly for its Players tab. */
function boardView(){return S.boardView==='search'?'search':'browse';}
function setBoardView(v){S.boardView=v;S.showAll=0;render();if(v==='browse')seekNow();}
function bpToggle(){
 const v=boardView();
 return '<div class="tgl bptgl">'
  +'<button'+(v==='browse'?' class="on"':'')+' onclick="setBoardView(\'browse\')">Browse the board</button>'
  +'<button'+(v==='search'?' class="on"':'')+' onclick="setBoardView(\'search\')">Search players</button>'
  +'</div>';
}
/* draft mode: the merged tab */
function viewBoard(){
 return headerNote()+bpToggle()+(boardView()==='search'?boardSearch():boardBrowse());
}
/* round-grouped browse, the scanning surface (the old Board body) */
function boardBrowse(){
 const r=PL.filter(pass), by={};
 r.forEach(x=>{const a=x.adp;const k=a==null?99:Math.min(rdOf(a),15);(by[k]=by[k]||[]).push(x);});
 const np=nextMyPick();
 let h='';
 for(let i=1;i<=15;i++){ if(!by[i])continue;
  const lo=(i-1)*RS()+1, hi=i*RS();
  const isNow=np&&np>=lo&&np<=hi;
  // Cards go in a .cards2 wrapper so a wide screen gets 2-3 columns of them
  // instead of one 1400px-wide row per player, with the name at the far left
  // and the ADP at the far right. The round header stays full width and stays
  // sticky, which column-count would have broken.
  h+='<div class="rh'+(isNow?' now':'')+'">Round '+i+' <span>\u00b7 picks '+lo+'\u2013'+hi+' \u00b7 '+by[i].length
    +(isNow?' \u00b7 YOUR PICK #'+np+' IS HERE':'')+'</span></div>'
    +'<div class="cards2">'+by[i].map(card).join('')+'</div>';}
 if(by[99]) h+='<div class="rh">Undrafted <span>\u00b7 outside the 14-team board \u00b7 FAAB watch list \u00b7 '+by[99].length+'</span></div>'
   +'<div class="cards2">'+by[99].map(card).join('')+'</div>';
 return h||'<div class="empty">Nothing matches.</div>';
}

/* ---------- one reason, not a chain ----------
   bestAvailable() emits every clause that applied, in the order it happened to
   test them: "fills FLEX · BUY conv 3 · last of tier 4 · likely still there at
   #47". Four clauses at 11.5px is not a reason, it is a paragraph, and the
   order it arrives in has nothing to do with which one matters.
   Rank them, lead with the strongest, and put a count on the rest — the full
   list is one tap away in the player overlay. */
const WHY_PRI=[[/^RUN /,-1],[/^MANDATORY/,0],[/^last of tier/,1],[/^BUY conv/,2],[/^FADE conv/,2],
               [/^fills /,3],[/^likely still there/,4],[/^K\/DEF can wait/,5],
               [/^no open /,6],[/^lineup full/,7]];
function whyPri(s){for(let i=0;i<WHY_PRI.length;i++)if(WHY_PRI[i][0].test(s))return WHY_PRI[i][1];return 9;}
function whyTop(why){
 if(!why||!why.length)return{top:'',rest:0,all:[]};
 const w=why.slice().sort((a,b)=>whyPri(a)-whyPri(b));
 return {top:w[0],rest:w.length-1,all:w};
}
/* JJ's own words, when he actually committed to them.
   The structural why ("fills FLEX", "last of tier 4") is always available and
   always the same shape, which makes it reliable and slightly lifeless. Where
   JJ has taken a real position — a BUY or a FADE at conviction 2 or better —
   his sentence is the more useful thing to read, because it is the reason the
   player is on this board at all. Below that bar the structural clause wins:
   a conviction-1 aside is not a reason to spend a pick.

   `·` is stripped because the reason line is deliberately ONE clause and a
   middot inside a quote would read as a second one. */
const JJ_CONV_FLOOR=2;
function jjLine(p){
 if(!p.h||!p.h.length)return null;
 if(p.lean!=='BUY'&&p.lean!=='FADE')return null;
 if((p.cv||0)<JJ_CONV_FLOOR)return null;
 let t=(p.h[p.h.length-1].t||'').replace(/\s+/g,' ').replace(/·/g,',').trim();
 if(t.length<12)return null;
 if(t.length>80){t=t.slice(0,80); const c=t.lastIndexOf(' '); if(c>52)t=t.slice(0,c); t+='…';}
 return t;
}
/* `fills` is the slot already shown as a chip beside the name. Passing it here
   drops the duplicate "fills QB" clause, so each row says a thing once and the
   reason line is free to carry the NEXT strongest clause instead of echoing
   the chip. */
function whyLine(why,p,fills){
 // A live run owns the reason line: its RUN clause leads (WHY_PRI -1) and
 // overrides JJ's quote, because on the clock the join/fade call is the decision.
 const runLive=(why||[]).some(x=>/^RUN /.test(x));
 const w=whyTop(fills?(why||[]).filter(x=>x!=='fills '+fills):why);
 const q=(!runLive&&p)?jjLine(p):null;
 if(q)return '<div class="why" title="'+esc(w.all.join(' · '))+'">'
   +'<b class="jjl '+esc(p.lean)+'">'+esc(p.lean)+' '+(p.cv||'')+'</b> '
   +'<span class="jjq">“'+esc(q)+'”</span></div>';
 if(!w.top)return '';
 return '<div class="why" title="'+esc(w.all.join(' · '))+'">'+esc(w.top)
  +(w.rest?' <em>+'+w.rest+' more</em>':'')+'</div>';
}

/* Collapsible section. Everything below the decision is genuinely useful and
   genuinely ballast while the clock runs — 596px of "gone before" used to sit
   between the recommendations and the run tracker. Open state persists in S. */
function fold(key,title,body,o){
 o=o||{};
 const open=o.force||S.open[key];
 return '<details class="fold"'+(open?' open':'')
  +' ontoggle="S.open[\''+key+'\']=this.open?1:0">'
  +'<summary'+(o.alert?' class="alert"':'')+'>'+title
  +(o.count!=null?'<span class="cnt">'+o.count+'</span>':'')+'</summary>'
  +'<div class="foldb">'+body+'</div></details>';
}

/* ---------- the Draft Room ----------
   Rebuilt for the two-minute window. The decision — five ranked names, each
   with a verdict, one reason and both survival numbers — is the first and
   largest thing on the screen, and on a laptop it sits beside the room
   context rather than 600px above it. */
function viewRoom(){
 const cp=currentPick(), np=nextMyPick(), n=need();
 let h='';

 /* status bar */
 const onClock=np&&np===cp;
 const SW={drafting:'live from Sleeper',paused:'paused by the commissioner',
           pre_draft:'not started yet',complete:'complete'};
 const st=LIVE.on
  ? (LIVE.err?'<b style="color:var(--urgent)">feed error</b> — '+esc(LIVE.err)
      +' · retrying, board untouched · type names below and carry on'
     :'<b>'+esc(SW[LIVE.status]||LIVE.status||'connected')+'</b>'
      +(LIVE.unmatched?' · <b>'+LIVE.unmatched+'</b> pick'+(LIVE.unmatched==1?'':'s')+' not on this board':''))
  : (liveEnabled()?'<b>not connected</b> — tap Go live and picks stop being your problem'
     :'<b>manual</b> — no draft id configured for this league');
 // Clock and control on the first line with the status dot; the prose wraps
 // underneath. The old single flex row let a long status message push the
 // clock onto a third line on a phone — the clock being the one thing on this
 // bar that is worth glancing at.
 h+='<div class="lvbar'+(onClock?' onclock':'')+'">'
  +'<div class="lvtop">'
   +'<span class="dot '+(LIVE.on?(LIVE.err?'err':'live'):'man')+'"></span>'
   +'<span class="clock" id="clk">'+(LIVE.on&&clockLeft()!=null?mmss(clockLeft()):'--:--')+'</span>'
   +(LIVE.on?'<button class="hbtn" onclick="liveStop()">Stop</button>'
           :'<button class="hbtn" onclick="liveStart()">Go live</button>')
  +'</div>'
  +'<span class="lvst">'+st+'</span>'
  +'</div>';

 if(onClock)h+='<div class="hot" style="background:var(--positive-fill);border-color:var(--positive);color:var(--positive)">'
   +'<b>You are on the clock — pick #'+cp+'.</b></div>';

 if(LIVE.on&&LIVE.fails>=3)h+='<div class="warn"><b>The feed has failed '+LIVE.fails+' times running.</b> '
  +'Every pick already on the board is still there and nothing has been lost. If you are on the '
  +'offline copy, the hosted hub at the same address is the better bet for the live feed; if the '
  +'venue wifi is gone, use the box above and keep drafting — the maths works identically on '
  +'hand-typed picks.</div>';

 /* Caption ABOVE the value: you read down the tile and the number lands
    last, instead of reading a bare number and then hunting for what it names. */
 h+='<div class="rtiles">'
  +'<div><span>on clock</span><b>'+cp+'</b></div>'
  +'<div><span>your pick</span><b class="key">'+(np||'—')+'</b></div>'
  +'<div><span>picks away</span><b>'+(np?Math.max(0,np-cp):'—')+'</b></div>'
  +'<div><span>slot'+(LIVE.autoSlot?' ✓':'')+'</span><b>'+(SLOT||'—')+'</b></div></div>';

 // The slot control now lives HERE as well as on My Team. The warning used to
 // end "or set it on the My Team tab" — sending him to another screen, mid
 // draft, to fix the one field that switches this one on.
 if(!SLOT){
  let sel='<select onchange="setSlot(this.value)" style="padding:5px 8px;font-size:var(--fs-body)">'
   +'<option value="0">set slot…</option>';
  for(let i=1;i<=META.teams;i++)sel+='<option value="'+i+'">'+i+'</option>';
  sel+='</select>';
  h+='<div class="warn" style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'
   +'<span style="flex:1 1 220px">Draft slot not set — everything pick-aware is off until it is. '
   +'It fills in by itself the moment the feed sees one of your picks.</span>'+sel+'</div>';
 }

 /* quick entry — always present, not only when the feed is down */
 h+='<div class="qe"><input id="qei" autocomplete="off" spellcheck="false" placeholder="'
  +(LIVE.on?'Type a name to mark someone gone (feed is live, you should not need this)'
           :'Type 3–4 letters, Enter — marks him gone. Ctrl+Enter = you drafted him.')
  +'" value="'+esc(QE.q)+'"><div class="qed" id="qed" style="display:none"></div></div>';

 h+='<div class="roomgrid">';

 /* ---- column A: the decision ---- */
 h+='<div class="rcolA">';
 h+='<div class="sec">Take one of these</div>';
 if(!Object.keys(n).length&&MINE.length)h+='<div class="info">Starting lineup is full — this is best available, not need.</div>';
 const ba=bestAvailable(5);
 if(!ba.length)h+='<div class="empty">Nothing left on the board.</div>';
 const bsv=ba.map(o=>survivalNext(o.p));
 const bvd=verdicts(bsv);
 ba.forEach((o,i)=>{
  const p=o.p, s=bsv[i], v=bvd[i];
  h+='<div class="rec'+(i===0?' n1':'')+'">'
   +'<div class="recb" onclick="openP('+p._i+')">'
   +'<div class="rh1">'+(v?'<span class="vd '+v.k+'">'+v.t+'</span>':'')
     +'<span class="nm">'+esc(p.n)+'</span>'
     +(o.fills?'<span class="nf">fills '+esc(o.fills)+'</span>':'')
     +(p.rq?'<span class="qr" title="rushing QB — '+(p.rfg||'')+' rush pts/game 2023-25'+(p.rq===2?' (elite: feeds the superflex barbell)':'')+'">runs</span>':'')
     +'</div>'
   +'<div class="meta">'+esc(p.p)+' · '+esc(p.tm)+' · ADP '+p.adp.toFixed(1)+' R'+rdOf(p.adp)
     +deltaChip(p)
     +(p.bye?' · bye '+esc(String(p.bye)):'')+'</div>'
   +whyLine(o.why,p,o.fills)
   +'</div>'
   +survBlock(s)
   +'<div class="racts"><button class="dh" onclick="event.stopPropagation();claimById(\''+p.g+'\')" '
     +'title="I drafted him">Draft<br>him</button></div>'
   +'</div>';
 });
 h+='</div>';

 /* ---- column B: what the room is doing to you ---- */
 h+='<div class="rcolB">';
 if(np){
  const shown=new Set(ba.map(o=>o.p.g));
  const gb=goneBefore(8,shown), away=np-cp;
  let gbody='';
  if(!gb.length)gbody='<div class="box" style="margin-top:0">Nobody worth worrying about — everything of value is more '
    +'likely than not to survive '+(away<=0?'until you are back on the clock'
      :away===1?'the one pick in between':'the next '+away+' picks')
    +'. Take the best player rather than the scarcest one.</div>';
  gb.forEach(o=>{
   const val=o.s.room!=null?o.s.room:o.s.nat;
   gbody+='<div class="gone" onclick="openP('+o.p._i+')">'
    +'<span class="gn">'+esc(o.p.n)+'</span>'
    +'<span class="gm">'+esc(o.p.p)+' · '+o.p.adp.toFixed(0)+'</span>'
    +'<span class="gs '+svClass(val)+'">'+pct(val)+' survives</span></div>';
  });
  h+=fold('gone','Gone before your pick at #'+np,gbody,{count:gb.length||null,force:1});
 }
 const rstat=runStats();
 h+=fold('runs','What the room is doing',runBlock(),
   {alert:!!rstat.hot.length,force:!!rstat.hot.length,
    count:rstat.hot.length?rstat.hot.join(' ')+' run':null});
 h+='</div>';

 /* ---- column C: context, folded by default ---- */
 h+='<div class="rcolC"><div class="foldwrap">';
 const path=rosterPath();
 let pbody='';
 if(!path.length)pbody='<div class="box" style="margin-top:0">No picks left, or no draft slot set.</div>';
 path.forEach(st=>{
  const bits=Object.keys(st.pool).sort().map(k=>
    '<b>'+k+'</b> '+st.pool[k].slice(0,3).map(p=>esc(surname(p.n))).join(', '));
  pbody+='<div class="path"><div class="ph">Pick #'+st.pick+' · round '+st.round
   +(st.pick===np?' · next':'')+'</div>'
   +'<div class="pb">'+(bits.length?bits.join(' · '):'<em>nothing projected to survive this far</em>')+'</div></div>';
 });
 pbody+='<div class="box">Projected pools list only players more likely than not to '
  +'still be there, using the same curve as the survival numbers above. They get thinner '
  +'the further out you look, which is the honest shape of the information — not a bug.</div>';
 h+=fold('path','Your path from here',pbody,{count:path.length||null});

 if(LIVE.seq.length){
  const lbody=LIVE.seq.slice(-12).reverse().map(s=>
   '<div class="log'+(s.me?' me':'')+(s.g?'':' unm')+'"><b>'+s.no+'</b>'
   +'<span>'+esc(s.nm)+(s.pos?' · '+esc(s.pos):'')
   +(s.g?'':' — not on this board')+(s.me?' ← you':'')+'</span></div>').join('');
  h+=fold('log','Last picks',lbody,{count:LIVE.seq.length});
 }
 const db=driftBox();
 if(db)h+=fold('drift','Live pace',db);
 h+='</div></div>';

 h+='</div>';
 return h;
}

/* "0%" is a claim of impossibility and this model is not entitled to make one —
   a top-35 player does occasionally fall twenty picks on news the board has not
   caught. Anything under a half point reads "<1%", and 99.5+ reads ">99%".
   Same reason the project would rather show a missing number than a made-up
   one: the rounding was inventing certainty at both ends. */
function pct(v){
 if(v<0.005)return '&lt;1%';
 if(v>0.995)return '&gt;99%';
 return Math.round(v*100)+'%';
}
/* ONE number on the row: his room, at his next pick.
   National moved BEHIND THE TAP — see survBox(), rendered by openP(). This was
   raised against the standing "side by side, not blended" preference and chosen
   knowingly: the row is read with a two-minute clock running. The two curves are
   still never averaged, and the LABEL always names the curve the number came
   from, so a league with no draft history to price against (superflex-8) reads
   "national" rather than passing the national number off as a room price. */
function survBlock(s){
 if(!s)return '<div class="svpair"><span class="svl">survival needs your slot</span></div>';
 const roomed=s.room!=null, v=roomed?s.room:s.nat;
 let h='<div class="svpair">'
  +'<span class="svone"><b class="sv '+svClass(v)+'">'+pct(v)+'</b>'
  +'<i class="svl">'+(roomed?'lasts to you':'national')+'</i></span>';
 if(s.thin)h+='<span class="svthin" title="'+esc(s.why)+'">thin</span>';
 return h+'</div>';
}

/* ADP vs this room as ONE signed number, so nothing is subtracted on the clock.
   ls = al - adp. POSITIVE means this room drafts him LATER than the national
   board: he falls, he is cheaper here, "under board". NEGATIVE means you would
   have to reach: "over board". Getting this sign backwards inverts every edge
   call and it has happened once already, so test_artifact.js asserts the
   direction against a real row rather than trusting this comment. */
function deltaChip(x){
 if(!LP()||x.al==null||x.ls==null)return '';
 const d=Math.round(x.ls);
 if(d===0)return ' · <span class="dlt" title="this room prices him at the national board">at board</span>';
 const t=d>0
  ? 'this room drafts him about '+d+' picks LATER than the national board — he lasts longer here, so he is cheaper'
  : 'this room drafts him about '+Math.abs(d)+' picks EARLIER than the national board — you would be reaching';
 return ' · <span class="dlt '+(d>0?'under':'over')+'" title="'+t+'">'
   +Math.abs(d)+(d>0?' under':' over')+' board</span>';
}

/* National and this room, SIDE BY SIDE and never averaged — this is where the
   pair lives now. It is one tap from every shortlist row, every board card and
   every search result, and it has the room to label both honestly, which a row
   read under a clock does not. Nothing was deleted by collapsing the row to one
   number; it moved here. */
function survBox(x){
 const s=survivalNext(x), np=nextMyPick();
 if(!s)return '<div class="box"><b>Survival to your next pick</b> — needs your draft '
   +'slot. Set it on the Draft Room tab and everything pick-aware switches on.</div>';
 let h='<div class="box"><b>Survives to your next pick'+(np?' (#'+np+')':'')+'</b><br>'
  +'National <b>'+pct(s.nat)+'</b>';
 if(s.room!=null)h+=' &nbsp;·&nbsp; this room <b>'+pct(s.room)+'</b>';
 else if(LP())h+=' &nbsp;·&nbsp; this room <b>no price for him</b>';
 else h+=' &nbsp;·&nbsp; this league has no draft history to price against';
 if(s.thin)h+='<div class="hint alert">Thin: '+esc(s.why)+'</div>';
 h+='<div class="hint">Two curves, never averaged. The shortlist row shows the room '
  +'number when there is one and says so in its label; this is the pair.</div>';
 return h+'</div>';
}

function runBlock(){
 const r=runStats();
 if(!r.last)return '<div class="box">No picks seen yet. Once the feed is live this shows '
   +'position runs and how much supply is left above each tier wall.</div>';
 const order=['RB','WR','TE','QB','K','DEF'];
 const tot=Object.values(r.l12).reduce((a,b)=>a+b,0)||1;
 let h='<div class="runbar">'+order.filter(k=>r.l12[k]).map(k=>
   '<i class="c'+k+'" style="width:'+(100*r.l12[k]/tot)+'%" title="'+k+' '+r.l12[k]+'"></i>').join('')+'</div>';
 h+='<div class="rl">'+order.filter(k=>r.l12[k]).map(k=>k+' <b>'+r.l12[k]+'</b>').join('')+'</div>';
 h+='<div class="rl" style="color:var(--text-mute)">last '+r.last+' picks'
  +(r.sinceN?' · since your last pick: '+order.filter(k=>r.since[k]).map(k=>r.since[k]+' '+k).join(', '):'')+'</div>';
 r.hot.forEach(k=>{
  h+='<div class="hot"><b>'+k+' run — '+r.l12[k]+' of the last '+r.last+'.</b> '
   +'Supply at '+k+' is leaving faster than the board prices it.</div>';
 });
 const walls=['RB','WR','TE','QB'].map(p=>({p,t:tierLeft(p)})).filter(x=>x.t&&x.t.n<=6);
 walls.forEach(w=>{
  h+='<div class="rl" style="color:var(--caution)">▾ <b>'+w.t.n+'</b> '+w.p
   +' left before the tier breaks at '+esc(w.t.wall.n)+'</div>';
 });
 return h;
}

function driftBox(){
 if(!LIVE.seq.length)return '';
 if(!DRIFT.ready)return '<div class="box">Pace calibration needs 12 drafted players that this '
   +'board prices; it has '+DRIFT.n+'. Until then the survival numbers run on the pre-draft '
   +'board with no live adjustment.</div>';
 const dir=d=>d>0?'later than':d<0?'earlier than':'exactly at';
 return '<div class="box"><b style="color:var(--text)">Live pace</b><br>'
  +'Over the last 24 priced picks this room is drafting <b>'+Math.abs(DRIFT.nat).toFixed(0)
  +'</b> picks '+dir(DRIFT.nat)+' national ADP'
  +(LP()?', and <b>'+Math.abs(DRIFT.room).toFixed(0)+'</b> picks '+dir(DRIFT.room)+' its own two-draft pace price':'')
  +'. Both survival curves are shifted by that much.'
  +(DRIFT.spreadReady?'<br>Scatter around that centre is <b>'+DRIFT.spread.toFixed(2)+'×</b> what the '
    +'board’s own spreads predicted, so every curve is widened by the same factor. '
    +(DRIFT.spread>1.15?'This room is messier than the mock-draft field — treat single-pick certainties with suspicion.'
      :DRIFT.spread<0.9?'This room is running tighter to the board than the mock field does.'
      :'This room is tracking the board’s own dispersion closely.'):'')
  +'<div style="margin-top:6px;color:var(--text-mute)">Median, not mean, so one reach cannot move it. '
  +'Measured only on players who have actually been drafted — it reads this room’s '
  +'aggression, not the whole board, and it is survivorship-biased by construction.</div></div>';
}

/* FAAB as a share of REMAINING budget, priced against what rivals can still
   spend. A 30% bid means something different when the league is broke. */
function faabBid(p){
 const my=LEAGUE?LEAGUE.myFaab:META.faab;
 let base=6;
 if(p.lean==='BUY')base+=8*(p.cv||1);
 if(p.lean==='WATCH')base+=4;
 if(p.lean==='FADE')base=2;
 if(p.dp)base+=3;
 const rivalPressure=LEAGUE?Math.min(1.6,Math.max(.5,LEAGUE.maxFaab/Math.max(1,my))):1;
 const pct=Math.max(1,Math.min(60,Math.round(base*rivalPressure)));
 return {pct,dollars:Math.max(1,Math.round(my*pct/100))};
}

/* ---------- the Plan tab ----------
   A pre-committed pick sheet, authored offline in plans/<league>.json and
   shipped in the payload. It exists because the two decisions this draft
   actually turns on — when the quarterback pool and the tight end pool close —
   are decisions you cannot make well on a two-minute clock. They are made here,
   in advance, and the tab's only job at the table is to remind you what you
   already decided and tell you whether the man is still there.

   Deliberately NOT a recommender. It never reranks and never reads the live
   board except to cross off players who are gone. The Draft Room is the live
   opinion; this is the standing one, and the value is precisely that it does
   not change its mind while you are on the clock. */
function planAvail(x){
 if(x.p==null)return '';
 const c = x.p>=60?'var(--positive)' : x.p>=35?'var(--caution)' : 'var(--urgent)';
 return '<span style="color:'+c+';font-weight:700">'+x.p+'%</span>';
}

 if(x.tm)bits.push(esc(x.tm));
 if(x.adp!=null)bits.push('adp '+x.adp+(x.lg!=null?' → <b style="color:var(--accent)">'+x.lg+'</b> here':''));
 return '<div style="display:flex;justify-content:space-between;gap:var(--s3);align-items:baseline;padding:3px 0">'
  +'<div style="min-width:0"><span style="font-weight:var(--w-med);font-size:var(--fs-support)">'+n+'</span>'
  +'<span class="cv" style="margin-left:6px">'+bits.join(' · ')+'</span></div>'
  +'<div style="white-space:nowrap;font-size:var(--fs-body)">'+(gone&&!mine?'<span style="color:var(--urgent);font-size:var(--fs-meta);font-weight:var(--w-med)">GONE</span>':planAvail(x))+'</div></div>';
}

 h+='<div class="hn">';
 if(PLAN.headline)h+='<div class="info"><b>'+esc(PLAN.headline)+'</b></div>';

 h+='</div>';

 if(PLAN.deadlines&&PLAN.deadlines.length){
  h+='<div class="sec">Deadlines — the picks you cannot get back</div><div class="plandl">';
  PLAN.deadlines.forEach(d=>{
   const live = next<=d.act;
   h+='<div class="c'+(live?' live':' past')+'" style="display:block">'
     +'<div class="ch"><div style="min-width:0"><div class="nm">'+esc(d.pos)+' — '+esc(d.label)+'</div>'
