<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Late-Round Tracker</title><style>/* ==========================================================================
   FANTASY HUB — DRAFT-DAY TOKENS v2
   Ported 2026-08-20 (run #17, Phase 2) from the Claude Design project
   "Design token consolidation brief". 16 colours · 5 type steps · 5 spacing
   steps · 3 radii · 3 weights · 2 letter-spacings.

   Before this port: 104 distinct colours (61 used exactly once), 18 font sizes
   across 85 declarations, 0 custom properties. Nothing was ranked because
   everything was bespoke.

   The rules that govern every value below:
     - the type scale is SEMANTIC, not a size list. --fs-hero is the one
       decision on the screen and appears once. --fs-answer is what you act on
       cold. --fs-support is what you check to confirm. --fs-body is read
       between picks. --fs-meta names things and never carries data.
     - a colour is a ROLE. There is no "a slightly different green".
     - anything not expressible as a token is listed under OFF-TOKEN at the
       foot of this block, with the reason. Nothing is inlined silently.
   ========================================================================== */
:root{
 /* ---- type: 5 steps ---- */
 --fs-hero:28px;    /* the one decision on the screen */
 --fs-answer:20px;  /* names and numbers you act on */
 --fs-support:15px; /* numbers you check, not read */
 --fs-body:13px;    /* meta, reasons, quotes, prose */
 --fs-meta:11px;    /* uppercase naming only, never data */

 /* ---- weights: 3 ---- */
 --w-reg:400; --w-med:600; --w-bold:700;

 /* ---- letter-spacing: 2 ---- */
 --ls-caps:.06em; --ls-none:0;

 /* ---- line-height: 2 ---- */
 --lh-tight:1.15; --lh-text:1.45;

 /* ---- font stacks: system only, no network ---- */
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

 /* ---- colour: 16 tokens ----
    Contrast ratios measured against --raised unless noted. Recomputed in this
    session rather than taken on trust; see the report. */
 --surface:#0F131A;      /* page, and the recessed step */
 --raised:#242D3E;       /* rows, panels — 1.35x surface */
 --raised-hi:#384459;    /* inputs, chips — 1.41x raised */
 --line:#6C7689;         /* default border — 3.02:1 */
 --line-strong:#8A94A6;  /* focus, hard dividers — 4.52:1 */

 --text:#EDF1F7;         /* 14.4:1 */
 --text-dim:#B4BFD0;     /* 7.6:1 — 5.3:1 on --raised-hi, the only
                            non-full text legal on that surface */
 --text-mute:#8F9AAD;    /* 4.9:1 floor. Legal on --surface and --raised
                            ONLY — it is 3.2-4.1:1 on every *-fill token, which
                            the contrast matrix in the report shows in full. */

 /* --muted is an ALIAS, not a 17th colour. Everything that wants "quiet text"
    reads it; the handful of containers painted with a fill token re-point it
    to --text-dim so quiet text never lands below AA just because the surface
    under it changed. Measured, not assumed: the failure this fixes was 26 real
    text nodes on the Plan tab that the previous audit's zero-failure count
    never saw, because that audit read declared colours and this one folds in
    the surface a node is actually sitting on. */
 --muted:var(--text-mute);

 --positive:#5CE39B;     /* take it / it survives */
 --positive-fill:#14532D;
 --urgent:#FF9DAE;       /* gone or going */
 --urgent-fill:#6B1F2E;
 --caution:#ECD07A;      /* check before you act */
 --caution-fill:#4A3712;
 --accent:#96C1F5;       /* structure, never a verdict */
 --accent-fill:#1E3A5F;

 /* position hues are ALIASES, not new tokens */
 --pos-rb:var(--positive);
 --pos-wr:var(--accent);
 --pos-te:var(--urgent);
 --pos-qb:var(--caution);

 /* ---- spacing: 5 steps ---- */
 --s1:4px; --s2:8px; --s3:12px; --s4:20px; --s5:32px;

 /* ---- radius: 3 ---- */
 --r1:4px; --r2:8px; --r3:999px;

 /* ---- OFF-TOKEN, deliberately literal ----
    --fs-input   16px is the iOS zoom-on-focus floor. A 15px input makes
                 Safari zoom the page the moment he taps the quick-entry box
                 mid-draft. Platform requirement, not a type step.
    --tap        44px is the accessibility touch floor, not a spacing step.
    --edge-alert 3px, deliberately thinner than --s1 (4px) so an alert panel
                 never competes with the hero row's 4px green edge.
    --shadow     drop shadows are not in the token set; two remain, both on
                 floating layers (the FAB and the quick-entry dropdown). */
 --fs-input:16px;
 --tap:44px;
 --edge-alert:3px;
 --shadow-fab:0 3px 12px #00000088;
 --shadow-pop:0 8px 22px #000000aa;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);font-size:var(--fs-support);line-height:var(--lh-text);
 font-weight:var(--w-reg);letter-spacing:var(--ls-none);
 background:var(--surface);color:var(--text);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:var(--raised);border-bottom:1px solid var(--line)}
.hb{padding:var(--s2) var(--s3) 0}
h1{margin:0;font-size:var(--fs-support);font-weight:var(--w-med);display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
h1 .ttl{display:flex;align-items:center;gap:var(--s2);min-width:0}
.mode{font-size:var(--fs-meta);font-weight:var(--w-med);letter-spacing:var(--ls-caps);
 padding:2px var(--s2);border-radius:var(--r3);background:var(--accent-fill);color:var(--accent);
 border:1px solid var(--accent);cursor:pointer;white-space:nowrap}
.mode.season{background:var(--positive-fill);color:var(--positive);border-color:var(--positive)}
.sub{font-size:var(--fs-body);color:var(--muted);margin-top:2px}
.hbtn{background:var(--raised-hi);border:1px solid var(--line-strong);color:var(--text-dim);
 border-radius:var(--r2);padding:5px var(--s2);font-size:var(--fs-body);cursor:pointer}
.tabs{display:flex;margin-top:var(--s2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:0;border:0;border-bottom:2px solid transparent;
 color:var(--muted);padding:9px var(--s2);font-size:var(--fs-body);font-weight:var(--w-med);
 cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:var(--w-bold)}
/* "More" overflow — Intel + Contingency demoted here 2026-08-26. Hidden until
   tapped; a fixed-position menu anchored under the button so the tab row's
   horizontal-scroll clip cannot hide it. */
.tabs button.moretab{flex:0 0 auto;color:var(--muted)}
.tabs button.moretab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:var(--w-bold)}
.moremenu{display:none;position:fixed;z-index:40;min-width:160px;flex-direction:column;
 background:var(--raised);border:1px solid var(--line);border-radius:8px;
 box-shadow:0 8px 22px rgba(0,0,0,.45);overflow:hidden}
.moremenu.open{display:flex}
.moremenu button{flex:0 0 auto;width:100%;text-align:left;background:0;border:0;
 border-bottom:1px solid var(--line);color:var(--muted);padding:11px 14px;
 font-size:var(--fs-body);font-weight:var(--w-med);cursor:pointer;white-space:nowrap}
.moremenu button:last-child{border-bottom:0}
.moremenu button.on{color:var(--text);font-weight:var(--w-bold)}
.moremenu button:hover{background:var(--raised-hi);color:var(--text)}
/* Phone: wrap the tab bar onto as many rows as it needs, rather than hiding
   tabs in a scrollbar-less overflow with no affordance. At <=559px the tabs no
   longer fit one row, and the hidden scrollbar left Contingency (and half of
   Intel) off-screen with nothing to say they scrolled. Every tab is reachable
   at 390px; the merge to 6 tabs shortens this again. */
@media(max-width:559px){
 .tabs{flex-wrap:wrap;overflow-x:visible}
 .tabs button{flex:1 1 auto;font-size:var(--fs-meta);padding:8px 6px}
}
.ctl{padding:var(--s2) var(--s3)}
/* A form control's border must clear 3:1 against BOTH the control and the page
   (WCAG 1.4.11). --line is only 2.15:1 on --raised-hi, so every control that
   sits on the raised-hi step takes --line-strong: 3.21:1 on it, 6.09:1 on the
   page. Measured this session; the design set did not cover control borders. */
input,select,textarea,button{font-family:var(--font);font-size:var(--fs-body);
 background:var(--raised-hi);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--r2);padding:7px 9px}
:focus-visible{outline:2px solid var(--line-strong);outline-offset:2px}
#q{width:100%;font-size:var(--fs-input)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:7px}
.row select{flex:1 1 auto;min-width:80px;font-size:var(--fs-body);padding:6px 7px}
.tgl{display:flex;gap:var(--s2);margin-top:7px;flex-wrap:wrap}
.tgl button{flex:1 1 auto;font-size:var(--fs-body);padding:7px 5px;cursor:pointer}
.tgl button.on{background:var(--accent-fill);border-color:var(--accent);color:var(--text);font-weight:var(--w-med)}
main{padding:0 var(--s3) 80px}
.warn{background:var(--caution-fill);border:1px solid var(--caution);color:var(--caution);
 padding:7px var(--s3);border-radius:var(--r2);font-size:var(--fs-body);margin:var(--s2) 0}
.info{background:var(--accent-fill);border:1px solid var(--accent);color:var(--accent);
 padding:7px var(--s3);border-radius:var(--r2);font-size:var(--fs-body);margin:var(--s2) 0}
/* Round headers stick BELOW the header, not behind it. `top:0` put them under
   an 84-205px opaque sticky header, so they were invisible for the entire time
   they were stuck — the one moment a sticky header exists to be visible.
   --hh is written by JS from the real header height, which changes with the
   filter strip and with wrapping. */
.rh{position:sticky;top:var(--hh,84px);background:var(--surface);padding:11px 0 5px;
 font-size:var(--fs-meta);font-weight:var(--w-med);letter-spacing:var(--ls-caps);
 color:var(--accent);text-transform:uppercase;border-bottom:1px solid var(--line);z-index:5}
.rh span{color:var(--muted);font-weight:var(--w-reg);text-transform:none;letter-spacing:var(--ls-none)}
.rh.now{color:var(--positive)}
.c{background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);
 padding:var(--s2) var(--s3);margin-top:var(--s2);display:flex;gap:var(--s2);align-items:stretch}
/* Taken players step DOWN a surface rather than fading out. opacity:.3 dropped
   every text pairing in the card below AA at once — the audit's zero-failure
   count never saw it because a faded card is still "the same colour" to a
   contrast checker that reads the declared value. */
.c.taken{background:var(--surface);border-color:var(--line)}
.c.taken .nm{text-decoration:line-through;color:var(--muted)}
.c.taken .meta,.c.taken .adp,.c.taken .adp b,.c.taken .adp i{color:var(--muted)}
.c.mine{border-color:var(--positive);background:var(--positive-fill)}
.c.wall{border-bottom:2px solid var(--caution)}
.acts{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--s1);justify-content:center}
.tk,.mn{width:36px;height:32px;border-radius:var(--r2);border:1px solid var(--line-strong);
 background:var(--raised-hi);color:var(--text-dim);font-size:var(--fs-support);cursor:pointer;padding:0;line-height:1}
.tk.on{background:var(--urgent-fill);border-color:var(--urgent);color:var(--text)}
.mn{color:var(--positive);border-color:var(--line-strong)}
.mn.on{background:var(--positive-fill);border-color:var(--positive);color:var(--text)}
.cc{flex:1;min-width:0;cursor:pointer}
.ch{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline}
.nm{font-weight:var(--w-med);font-size:var(--fs-support)}
.meta{font-size:var(--fs-body);color:var(--muted);margin-top:2px}
.adp{font-size:var(--fs-body);color:var(--text-dim);text-align:right;white-space:nowrap}
.adp b{font-size:var(--fs-support);font-weight:var(--w-bold);color:var(--text);display:block}
.adp i{font-size:var(--fs-meta);font-style:normal;color:var(--muted)}
/* margin-right: at 9.5px the move arrow ran straight into the round label
   ("5.4R9") and nobody noticed; at the meta step it is unmissable. */
.mvu,.mvd{font-size:var(--fs-meta);font-weight:var(--w-med);margin-right:var(--s1)}
.mvu{color:var(--urgent)}
.mvd{color:var(--positive)}
.pill{display:inline-block;font-size:var(--fs-meta);font-weight:var(--w-med);
 padding:2px 6px;border-radius:var(--r3);margin:var(--s1) var(--s1) 0 0;letter-spacing:var(--ls-caps)}
.BUY{background:var(--positive-fill);color:var(--positive)}
.FADE{background:var(--urgent-fill);color:var(--urgent)}
.NEUTRAL{background:var(--raised-hi);color:var(--text-dim)}
.WATCH{background:var(--caution-fill);color:var(--caution)}
.rev{background:var(--accent-fill);color:var(--accent)}
.deep{background:var(--accent-fill);color:var(--accent)}
.REACH{background:var(--caution-fill);color:var(--caution)}
.WAIT{background:var(--accent-fill);color:var(--accent)}
.lg{display:block;font-size:var(--fs-body);font-style:normal;color:var(--text-dim);margin-top:1px;white-space:nowrap}
.lg b{display:inline;font-size:var(--fs-body);font-weight:var(--w-med);color:var(--text)}
.lgna{display:block;font-size:var(--fs-body);font-style:normal;color:var(--muted)}
.stale{background:var(--caution-fill);color:var(--caution)}
.tier{background:var(--caution-fill);color:var(--caution)}
.cv{color:var(--muted);font-size:var(--fs-body)}
.snip{font-size:var(--fs-body);color:var(--text-dim);margin-top:var(--s1);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ov{display:none;position:fixed;inset:0;background:var(--surface);z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov.show{display:block}
.oh{position:sticky;top:0;background:var(--raised);border-bottom:1px solid var(--line);
 padding:var(--s3);display:flex;justify-content:space-between;align-items:center;gap:var(--s3);z-index:5}
.ob{padding:var(--s3) var(--s3) 60px}
.x{background:var(--raised-hi);border:1px solid var(--line-strong);border-radius:var(--r2);
 padding:7px 13px;cursor:pointer;font-size:var(--fs-body);color:var(--text);white-space:nowrap}
.ev{border-left:2px solid var(--line);padding:0 0 var(--s3) var(--s3);margin-left:5px;position:relative}
.ev:before{content:"";position:absolute;left:-5px;top:5px;width:var(--s2);height:var(--s2);border-radius:50%;background:var(--accent)}
.evd{font-size:var(--fs-body);color:var(--muted)}
.evt{font-size:var(--fs-body);margin-top:var(--s1);color:var(--text-dim)}
.evs{font-size:var(--fs-body);color:var(--muted);margin-top:var(--s1);font-style:italic}
.msv{display:inline-block;background:var(--accent-fill);color:var(--accent);border:1px solid var(--accent);
 border-radius:var(--r1);padding:1px 5px;font-size:var(--fs-meta);font-style:normal;font-weight:var(--w-med);margin-left:var(--s1)}
.evn{font-size:var(--fs-body);color:var(--caution);background:var(--caution-fill);border:1px solid var(--caution);
 border-radius:var(--r1);padding:5px 7px;margin-top:5px;font-style:normal}
.src{background:var(--accent-fill);border:1px solid var(--accent);color:var(--accent);
 border-radius:var(--r1);padding:3px var(--s2);font-size:var(--fs-body);cursor:pointer;margin-top:6px}
.sec{font-size:var(--fs-meta);text-transform:uppercase;letter-spacing:var(--ls-caps);font-weight:var(--w-med);
 color:var(--muted);margin:16px 0 7px;border-bottom:1px solid var(--line);padding-bottom:var(--s1)}
.box{background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);
 padding:9px;font-size:var(--fs-body);color:var(--text-dim);margin:9px 0}
.cn{font-size:var(--fs-body);color:var(--text-dim);padding:6px 0;border-bottom:1px solid var(--line)}
.ep{background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px;margin-top:6px;cursor:pointer}
.md h1{font-size:var(--fs-answer);font-weight:var(--w-bold);margin:0 0 var(--s3)}
.md h2{font-size:var(--fs-meta);text-transform:uppercase;letter-spacing:var(--ls-caps);font-weight:var(--w-med);
 color:var(--accent);margin:var(--s4) 0 7px;border-bottom:1px solid var(--line);padding-bottom:var(--s1)}
.md h3{font-size:var(--fs-support);font-weight:var(--w-bold);margin:16px 0 5px;color:var(--text);scroll-margin-top:60px}
.md h3.hl{background:var(--accent-fill);margin-left:-8px;padding:var(--s1) var(--s2);border-radius:var(--r1)}
.md li,.md p{font-size:var(--fs-body);color:var(--text-dim)}
.md li{margin:3px 0}
.md code{background:var(--raised-hi);padding:1px var(--s1);border-radius:var(--r1);font-size:var(--fs-body)}
.md strong{color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:40px var(--s3);font-size:var(--fs-body)}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--text)}
/* roster grid */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2);margin-top:var(--s2)}
.slot{background:var(--raised);border:1px dashed var(--line);border-radius:var(--r2);padding:7px 9px;min-height:52px}
.slot.filled{border-style:solid;border-color:var(--positive);background:var(--positive-fill)}
.slot .lb{font-size:var(--fs-meta);font-weight:var(--w-med);letter-spacing:var(--ls-caps);
 color:var(--muted);text-transform:uppercase}
.slot .pn{font-size:var(--fs-support);font-weight:var(--w-med);margin-top:2px}
.slot .px{font-size:var(--fs-body);color:var(--muted)}
.slot .rm{float:right;background:0;border:0;color:var(--muted);cursor:pointer;font-size:var(--fs-support);padding:0 2px}
.need{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
/* Stat tile: caption ABOVE the value, so you read down and the number lands
   last. 62px, one state colour at a time. */
.need div{flex:1 1 auto;background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);
 padding:6px var(--s2);text-align:center;min-width:56px}
.need b{display:block;font-size:var(--fs-answer);font-weight:var(--w-bold);line-height:var(--lh-tight);color:var(--text)}
.need span{display:block;font-size:var(--fs-meta);font-weight:var(--w-med);color:var(--muted);letter-spacing:var(--ls-caps);text-transform:uppercase}
/* Was `.need.crit` for as long as this rule has existed, but the markup puts
   `crit` on the CHILD div inside `.need` — so the critical-need highlight has
   never once rendered. Descendant selector, found during the token port. */
.need .crit{border-color:var(--urgent)}
.need .crit b{color:var(--urgent)}
.bar{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s2);flex-wrap:wrap}
.bar label{font-size:var(--fs-body);color:var(--muted)}
.bar select,.bar input{padding:5px 7px;font-size:var(--fs-body)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:var(--surface);z-index:99;font-size:var(--fs-body);color:var(--muted);text-align:center;padding:var(--s4)}
.fab{position:fixed;right:var(--s3);bottom:14px;z-index:40;display:flex;gap:var(--s2)}
.fab button{background:var(--accent-fill);border:1px solid var(--accent);color:var(--text);
 border-radius:var(--r3);padding:9px 15px;font-size:var(--fs-body);font-weight:var(--w-med);
 box-shadow:var(--shadow-fab);cursor:pointer}
.fab button.ghost{background:var(--raised-hi);border-color:var(--line-strong);color:var(--text-dim)}
.spark{display:inline-block;vertical-align:middle;margin-left:var(--s1)}
/* ---------- draft room ---------- */
.lvbar{display:flex;align-items:center;gap:6px var(--s3);flex-wrap:wrap;background:var(--raised);
 border:1px solid var(--line);border-radius:var(--r2);padding:7px var(--s3);margin-top:var(--s2)}
.lvtop{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.lvbar .lvst{flex:1 1 200px}
.lvbar.onclock{background:var(--positive-fill);border-color:var(--positive)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);flex:0 0 auto}
.dot.live{background:var(--positive);animation:pulse 2s infinite}
.dot.err{background:var(--urgent)}
.dot.man{background:var(--caution)}
@keyframes pulse{
 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--positive) 60%,transparent)}
 70%{box-shadow:0 0 0 7px color-mix(in srgb,var(--positive) 0%,transparent)}
 100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--positive) 0%,transparent)}
}
.lvst{font-size:var(--fs-body);color:var(--text-dim);flex:1 1 auto;min-width:0}
.lvst b{color:var(--text)}
.clock{font-variant-numeric:tabular-nums;font-size:var(--fs-answer);font-weight:var(--w-bold);
 color:var(--text);letter-spacing:var(--ls-none)}
.clock.warn{color:var(--caution)}
.clock.crit{color:var(--urgent)}
.pk{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.pk div{flex:1 1 auto;background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);
 padding:7px 9px;text-align:center;min-width:66px}
.pk b{display:block;font-size:var(--fs-answer);font-weight:var(--w-bold);color:var(--text);font-variant-numeric:tabular-nums}
.pk span{display:block;font-size:var(--fs-meta);font-weight:var(--w-med);color:var(--muted);
 letter-spacing:var(--ls-caps);text-transform:uppercase}
/* ---- the shortlist row -------------------------------------------------
   Grid, not flex, so the survival number can drop to its own strip on a narrow
   screen without duplicating the markup. Reading order left to right is:
   VERDICT + who, the one survival number, the button.

   Three changes land here from the design session, all approved:
     - the rank digit is GONE. Row order plus row 1 at --fs-hero carries the
       ranking; five digits at 18px carried nothing the order did not.
     - ONE survival number, his room at his next pick. National moved behind
       the tap. Raised against the standing "side by side, not blended"
       preference and chosen knowingly. The two are still never averaged.
     - only row 1 gets the hero size, the green left edge and the filled
       button. Everything else is an outline. */
.rec{background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);
 padding:var(--s3);margin-top:var(--s2);
 display:grid;grid-template-columns:minmax(0,1fr) auto;
 grid-template-areas:"b a" "s s";gap:var(--s2) var(--s3);align-items:center}
.rec.n1{border-left:var(--s1) solid var(--positive)}
.recb{grid-area:b;min-width:0;cursor:pointer}
.racts{grid-area:a;display:flex;align-items:center}
/* The verdict chip and the name share a line, chip first. It used to be 9.5px
   and the LAST element in the card — the smallest, lowest-placed thing on the
   screen was the one telling him what to do. */
.rh1{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.rh1 .nm{font-size:var(--fs-answer);font-weight:var(--w-bold);line-height:var(--lh-tight);
 color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec.n1 .rh1 .nm{font-size:var(--fs-hero)}
.vd{display:inline-block;font-size:var(--fs-meta);font-weight:var(--w-med);padding:3px var(--s2);
 border-radius:var(--r1);letter-spacing:var(--ls-caps);text-transform:uppercase;
 white-space:nowrap;flex:0 0 auto;border:1px solid transparent}
.vd.now{background:var(--urgent-fill);color:var(--urgent);border-color:var(--urgent)}
.vd.wait{background:var(--accent-fill);color:var(--accent);border-color:var(--accent)}
.vd.flip{background:var(--caution-fill);color:var(--caution);border-color:var(--caution)}
/* ONE number, labelled with where it applies. Falls back to the national curve
   — and says so — in a league with no draft history to price against, which is
   exactly the superflex-8 case. A silently unlabelled fallback would be the
   blend this project has always refused. */
.svpair{grid-area:s;display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;
 border-top:1px solid var(--line);padding-top:5px;margin-top:1px}
.svone{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.sv{font-size:var(--fs-answer);font-weight:var(--w-bold);font-variant-numeric:tabular-nums;line-height:var(--lh-tight)}
.sv.hi{color:var(--positive)}
.sv.mid{color:var(--caution)}
.sv.lo{color:var(--urgent)}
.svl{font-size:var(--fs-meta);font-weight:var(--w-med);color:var(--muted);
 letter-spacing:var(--ls-caps);text-transform:uppercase}
.svthin{font-size:var(--fs-meta);font-weight:var(--w-med);color:var(--caution);background:var(--caution-fill);
 border:1px solid var(--caution);border-radius:var(--r1);padding:1px 5px;display:inline-block;
 letter-spacing:var(--ls-caps);text-transform:uppercase}
.why{font-size:var(--fs-body);color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.why em{color:var(--muted);font-style:normal}
.jjq{color:var(--text-dim);font-style:italic}
.jjl{font-size:var(--fs-meta);font-weight:var(--w-med);letter-spacing:var(--ls-caps);text-transform:uppercase;
 padding:1px 5px;border-radius:var(--r1);margin-right:2px}
.jjl.BUY{background:var(--positive-fill);color:var(--positive)}
.jjl.FADE{background:var(--urgent-fill);color:var(--urgent)}
/* ADP-vs-this-room as a SIGNED DELTA. Positive = drafted later here = falling
   = cheaper = "under board". Getting this sign backwards inverts every edge
   call, and it has happened once already, so the direction is asserted in the
   suite rather than trusted to this comment. */
.dlt{font-weight:var(--w-med)}
.dlt.under{color:var(--positive)}
.dlt.over{color:var(--caution)}
/* Need flag. The shortlist stays pure best-available — this marks the rows
   that also plug an open starting slot, so roster need is visible without
   being allowed to reorder anything. */
.nf{font-size:var(--fs-meta);font-weight:var(--w-med);letter-spacing:var(--ls-caps);text-transform:uppercase;
 color:var(--accent);background:var(--accent-fill);border:1px solid var(--accent);border-radius:var(--r1);
 padding:2px 6px;flex:0 0 auto;white-space:nowrap}
/* Rushing-QB flag (2C). Display only — the elite tier feeds the barbell in the
   sort; this chip just SAYS a QB runs. Muted (same dim text the reason line uses,
   which measures AA-clean) so it never competes with the need flag. */
.qr{font-size:var(--fs-meta);font-weight:var(--w-med);letter-spacing:var(--ls-caps);text-transform:uppercase;
 color:var(--text-dim);border:1px solid var(--border);border-radius:var(--r1);
 padding:2px 6px;flex:0 0 auto;white-space:nowrap}
/* "I drafted him", reachable with a pointer. Before this the only path was
   Ctrl+Enter in the quick-entry box, which does not exist on a touch device.
   Outline by default; filled ONLY on row 1. */
.dh{background:var(--raised-hi);border:1px solid var(--line-strong);color:var(--text);border-radius:var(--r2);
 padding:var(--s2) var(--s3);font-size:var(--fs-support);font-weight:var(--w-med);line-height:var(--lh-tight);
 cursor:pointer;min-width:46px;min-height:var(--tap);text-align:center}
.rec.n1 .dh{background:var(--positive-fill);border-color:var(--positive)}
.dh:hover{border-color:var(--line-strong)}
.dh.sm{min-height:36px;padding:6px var(--s2);font-size:var(--fs-body)}
/* ---- gone-before: deliberately NOT a recommendation ----
   These used to reuse .rec verbatim, differing only by a missing rank digit.
   Under a clock a "he is about to be gone" name read as "take him". */
.gone{display:flex;align-items:baseline;gap:var(--s2);font-size:var(--fs-body);color:var(--text-dim);
 padding:5px var(--s2);border-left:2px solid var(--caution);background:var(--surface);
 border-radius:0 var(--r1) var(--r1) 0;margin-top:3px;cursor:pointer}
.gone .gn{font-weight:var(--w-med);color:var(--text);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gone .gm{font-size:var(--fs-body);color:var(--muted);flex:0 0 auto}
.gone .gs{margin-left:auto;font-size:var(--fs-support);font-weight:var(--w-bold);
 font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap}
.gs.hi{color:var(--positive)}
.gs.mid{color:var(--caution)}
.gs.lo{color:var(--urgent)}
.runbar{display:flex;gap:2px;margin-top:7px;height:9px;border-radius:5px;overflow:hidden;background:var(--raised-hi)}
.runbar i{display:block;height:100%}
.cRB{background:var(--pos-rb)}
.cWR{background:var(--pos-wr)}
.cTE{background:var(--pos-te)}
.cQB{background:var(--pos-qb)}
.cK{background:var(--line-strong)}
.cDEF{background:var(--text-mute)}
.rl{display:flex;gap:9px;flex-wrap:wrap;font-size:var(--fs-body);color:var(--text-dim);margin-top:6px}
.rl b{color:var(--text);font-variant-numeric:tabular-nums}
.hot{background:var(--urgent-fill);border:1px solid var(--urgent);color:var(--urgent);
 padding:7px var(--s3);border-radius:var(--r2);font-size:var(--fs-body);margin-top:var(--s2)}
.hot b{color:var(--text)}
/* Secondary line inside a .box — the caveat under a number, at the body step
   in mute. Replaces four one-off inline `margin-top:6px;color:var(--text-mute)` pairs. */
.hint{margin-top:6px;font-size:var(--fs-body);color:var(--muted)}
.hint.alert{color:var(--caution)}
/* A past or spent row steps DOWN a surface instead of fading. opacity:.45 and
   .55 dropped every text pairing inside them below AA simultaneously, and a
   contrast checker reading declared values never saw it. */
/* Containers painted with a FILL token. --muted re-points inside them so no
   quiet caption sits at 3.2-4.1:1 on a coloured panel. */
.c.mine,.c.live,.slot.filled,.lvbar.onclock,.qer.sel,.md h3.hl,.warn,.info,.hot,.evn{--muted:var(--text-dim)}
.c.live{border-color:var(--caution);background:var(--caution-fill)}
.past{background:var(--surface);border-color:var(--line)}
.past .nm,.past .meta,.past .snip,.past .adp,.past .adp b,.past .adp i{color:var(--muted)}
.planrow.past .rh{color:var(--muted)}
.planrow.past .c{background:var(--surface)}
.qe{position:relative;margin-top:var(--s2)}
#qei{width:100%;font-size:var(--fs-input);border-color:var(--positive)}
.qed{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--raised);
 border:1px solid var(--line);border-radius:0 0 var(--r2) var(--r2);max-height:44vh;overflow-y:auto;box-shadow:var(--shadow-pop)}
.qer{padding:6px var(--s2);font-size:var(--fs-support);cursor:pointer;border-bottom:1px solid var(--line);
 display:flex;justify-content:space-between;gap:var(--s2);align-items:center}
.qer.sel{background:var(--accent-fill)}
.qer small{color:var(--muted);font-size:var(--fs-body);white-space:nowrap}
.log{font-size:var(--fs-body);color:var(--text-dim);padding:var(--s1) 0;border-bottom:1px solid var(--line);display:flex;gap:var(--s2)}
.log b{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 34px}
.log.me{color:var(--positive)}
.log.unm{color:var(--caution)}
.path{background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s2) var(--s3);margin-top:6px}
.path .ph{font-size:var(--fs-meta);color:var(--accent);font-weight:var(--w-med);
 letter-spacing:var(--ls-caps);text-transform:uppercase}
.path .pb{font-size:var(--fs-body);color:var(--text-dim);margin-top:3px}
.path .pb em{color:var(--muted);font-style:normal}

/* ================= collapsible secondary sections =======================
   Everything below the decision is real information that is real ballast in a
   two-minute window. <details> keeps it one click away without keeping it in
   the scroll path. Open state is remembered per section in S.open.

   Panel header per the design spec: meta caps only, count in a pill, and an
   alert reads as a coloured LEFT EDGE rather than a filled bar — a filled red
   header competed with the shortlist for the eye. */
.fold{border:1px solid var(--line);border-radius:var(--r2);background:var(--raised);margin-top:var(--s2);overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:9px 11px;font-size:var(--fs-meta);
 text-transform:uppercase;letter-spacing:var(--ls-caps);color:var(--text-dim);font-weight:var(--w-med);
 display:flex;align-items:center;gap:var(--s2);user-select:none;background:var(--surface);
 border-bottom:1px solid var(--line)}
.fold:not([open])>summary{border-bottom:0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:before{content:"\25b8";color:var(--muted);font-size:var(--fs-meta);transition:transform .12s}
.fold[open]>summary:before{transform:rotate(90deg)}
.fold>summary .cnt{margin-left:auto;font-size:var(--fs-meta);font-weight:var(--w-med);color:var(--text-dim);
 background:var(--raised-hi);border-radius:var(--r3);padding:1px var(--s2);letter-spacing:var(--ls-none);text-transform:none}
.fold.alert{border-left:var(--edge-alert) solid var(--urgent)}
.fold>summary.alert{color:var(--urgent)}
.fold>summary.alert .cnt{background:var(--urgent-fill);color:var(--urgent)}
.foldb{padding:0 11px 11px}
/* The two reference banners (ADP basis + league price) now live inside a
   tap-to-open disclosure at the top of the board/search views — reference, not
   decision, so they no longer cost ~1.5 screens above every list. */
.hnfold{margin-top:var(--s2)}
.hnfold .foldb>*:first-child{margin-top:0}
.hnfold .foldb>*:last-child{margin-bottom:0}

/* ================= the draft room, laid out for a screen =================
   There were ZERO media queries in this file. On a laptop the phone column
   stretched to the full window: the name at the far left, the ADP at the far
   right, and most of the screen empty — while the thing he actually had to
   read was below the fold. */
.roomgrid{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}
.rcolB,.rcolC{min-width:0}
.rtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin-top:var(--s2)}
.rtiles div{background:var(--raised);border:1px solid var(--line);border-radius:var(--r2);
 padding:6px var(--s2);text-align:center;min-height:62px;display:flex;flex-direction:column;
 justify-content:center;gap:var(--s1)}
.rtiles b{display:block;font-size:var(--fs-answer);font-weight:var(--w-bold);color:var(--text-dim);
 font-variant-numeric:tabular-nums;line-height:var(--lh-tight)}
.rtiles b.key{color:var(--text)}
.rtiles span{display:block;font-size:var(--fs-meta);font-weight:var(--w-med);color:var(--muted);
 letter-spacing:var(--ls-caps);text-transform:uppercase;white-space:nowrap}

@media(min-width:560px){
 .rec{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"b s a"}
 .svpair{border-top:0;padding-top:0;margin-top:0;flex-direction:column;gap:3px;
  align-items:flex-end;min-width:104px}
 .svone{gap:6px}
}
.planrow{break-inside:avoid;page-break-inside:avoid;margin-bottom:var(--s3)}
.planrow .rh{position:static}
.plansheet{margin-top:2px}
.plandl{display:grid;grid-template-columns:1fr;gap:var(--s2);margin-top:6px}
@media(min-width:900px){.plandl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1280px){.plandl{grid-template-columns:repeat(4,minmax(0,1fr))}
 .plansheet{column-count:2;column-gap:18px}}
@media(min-width:1700px){.plansheet{column-count:3}}
/* The Board is a SCANNING surface — 266 cards. On a laptop the take snippet
   moves behind the tap: the card is already clickable and the player view
   carries JJ's FULL opinion history, not a 150-character slice of the newest
   take. Chosen 2026-08-20 against two measured alternatives; this one takes the
   board to 14.15 screens, 19% SHORTER than the live build it replaces, without
   putting data back at the naming step. The phone board keeps the snippet —
   there is no second column there to lose it to, and the phone is a later pass.
   Scoped to the Board only: the Players tab is a lookup surface where the
   snippet is the point of the result row. */
@media(min-width:900px){body[data-tab="board"][data-boardview="browse"] .cards2 .snip{display:none}}
.plandl .c{margin-top:0}
@media(min-width:900px){
 main{padding:0 16px 80px}
 /* The filter strip was three stacked full-width rows — search, three selects,
    five toggles — costing ~120px of every Board and Players screen on a
    machine with width to spare. One row. */
 .ctl{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
 .ctl #q{flex:1 1 240px;width:auto;font-size:var(--fs-support);padding:6px 9px}
 .ctl .row{margin-top:0;flex:0 1 auto;gap:var(--s2)}
 .ctl .row select{min-width:92px;flex:0 0 auto}
 .ctl .tgl{margin-top:0;flex:1 1 auto;justify-content:flex-end}
 .ctl .tgl button{flex:0 0 auto;padding:6px var(--s3)}
 /* Same idea for the two explainer banners: real information, but they were
    two full-width paragraphs above every board. */
 .hn{display:flex;gap:var(--s2);flex-wrap:wrap}
 .hn>*{flex:1 1 340px;margin:var(--s2) 0}
 .roomgrid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
 .rcolA{grid-column:1;grid-row:1}
 .rcolB{grid-column:2;grid-row:1}
 .rcolC{grid-column:1 / -1;grid-row:2}
 .rcolC .foldwrap{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
 .rtiles{grid-template-columns:repeat(4,1fr)}
 .sec{margin-top:var(--s3)}
}
@media(min-width:1280px){
 main{padding:0 22px 80px;max-width:1700px;margin:0 auto}
 .roomgrid{grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr) minmax(0,.85fr)}
 .rcolA{grid-column:1;grid-row:1}
 .rcolB{grid-column:2;grid-row:1}
 .rcolC{grid-column:3;grid-row:1}
 .rcolC .foldwrap{display:block}
 .rec{padding:var(--s3)}
 /* The board is a list of 256 one-line rows on a 1400px screen. Two columns
    halves the scroll without shrinking anything. */
 .cards2{column-count:2;column-gap:16px}
 .cards2>.c{break-inside:avoid;margin-top:0;margin-bottom:6px}
 .slots{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
@media(min-width:1700px){
 .cards2{column-count:3}
}
/* ============ phone density pass (run #28) ================================
   Board (browse + search) and Contingency are the long tabs. Tighten the row
   chrome at <=559px WITHOUT touching type sizes or colours, so the 0-WCAG-
   failure count is untouched: smaller card padding and inter-card gap, a
   one-line take snippet on the cards (the full take is one tap into the player
   view), shorter sticky round headers, and slightly tighter contingency rows.
   Tap targets (the .dh draft button = 44px) are left alone. */
@media(max-width:559px){
 .c{padding:6px 10px;gap:var(--s2);margin-top:var(--s1)}
 .acts{gap:var(--s1)}
 .rh{padding:7px 0 4px}
 .cards2 .snip{-webkit-line-clamp:1}
 .cn{padding:5px 0}
}

/* ===== embedded Usage/Compare module (scoped) ===== */
/* ===== UB module styles — every rule scoped under .ub so nothing bleeds into the
   tracker app. Palette maps the Usage Board's tokens onto the tracker's surfaces
   (so it looks native) while keeping the semantic accent colours. ===== */
.ub{--bg:var(--surface);--card:var(--raised);--card2:var(--raised-hi);--ink:var(--text);--mut:var(--muted);
 --tar:#22b07d;--gold:#e9c46a;--fade:#e05a5a;--rb:#22b07d;--wr:#3a95e6;--te:#e6893a;--qb:#7c5cff;
 color:var(--ink);font-size:14px;line-height:1.45}
.ub .ubhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ub input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:16px;flex:1;min-width:150px}
.ub .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ub .seg button{background:transparent;color:var(--mut);border:0;padding:7px 12px;cursor:pointer;font-size:13px}
.ub .seg button.on{background:var(--card2);color:var(--ink);font-weight:600}
.ub .ubcount{color:var(--mut);font-size:12px;margin-bottom:8px}
.ub .ubfoot{color:var(--mut);font-size:11.5px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.ub .empty{color:var(--mut);font-size:13px;padding:16px;text-align:center}
.ub .tier{margin-bottom:14px}
.ub .tierhead{display:flex;align-items:baseline;gap:10px;margin:10px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.ub .tierhead h2{font-size:14px}
.ub .tierhead span{color:var(--mut);font-size:12px}
.ub .row{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
.ub .rowmain{display:grid;grid-template-columns:26px 30px 1fr 60px 96px 46px;gap:8px;align-items:center;padding:9px 12px;cursor:pointer}
.ub .rowmain:hover{background:var(--card2)}
.ub .rk{color:var(--mut);font-size:12px;text-align:right}
.ub .pos{font-size:10px;font-weight:700;text-align:center;border-radius:5px;padding:2px 4px;color:#0f1720;display:inline-block}
.ub .RB{background:var(--rb)}.ub .WR{background:var(--wr)}.ub .TE{background:var(--te)}.ub .QB{background:var(--qb);color:#fff}
.ub .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub .nm small{color:var(--mut);font-weight:400;margin-left:6px}
.ub .badges{display:inline-flex;gap:4px;margin-left:6px;vertical-align:1px}
.ub .b{font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
.ub .bR{background:var(--gold);color:#0f1720}
.ub .bM{background:#8a5cf6;color:#fff}
.ub .bOUT{background:var(--fade);color:#fff}
.ub .bUP{color:var(--tar)}.ub .bDN{color:var(--fade)}.ub .bNEU{color:var(--mut)}
.ub .adp{color:var(--mut);font-size:12px;text-align:right}
.ub .bars{display:flex;flex-direction:column;gap:3px}
.ub .bar{height:5px;border-radius:3px;background:var(--line);position:relative}
.ub .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.ub .bar.pv i{background:var(--mut)}
.ub .bar.pj i{background:var(--wr)}
.ub .score{font-size:16px;font-weight:800;text-align:right}
.ub .s-hi{color:var(--tar)}.ub .s-mid{color:var(--gold)}.ub .s-lo{color:var(--mut)}
.ub .detail{display:none;border-top:1px solid var(--line);padding:12px 14px;background:var(--card2);font-size:13px}
.ub .row.open .detail{display:block}
.ub .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ub .dcol h4{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.ub .crow{display:grid;grid-template-columns:130px 1fr 68px;gap:8px;align-items:center;margin-bottom:5px;font-size:12px}
.ub .crow .lbl{color:var(--mut)}
.ub .crow .val{text-align:right;color:var(--ink)}
.ub .pbar{height:7px;border-radius:4px;background:var(--line);position:relative}
.ub .pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--wr)}
.ub .note{margin-top:10px;padding:9px 11px;border-left:3px solid var(--line);color:var(--mut);font-size:12px;border-radius:0 6px 6px 0;background:var(--card)}
.ub .note b{color:var(--ink)}
.ub .warn{border-left-color:var(--gold)}
.ub .subline{color:var(--mut);font-size:12px;margin-top:8px}
/* compare */
.ub #ubC-results.show{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);margin-bottom:10px}
.ub .ritem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ub .ritem:last-child{border-bottom:0}
.ub .ritem:hover{background:var(--card2)}
.ub .ritem .rn{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- head-to-head row + verdict (verbatim from the board's compare tray) ---- */
function h2hRow(lbl,vals,hiGood=true,fmtFn=(v)=>v==null?'&ndash;':v){
  const nums=vals.map(v=>v==null?(hiGood?-1e9:1e9):v);
  const best=hiGood?Math.max(...nums):Math.min(...nums);
  return `<tr><td>${lbl}</td>`+vals.map((v,i)=>`<td class="${nums[i]===best&&vals.filter(x=>x!=null).length>1?'best':''}">${fmtFn(v)}</td>`).join('')+'</tr>';
}
function verdict(ps){
  if(ps.every(p=>p.pos==='RB')) return rbVerdict(ps);
  const ranked=[...ps].sort((a,b)=>(usage(b)??-1)-(usage(a)??-1));
  const A=ranked[0],B=ranked[1];
  if(usage(A)==null) return '<b>No verdict:</b> missing scores.';
  const gap=usage(A)-(usage(B)??0);
  let strength=gap>=8?'a clear edge':gap>=3?'a modest edge':'a coin flip &mdash; break the tie on roster need';
  let why=[];
  if(A.comp_pct && B && B.comp_pct){
    const diffs=['tgt','snap','rz','air','ypt'].map(k=>({k,d:(A.comp_pct[k]||0)-(B.comp_pct[k]||0)})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    const names={tgt:'target share',snap:'snap share',rz:'RZ role',air:'downfield role',ypt:'efficiency'};
    diffs.slice(0,2).forEach(x=>{ if(Math.abs(x.d)>8) why.push((x.d>0?A.name:B.name)+' wins '+names[x.k]); });
  }
  let cautions=[];
  ps.forEach(p=>{
    if(p.out) cautions.push(p.name+': '+p.out);
    if(p.rookie) cautions.push(p.name+' is projection-only (rookie)');
    if(p.mover) cautions.push(p.name+"'s proven usage came with "+p.team25);
    if(p.has25 && p.gp && p.gp<8) cautions.push(p.name+': '+p.gp+'-game sample');
    if(p.scheme_flag==='up') cautions.push(p.name+': scheme trending up ('+p.team26+')');
    if(p.scheme_flag==='down') cautions.push(p.name+': scheme trending down ('+p.team26+')');
  });
  return `<b>${A.name}</b> &mdash; ${strength} (${usage(A).toFixed(0)} vs ${usage(B)==null?'&ndash;':usage(B).toFixed(0)} usage in this league).`
    +(why.length?'<br>'+why.join(' &middot; ')+'.':'')
    +(cautions.length?'<br><span style="color:var(--mut)">Watch: '+cautions.join(' &middot; ')+'.</span>':'');
}
function statusText(p){ return p.out?p.out:(p.injury||'Active'); }
function textRow(lbl,vals){ return `<tr><td>${lbl}</td>`+vals.map(v=>`<td>${v==null?'&ndash;':v}</td>`).join('')+'</tr>'; }
function finishRow(ps){
  const ranks=ps.map(p=>p.pos_rank_ppr==null?1e9:p.pos_rank_ppr);
  const best=Math.min(...ranks), nHas=ps.filter(p=>p.pos_rank_ppr!=null).length;
  return `<tr><td>PPR finish (2025)</td>`+ps.map((p,i)=>{
    const isBest=ranks[i]===best&&nHas>1;
    return `<td class="${isBest?'best':''}">${p.pos_rank_ppr==null?'&ndash;':p.pos+p.pos_rank_ppr}</td>`;
  }).join('')+'</tr>';
}

function subHdr(lbl, n){ return `<tr class="subhdr"><td colspan="${n+1}">${lbl}</td></tr>`; }
function runTendency(p){
  const t = p.team26 ? TMAP[p.team26] : null;
  if(!t || !t.pass_rate_2025) return null;
  const m = String(t.pass_rate_2025).match(/^\s*([\d.]+)\s*%/);
  if(!m) return null;
  const pr = parseFloat(m[1]);
  const lbl = pr<50 ? 'Run-leaning ('+pr+'% pass)' : (pr<=57 ? 'Balanced ('+pr+'% pass)' : 'Pass-leaning ('+pr+'% pass)');
  const arrow = t.flag==='up' ? ' <span class="bUP">&#9650;</span>' : (t.flag==='down' ? ' <span class="bDN">&#9660;</span>' : '');
  return lbl + arrow;
}
function hcTakeCell(p){
  if(!p.hc_take) return null;
  return '<div class="tkbx">' + (p.hc_url ? '<a href="'+p.hc_url+'" target="_blank" rel="noopener">'+p.hc_take+'</a>' : p.hc_take) + '</div>';
}
function rbRows(ps){
  const allRB = ps.every(p=>p.pos==='RB');
  if(!allRB) return '';
  const n = ps.length;
  let h = '';

  h += h2hRow('Rush share %', ps.map(p=>p.rush_share));
  h += h2hRow('Rush yards', ps.map(p=>p.rush_yd));
  h += h2hRow('Yards/carry', ps.map(p=>p.rush_ypc));
  h += h2hRow('Rush TD', ps.map(p=>p.rush_td));
  h += h2hRow('RZ carries (in-20)', ps.map(p=>p.rush_rz));
  h += h2hRow('Broken tackles', ps.map(p=>p.rush_btkl));
  h += h2hRow('Yds before contact', ps.map(p=>p.rush_ybc));
  h += h2hRow('Yds after contact', ps.map(p=>p.rush_yac));
  h += h2hRow('Rush 1st downs', ps.map(p=>p.rush_fd));
  h += h2hRow("'26 proj carries", ps.map(p=>p.p_rush_att));
  h += h2hRow("'26 proj rush yds", ps.map(p=>p.p_rush_yd));
  h += h2hRow("'26 proj rush TD", ps.map(p=>p.p_rush_td));
  h += subHdr('&mdash; Depth / Handcuff &mdash;', n);
  h += textRow('Role', ps.map(p=>p.role));
  h += textRow("Handcuff (if he's out)", ps.map(p=>p.hc_name));
  h += textRow('Backs up', ps.map(p=>p.ahead_name));
  h += textRow('Run tendency', ps.map(p=>runTendency(p)));
  h += textRow('Contingency take', ps.map(p=>hcTakeCell(p)));
  return h;
}
function backfieldMap(){
  if(typeof BACKFIELDS==='undefined') return '';

function rbFmtV(k, v){
  if(v==null) return '?';

function rbVerdict(ps){

    ? usage(b)-usage(a)

  const A = ranked[0], B = ranked[1];
  const spans = {rush_share:100, rush_ypc:3, rush_att:300, snap_share:100, p_rush_att:300, rush_btkl:40};
  const names = {rush_share:'rush share', rush_ypc:'YPC', rush_att:'2025 carries', snap_share:'snap share', p_rush_att:'projected 2026 carries', rush_btkl:'broken tackles'};
  const seps = Object.keys(spans)
    .map(k=>({k, a:A[k], b:B[k], d:(A[k]==null||B[k]==null)?0:(A[k]-B[k])/spans[k]}))  /* signed: only stats where the named (stronger) play leads survive the filter */
    .filter(x=>x.d>0.06).sort((x,y)=>y.d-x.d).slice(0,2);
  const top = seps.length ? seps[0].d : 0;
  const scored2 = usage(A)!=null && usage(B)!=null;
  const strength = scored2
    ? ((usage(A)-(usage(B)??0))>=8 ? 'far the stronger play' : (usage(A)-(usage(B)??0))>=3 ? 'the stronger play' : 'a close call &mdash; break the tie on roster need')
    : (top>=0.25 ? 'far the stronger play' : (top>=0.10 ? 'the stronger play' : 'a close call &mdash; break the tie on roster need'));
  const why = seps.map(x=>names[x.k]+' '+rbFmtV(x.k,x.a)+' vs '+rbFmtV(x.k,x.b)).join(', ');
  let h = '<b>'+A.name+'</b> &mdash; '+strength+(why?' ('+why+').':'.');
  const rolePhrase = p => {
    if(p.role==='Lead') return p.name+' is '+(p.team26||'his team')+"'s lead back"+(p.hc_name?' (handcuff: '+p.hc_name+')':'');
    if(p.role==='Backup') return p.name+' is a pure contingency stash'+(p.ahead_name?' behind '+p.ahead_name:'');
    if(p.role==='Committee') return p.name+' is in a committee backfield'+(p.ahead_name?' with '+p.ahead_name:'');
    if(p.role==='Passing-down') return p.name+' is a passing-down back'+(p.ahead_name?' behind '+p.ahead_name:'');
    return null;
  };
  const roles = [rolePhrase(A), rolePhrase(B)].filter(Boolean);
  if(roles.length) h += '<br>'+roles.join('; ')+'.';
  const uns = ps.filter(p=>p.unscored);
  if(uns.length) h += '<br>'+uns.map(p=>p.name+' is a handcuff, unscored &mdash; his value is contingent on '+(p.ahead_name||'the back ahead of him')).join('; ')+'.';
  let cautions = [];
  ps.forEach(p=>{
    if(p.out) cautions.push(p.name+': '+p.out);
    if(p.rookie) cautions.push(p.name+' is projection-only (rookie)');
    if(p.mover) cautions.push(p.name+"'s proven usage came with "+p.team25);
    if(p.has25 && p.gp && p.gp<8) cautions.push(p.name+': '+p.gp+'-game sample');

    if(p.scheme_flag==='down') cautions.push(p.name+': scheme trending down ('+p.team26+')');
  });
  return h + (cautions.length?'<br><span style="color:var(--mut)">Watch: '+cautions.join(' &middot; ')+'.</span>':'');
}

<script>
/* ---------- payload acquisition ----------
   This page carries NO data of its own. There are exactly two ways data gets
   in, and they must stay equivalent — the same base64 blobs reach the same two
   variables either way:

   1. HUB MODE (build/hub.py). manifest.js names content-hashed payload files
      which are pulled in by <script> tag. A rebuild rewrites those files and
      leaves this page untouched, so a refresh is the whole update procedure.
      That is the point of the split: nothing has to be hand-carried again.

   2. PARACHUTE MODE (build/artifact.py). The payload is inlined into the page
      ABOVE this script, so window.__P is already populated and nothing is
      loaded over the network. This is the single self-contained file that opens
      off a laptop with no wifi — the draft-table fallback.

   Script tags, NOT fetch(). fetch() is blocked on file:// in Chrome
   ("URL scheme file is not supported"), and the hub must work from a local
   bookmark as well as from a web server. <script src> works under both, so one
   loader covers both without a protocol check. Verified 2026-08-13. */
const LEAGUE_KEY="superflex-8";
let B64M=null, B64T=null, BUILT="", SOURCE="";
function loadScript(src){
 return new Promise((res,rej)=>{
  const s=document.createElement('script');
  s.src=src; s.async=false;
  s.onload=()=>res(src);
  s.onerror=()=>rej(new Error('could not load '+src));
  document.head.appendChild(s);
 });
}
async function acquire(){
 if(window.__P && window.__P.main){
  B64M=window.__P.main; B64T=window.__P.text; BUILT=window.__BUILT__||"";
  return 'inline';
 }
 /* Cache-bust the manifest and ONLY the manifest. Everything it points at is
    content-hashed, so those files are safe to cache forever: an unchanged board
    reloads instantly, and a changed one arrives under a new name and therefore
    cannot be served stale. Getting this backwards is how a "self-updating" page
    quietly shows week-old data. */
 await loadScript('./manifest.js?t='+Date.now());
 const M=window.__MANIFEST__;
 if(!M) throw new Error('manifest.js loaded but did not define __MANIFEST__');
 const e=M.leagues && M.leagues[LEAGUE_KEY];
 if(!e) throw new Error('manifest.js has no entry for league "'+LEAGUE_KEY+'"');
 await loadScript('./'+e.main);
 await loadScript('./'+e.text);
 if(!window.__P || !window.__P.main || !window.__P.text)
  throw new Error('payload scripts loaded but did not populate window.__P');
 B64M=window.__P.main; B64T=window.__P.text; BUILT=M.built||"";
 return 'hub';
}

let D,EPTXT,PL,BOARD,CN,EPS,DEPTH,META,PLAN=null,BYID={},BYSL={};
let TAKEN={}, MINE=[], HIST=[], SLOT=0, MODE='draft', LEAGUE=null;
/* tab defaults to the Draft Room, not the Board. It used to open on 'board',
   and renderTabs() only redirects when the saved tab is absent from the mode's
   tab list — which 'board' is not — so draft day started on the wrong screen
   every time. `open` holds the collapsed-section state; it is deliberately NOT
   persisted to the hash, so a fresh page is always in the default shape. */
/* hideTaken now defaults ON in draft mode. Measured 2026-08-20 at pick 119 of
   196: with it off the Board opened on Round 1 — a full screen of struck-through
   players — and reaching your own round cost 7,928px on a laptop, 15,998px on a
   phone. One tap already fixed it; the toggle just shipped off and was not saved.
   Nothing is deleted: the toggle is where it always was, one tap away. */
let S={tab:'room',q:'',p:'',l:'',c:'',deep:0,rev:0,hideTaken:1,hasTakes:0,lshift:0,showAll:0,
       open:{gone:1,runs:1,path:0,log:0,drift:0}};

/* ---------- who is off the board, and who says so ----------
   TAKEN and MINE are now DERIVED, not authoritative. Two independent sources
   feed them and they must not be able to clobber each other:

                                       the URL hash, exactly as before.
     FEED / FEED_MINE                  what Sleeper's draft endpoint says.
                                       Never persisted — it is re-fetched.

   The failure this shape prevents: a poll returning a short or empty list (a
   blip, a paused draft, a 500) rebuilding TAKEN from scratch and silently
   erasing two hours of hand-marked picks. Manual marks live in their own
   object and survive every poll. SUPPRESS is the reverse override — the feed
   claims a player Chris knows it got wrong, and he can veto it. */
let MANUAL={}, MANUAL_MINE=[], SUPPRESS={};

   The draft feed freezes on draft night — it can never learn about a waiver
   add, a drop or a trade. In SEASON mode, once a sync has found Chris's
   roster, ROSTER/ROSTER_MINE replace FEED/FEED_MINE as the derivation source
   for TAKEN and MINE (recompute() below). Draft mode never reads them, so
   nothing about the draft-day board changes. MYROSTER keeps the raw Sleeper
   roster object so My Team can mirror the starters[] array he actually set.
   SLMETA remembers name/pos per Sleeper id from the draft feed's metadata, so
   a roster id that is not on the ADP board still renders as a name. */
let ROSTER={}, ROSTER_MINE=[], MYROSTER=null, SLMETA={};

   A second price for every board player, derived from THIS league's own 2024 and
   2025 drafts: where the nth player at a position actually left this board.
   See build/league_pace.py. It is DISPLAY ONLY — bestAvailable(), the tier
   walls, deep_flag and the round filters all still read national ADP, so
   turning this on cannot move a recommendation. */
const LP=()=> (typeof META!=='undefined' && META.leaguePace) || null;

const LP_WHY={
 'beyond-board':'never drafted this deep at his position here — a waiver name, not a late pick',
 'tail-censored':'lands in the last two rounds of the sample, where a 196-pick board censors the measurement',
 'off-board':'not on the national board at all, so there is no positional slot to price',
 'no-positional-rank':'no positional rank on this board',
 'unmeasured':'not measured in both prior drafts'};

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

   Marvin Harrison Jr. as "Jr." and Oronde Gadsden II as "II" — which is not a

const SUFFIX=/^(jr|sr|ii|iii|iv|v)\.?$/i;

async function ungz(b64){
 const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(typeof DecompressionStream==='undefined') throw new Error('no DecompressionStream');

/* ---------- state persistence via the URL hash ----------
   No storage APIs. The hash survives a reload and can be bookmarked, which is
   what matters at a draft table where an accidental refresh would otherwise
   wipe two hours of picks.

   Players are referenced by gsis_id, NOT by index into PL. Indices are derived
   from the ADP board and are not stable across rebuilds — a mid-draft bookmark
   reopened after a fresh ADP pull would have silently pointed ~94% of the marked
   picks at different players. Ids are stable by construction. The shared
   "00-00" prefix is stripped to keep the hash short. */
let STATE_OK=true;
/* The escape prefix must NOT be the field separator. It was '~' for both, so
   an id that did not start with '00-00' emitted a '~' INSIDE a field, the
   split('~') in loadState() sheared into the wrong number of segments, and the
   picks were silently misparsed — taken list emptied, roster list read from the
   wrong segment, and the trailing segment dropped without even incrementing the
   `miss` counter that exists to warn about exactly this. Total silent loss of a
   mid-draft state, which is the failure this whole id-based scheme was written
   to prevent.

   Dormant in production only because every nflverse gsis_id happens to start
   with '00-00', so the escape branch never fired. That is a property of the
   data, not a guarantee — and "it has not happened yet" is not a fix. '!' is
   not the separator and is legal in a fragment, so both id shapes now round
   trip. Existing bookmarks are unaffected: they contain only stripped ids. */
const encId=g=>g.startsWith('00-00')?g.slice(5):('!'+g);
const decId=s=>s.startsWith('!')?s.slice(1):('00-00'+s);
/* Segments 5 and 6 (SUPPRESS, live draft id) were appended, never inserted.
   A hash written before the Draft Room existed has four segments, so those two
   destructure to undefined and load exactly as they used to. Old bookmarks
   keep working; that is the whole reason they went on the end. */
function saveState(){
 try{
  const t=Object.keys(MANUAL).filter(k=>MANUAL[k]&&!MANUAL_MINE.includes(k)).map(encId);
  const m=MANUAL_MINE.map(encId);
  const x=Object.keys(SUPPRESS).filter(k=>SUPPRESS[k]).map(encId);
  /* Segment 7 (view preferences) was appended, never inserted — same rule as
     segments 5 and 6. A six-segment hash written before today destructures it to
     undefined and keeps the new default. */
  history.replaceState(null,'','#s'+SLOT+'~'+MODE[0]+'~'+t.join('.')+'~'+m.join('.')
    +'~'+x.join('.')+'~'+(LIVE.draftId||'')+'~'+(S.hideTaken?'h':'-'));
  if(!STATE_OK){STATE_OK=true;render();}
 }catch(e){
  // An opaque-origin iframe can refuse replaceState. Say so rather than
  // letting the user believe their picks are being saved.
  if(STATE_OK){STATE_OK=false;render();}
 }
}
function loadState(){
 try{
  const h=decodeURIComponent(location.hash||'');
  if(!h.startsWith('#s'))return;
  const [a,md,t,m,x,dr,vw]=h.slice(2).split('~');
  if(vw)S.hideTaken=vw.indexOf('h')>=0?1:0;
  SLOT=parseInt(a)||0;
  if(md==='s')MODE='season'; else if(md==='d')MODE='draft';
  let miss=0;
  (t||'').split('.').filter(Boolean).forEach(s=>{
   const g=decId(s); if(BYID[g])MANUAL[g]=1; else miss++;});
  MANUAL_MINE=(m||'').split('.').filter(Boolean).map(decId).filter(g=>{
   if(BYID[g])return 1; miss++;return 0;});
  (x||'').split('.').filter(Boolean).forEach(s=>{
   const g=decId(s); if(BYID[g])SUPPRESS[g]=1;});
  if(dr)LIVE.draftId=dr;
  recompute();
  if(miss)setTimeout(()=>alert(miss+' saved pick'+(miss==1?'':'s')+' referenced players that are not in this build and were dropped.'),300);
 }catch(e){}
}

/* Wipe every pick, from both sources. "Clear all picks" used to empty TAKEN and
   MINE, which are now derived — that would have cleared the screen for exactly
   one render and then been undone by the next poll. */
function resetPicks(){
 MANUAL={};MANUAL_MINE=[];SUPPRESS={};FEED={};FEED_MINE=[];
